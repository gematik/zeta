<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1052px" preserveAspectRatio="none" style="width:1055px;height:1052px;background:#FFFFFF;" version="1.1" viewBox="0 0 1055 1052" width="1055px" zoomAndPan="magnify"><defs/><g><rect fill="#FEFCFF" height="1040.8594" style="stroke:#181818;stroke-width:0.5;" width="100" x="236.5" y="6"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="248.5" y="16.3809">Android Device</text><rect fill="#E6E6FA" height="1023.2813" style="stroke:#181818;stroke-width:0.5;" width="100" x="236.5" y="23.5781"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="277" y="33.959">App</text><rect fill="#EDFDEC" height="1040.8594" style="stroke:#181818;stroke-width:0.5;" width="128" x="531.5" y="6"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="543.5" y="16.3809">Anbieter TI 2.0 Dienst</text><rect fill="#FFF3E5" height="1023.2813" style="stroke:#181818;stroke-width:0.5;" width="128" x="531.5" y="23.5781"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="566.5" y="33.959">ZETA Guard</text><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="286.5" x2="286.5" y1="80.3125" y2="1000.7031"/><rect fill="#FFFFFF" height="912.3906" style="stroke:#000000;stroke-width:1.0;" width="10" x="281.5" y="88.3125"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="595.5" x2="595.5" y1="80.3125" y2="1000.7031"/><rect fill="#FFFFFF" height="472.4063" style="stroke:#000000;stroke-width:1.0;" width="10" x="590.5" y="185.7813"/><rect fill="#FFE6CC" height="26.5781" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72" x="250.5" y="52.7344"/><text fill="#000000" font-family="Helvetica" font-size="10" x="257.5" y="70.1152">ZETA Client</text><rect fill="#FFE6CC" height="39.1563" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="110" x="540.5" y="40.1563"/><text fill="#000000" font-family="Helvetica" font-size="10" x="585" y="57.5371">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="547.5" y="70.1152">Authorization Server</text><rect fill="#FFE6CC" height="26.5781" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72" x="250.5" y="1000.7031"/><text fill="#000000" font-family="Helvetica" font-size="10" x="257.5" y="1018.084">ZETA Client</text><rect fill="#FFE6CC" height="39.1563" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="110" x="540.5" y="1000.7031"/><text fill="#000000" font-family="Helvetica" font-size="10" x="585" y="1018.084">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="547.5" y="1030.6621">Authorization Server</text><path d="M270.5,92.3125 L327.5,92.3125 L327.5,96.8906 L317.5,106.8906 L270.5,106.8906 L270.5,92.3125 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="826.6563" style="stroke:#000000;stroke-width:1.5;" width="778" x="270.5" y="92.3125"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="285.5" y="103.6934">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="342.5" y="104.6934">[Kein ZETA Attestation Token vorhanden]</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="270.5" x2="1048.5" y1="677.1875" y2="677.1875"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="275.5" y="689.5684">[ZETA Attestation Token vorhanden (Fast-Path)]</text><polygon fill="#181818" points="578.5,181.7813,588.5,185.7813,578.5,189.7813,582.5,185.7813" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="291.5" x2="584.5" y1="185.7813" y2="185.7813"/><text fill="#000000" font-family="Helvetica" font-size="10" x="298.5" y="156.4277">(01)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="320.5" y="131.2715">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="320.5" y="143.8496">{attestation_type="android", PuK.AK.Sig,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="320.5" y="156.4277">Android_Key_Attestation_Certificate_Chain,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="320.5" y="169.0059">PuK.Client.Sig, signed_Hash_PuK.Client.Sig,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="320.5" y="181.584">play_integrity_token, redirect_uris}</text><line style="stroke:#181818;stroke-width:1.0;" x1="600.5" x2="642.5" y1="212.3594" y2="212.3594"/><line style="stroke:#181818;stroke-width:1.0;" x1="642.5" x2="642.5" y1="212.3594" y2="225.3594"/><line style="stroke:#181818;stroke-width:1.0;" x1="601.5" x2="642.5" y1="225.3594" y2="225.3594"/><polygon fill="#181818" points="611.5,221.3594,601.5,225.3594,611.5,229.3594,607.5,225.3594" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="607.5" y="208.1621">(02)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="629.5" y="208.1621">Validiere Zertifikatskette gegen Google Root CA</text><line style="stroke:#181818;stroke-width:1.0;" x1="600.5" x2="642.5" y1="251.9375" y2="251.9375"/><line style="stroke:#181818;stroke-width:1.0;" x1="642.5" x2="642.5" y1="251.9375" y2="264.9375"/><line style="stroke:#181818;stroke-width:1.0;" x1="601.5" x2="642.5" y1="264.9375" y2="264.9375"/><polygon fill="#181818" points="611.5,260.9375,601.5,264.9375,611.5,268.9375,607.5,264.9375" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="607.5" y="247.7402">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="629.5" y="247.7402">Pr&#252;fe signed_Hash_PuK.Client.Sig</text><path d="M579.5,276.9375 L639.5,276.9375 L639.5,281.5156 L629.5,291.5156 L579.5,291.5156 L579.5,276.9375 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="143.3125" style="stroke:#000000;stroke-width:1.5;" width="378" x="579.5" y="276.9375"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="594.5" y="288.3184">opt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="654.5" y="289.3184">[Play Integrity Pr&#252;fung]</text><line style="stroke:#181818;stroke-width:1.0;" x1="600.5" x2="642.5" y1="320.0938" y2="320.0938"/><line style="stroke:#181818;stroke-width:1.0;" x1="642.5" x2="642.5" y1="320.0938" y2="333.0938"/><line style="stroke:#181818;stroke-width:1.0;" x1="601.5" x2="642.5" y1="333.0938" y2="333.0938"/><polygon fill="#181818" points="611.5,329.0938,601.5,333.0938,611.5,337.0938,607.5,333.0938" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="607.5" y="315.8965">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="629.5" y="315.8965">Entschl&#252;ssele play_integrity_token (lokal/remote)</text><line style="stroke:#181818;stroke-width:1.0;" x1="600.5" x2="642.5" y1="359.6719" y2="359.6719"/><line style="stroke:#181818;stroke-width:1.0;" x1="642.5" x2="642.5" y1="359.6719" y2="372.6719"/><line style="stroke:#181818;stroke-width:1.0;" x1="601.5" x2="642.5" y1="372.6719" y2="372.6719"/><polygon fill="#181818" points="611.5,368.6719,601.5,372.6719,611.5,376.6719,607.5,372.6719" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="607.5" y="355.4746">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="629.5" y="355.4746">Verifiziere Nonce (Muss Hash(PuK.Client.Sig) entsprechen)</text><line style="stroke:#181818;stroke-width:1.0;" x1="600.5" x2="642.5" y1="399.25" y2="399.25"/><line style="stroke:#181818;stroke-width:1.0;" x1="642.5" x2="642.5" y1="399.25" y2="412.25"/><line style="stroke:#181818;stroke-width:1.0;" x1="601.5" x2="642.5" y1="412.25" y2="412.25"/><polygon fill="#181818" points="611.5,408.25,601.5,412.25,611.5,416.25,607.5,412.25" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="607.5" y="395.0527">(06)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="629.5" y="395.0527">Werte Verdicts aus (appIntegrity, deviceIntegrity, accountDetails)</text><path d="M605.5,439.25 L605.5,474.25 L1001.5,474.25 L1001.5,449.25 L991.5,439.25 L605.5,439.25 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M991.5,439.25 L991.5,449.25 L1001.5,449.25 L991.5,439.25 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="611.5" y="454.6309">PuK.AK.Sig muss mit dem Blatt-Zertifikat der Certificate Chain &#252;bereinstimmen.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="611.5" y="467.209">Sicherheitsniveau: TrustedEnvironment oder StrongBox.</text><path d="M605.5,484.4063 L605.5,594.4063 L1027.5,594.4063 L1027.5,494.4063 L1017.5,484.4063 L605.5,484.4063 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1017.5,484.4063 L1017.5,494.4063 L1027.5,494.4063 L1017.5,484.4063 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="611.5" y="499.7871">Es werden zwei redirect_uris je App registriert (RFC 8252, claimed-HTTPS</text><text fill="#000000" font-family="Helvetica" font-size="10" x="611.5" y="512.3652">Universal-/App-Links auf einer vom App-Hersteller kontrollierten Domain):</text><text fill="#000000" font-family="Helvetica" font-size="10" x="611.5" y="524.9434">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/oidc = oidc_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="617.5" y="537.5215">(SekIDP Auth Code Flow, redirection_endpoint des AuthS, nicht /token)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="611.5" y="550.0996">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/app = app_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="617.5" y="562.6777">(ZETA Guard Auth Code Flow, /token-Endpunkt des AuthS)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="611.5" y="575.2559">Beide Callbacks enden &#252;ber denselben App-Link/Universal-Link in der App.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="611.5" y="587.834">Der ZETA Client unterscheidet den zu nutzenden AuthS-Endpunkt anhand des Pfads.</text><line style="stroke:#181818;stroke-width:1.0;" x1="600.5" x2="642.5" y1="618.6094" y2="618.6094"/><line style="stroke:#181818;stroke-width:1.0;" x1="642.5" x2="642.5" y1="618.6094" y2="631.6094"/><line style="stroke:#181818;stroke-width:1.0;" x1="601.5" x2="642.5" y1="631.6094" y2="631.6094"/><polygon fill="#181818" points="611.5,627.6094,601.5,631.6094,611.5,635.6094,607.5,631.6094" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="607.5" y="614.4121">(07)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="629.5" y="614.4121">Store Client (state: pending_user_binding)</text><polygon fill="#181818" points="302.5,654.1875,292.5,658.1875,302.5,662.1875,298.5,658.1875" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="296.5" x2="589.5" y1="658.1875" y2="658.1875"/><text fill="#000000" font-family="Helvetica" font-size="10" x="308.5" y="653.9902">(08)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="330.5" y="653.9902">201 Created {client_id, status: pending_user_binding}</text><polygon fill="#181818" points="583.5,749.0781,593.5,753.0781,583.5,757.0781,587.5,753.0781" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="291.5" x2="589.5" y1="753.0781" y2="753.0781"/><text fill="#000000" font-family="Helvetica" font-size="10" x="298.5" y="730.0137">(09)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="320.5" y="711.1465">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="320.5" y="723.7246">{attestation_type="zeta_attestation_token",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="320.5" y="736.3027">zeta_attestation_token, PuK.Client.Sig,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="320.5" y="748.8809">Besitznachweis (Signatur/Assertion)}</text><line style="stroke:#181818;stroke-width:1.0;" x1="595.5" x2="637.5" y1="779.6563" y2="779.6563"/><line style="stroke:#181818;stroke-width:1.0;" x1="637.5" x2="637.5" y1="779.6563" y2="792.6563"/><line style="stroke:#181818;stroke-width:1.0;" x1="596.5" x2="637.5" y1="792.6563" y2="792.6563"/><polygon fill="#181818" points="606.5,788.6563,596.5,792.6563,606.5,796.6563,602.5,792.6563" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="602.5" y="775.459">(10)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="624.5" y="775.459">Pr&#252;fe Token-Signatur &amp; Vertrauensstellung</text><line style="stroke:#181818;stroke-width:1.0;" x1="595.5" x2="637.5" y1="819.2344" y2="819.2344"/><line style="stroke:#181818;stroke-width:1.0;" x1="637.5" x2="637.5" y1="819.2344" y2="832.2344"/><line style="stroke:#181818;stroke-width:1.0;" x1="596.5" x2="637.5" y1="832.2344" y2="832.2344"/><polygon fill="#181818" points="606.5,828.2344,596.5,832.2344,606.5,836.2344,602.5,832.2344" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="602.5" y="815.0371">(11)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="624.5" y="815.0371">Extrahiere PuK.AK.Sig aus Token, verifiziere Besitznachweis</text><line style="stroke:#181818;stroke-width:1.0;" x1="595.5" x2="637.5" y1="871.3906" y2="871.3906"/><line style="stroke:#181818;stroke-width:1.0;" x1="637.5" x2="637.5" y1="871.3906" y2="884.3906"/><line style="stroke:#181818;stroke-width:1.0;" x1="596.5" x2="637.5" y1="884.3906" y2="884.3906"/><polygon fill="#181818" points="606.5,880.3906,596.5,884.3906,606.5,888.3906,602.5,884.3906" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="602.5" y="860.9043">(12)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="624.5" y="854.6152">&#220;bernimm registrierte redirect_uris aus dem Token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="624.5" y="867.1934">(kein erneutes Senden im Fast-Path)</text><polygon fill="#181818" points="302.5,906.9688,292.5,910.9688,302.5,914.9688,298.5,910.9688" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="296.5" x2="594.5" y1="910.9688" y2="910.9688"/><text fill="#000000" font-family="Helvetica" font-size="10" x="308.5" y="906.7715">(13)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="330.5" y="906.7715">201 Created {client_id}</text><path d="M10,937.9688 L10,984.9688 L872,984.9688 L872,947.9688 L862,937.9688 L10,937.9688 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M862,937.9688 L862,947.9688 L872,947.9688 L862,937.9688 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="953.3496">Der zeta_attestation_token zertifiziert die erfolgreiche Android Key Attestation, ist an PuK.AK.Sig gebunden (cnf) und enth&#228;lt die registrierten redirect_uris. Er wird</text><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="965.9277">NICHT mehr bei /register ausgestellt, sondern erst nach der identit&#228;tsgebundenen E-Mail-Bindung im Token-Flow (siehe Abb-ZETA-OIDC-Token-Bezug). Er kann bei einer erneuten</text><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="978.5059">Registrierung im Fast-Path vorgelegt werden, sodass Hardware-Attestierung und redirect_uris nicht erneut &#252;bertragen werden m&#252;ssen.</text><!--SRC=[hLTHR-9647xdLqnvQ471zZLIfOhc8X4W2SebeS2bwYcIjTY3sMBMrdfD4axv9tsydt5l-METMHimkIIzXyi3uFNkx3Spttmp-Kcg8Cv31DVrqdmPEx5uI7BZcdjJg_q2xt_W7vdhN9trXvtnU0AhG_UT-siR-iwbaB5pFHc2p0nS3Rhd4rZYNCC4PGohH86dCQ9tg5suGAc0zZetg3EXmXRPNF3QTe-tGYrd3z309Tdr4vCsMtOBmbLkrlHIqIwnC39HBlGaWWnH6Ma4cYp2QQxe4Sbi2Un4gZ1N4Q2U9N5403lTSmXn2TU3NjSvZPCxo76A6hmr6k6LnXwyAPrpB8P62Qb9HXkPn3b2PpfrFlKd7SSQcIGBLCu9hlEewUuy0R8tZILg0ohNC52P4MgT1VCunop360uue2hKYGoTZZ6O6TfCMF-0iH4cpo0KIWJpDgIeGgaYFyzG-moC7jmVdTpQDBc7Uea7UhYI0TQXrxyPTFj-z_h3zQW6KEn9qpeCHuFBJdyq_diywLzktmEaGXiPo5Ge0rtodhv41dMELlbSXwCZZlNnCHqWpzXeRVEzGJ6Lo26S381uncccwF6brpU3Nd-qZyVQFik53kl0l_spZvrHxnLCdTpCnnRIi3UyLVoOQBaMp2SOewPSlmsmSEBWe2PYK_3Ptbyai31Z2K7KrtF1RBGOx0V_bK5nZWie1mTj65vJGMrvSwi-Yvqntpoa-BukYhpKMp3CBzpEXJkMKOlW5yl-1Jxu5GH-brWdPp8G1ltkN4X5U_bWSRaz39cC58R-kSZc_hDtjoeb6V6vr29DrU0RzgW56aEfCJ1-hcNsk7MfYEd6epRSY5Y6n6M4JmMEXJ3P0WaVH1XHQCwI98eHHab29EcyQcUedxxEy0sWsvFR7qbgO4ZOgTnAx8KLAgljdfUkwYl3bVdqbIiJuINteH4d2n5JdfQ9mUQRvcvOCUJQnk0gKG52upBFCc0V6li-D8bY9aifh7DKRrlzYwA9R3kKWSb0a4GqH9fkNMsHi77PLXP442IvCZsYiuopdNcYyxV1K-GNQ1dD3IIpRHAsV8Cbkx2KnkhdIKmiTNO9faKD5Tw1vHqyVILnfIeXSLikKRctQYp9Kpr7QJ8bLoZoDanqJimF-sebTQAMN1y9cniRUenEadktLdi5O0c-dy4TnOMojBv3kKzK-8SKEqsXA31j5RanEkt2xuU_7ROWY8LSOkYSJoR3ZRcFZ8mwLEnuTDBv8DM2upq3RaIQIdl95frpscCmZcbfaIW26rkz9nIzX5g7QhPBUmxCZKcpjkSTyRdJFtjNnrumzOueVSSULN00xu6__2hoRM8QOrmCUaFhCNGfDC2DQrUFNFAKqJGXob8UiY8qBL0KQWEUfM_pkw3G1o6XprU0xBJs6p35DKwVSEHgKS6nkVa4gRj2LyJnL0GKJsHnB0X2cnKLtfIUD_7sTZdWHo0kCINejLlQwz5ZfQz0pfC1LJ5VmzSJ5t9glJGqs8iibXqyeLYTBShXJ8HPOPLbdbbMyErv0OvDGWLTNjTWiSMNktEpUfpE5qSSfms7xtw5haOw6SBdm2xxCYGrjYt_PMkFjHh66Vvleu76gSYCCnHcNW1urck-gzDmv_FtblcIElM4bzyK7MclUPnW9isQPnUgHT8eMbNadVOwfAwQZpOVQsy8VZ5GRKx1ponvHekSE6BBRIFctuZuFUsQMz6jg1RBvAH0kgh8yZx85-qz_KlKLAHRLUd0P-B2vba