<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="502px" preserveAspectRatio="none" style="width:967px;height:502px;background:#FFFFFF;" version="1.1" viewBox="0 0 967 502" width="967px" zoomAndPan="magnify"><defs/><g><rect fill="#FEFCFF" height="490.1875" style="stroke:#181818;stroke-width:0.5;" width="95" x="11" y="6"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="23" y="16.3809">mobile Device</text><rect fill="#E6E6FA" height="472.6094" style="stroke:#181818;stroke-width:0.5;" width="95" x="11" y="23.5781"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="49" y="33.959">App</text><rect fill="#EDFDEC" height="490.1875" style="stroke:#181818;stroke-width:0.5;" width="128" x="465.5" y="6"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="477.5" y="16.3809">Anbieter TI 2.0 Dienst</text><rect fill="#FFF3E5" height="472.6094" style="stroke:#181818;stroke-width:0.5;" width="128" x="465.5" y="23.5781"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="500.5" y="33.959">ZETA Guard</text><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="58.5" x2="58.5" y1="80.3125" y2="450.0313"/><rect fill="#FFFFFF" height="361.7188" style="stroke:#000000;stroke-width:1.0;" width="10" x="53.5" y="88.3125"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="529.5" x2="529.5" y1="80.3125" y2="450.0313"/><rect fill="#FFFFFF" height="237.0938" style="stroke:#000000;stroke-width:1.0;" width="10" x="524.5" y="194.9375"/><rect fill="#FFE6CC" height="26.5781" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72" x="22.5" y="52.7344"/><text fill="#000000" font-family="Helvetica" font-size="10" x="29.5" y="70.1152">ZETA Client</text><rect fill="#FFE6CC" height="39.1563" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="110" x="474.5" y="40.1563"/><text fill="#000000" font-family="Helvetica" font-size="10" x="519" y="57.5371">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="481.5" y="70.1152">Authorization Server</text><rect fill="#FFE6CC" height="26.5781" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72" x="22.5" y="450.0313"/><text fill="#000000" font-family="Helvetica" font-size="10" x="29.5" y="467.4121">ZETA Client</text><rect fill="#FFE6CC" height="39.1563" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="110" x="474.5" y="450.0313"/><text fill="#000000" font-family="Helvetica" font-size="10" x="519" y="467.4121">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="481.5" y="479.9902">Authorization Server</text><polygon fill="#181818" points="512.5,190.9375,522.5,194.9375,512.5,198.9375,516.5,194.9375" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="63.5" x2="518.5" y1="194.9375" y2="194.9375"/><text fill="#000000" font-family="Helvetica" font-size="10" x="70.5" y="146.7168">(01)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="92.5" y="102.6934">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="92.5" y="115.2715">{</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.5" y="127.8496">"client_name": "myClient",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.5" y="140.4277">"grant_types": ["urn:ietf:params:oauth:grant-type:token-exchange", "refresh_token"],</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.5" y="153.0059">"jwks": { "keys": [ PuK.Client.Sig ] },</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.5" y="165.584">"token_endpoint_auth_method": "private_key_jwt",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.5" y="178.1621">"redirect_uris": ["https:</text><text fill="#000000" font-family="Helvetica" font-size="10" font-style="italic" x="202.5" y="178.1621">&lt;App-FQDN&gt;/cb/&lt;app&gt;/oidc", "https:</text><text fill="#000000" font-family="Helvetica" font-size="10" x="374.5" y="178.1621">&lt;App-FQDN&gt;/cb/&lt;app&gt;/app"]</text><text fill="#000000" font-family="Helvetica" font-size="10" x="92.5" y="190.7402">}</text><path d="M539.5,207.9375 L539.5,367.9375 L960.5,367.9375 L960.5,217.9375 L950.5,207.9375 L539.5,207.9375 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M950.5,207.9375 L950.5,217.9375 L960.5,217.9375 L950.5,207.9375 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="545.5" y="223.3184">Es werden zwei redirect_uris je App registriert (RFC 8252, claimed-HTTPS</text><text fill="#000000" font-family="Helvetica" font-size="10" x="545.5" y="235.8965">Universal-/App-Links auf einer vom App-Hersteller kontrollierten Domain):</text><text fill="#000000" font-family="Helvetica" font-size="10" x="545.5" y="248.4746">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/oidc = oidc_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="551.5" y="261.0527">(SekIDP Auth Code Flow, redirection_endpoint des AuthS, nicht /token)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="545.5" y="273.6309">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/app = app_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="551.5" y="286.209">(ZETA Guard Auth Code Flow, /token-Endpunkt des AuthS)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="545.5" y="298.7871">Beide Callbacks enden &#252;ber denselben App-Link/Universal-Link in der App;</text><text fill="#000000" font-family="Helvetica" font-size="10" x="545.5" y="311.3652">der ZETA Client unterscheidet den zu nutzenden AuthS-Endpunkt anhand des Pfads.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="545.5" y="323.9434">Die OS-seitige Verkn&#252;pfung erfolgt &#252;ber apple-app-site-association bzw.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="545.5" y="336.5215">assetlinks.json (Deployment, kein Laufzeit-Flow). Die App ist inkl. redirect_uris</text><text fill="#000000" font-family="Helvetica" font-size="10" x="545.5" y="349.0996">bei der gematik registriert; der AuthS pr&#252;ft beim DCR, ob die &#252;bergebenen</text><text fill="#000000" font-family="Helvetica" font-size="10" x="545.5" y="361.6777">redirect_uris registriert sind.</text><line style="stroke:#181818;stroke-width:1.0;" x1="534.5" x2="576.5" y1="392.4531" y2="392.4531"/><line style="stroke:#181818;stroke-width:1.0;" x1="576.5" x2="576.5" y1="392.4531" y2="405.4531"/><line style="stroke:#181818;stroke-width:1.0;" x1="535.5" x2="576.5" y1="405.4531" y2="405.4531"/><polygon fill="#181818" points="545.5,401.4531,535.5,405.4531,545.5,409.4531,541.5,405.4531" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="541.5" y="388.2559">(02)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="563.5" y="388.2559">Store Client (state: pending_user_binding)</text><polygon fill="#181818" points="74.5,428.0313,64.5,432.0313,74.5,436.0313,70.5,432.0313" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="68.5" x2="523.5" y1="432.0313" y2="432.0313"/><text fill="#000000" font-family="Helvetica" font-size="10" x="80.5" y="427.834">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="102.5" y="427.834">201 Created {client_id, status: pending_user_binding}</text><!--SRC=[hLLHJ-Cu47xlhvZBoxMYINQHLZe55gaq1Qe5sckxI7S7YfnacfecJcGxb1RnptZZZztOAL1qtExBzY6Du_4ttundllcDYoIlKmJFywkwoDsShSjQU_fUjrg_mzTV-2EutkNfODoRJcTmj-zzyZu7C70l6C_TqMmCN6cu7FRFPb3WGi8CUGvtfG1VOaPxA3tuXbm0sRfNA1KJQPSmb-RRgur_XvBFrz36Wd2ZKbUThZL1