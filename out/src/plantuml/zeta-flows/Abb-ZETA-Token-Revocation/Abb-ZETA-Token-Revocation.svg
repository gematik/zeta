le="stroke:#181818;stroke-width:0.5;"/><path d="M24,56.6563 L24,83.6563 M11,64.6563 L37,64.6563 M24,83.6563 L11,98.6563 M24,83.6563 L37,98.6563 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#FFE6CC" height="26.5781" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72" x="226" y="85.1563"/><text fill="#000000" font-family="Helvetica" font-size="10" x="233" y="102.5371">ZETA Client</text><rect fill="#FFE6CC" height="39.1563" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="110" x="558" y="72.5781"/><text fill="#000000" font-family="Helvetica" font-size="10" x="602.5" y="89.959">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="565" y="102.5371">Authorization Server</text><text fill="#000000" font-family="Helvetica" font-size="10" x="6" y="1088.5059">Nutzer</text><ellipse cx="24" cy="1026.625" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M24,1034.625 L24,1061.625 M11,1042.625 L37,1042.625 M24,1061.625 L11,1076.625 M24,1061.625 L37,1076.625 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#FFE6CC" height="26.5781" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72" x="226" y="1018.125"/><text fill="#000000" font-family="Helvetica" font-size="10" x="233" y="1035.5059">ZETA Client</text><rect fill="#FFE6CC" height="39.1563" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="110" x="558" y="1018.125"/><text fill="#000000" font-family="Helvetica" font-size="10" x="602.5" y="1035.5059">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="565" y="1048.084">Authorization Server</text><polygon fill="#181818" points="245,135.3125,255,139.3125,245,143.3125,249,139.3125" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="24" x2="251" y1="139.3125" y2="139.3125"/><text fill="#000000" font-family="Helvetica" font-size="10" x="31" y="135.1152">(01)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="53" y="135.1152">Abmeldung (Logout) / Session beenden</text><path d="M-7.5,152.3125 L-7.5,187.3125 L644.5,187.3125 L644.5,162.3125 L634.5,152.3125 L-7.5,152.3125 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M634.5,152.3125 L634.5,162.3125 L644.5,162.3125 L634.5,152.3125 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="108.5" y="167.6934">A_31016: Der ZETA Client widerruft bei nutzerinitiierter Abmeldung sein Refresh Token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="108.5" y="180.2715">serverseitig, damit aus dem lokalen Logout eine echte Grant-Terminierung wird.</text><line style="stroke:#181818;stroke-width:1.0;" x1="267" x2="309" y1="211.0469" y2="211.0469"/><line style="stroke:#181818;stroke-width:1.0;" x1="309" x2="309" y1="211.0469" y2="224.0469"/><line style="stroke:#181818;stroke-width:1.0;" x1="268" x2="309" y1="224.0469" y2="224.0469"/><polygon fill="#181818" points="278,220.0469,268,224.0469,278,228.0469,274,224.0469" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="274" y="206.8496">(02)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="296" y="206.8496">Create DPoP Proof (without Nonce)</text><line style="stroke:#181818;stroke-width:1.0;" x1="267" x2="309" y1="250.625" y2="250.625"/><line style="stroke:#181818;stroke-width:1.0;" x1="309" x2="309" y1="250.625" y2="263.625"/><line style="stroke:#181818;stroke-width:1.0;" x1="268" x2="309" y1="263.625" y2="263.625"/><polygon fill="#181818" points="278,259.625,268,263.625,278,267.625,274,263.625" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="274" y="246.4277">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="296" y="246.4277">Create Client Assertion JWT (without Attestation)</text><polygon fill="#181818" points="596,323.9375,606,327.9375,596,331.9375,600,327.9375" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="267" x2="602" y1="327.9375" y2="327.9375"/><text fill="#000000" font-family="Helvetica" font-size="10" x="274" y="304.873">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="296" y="286.0059">POST /revoke  dpop: dpop_proof</text><text fill="#000000" font-family="Helvetica" font-size="10" x="296" y="298.584">{client_assertion (JWT, PrK.Client.Sig signiert),</text><text fill="#000000" font-family="Helvetica" font-size="10" x="296" y="311.1621">token=&lt;Refresh Token&gt;,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="296" y="323.7402">token_type_hint=refresh_token}</text><line style="stroke:#181818;stroke-width:1.0;" x1="618" x2="660" y1="367.0938" y2="367.0938"/><line style="stroke:#181818;stroke-width:1.0;" x1="660" x2="660" y1="367.0938" y2="380.0938"/><line style="stroke:#181818;stroke-width:1.0;" x1="619" x2="660" y1="380.0938" y2="380.0938"/><polygon fill="#181818" points="629,376.0938,619,380.0938,629,384.0938,625,380.0938" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="625" y="356.6074">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="647" y="350.3184">Client-Authentifizierung pr&#252;fen</text><text fill="#000000" font-family="Helvetica" font-size="10" x="647" y="362.8965">(Client Assertion [RFC7523], DPoP Proof [RFC9449]) &#8212; wie am Token-Endpunkt</text><path d="M8,392.0938 L65,392.0938 L65,396.6719 L55,406.6719 L8,406.6719 L8,392.0938 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="531.7188" style="stroke:#000000;stroke-width:1.5;" width="1127" x="8" y="392.0938"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="23" y="403.4746">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="80" y="404.4746">[Client-Authentifizierung erfolgreich (A_31011)]</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="8" x2="1135" y1="877.6563" y2="877.6563"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="13" y="890.0371">[Client-Authentifizierung fehlerhaft (A_29997)]</text><path d="M246,420.6719 L303,420.6719 L303,425.25 L293,435.25 L246,435.25 L246,420.6719 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="353.25" style="stroke:#000000;stroke-width:1.5;" width="864" x="246" y="420.6719"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="261" y="432.0527">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="318" y="433.0527">[token_type_hint = refresh_token bzw. Refresh Token erkannt]</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="246" x2="1110" y1="670.0313" y2="670.0313"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="251" y="682.4121">[Access Token &#252;bergeben (au&#223;erhalb Geltungsbereich, A_30000)]</text><line style="stroke:#181818;stroke-width:1.0;" x1="618" x2="660" y1="476.4063" y2="476.4063"/><line style="stroke:#181818;stroke-width:1.0;" x1="660" x2="660" y1="476.4063" y2="489.4063"/><line style="stroke:#181818;stroke-width:1.0;" x1="619" x2="660" y1="489.4063" y2="489.4063"/><polygon fill="#181818" points="629,485.4063,619,489.4063,629,493.4063,625,489.4063" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="625" y="465.9199">(06)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="647" y="459.6309">Widerrufe &#252;bergebenes Refresh Token und ALLE der Session</text><text fill="#000000" font-family="Helvetica" font-size="10" x="647" y="472.209">zugeordneten (auch rotierten) Refresh Token, terminiere Session (A_29998, analog A_29855)</text><line style="stroke:#181818;stroke-width:1.0;" x1="618" x2="660" y1="528.5625" y2="528.5625"/><line style="stroke:#181818;stroke-width:1.0;" x1="660" x2="660" y1="528.5625" y2="541.5625"/><line style="stroke:#181818;stroke-width:1.0;" x1="619" x2="660" y1="541.5625" y2="541.5625"/><polygon fill="#181818" points="629,537.5625,619,541.5625,629,545.5625,625,541.5625" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="625" y="518.0762">(07)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="647" y="511.7871">Revisionssichere Protokollierung</text><text fill="#000000" font-family="Helvetica" font-size="10" x="647" y="524.3652">(Trace-Id, Session-Id, Trigger-Source, Reason-Code, Zeitpunkt) (A_29857)</text><path d="M623,554.5625 L623,626.5625 L942,626.5625 L942,564.5625 L932,554.5625 L623,554.5625 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M932,554.5625 L932,564.5625 L942,564.5625 L932,554.5625 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="629" y="569.9434">A_29999 (RFC 7009 &#167;2.2): Antwort 200 OK unabh&#228;ngig davon,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="629" y="582.5215">ob das Token g&#252;ltig, bereits ung&#252;ltig oder unbekannt war</text><text fill="#000000" font-family="Helvetica" font-size="10" x="629" y="595.0996">(keine Preisgabe der Token-Existenz).</text><text fill="#000000" font-family="Helvetica" font-size="10" x="629" y="607.6777">Folge-Refresh-Requests werden gem&#228;&#223; A_29856 mit</text><text fill="#000000" font-family="Helvetica" font-size="10" x="629" y="620.2559">refresh_token_revoked abgelehnt.</text><polygon fill="#181818" points="278,647.0313,268,651.0313,278,655.0313,274,651.0313" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="272" x2="607" y1="651.0313" y2="651.0313"/><text fill="#000000" font-family="Helvetica" font-size="10" x="284" y="646.834">(08)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="306" y="646.834">200 OK</text><path d="M623,694.6094 L623,729.6094 L974,729.6094 L974,704.6094 L964,694.6094 L623,694.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M964,694.6094 L964,704.6094 L974,704.6094 L964,694.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="629" y="709.9902">Access Token sind kurzlebig, DPoP-gebunden und werden zustandslos</text><text fill="#000000" font-family="Helvetica" font-size="10" x="629" y="722.5684">gepr&#252;ft; ihr Widerruf ist nicht Zweck dieses Endpunkts.</text><polygon fill="#181818" points="278,761.9219,268,765.9219,278,769.9219,274,765.9219" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="272" x2="607" y1="765.9219" y2="765.9219"/><text fill="#000000" font-family="Helvetica" font-size="10" x="284" y="755.4355">(09)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="306" y="749.1465">200 OK (ohne serverseitige Wirkung)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="306" y="761.7246">alternativ 400 Bad Request {"error": "unsupported_token_type"}</text><line style="stroke:#181818;stroke-width:1.0;" x1="267" x2="309" y1="819.0781" y2="819.0781"/><line style="stroke:#181818;stroke-width:1.0;" x1="309" x2="309" y1="819.0781" y2="832.0781"/><line style="stroke:#181818;stroke-width:1.0;" x1="268" x2="309" y1="832.0781" y2="832.0781"/><polygon fill="#181818" points="278,828.0781,268,832.0781,278,836.0781,274,832.0781" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="274" y="808.5918">(10)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="296" y="802.3027">L&#246;sche lokale Access-/Refresh Token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="296" y="814.8809">und DPoP-Schl&#252;ssel (A_30002)</text><polygon fill="#181818" points="35,854.6563,25,858.6563,35,862.6563,31,858.6563" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="29" x2="256" y1="858.6563" y2="858.6563"/><text fill="#000000" font-family="Helvetica" font-size="10" x="41" y="854.459">(11)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="63" y="854.459">Abmeldung abgeschlossen</text><polygon fill="#181818" points="278,911.8125,268,915.8125,278,919.8125,274,915.8125" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="272" x2="607" y1="915.8125" y2="915.8125"/><text fill="#000000" font-family="Helvetica" font-size="10" x="284" y="911.6152">(12)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="306" y="911.6152">401 Unauthorized {"error": "invalid_client"}</text><path d="M204,942.8125 L204,1002.8125 L671,1002.8125 L671,952.8125 L661,942.8125 L204,942.8125 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M661,942.8125 L661,952.8125 L671,952.8125 L661,942.8125 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="210" y="958.1934">Endpunkt POST /revoke gem&#228;&#223; [RFC7009] (A_29996), bekanntgegeben im</text><text fill="#000000" font-family="Helvetica" font-size="10" x="210" y="970.7715">as-well-known-Dokument (revocation_endpoint*, [RFC8414] / [as-well-known.yaml]).</text><text fill="#000000" font-family="Helvetica" font-size="10" x="210" y="983.3496">Client-Authentifizierung wie am Token-Endpunkt; ein Client kann nur eigene Token widerrufen.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="210" y="995.9277">Fehler-Body gem&#228;&#223; [zeta-error.yaml].</text><!