<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="814px" preserveAspectRatio="none" style="width:1110px;height:814px;background:#FFFFFF;" version="1.1" viewBox="0 0 1110 814" width="1110px" zoomAndPan="magnify"><defs/><g><rect fill="#FEFCFF" height="802.2344" style="stroke:#181818;stroke-width:0.5;" width="126" x="143" y="6"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="155" y="16.3809">mobile Apple Device</text><rect fill="#E6E6FA" height="784.6563" style="stroke:#181818;stroke-width:0.5;" width="126" x="143" y="23.5781"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="196.5" y="33.959">App</text><rect fill="#EDFDEC" height="802.2344" style="stroke:#181818;stroke-width:0.5;" width="128" x="583" y="6"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="595" y="16.3809">Anbieter TI 2.0 Dienst</text><rect fill="#FFF3E5" height="784.6563" style="stroke:#181818;stroke-width:0.5;" width="128" x="583" y="23.5781"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="618" y="33.959">ZETA Guard</text><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="206" x2="206" y1="80.3125" y2="762.0781"/><rect fill="#FFFFFF" height="673.7656" style="stroke:#000000;stroke-width:1.0;" width="10" x="201" y="88.3125"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="647" x2="647" y1="80.3125" y2="762.0781"/><rect fill="#FFFFFF" height="271.5156" style="stroke:#000000;stroke-width:1.0;" width="10" x="642" y="148.0469"/><rect fill="#FFE6CC" height="26.5781" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72" x="170" y="52.7344"/><text fill="#000000" font-family="Helvetica" font-size="10" x="177" y="70.1152">ZETA Client</text><rect fill="#FFE6CC" height="39.1563" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="110" x="592" y="40.1563"/><text fill="#000000" font-family="Helvetica" font-size="10" x="636.5" y="57.5371">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="599" y="70.1152">Authorization Server</text><rect fill="#FFE6CC" height="26.5781" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72" x="170" y="762.0781"/><text fill="#000000" font-family="Helvetica" font-size="10" x="177" y="779.459">ZETA Client</text><rect fill="#FFE6CC" height="39.1563" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="110" x="592" y="762.0781"/><text fill="#000000" font-family="Helvetica" font-size="10" x="636.5" y="779.459">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="599" y="792.0371">Authorization Server</text><path d="M190,92.3125 L247,92.3125 L247,96.8906 L237,106.8906 L190,106.8906 L190,92.3125 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="588.0313" style="stroke:#000000;stroke-width:1.5;" width="913" x="190" y="92.3125"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="205" y="103.6934">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="262" y="104.6934">[Kein ZETA Attestation Token vorhanden]</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="190" x2="1103" y1="438.5625" y2="438.5625"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="195" y="450.9434">[ZETA Attestation Token vorhanden (Fast-Path)]</text><polygon fill="#181818" points="630,144.0469,640,148.0469,630,152.0469,634,148.0469" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="211" x2="636" y1="148.0469" y2="148.0469"/><text fill="#000000" font-family="Helvetica" font-size="10" x="218" y="137.5605">(01)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="240" y="131.2715">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="240" y="143.8496">{attestation_type="apple", Apple_Attestation_Object, PuK.Client.Sig, redirect_uris}</text><line style="stroke:#181818;stroke-width:1.0;" x1="652" x2="694" y1="174.625" y2="174.625"/><line style="stroke:#181818;stroke-width:1.0;" x1="694" x2="694" y1="174.625" y2="187.625"/><line style="stroke:#181818;stroke-width:1.0;" x1="653" x2="694" y1="187.625" y2="187.625"/><polygon fill="#181818" points="663,183.625,653,187.625,663,191.625,659,187.625" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="659" y="170.4277">(02)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="681" y="170.4277">Validiere Apple_Attestation_Object</text><path d="M657,200.625 L657,235.625 L1082,235.625 L1082,210.625 L1072,200.625 L657,200.625 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1072,200.625 L1072,210.625 L1082,210.625 L1072,200.625 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="663" y="216.0059">AuthS verifiziert Apple App Attest Root CA. Extrahiert Hash(PuK.Client.Sig) aus Objekt</text><text fill="#000000" font-family="Helvetica" font-size="10" x="663" y="228.584">und vergleicht ihn mit dem Payload.</text><path d="M657,245.7813 L657,355.7813 L1079,355.7813 L1079,255.7813 L1069,245.7813 L657,245.7813 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1069,245.7813 L1069,255.7813 L1079,255.7813 L1069,245.7813 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="663" y="261.1621">Es werden zwei redirect_uris je App registriert (RFC 8252, claimed-HTTPS</text><text fill="#000000" font-family="Helvetica" font-size="10" x="663" y="273.7402">Universal-/App-Links auf einer vom App-Hersteller kontrollierten Domain):</text><text fill="#000000" font-family="Helvetica" font-size="10" x="663" y="286.3184">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/oidc = oidc_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="669" y="298.8965">(SekIDP Auth Code Flow, redirection_endpoint des AuthS, nicht /token)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="663" y="311.4746">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/app = app_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="669" y="324.0527">(ZETA Guard Auth Code Flow, /token-Endpunkt des AuthS)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="663" y="336.6309">Beide Callbacks enden &#252;ber denselben App-Link/Universal-Link in der App.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="663" y="349.209">Der ZETA Client unterscheidet den zu nutzenden AuthS-Endpunkt anhand des Pfads.</text><line style="stroke:#181818;stroke-width:1.0;" x1="652" x2="694" y1="379.9844" y2="379.9844"/><line style="stroke:#181818;stroke-width:1.0;" x1="694" x2="694" y1="379.9844" y2="392.9844"/><line style="stroke:#181818;stroke-width:1.0;" x1="653" x2="694" y1="392.9844" y2="392.9844"/><polygon fill="#181818" points="663,388.9844,653,392.9844,663,396.9844,659,392.9844" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="659" y="375.7871">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="681" y="375.7871">Store Client (state: pending_user_binding)</text><polygon fill="#181818" points="222,415.5625,212,419.5625,222,423.5625,218,419.5625" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="216" x2="641" y1="419.5625" y2="419.5625"/><text fill="#000000" font-family="Helvetica" font-size="10" x="228" y="415.3652">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="250" y="415.3652">201 Created {client_id, status: pending_user_binding}</text><polygon fill="#181818" points="635,510.4531,645,514.4531,635,518.4531,639,514.4531" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="211" x2="641" y1="514.4531" y2="514.4531"/><text fill="#000000" font-family="Helvetica" font-size="10" x="218" y="491.3887">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="240" y="472.5215">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="240" y="485.0996">{attestation_type="zeta_attestation_token",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="240" y="497.6777">zeta_attestation_token, PuK.Client.Sig,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="240" y="510.2559">Besitznachweis (Signatur/Assertion)}</text><line style="stroke:#181818;stroke-width:1.0;" x1="647" x2="689" y1="541.0313" y2="541.0313"/><line style="stroke:#181818;stroke-width:1.0;" x1="689" x2="689" y1="541.0313" y2="554.0313"/><line style="stroke:#181818;stroke-width:1.0;" x1="648" x2="689" y1="554.0313" y2="554.0313"/><polygon fill="#181818" points="658,550.0313,648,554.0313,658,558.0313,654,554.0313" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="654" y="536.834">(06)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="676" y="536.834">Pr&#252;fe Token-Signatur &amp; Vertrauensstellung</text><line style="stroke:#181818;stroke-width:1.0;" x1="647" x2="689" y1="580.6094" y2="580.6094"/><line style="stroke:#181818;stroke-width:1.0;" x1="689" x2="689" y1="580.6094" y2="593.6094"/><line style="stroke:#181818;stroke-width:1.0;" x1="648" x2="689" y1="593.6094" y2="593.6094"/><polygon fill="#181818" points="658,589.6094,648,593.6094,658,597.6094,654,593.6094" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="654" y="576.4121">(07)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="676" y="576.4121">Extrahiere PuK.AK.Sig aus Token, verifiziere Besitznachweis</text><line style="stroke:#181818;stroke-width:1.0;" x1="647" x2="689" y1="632.7656" y2="632.7656"/><line style="stroke:#181818;stroke-width:1.0;" x1="689" x2="689" y1="632.7656" y2="645.7656"/><line style="stroke:#181818;stroke-width:1.0;" x1="648" x2="689" y1="645.7656" y2="645.7656"/><polygon fill="#181818" points="658,641.7656,648,645.7656,658,649.7656,654,645.7656" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="654" y="622.2793">(08)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="676" y="615.9902">&#220;bernimm registrierte redirect_uris aus dem Token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="676" y="628.5684">(kein erneutes Senden im Fast-Path)</text><polygon fill="#181818" points="222,668.3438,212,672.3438,222,676.3438,218,672.3438" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="216" x2="646" y1="672.3438" y2="672.3438"/><text fill="#000000" font-family="Helvetica" font-size="10" x="228" y="668.1465">(09)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="250" y="668.1465">201 Created {client_id}</text><path d="M10,699.3438 L10,746.3438 L843,746.3438 L843,709.3438 L833,699.3438 L10,699.3438 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M833,699.3438 L833,709.3438 L843,709.3438 L833,699.3438 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="714.7246">Der zeta_attestation_token zertifiziert die erfolgreiche Apple App Attest Attestierung, ist an PuK.AK.Sig gebunden (cnf) und enth&#228;lt die registrierten</text><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="727.3027">redirect_uris. Er wird NICHT mehr bei /register ausgestellt, sondern erst nach der identit&#228;tsgebundenen E-Mail-Bindung im Token-Flow (siehe Abb-ZETA-OIDC-Token-Bezug).</text><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="739.8809">Er kann bei einer erneuten Registrierung im Fast-Path vorgelegt werden, sodass Hardware-Attestierung und redirect_uris nicht erneut &#252;bertragen werden m&#252;ssen.</text><!--SRC=[hLRDRjiu4BxhAMPzsBKHIse3BB3mfW4KsscCjh7NTWFi8e11IME9jKmP99KqBlecU-nZz9ONso4f_wNEjeVc88SIvvkFy_DnVk4YAQeK8GZ2LRKi_88zb9KEz4VjUR_1gv_uHt3HzUl-A9fCfd1t6hm8NdQWxxzZlF27qn5mfU5wqBsQmX9p2LFa1ToL0aA96Nr36S0Rv09eht-3KZ6HjWbpOTvjzuHtAFdy0Pgu9DnPgLUjjjs2S5tfDNqKj8ijD2z503sEm5CKcck6McKOLuAMIB0riGikqafaW79U5XaHZBfNaE8IXeDUrxyiodkeC4O9uHer2skmXp0cEzzoQDQKMWJQL1npX2YE_N_wqyYt8DDoWSA_m7MLjOBTIO3mueAZr20g2GEXD1DhbUH5XKfX0ISceAjLWNwaDIfDMudfdp3HJ5SAKYPOadTWXIBb8fjL2kNCqA95yBDJwyNbHsWiovWNw4X13-zuWWtezMy6tVwiEtmx77i0TYFjQC1eF7WNzSUJloVJ_hljTu0LavedVCM4XYu5W7wOWeO9MBrkmDcP2VVvEHdGyGoej_brL28HSpHHd0w0IiracW9ed0vl1ht- -92FnNvTCPasmFm_U_q-6lUUuHHLEfzOIgFUw5QOPIdvcfcIWWbAIlV_4tI7E3dnMA5TILl_BeiEnjO4LR_CcIb8oy4-we3uvux6oKa7HaFgfstPt8fFR0SqqmyhVDLW9YEDjilCRC_HR1X_m4ItOLIz2HnsCE5P6oIcNDANMIMv-cnTktDlF7VWXXKyfQB3Ps6jcIWrWkHPhg6SRsmTbcqClhOrxeg6ddKSO5oMbFyeWFv7BLbkDrqnbJSFgRQ0KR4RVmjzAwXz3MfM84_88Sy5BBcs3JjY3qN9qi1xZfLz3z1NS8-IWWxhU-I7WO0FZg8BjhISckFBBlnn-ljf6vA2yIMc_jLqEjh0lHVypeXLuOTawR_bOg68yXoC9abAyT8W-bUqHsDHqAj5ARGi2zlwnA9Naeg8LgV6yo7NUgKwONXcx2x_wbsVXqaSdb6EpyEIfmcy0lCpssTU6mCq9xWOz4RsnD0jIVYDXktoRP97XRegIISfRCg5fWt2nZFKfYvRFqI57iI4diyGsVNSDsIS6xzFF2gnsEEnyNo19BJGPKKHiuJYYQP9uF6h4MBwZzGnflKctk4k1sO9r70fRQJFGOtNe-MUla1bBWcIMkF6kATQg4Y5wVwmZYoN7JqcJ9TQbgCvIvL3DUrkgimxsZmJNLBZrEwQfctmk5Itzit9tfduVWTENxo4haIoJE5JOb_FUDe6PVN_EDfdpyD2uNS51vgNJ6b_n7JUEgOxFwGwHW5d1w-DaqRxLXp_yeqAtOeBL5olpKL6lQYeUdacw7GoZEWAbCQqTLoSHlBnwnpTiVoD5VmAD3YGcbHK8xRTwC8yQhxL7BISeZU6ZrMQgMEwaow4Gv97yHx_fT8KVBdSbmvy8Yu6tYYLTN4hcdQo8JEiA51qizZ4y2KyIStJsdYkCZwR6yZphFALnB_Utjwgd-c2uvcXrnJiZLIJwDVpa3GoYzzgz_v0qhQ37HFxWTmCMj1CnBm5HhM9IVxufN3e-q4obzz1dEX