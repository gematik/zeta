0.00000" height="870.7031" width="8" x="662.5801" y="114.9219"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5,5;" x1="666.0801" x2="666.0801" y1="114.9219" y2="985.625"/></g><g><title/><rect fill="#FFFFFF" height="565.375" style="stroke:#181818;stroke-width:1;" width="10" x="661.0801" y="321.6875"/></g><text fill="#000000" font-family="Helvetica" font-size="10" x="10" y="112.5635">Nutzer</text><ellipse cx="29.626" cy="51.7813" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M29.626,59.7813 L29.626,86.7813 M16.626,67.7813 L42.626,67.7813 M29.626,86.7813 L16.626,101.7813 M29.626,86.7813 L42.626,101.7813" fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="244.5444" y="88.2813"/><text fill="#000000" font-family="Helvetica" font-size="10" x="251.5444" y="104.5635">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="607.6055" y="76.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" x="656.1997" y="92.9229">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="614.6055" y="104.5635">Authorization Server</text><text fill="#000000" font-family="Helvetica" font-size="10" x="10" y="1054.9072">Nutzer</text><ellipse cx="29.626" cy="994.125" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M29.626,1002.125 L29.626,1029.125 M16.626,1010.125 L42.626,1010.125 M29.626,1029.125 L16.626,1044.125 M29.626,1029.125 L42.626,1044.125" fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="244.5444" y="985.625"/><text fill="#000000" font-family="Helvetica" font-size="10" x="251.5444" y="1001.9072">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="607.6055" y="985.625"/><text fill="#000000" font-family="Helvetica" font-size="10" x="656.1997" y="1001.9072">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="614.6055" y="1013.5479">Authorization Server</text><polygon fill="#181818" points="263.668,136.5625,273.668,140.5625,263.668,144.5625,267.668,140.5625" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="29.626" x2="269.668" y1="140.5625" y2="140.5625"/><text fill="#000000" font-family="Helvetica" font-size="10" x="36.626" y="136.2041">(01)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="61.1533" y="136.2041">Abmeldung (Logout) / Session beenden</text><path d="M-4.4243,153.5625 L-4.4243,186.5625 L699.5757,186.5625 L699.5757,163.5625 L689.5757,153.5625 L-4.4243,153.5625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M689.5757,153.5625 L689.5757,163.5625 L699.5757,163.5625 L689.5757,153.5625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="124.7739" y="167.8447">A_31016: Der ZETA Client widerruft bei nutzerinitiierter Abmeldung sein Refresh Token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="124.7739" y="179.4854">serverseitig, damit aus dem lokalen Logout eine echte Grant-Terminierung wird.</text><line style="stroke:#181818;stroke-width:1;" x1="285.668" x2="327.668" y1="209.4844" y2="209.4844"/><line style="stroke:#181818;stroke-width:1;" x1="327.668" x2="327.668" y1="209.4844" y2="222.4844"/><line style="stroke:#181818;stroke-width:1;" x1="286.668" x2="327.668" y1="222.4844" y2="222.4844"/><polygon fill="#181818" points="296.668,218.4844,286.668,222.4844,296.668,226.4844,292.668,222.4844" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="292.668" y="205.126">(02)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="317.1953" y="205.126">Create DPoP Proof (without Nonce)</text><line style="stroke:#181818;stroke-width:1;" x1="285.668" x2="327.668" y1="248.125" y2="248.125"/><line style="stroke:#181818;stroke-width:1;" x1="327.668" x2="327.668" y1="248.125" y2="261.125"/><line style="stroke:#181818;stroke-width:1;" x1="286.668" x2="327.668" y1="261.125" y2="261.125"/><polygon fill="#181818" points="296.668,257.125,286.668,261.125,296.668,265.125,292.668,261.125" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="292.668" y="243.7666">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="317.1953" y="243.7666">Create Client Assertion JWT (without Attestation)</text><polygon fill="#181818" points="649.0801,317.6875,659.0801,321.6875,649.0801,325.6875,653.0801,321.6875" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="285.668" x2="655.0801" y1="321.6875" y2="321.6875"/><text fill="#000000" font-family="Helvetica" font-size="10" x="292.668" y="299.8682">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="317.1953" y="282.4072">POST /revoke  dpop: dpop_proof</text><text fill="#000000" font-family="Helvetica" font-size="10" x="317.1953" y="294.0479">{client_assertion (JWT, PrK.Client.Sig signiert),</text><text fill="#000000" font-family="Helvetica" font-size="10" x="317.1953" y="305.6885">token=&lt;Refresh Token&gt;,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="317.1953" y="317.3291">token_type_hint=refresh_token}</text><line style="stroke:#181818;stroke-width:1;" x1="671.0801" x2="713.0801" y1="358.9688" y2="358.9688"/><line style="stroke:#181818;stroke-width:1;" x1="713.0801" x2="713.0801" y1="358.9688" y2="371.9688"/><line style="stroke:#181818;stroke-width:1;" x1="672.0801" x2="713.0801" y1="371.9688" y2="371.9688"/><polygon fill="#181818" points="682.0801,367.9688,672.0801,371.9688,682.0801,375.9688,678.0801,371.9688" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="678.0801" y="348.79">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="702.6074" y="342.9697">Client-Authentifizierung pr&#252;fen</text><text fill="#000000" font-family="Helvetica" font-size="10" x="702.6074" y="354.6104">(Client Assertion [RFC7523], DPoP Proof [RFC9449]) &#8212; wie am Token-Endpunkt</text><path d="M13.626,383.9688 L73.582,383.9688 L73.582,387.6094 L63.582,397.6094 L13.626,397.6094 L13.626,383.9688" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="511.0938" style="stroke:#000000;stroke-width:1.5;" width="1205.4971" x="13.626" y="383.9688"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="28.626" y="394.251">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="88.582" y="395.251">[Client-Authentifizierung erfolgreich (A_31011)]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="13.626" x2="1219.123" y1="850.7813" y2="850.7813"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="18.626" y="862.0635">[Client-Authentifizierung fehlerhaft (A_29997)]</text><path d="M264.668,411.6094 L324.624,411.6094 L324.624,415.25 L314.624,425.25 L264.668,425.25 L264.668,411.6094" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="338.25" style="stroke:#000000;stroke-width:1.5;" width="929.4551" x="264.668" y="411.6094"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="279.668" y="421.8916">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="339.624" y="422.8916">[token_type_hint = refresh_token bzw. Refresh Token erkannt]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="264.668" x2="1194.123" y1="650.6563" y2="650.6563"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="269.668" y="661.9385">[Access Token &#252;bergeben (au&#223;erhalb Geltungsbereich, A_30000)]</text><line style="stroke:#181818;stroke-width:1;" x1="671.0801" x2="713.0801" y1="464.5313" y2="464.5313"/><line style="stroke:#181818;stroke-width:1;" x1="713.0801" x2="713.0801" y1="464.5313" y2="477.5313"/><line style="stroke:#181818;stroke-width:1;" x1="672.0801" x2="713.0801" y1="477.5313" y2="477.5313"/><polygon fill="#181818" points="682.0801,473.5313,672.0801,477.5313,682.0801,481.5313,678.0801,477.5313" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="678.0801" y="454.3525">(06)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="702.6074" y="448.5322">Widerrufe &#252;bergebenes Refresh Token und ALLE der Session</text><text fill="#000000" font-family="Helvetica" font-size="10" x="702.6074" y="460.1729">zugeordneten (auch rotierten) Refresh Token, terminiere Session (A_29998, analog A_29855)</text><line style="stroke:#181818;stroke-width:1;" x1="671.0801" x2="713.0801" y1="514.8125" y2="514.8125"/><line style="stroke:#181818;stroke-width:1;" x1="713.0801" x2="713.0801" y1="514.8125" y2="527.8125"/><line style="stroke:#181818;stroke-width:1;" x1="672.0801" x2="713.0801" y1="527.8125" y2="527.8125"/><polygon fill="#181818" points="682.0801,523.8125,672.0801,527.8125,682.0801,531.8125,678.0801,527.8125" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="678.0801" y="504.6338">(07)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="702.6074" y="498.8135">Revisionssichere Protokollierung</text><text fill="#000000" font-family="Helvetica" font-size="10" x="702.6074" y="510.4541">(Trace-Id, Session-Id, Trigger-Source, Reason-Code, Zeitpunkt) (A_29857)</text><path d="M676.0801,540.8125 L676.0801,608.8125 L1009.0801,608.8125 L1009.0801,550.8125 L999.0801,540.8125 L676.0801,540.8125" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M999.0801,540.8125 L999.0801,550.8125 L1009.0801,550.8125 L999.0801,540.8125" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="682.0801" y="555.0947">A_29999 (RFC 7009 &#167;2.2): Antwort 200 OK unabh&#228;ngig davon,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="682.0801" y="566.7354">ob das Token g&#252;ltig, bereits ung&#252;ltig oder unbekannt war</text><text fill="#000000" font-family="Helvetica" font-size="10" x="682.0801" y="578.376">(keine Preisgabe der Token-Existenz).</text><text fill="#000000" font-family="Helvetica" font-size="10" x="682.0801" y="590.0166">Folge-Refresh-Requests werden gem&#228;&#223; A_29856 mit</text><text fill="#000000" font-family="Helvetica" font-size="10" x="682.0801" y="601.6572">refresh_token_revoked abgelehnt.</text><polygon fill="#181818" points="296.668,627.6563,286.668,631.6563,296.668,635.6563,292.668,631.6563" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="290.668" x2="660.0801" y1="631.6563" y2="631.6563"/><text fill="#000000" font-family="Helvetica" font-size="10" x="302.668" y="627.2979">(08)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="327.1953" y="627.2979">200 OK</text><path d="M676.0801,674.2969 L676.0801,707.2969 L1048.0801,707.2969 L1048.0801,684.2969 L1038.0801,674.2969 L676.0801,674.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1038.0801,674.2969 L1038.0801,684.2969 L1048.0801,684.2969 L1038.0801,674.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="682.0801" y="688.5791">Access Token sind kurzlebig, DPoP-gebunden und werden zustandslos</text><text fill="#000000" font-family="Helvetica" font-size="10" x="682.0801" y="700.2197">gepr&#252;ft; ihr Widerruf ist nicht Zweck dieses Endpunkts.</text><polygon fill="#181818" points="296.668,737.8594,286.668,741.8594,296.668,745.8594,292.668,741.8594" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="290.668" x2="660.0801" y1="741.8594" y2="741.8594"/><text fill="#000000" font-family="Helvetica" font-size="10" x="302.668" y="731.6807">(09)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="327.1953" y="725.8604">200 OK (ohne serverseitige Wirkung)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="327.1953" y="737.501">alternativ 400 Bad Request {"error": "unsupported_token_type"}</text><line style="stroke:#181818;stroke-width:1;" x1="285.668" x2="327.668" y1="793.1406" y2="793.1406"/><line style="stroke:#181818;stroke-width:1;" x1="327.668" x2="327.668" y1="793.1406" y2="806.1406"/><line style="stroke:#181818;stroke-width:1;" x1="286.668" x2="327.668" y1="806.1406" y2="806.1406"/><polygon fill="#181818" points="296.668,802.1406,286.668,806.1406,296.668,810.1406,292.668,806.1406" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="292.668" y="782.9619">(10)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="317.1953" y="777.1416">L&#246;sche lokale Access-/Refresh Token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="317.1953" y="788.7822">und DPoP-Schl&#252;ssel (A_30002)</text><polygon fill="#181818" points="40.626,827.7813,30.626,831.7813,40.626,835.7813,36.626,831.781