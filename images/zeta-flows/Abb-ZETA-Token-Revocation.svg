<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="1066px" preserveAspectRatio="none" style="width:1066px;height:1066px;background:#FFFFFF;" version="1.1" viewBox="0 0 1066 1066" width="1066px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><rect fill="#FEFCFF" height="1040.625" style="stroke:#181818;stroke-width:0.5;" width="102.1934" x="229.5713" y="11"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="261.7983" y="20.2822">Device</text><rect fill="#E6E6FA" height="1023.9844" style="stroke:#181818;stroke-width:0.5;" width="102.1934" x="229.5713" y="27.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="241.5713" y="36.9229">Prim&#228;rsystem</text><rect fill="#EDFDEC" height="1040.625" style="stroke:#181818;stroke-width:0.5;" width="147.7842" x="540.8354" y="11"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="552.8354" y="20.2822">Anbieter TI 2.0 Dienst</text><rect fill="#FFF3E5" height="1023.9844" style="stroke:#181818;stroke-width:0.5;" width="147.7842" x="540.8354" y="27.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="581.583" y="36.9229">ZETA Guard</text><g><title>Nutzer</title><rect fill="#000000" fill-opacity="0.00000" height="859.0625" width="8" x="26.126" y="114.9219"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5,5;" x1="29.626" x2="29.626" y1="114.9219" y2="973.9844"/></g><g><title>ZETA Client</title><rect fill="#000000" fill-opacity="0.00000" height="859.0625" width="8" x="277.168" y="114.9219"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5,5;" x1="280.668" x2="280.668" y1="114.9219" y2="973.9844"/></g><g><title/><rect fill="#FFFFFF" height="756.8594" style="stroke:#181818;stroke-width:1;" width="10" x="275.668" y="140.5625"/></g><g><title>PDP</title><rect fill="#000000" fill-opacity="0.00000" height="859.0625" width="8" x="611.2275" y="114.9219"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5,5;" x1="614.7275" x2="614.7275" y1="114.9219" y2="973.9844"/></g><g><title/><rect fill="#FFFFFF" height="553.7344" style="stroke:#181818;stroke-width:1;" width="10" x="609.7275" y="321.6875"/></g><text fill="#000000" font-family="Helvetica" font-size="10" x="10" y="112.5635">Nutzer</text><ellipse cx="29.626" cy="51.7813" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M29.626,59.7813 L29.626,86.7813 M16.626,67.7813 L42.626,67.7813 M29.626,86.7813 L16.626,101.7813 M29.626,86.7813 L42.626,101.7813" fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="244.5444" y="88.2813"/><text fill="#000000" font-family="Helvetica" font-size="10" x="251.5444" y="104.5635">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="556.2529" y="76.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" x="604.8472" y="92.9229">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="563.2529" y="104.5635">Authorization Server</text><text fill="#000000" font-family="Helvetica" font-size="10" x="10" y="1043.2666">Nutzer</text><ellipse cx="29.626" cy="982.4844" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M29.626,990.4844 L29.626,1017.4844 M16.626,998.4844 L42.626,998.4844 M29.626,1017.4844 L16.626,1032.4844 M29.626,1017.4844 L42.626,1032.4844" fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="244.5444" y="973.9844"/><text fill="#000000" font-family="Helvetica" font-size="10" x="251.5444" y="990.2666">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="556.2529" y="973.9844"/><text fill="#000000" font-family="Helvetica" font-size="10" x="604.8472" y="990.2666">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="563.2529" y="1001.9072">Authorization Server</text><polygon fill="#181818" points="263.668,136.5625,273.668,140.5625,263.668,144.5625,267.668,140.5625" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="29.626" x2="269.668" y1="140.5625" y2="140.5625"/><text fill="#000000" font-family="Helvetica" font-size="10" x="36.626" y="136.2041">(01)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="61.1533" y="136.2041">Abmeldung (Logout) / Session beenden</text><path d="M-4.4243,153.5625 L-4.4243,186.5625 L648.5757,186.5625 L648.5757,163.5625 L638.5757,153.5625 L-4.4243,153.5625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M638.5757,153.5625 L638.5757,163.5625 L648.5757,163.5625 L638.5757,153.5625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="116.0825" y="167.8447">Der ZETA Client widerruft bei nutzerinitiierter Abmeldung sein Refresh Token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="116.0825" y="179.4854">serverseitig, damit aus dem lokalen Logout eine echte Grant-Terminierung wird.</text><line style="stroke:#181818;stroke-width:1;" x1="285.668" x2="327.668" y1="209.4844" y2="209.4844"/><line style="stroke:#181818;stroke-width:1;" x1="327.668" x2="327.668" y1="209.4844" y2="222.4844"/><line style="stroke:#181818;stroke-width:1;" x1="286.668" x2="327.668" y1="222.4844" y2="222.4844"/><polygon fill="#181818" points="296.668,218.4844,286.668,222.4844,296.668,226.4844,292.668,222.4844" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="292.668" y="205.126">(02)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="317.1953" y="205.126">Create DPoP Proof (without Nonce)</text><line style="stroke:#181818;stroke-width:1;" x1="285.668" x2="327.668" y1="248.125" y2="248.125"/><line style="stroke:#181818;stroke-width:1;" x1="327.668" x2="327.668" y1="248.125" y2="261.125"/><line style="stroke:#181818;stroke-width:1;" x1="286.668" x2="327.668" y1="261.125" y2="261.125"/><polygon fill="#181818" points="296.668,257.125,286.668,261.125,296.668,265.125,292.668,261.125" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="292.668" y="243.7666">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="317.1953" y="243.7666">Create Client Assertion JWT (without Attestation)</text><polygon fill="#181818" points="597.7275,317.6875,607.7275,321.6875,597.7275,325.6875,601.7275,321.6875" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="285.668" x2="603.7275" y1="321.6875" y2="321.6875"/><text fill="#000000" font-family="Helvetica" font-size="10" x="292.668" y="299.8682">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="317.1953" y="282.4072">POST /revoke  dpop: dpop_proof</text><text fill="#000000" font-family="Helvetica" font-size="10" x="317.1953" y="294.0479">{client_assertion (JWT, PrK.Client.Sig signiert),</text><text fill="#000000" font-family="Helvetica" font-size="10" x="317.1953" y="305.6885">token=&lt;Refresh Token&gt;,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="317.1953" y="317.3291">token_type_hint=refresh_token}</text><line style="stroke:#181818;stroke-width:1;" x1="619.7275" x2="661.7275" y1="358.9688" y2="358.9688"/><line style="stroke:#181818;stroke-width:1;" x1="661.7275" x2="661.7275" y1="358.9688" y2="371.9688"/><line style="stroke:#181818;stroke-width:1;" x1="620.7275" x2="661.7275" y1="371.9688" y2="371.9688"/><polygon fill="#181818" points="630.7275,367.9688,620.7275,371.9688,630.7275,375.9688,626.7275,371.9688" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="626.7275" y="348.79">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="651.2549" y="342.9697">Client-Authentifizierung pr&#252;fen</text><text fill="#000000" font-family="Helvetica" font-size="10" x="651.2549" y="354.6104">(Client Assertion [RFC7523], DPoP Proof [RFC9449]) &#8212; wie am Token-Endpunkt</text><path d="M13.626,383.9688 L73.582,383.9688 L73.582,387.6094 L63.582,397.6094 L13.626,397.6094 L13.626,383.9688" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="499.4531" style="stroke:#000000;stroke-width:1.5;" width="1030.0156" x="13.626" y="383.9688"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="28.626" y="394.251">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="88.582" y="395.251">[Client-Authentifizierung erfolgreich]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="13.626" x2="1043.6416" y1="839.1406" y2="839.1406"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="18.626" y="850.4229">[Client-Authentifizierung fehlerhaft]</text><path d="M264.668,411.6094 L324.624,411.6094 L324.624,415.25 L314.624,425.25 L264.668,425.25 L264.668,411.6094" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="326.6094" style="stroke:#000000;stroke-width:1.5;" width="753.9736" x="264.668" y="411.6094"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="279.668" y="421.8916">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="339.624" y="422.8916">[token_type_hint = refresh_token bzw. Refresh Token erkannt]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="264.668" x2="1018.6416" y1="650.6563" y2="650.6563"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="269.668" y="661.9385">[Access Token &#252;bergeben (au&#223;erhalb Geltungsbereich)]</text><line style="stroke:#181818;stroke-width:1;" x1="619.7275" x2="661.7275" y1="464.5313" y2="464.5313"/><line style="stroke:#181818;stroke-width:1;" x1="661.7275" x2="661.7275" y1="464.5313" y2="477.5313"/><line style="stroke:#181818;stroke-width:1;" x1="620.7275" x2="661.7275" y1="477.5313" y2="477.5313"/><polygon fill="#181818" points="630.7275,473.5313,620.7275,477.5313,630.7275,481.5313,626.7275,477.5313" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="626.7275" y="454.3525">(06)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="651.2549" y="448.5322">Widerrufe &#252;bergebenes Refresh Token und ALLE der Session</text><text fill="#000000" font-family="Helvetica" font-size="10" x="651.2549" y="460.1729">zugeordneten (auch rotierten) Refresh Token, terminiere Session</text><line style="stroke:#181818;stroke-width:1;" x1="619.7275" x2="661.7275" y1="514.8125" y2="514.8125"/><line style="stroke:#181818;stroke-width:1;" x1="661.7275" x2="661.7275" y1="514.8125" y2="527.8125"/><line style="stroke:#181818;stroke-width:1;" x1="620.7275" x2="661.7275" y1="527.8125" y2="527.8125"/><polygon fill="#181818" points="630.7275,523.8125,620.7275,527.8125,630.7275,531.8125,626.7275,527.8125" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="626.7275" y="504.6338">(07)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="651.2549" y="498.8135">Revisionssichere Protokollierung</text><text fill="#000000" font-family="Helvetica" font-size="10" x="651.2549" y="510.4541">(Trace-Id, Session-Id, Trigger-Source, Reason-Code, Zeitpunkt)</text><path d="M624.7275,540.8125 L624.7275,608.8125 L933.7275,608.8125 L933.7275,550.8125 L923.7275,540.8125 L624.7275,540.8125" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M923.7275,540.8125 L923.7275,550.8125 L933.7275,550.8125 L923.7275,540.8125" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="630.7275" y="555.0947">(RFC 7009 &#167;2.2): Antwort 200 OK unabh&#228;ngig davon,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="630.7275" y="566.7354">ob das Token g&#252;ltig, bereits ung&#252;ltig oder unbekannt war</text><text fill="#000000" font-family="Helvetica" font-size="10" x="630.7275" y="578.376">(keine Preisgabe der Token-Existenz).</text><text fill="#000000" font-family="Helvetica" font-size="10" x="630.7275" y="590.0166">Folge-Refresh-Requests werden gem&#228;&#223; mit</text><text fill="#000000" font-family="Helvetica" font-size="10" x="630.7275" y="601.6572">refresh_token_revoked abgelehnt.</text><polygon fill="#181818" points="296.668,627.6563,286.668,631.6563,296.668,635.6563,292.668,631.6563" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="290.668" x2="608.7275" y1="631.6563" y2="631.6563"/><text fill="#000000" font-family="Helvetica" font-size="10" x="302.668" y="627.2979">(08)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="327.1953" y="627.2979">200 OK</text><path d="M624.7275,674.2969 L624.7275,707.2969 L996.7275,707.2969 L996.7275,684.2969 L986.7275,674.2969 L624.7275,674.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M986.7275,674.2969 L986.7275,684.2969 L996.7275,684.2969 L986.7275,674.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="630.7275" y="688.5791">Access Token sind kurzlebig, DPoP-gebunden und werden zustandslos</text><text fill="#000000" font-family="Helvetica" font-size="10" x="630.7275" y="700.2197">gepr&#252;ft; ihr Widerruf ist nicht Zweck dieses Endpunkts.</text><polygon fill="#181818" points="296.668,726.2188,286.668,730.2188,296.668,734.2188,292.668,730.2188" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="290.668" x2="608.7275" y1="730.2188" y2="730.2188"/><text fill="#000000" font-family="Helvetica" font-size="10" x="302.668" y="725.8604">(09)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="327.1953" y="725.8604">400 Bad Request {"error": "unsupported_token_type"}</text><line style="stroke:#181818;stroke-width:1;" x1="285.668" x2="327.668" y1="781.5" y2="781.5"/><line style="stroke:#181818;stroke-width:1;" x1="327.668" x2="327.668" y1="781.5" y2="794.5"/><line style="stroke:#181818;stroke-width:1;" x1="286.668" x2="327.668" y1="794.5" y2="794.5"/><polygon fill="#181818" points="296.668,790.5,286.668,794.5,296.668,798.5,292.668,794.5" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="292.668" y="771.3213">(10)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="317.1953" y="765.501">L&#246;sche lokale Access-/Refresh Token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="317.1953" y="777.1416">und DPoP-Schl&#252;ssel</text><polygon fill="#181818" points="40.626,816.1406,30.626,820.1406,40.626,824.1406,36.626,820.1406" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="34.626" x2="274.668" y1="820.1406" y2="820.1406"/><text fill="#000000" font-family="Helvetica" font-size