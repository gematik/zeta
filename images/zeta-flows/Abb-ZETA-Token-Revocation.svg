<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="1119px" preserveAspectRatio="none" style="width:1063px;height:1119px;background:#FFFFFF;" version="1.1" viewBox="0 0 1063 1119" width="1063px" zoomAndPan="magnify"><defs/><g><rect fill="#FEFCFF" height="1107.5469" style="stroke:#181818;stroke-width:0.5;" width="102.1934" x="224.5713" y="6"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="256.7983" y="15.2822">Device</text><rect fill="#E6E6FA" height="1090.9063" style="stroke:#181818;stroke-width:0.5;" width="102.1934" x="224.5713" y="22.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="236.5713" y="31.9229">Prim&#228;rsystem</text><rect fill="#EDFDEC" height="1107.5469" style="stroke:#181818;stroke-width:0.5;" width="147.7842" x="548.0132" y="6"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="560.0132" y="15.2822">Anbieter TI 2.0 Dienst</text><rect fill="#FFF3E5" height="1090.9063" style="stroke:#181818;stroke-width:0.5;" width="147.7842" x="548.0132" y="22.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="588.7607" y="31.9229">ZETA Guard</text><g><title>Nutzer</title><rect fill="#000000" fill-opacity="0.00000" height="925.9844" width="8" x="21.126" y="109.9219"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="24.626" x2="24.626" y1="109.9219" y2="1035.9063"/></g><g><title>ZETA Client</title><rect fill="#000000" fill-opacity="0.00000" height="925.9844" width="8" x="272.168" y="109.9219"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="275.668" x2="275.668" y1="109.9219" y2="1035.9063"/></g><g><title/><rect fill="#FFFFFF" height="815.7813" style="stroke:#000000;stroke-width:1;" width="10" x="270.668" y="135.5625"/></g><g><title>PDP</title><rect fill="#000000" fill-opacity="0.00000" height="925.9844" width="8" x="618.4053" y="109.9219"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="621.9053" x2="621.9053" y1="109.9219" y2="1035.9063"/></g><g><title/><rect fill="#FFFFFF" height="719.2188" style="stroke:#000000;stroke-width:1;" width="10" x="616.9053" y="316.6875"/></g><text fill="#000000" font-family="Helvetica" font-size="10" x="5" y="107.5635">Nutzer</text><ellipse cx="24.626" cy="46.7813" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M24.626,54.7813 L24.626,81.7813 M11.626,62.7813 L37.626,62.7813 M24.626,81.7813 L11.626,96.7813 M24.626,81.7813 L37.626,96.7813" fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="239.5444" y="83.2813"/><text fill="#000000" font-family="Helvetica" font-size="10" x="246.5444" y="99.5635">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="563.4307" y="71.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" x="612.0249" y="87.9229">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="570.4307" y="99.5635">Authorization Server</text><text fill="#000000" font-family="Helvetica" font-size="10" x="5" y="1105.1885">Nutzer</text><ellipse cx="24.626" cy="1044.4063" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M24.626,1052.4063 L24.626,1079.4063 M11.626,1060.4063 L37.626,1060.4063 M24.626,1079.4063 L11.626,1094.4063 M24.626,1079.4063 L37.626,1094.4063" fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="239.5444" y="1035.9063"/><text fill="#000000" font-family="Helvetica" font-size="10" x="246.5444" y="1052.1885">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="563.4307" y="1035.9063"/><text fill="#000000" font-family="Helvetica" font-size="10" x="612.0249" y="1052.1885">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="570.4307" y="1063.8291">Authorization Server</text><polygon fill="#181818" points="258.668,131.5625,268.668,135.5625,258.668,139.5625,262.668,135.5625" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="24.626" x2="264.668" y1="135.5625" y2="135.5625"/><text fill="#000000" font-family="Helvetica" font-size="10" x="31.626" y="131.2041">(01)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="56.1533" y="131.2041">Abmeldung (Logout) / Session beenden</text><path d="M-9.4243,148.5625 L-9.4243,181.5625 L655.5757,181.5625 L655.5757,158.5625 L645.5757,148.5625 L-9.4243,148.5625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M645.5757,148.5625 L645.5757,158.5625 L655.5757,158.5625 L645.5757,148.5625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="117.1714" y="162.8447">Der ZETA Client widerruft bei nutzerinitiierter Abmeldung sein Refresh Token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="117.1714" y="174.4854">serverseitig, damit aus dem lokalen Logout eine echte Grant-Terminierung wird.</text><line style="stroke:#181818;stroke-width:1;" x1="280.668" x2="322.668" y1="204.4844" y2="204.4844"/><line style="stroke:#181818;stroke-width:1;" x1="322.668" x2="322.668" y1="204.4844" y2="217.4844"/><line style="stroke:#181818;stroke-width:1;" x1="281.668" x2="322.668" y1="217.4844" y2="217.4844"/><polygon fill="#181818" points="291.668,213.4844,281.668,217.4844,291.668,221.4844,287.668,217.4844" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="287.668" y="200.126">(02)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="312.1953" y="200.126">Create DPoP Proof (without Nonce)</text><line style="stroke:#181818;stroke-width:1;" x1="280.668" x2="322.668" y1="243.125" y2="243.125"/><line style="stroke:#181818;stroke-width:1;" x1="322.668" x2="322.668" y1="243.125" y2="256.125"/><line style="stroke:#181818;stroke-width:1;" x1="281.668" x2="322.668" y1="256.125" y2="256.125"/><polygon fill="#181818" points="291.668,252.125,281.668,256.125,291.668,260.125,287.668,256.125" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="287.668" y="238.7666">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="312.1953" y="238.7666">Create Client Assertion JWT (without Attestation)</text><polygon fill="#181818" points="604.9053,312.6875,614.9053,316.6875,604.9053,320.6875,608.9053,316.6875" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="280.668" x2="610.9053" y1="316.6875" y2="316.6875"/><text fill="#000000" font-family="Helvetica" font-size="10" x="287.668" y="294.8682">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="312.1953" y="277.4072">POST /revoke  dpop: dpop_proof</text><text fill="#000000" font-family="Helvetica" font-size="10" x="312.1953" y="289.0479">{client_assertion (JWT, PrK.Client.Sig signiert),</text><text fill="#000000" font-family="Helvetica" font-size="10" x="312.1953" y="300.6885">token=&lt;Refresh Token&gt;,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="312.1953" y="312.3291">token_type_hint=refresh_token}</text><line style="stroke:#181818;stroke-width:1;" x1="626.9053" x2="668.9053" y1="353.9688" y2="353.9688"/><line style="stroke:#181818;stroke-width:1;" x1="668.9053" x2="668.9053" y1="353.9688" y2="366.9688"/><line style="stroke:#181818;stroke-width:1;" x1="627.9053" x2="668.9053" y1="366.9688" y2="366.9688"/><polygon fill="#181818" points="637.9053,362.9688,627.9053,366.9688,637.9053,370.9688,633.9053,366.9688" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="633.9053" y="343.79">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="658.4326" y="337.9697">Client-Authentifizierung pr&#252;fen</text><text fill="#000000" font-family="Helvetica" font-size="10" x="658.4326" y="349.6104">(Client Assertion [RFC7523], DPoP Proof [RFC9449]) &#8212; wie am Token-Endpunkt</text><path d="M240.668,378.9688 L300.624,378.9688 L300.624,382.6094 L290.624,392.6094 L240.668,392.6094 L240.668,378.9688" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="490.4531" style="stroke:#000000;stroke-width:1.5;" width="810.1514" x="240.668" y="378.9688"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="255.668" y="389.251">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="315.624" y="390.251">[Client-Authentifizierung erfolgreich]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="240.668" x2="1050.8193" y1="769.8594" y2="769.8594"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="245.668" y="781.1416">[DPoP Proof fehlerhaft]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="240.668" x2="1050.8193" y1="825.1406" y2="825.1406"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="245.668" y="836.4229">[Client Assertion fehlerhaft]</text><path d="M259.668,406.6094 L319.624,406.6094 L319.624,410.25 L309.624,420.25 L259.668,420.25 L259.668,406.6094" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="338.25" style="stroke:#000000;stroke-width:1.5;" width="766.1514" x="259.668" y="406.6094"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="274.668" y="416.8916">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="334.624" y="417.8916">[token_type_hint = refresh_token bzw. Refresh Token erkannt]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="259.668" x2="1025.8193" y1="645.6563" y2="645.6563"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="264.668" y="656.9385">[Access Token &#252;bergeben (au&#223;erhalb Geltungsbereich)]</text><line style="stroke:#181818;stroke-width:1;" x1="626.9053" x2="668.9053" y1="459.5313" y2="459.5313"/><line style="stroke:#181818;stroke-width:1;" x1="668.9053" x2="668.9053" y1="459.5313" y2="472.5313"/><line style="stroke:#181818;stroke-width:1;" x1="627.9053" x2="668.9053" y1="472.5313" y2="472.5313"/><polygon fill="#181818" points="637.9053,468.5313,627.9053,472.5313,637.9053,476.5313,633.9053,472.5313" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="633.9053" y="449.3525">(06)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="658.4326" y="443.5322">Widerrufe &#252;bergebenes Refresh Token und ALLE der Session</text><text fill="#000000" font-family="Helvetica" font-size="10" x="658.4326" y="455.1729">zugeordneten (auch rotierten) Refresh Token, terminiere Session</text><line style="stroke:#181818;stroke-width:1;" x1="626.9053" x2="668.9053" y1="509.8125" y2="509.8125"/><line style="stroke:#181818;stroke-width:1;" x1="668.9053" x2="668.9053" y1="509.8125" y2="522.8125"/><line style="stroke:#181818;stroke-width:1;" x1="627.9053" x2="668.9053" y1="522.8125" y2="522.8125"/><polygon fill="#181818" points="637.9053,518.8125,627.9053,522.8125,637.9053,526.8125,633.9053,522.8125" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="633.9053" y="499.6338">(07)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="658.4326" y="493.8135">Revisionssichere Protokollierung</text><text fill="#000000" font-family="Helvetica" font-size="10" x="658.4326" y="505.4541">(Trace-Id, Session-Id, Trigger-Source, Reason-Code, Zeitpunkt)</text><path d="M631.9053,535.8125 L631.9053,603.8125 L940.9053,603.8125 L940.9053,545.8125 L930.9053,535.8125 L631.9053,535.8125" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M930.9053,535.8125 L930.9053,545.8125 L940.9053,545.8125 L930.9053,535.8125" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="637.9053" y="550.0947">(RFC 7009 &#167;2.2): Antwort 200 OK unabh&#228;ngig davon,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="637.9053" y="561.7354">ob das Token g&#252;ltig, bereits ung&#252;ltig oder unbekannt war</text><text fill="#000000" font-family="Helvetica" font-size="10" x="637.9053" y="573.376">(keine Preisgabe der Token-Existenz).</text><text fill="#000000" font-family="Helvetica" font-size="10" x="637.9053" y="585.0166">Folge-Refresh-Requests werden mit</text><text fill="#000000" font-family="Helvetica" font-size="10" x="637.9053" y="596.6572">400 invalid_grant abgelehnt (A_29998).</text><polygon fill="#181818" points="291.668,622.6563,281.668,626.6563,291.668,630.6563,287.668,626.6563" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="285.668" x2="615.9053" y1="626.6563" y2="626.6563"/><text fill="#000000" font-family="Helvetica" font-size="10" x="297.668" y="622.2979">(08)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="322.1953" y="622.2979">200 OK</text><path d="M631.9053,669.2969 L631.9053,713.2969 L1003.9053,713.2969 L1003.9053,679.2969 L993.9053,669.2969 L631.9053,669.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M993.9053,669.2969 L993.9053,679.2969 L1003.9053,679.2969 L993.9053,669.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="637.9053" y="683.5791">Access Token sind kurzlebig, DPoP-gebunden und werden zustandslos</text><text fill="#000000" font-family="Helvetica" font-size="10" x="637.9053" y="695.2197">gepr&#252;ft; ihr Widerruf ist nicht Zweck dieses Endpunkts.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="637.9053" y="706.8604">Antwort unabh&#228;ngig von token_type_hint (A_30000).</text><polygon fill="#181818" points="291.668,732.8594,281.668,736.8594,291.668,740.8594,287.668,736.8594" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="285.668" x2="615.9053" y1="736.8594" y2="736.8594"/><text fill="#000000" font-family="Helvetica" font-size="10" x="297.668" y="732.501">(09)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="322.1953" y="732.501">200 OK (ohne Wirkung)</text><polygon fill="#181818" points="291.668,802.1406,281.668,806.1406,291.668,810.1406,287.668,806.1406" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="285.668" x2="615.9053" y1="806.1406" y2="806.1406"/><text fill="#000000" font-family="Helvetica" font-size="10" x="297.668" y="801.7822">(10)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="322.1953" y="801.7822">400 Bad Request {"error": "invalid_dpop_proof"}</text><polygon fill="#181818" points="291.668,857.4219,281.668,861.4219,291.668,865.4219,287.668,861.4219" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="285.668" x2="615.9053" y1="861.4219" y2="861.4219"/><text fill="#000000" font-family="Helvetica" font-size="10" x="297.668" y="857.0635">(11)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="322.1953" y="857.0635">401 Unauthorized {"error": "invalid_client"}</text><line style="stroke:#181818;stroke-width:1;" x1="280.668" x2="322.668" y1="912.7031" y2="912.7031"/><line style="stroke:#181818;stroke-width:1;" x1="322.668" x2="322.668" y1="912.7031" y2="925.7031"/><line style="stroke:#181818;stroke-width:1;" x1="281.668" x2="322.668" y1="925.7031" y2="925.7031"/><polygon fill="#181818" points="291.668,921.7031,281.668,925.7031,291.668,929.7031,287.668,925.7031" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="287.668" y="902.5244">(12)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="312.1953" y="896.7041">L&#246;sche lokale Access-/Refresh Token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="312.1953" y="908.3447">und DPoP-Schl&#252;ssel (unabh&#228;ngig von der Antwort, A_30002)</text><polygon fill="#181818" points="35.626,947.3438,25.626,951.3438,35.626,955.3438,31.626,951.3438" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="29.626" x2="269.668" y1="951.3438" y2="951.3438"/><text fill="#000000" font-family="Helvetica" font-size="10" x="41.626" y="946.9854">(13)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="66.1533" y="946.9854">Abmeldung abgeschlossen</text><path d="M200.2739,964.3438 L200.2739,1020.3438 L697.2739,1020.3438 L697.2739,974.3438 L687.2739,964.3438 L200.2739,964.3438" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M687.2739,964.3438 L687.2739,974.3438 L697.2739,974.3438 L687.2739,964.3438" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="206.2739" y="978.626">Endpunkt POST /revoke gem&#228;&#223; [RFC7009], bekanntgegeben im</text><text fill="#000000" font-family="Helvetica" font-size="10" x="206.2739" y="990.2666">as-well-known-Dokument (revocation_endpoint*, [RFC8414] / [as-well-known.yaml]).</text><text fill="#000000" font-family="Helvetica" font-size="10" x="206.2739" y="1001.9072">Client-Authentifizierung wie am Token-Endpunkt; ein Client kann nur eigene Token widerrufen.</text><