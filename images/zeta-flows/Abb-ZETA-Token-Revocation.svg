000" height="859.0625" width="8" x="606.2275" y="109.9219"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="609.7275" x2="609.7275" y1="109.9219" y2="968.9844"/></g><g><title/><rect fill="#FFFFFF" height="553.7344" style="stroke:#000000;stroke-width:1;" width="10" x="604.7275" y="316.6875"/></g><text fill="#000000" font-family="Helvetica" font-size="10" x="5" y="107.5635">Nutzer</text><ellipse cx="24.626" cy="46.7813" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M24.626,54.7813 L24.626,81.7813 M11.626,62.7813 L37.626,62.7813 M24.626,81.7813 L11.626,96.7813 M24.626,81.7813 L37.626,96.7813" fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="239.5444" y="83.2813"/><text fill="#000000" font-family="Helvetica" font-size="10" x="246.5444" y="99.5635">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="551.2529" y="71.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" x="599.8472" y="87.9229">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="558.2529" y="99.5635">Authorization Server</text><text fill="#000000" font-family="Helvetica" font-size="10" x="5" y="1038.2666">Nutzer</text><ellipse cx="24.626" cy="977.4844" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M24.626,985.4844 L24.626,1012.4844 M11.626,993.4844 L37.626,993.4844 M24.626,1012.4844 L11.626,1027.4844 M24.626,1012.4844 L37.626,1027.4844" fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="239.5444" y="968.9844"/><text fill="#000000" font-family="Helvetica" font-size="10" x="246.5444" y="985.2666">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="551.2529" y="968.9844"/><text fill="#000000" font-family="Helvetica" font-size="10" x="599.8472" y="985.2666">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="558.2529" y="996.9072">Authorization Server</text><polygon fill="#181818" points="258.668,131.5625,268.668,135.5625,258.668,139.5625,262.668,135.5625" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="24.626" x2="264.668" y1="135.5625" y2="135.5625"/><text fill="#000000" font-family="Helvetica" font-size="10" x="31.626" y="131.2041">(01)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="56.1533" y="131.2041">Abmeldung (Logout) / Session beenden</text><path d="M-9.4243,148.5625 L-9.4243,181.5625 L643.5757,181.5625 L643.5757,158.5625 L633.5757,148.5625 L-9.4243,148.5625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M633.5757,148.5625 L633.5757,158.5625 L643.5757,158.5625 L633.5757,148.5625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="111.0825" y="162.8447">Der ZETA Client widerruft bei nutzerinitiierter Abmeldung sein Refresh Token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="111.0825" y="174.4854">serverseitig, damit aus dem lokalen Logout eine echte Grant-Terminierung wird.</text><line style="stroke:#181818;stroke-width:1;" x1="280.668" x2="322.668" y1="204.4844" y2="204.4844"/><line style="stroke:#181818;stroke-width:1;" x1="322.668" x2="322.668" y1="204.4844" y2="217.4844"/><line style="stroke:#181818;stroke-width:1;" x1="281.668" x2="322.668" y1="217.4844" y2="217.4844"/><polygon fill="#181818" points="291.668,213.4844,281.668,217.4844,291.668,221.4844,287.668,217.4844" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="287.668" y="200.126">(02)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="312.1953" y="200.126">Create DPoP Proof (without Nonce)</text><line style="stroke:#181818;stroke-width:1;" x1="280.668" x2="322.668" y1="243.125" y2="243.125"/><line style="stroke:#181818;stroke-width:1;" x1="322.668" x2="322.668" y1="243.125" y2="256.125"/><line style="stroke:#181818;stroke-width:1;" x1="281.668" x2="322.668" y1="256.125" y2="256.125"/><polygon fill="#181818" points="291.668,252.125,281.668,256.125,291.668,260.125,287.668,256.125" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="287.668" y="238.7666">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="312.1953" y="238.7666">Create Client Assertion JWT (without Attestation)</text><polygon fill="#181818" points="592.7275,312.6875,602.7275,316.6875,592.7275,320.6875,596.7275,316.6875" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="280.668" x2="598.7275" y1="316.6875" y2="316.6875"/><text fill="#000000" font-family="Helvetica" font-size="10" x="287.668" y="294.8682">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="312.1953" y="277.4072">POST /revoke  dpop: dpop_proof</text><text fill="#000000" font-family="Helvetica" font-size="10" x="312.1953" y="289.0479">{client_assertion (JWT, PrK.Client.Sig signiert),</text><text fill="#000000" font-family="Helvetica" font-size="10" x="312.1953" y="300.6885">token=&lt;Refresh Token&gt;,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="312.1953" y="312.3291">token_type_hint=refresh_token}</text><line style="stroke:#181818;stroke-width:1;" x1="614.7275" x2="656.7275" y1="353.9688" y2="353.9688"/><line style="stroke:#181818;stroke-width:1;" x1="656.7275" x2="656.7275" y1="353.9688" y2="366.9688"/><line style="stroke:#181818;stroke-width:1;" x1="615.7275" x2="656.7275" y1="366.9688" y2="366.9688"/><polygon fill="#181818" points="625.7275,362.9688,615.7275,366.9688,625.7275,370.9688,621.7275,366.9688" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="621.7275" y="343.79">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="646.2549" y="337.9697">Client-Authentifizierung pr&#252;fen</text><text fill="#000000" font-family="Helvetica" font-size="10" x="646.2549" y="349.6104">(Client Assertion [RFC7523], DPoP Proof [RFC9449]) &#8212; wie am Token-Endpunkt</text><path d="M8.626,378.9688 L68.582,378.9688 L68.582,382.6094 L58.582,392.6094 L8.626,392.6094 L8.626,378.9688" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="499.4531" style="stroke:#000000;stroke-width:1.5;" width="1030.0156" x="8.626" y="378.9688"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="23.626" y="389.251">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="83.582" y="390.251">[Client-Authentifizierung erfolgreich]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="8.626" x2="1038.6416" y1="834.1406" y2="834.1406"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="13.626" y="845.4229">[Client-Authentifizierung fehlerhaft]</text><path d="M259.668,406.6094 L319.624,406.6094 L319.624,410.25 L309.624,420.25 L259.668,420.25 L259.668,406.6094" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="326.6094" style="stroke:#000000;stroke-width:1.5;" width="753.9736" x="259.668" y="406.6094"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="274.668" y="416.8916">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="334.624" y="417.8916">[token_type_hint = refresh_token bzw. Refresh Token erkannt]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="259.668" x2="1013.6416" y1="645.6563" y2="645.6563"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="264.668" y="656.9385">[Access Token &#252;bergeben (au&#223;erhalb Geltungsbereich)]</text><line style="stroke:#181818;stroke-width:1;" x1="614.7275" x2="656.7275" y1="459.5313" y2="459.5313"/><line style="stroke:#181818;stroke-width:1;" x1="656.7275" x2="656.7275" y1="459.5313" y2="472.5313"/><line style="stroke:#181818;stroke-width:1;" x1="615.7275" x2="656.7275" y1="472.5313" y2="472.5313"/><polygon fill="#181818" points="625.7275,468.5313,615.7275,472.5313,625.7275,476.5313,621.7275,472.5313" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="621.7275" y="449.3525">(06)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="646.2549" y="443.5322">Widerrufe &#252;bergebenes Refresh Token und ALLE der Session</text><text fill="#000000" font-family="Helvetica" font-size="10" x="646.2549" y="455.1729">zugeordneten (auch rotierten) Refresh Token, terminiere Session</text><line style="stroke:#181818;stroke-width:1;" x1="614.7275" x2="656.7275" y1="509.8125" y2="509.8125"/><line style="stroke:#181818;stroke-width:1;" x1="656.7275" x2="656.7275" y1="509.8125" y2="522.8125"/><line style="stroke:#181818;stroke-width:1;" x1="615.7275" x2="656.7275" y1="522.8125" y2="522.8125"/><polygon fill="#181818" points="625.7275,518.8125,615.7275,522.8125,625.7275,526.8125,621.7275,522.8125" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="621.7275" y="499.6338">(07)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="646.2549" y="493.8135">Revisionssichere Protokollierung</text><text fill="#000000" font-family="Helvetica" font-size="10" x="646.2549" y="505.4541">(Trace-Id, Session-Id, Trigger-Source, Reason-Code, Zeitpunkt)</text><path d="M619.7275,535.8125 L619.7275,603.8125 L928.7275,603.8125 L928.7275,545.8125 L918.7275,535.8125 L619.7275,535.8125" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M918.7275,535.8125 L918.7275,545.8125 L928.7275,545.8125 L918.7275,535.8125" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="625.7275" y="550.0947">(RFC 7009 &#167;2.2): Antwort 200 OK unabh&#228;ngig davon,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="625.7275" y="561.7354">ob das Token g&#252;ltig, bereits ung&#252;ltig oder unbekannt war</text><text fill="#000000" font-family="Helvetica" font-size="10" x="625.7275" y="573.376">(keine Preisgabe der Token-Existenz).</text><text fill="#000000" font-family="Helvetica" font-size="10" x="625.7275" y="585.0166">Folge-Refresh-Requests werden gem&#228;&#223; mit</text><text fill="#000000" font-family="Helvetica" font-size="10" x="625.7275" y="596.6572">refresh_token_revoked abgelehnt.</text><polygon fill="#181818" points="291.668,622.6563,281.668,626.6563,291.668,630.6563,287.668,626.6563" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="285.668" x2="603.7275" y1="626.6563" y2="626.6563"/><text fill="#000000" font-family="Helvetica" font-size="10" x="297.668" y="622.2979">(08)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="322.1953" y="622.2979">200 OK</text><path d="M619.7275,669.2969 L619.7275,702.2969 L991.7275,702.2969 L991.7275,679.2969 L981.7275,669.2969 L619.7275,669.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M981.7275,669.2969 L981.7275,679.2969 L991.7275,679.2969 L981.7275,669.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="625.7275" y="683.5791">Access Token sind kurzlebig, DPoP-gebunden und werden zustandslos</text><text fill="#000000" font-family="Helvetica" font-size="10" x="625.7275" y="695.2197">gepr&#252;ft; ihr Widerruf ist nicht Zweck dieses Endpunkts.</text><polygon fill="#181818" points="291.668,721