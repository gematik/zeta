113.624" y="128.485" fill="#000" font-size="10" font-family="Helvetica">200 OK {nonce}</text><line x1="72.097" y1="170.125" x2="114.097" y2="170.125" style="stroke:#181818;stroke-width:1;"/><line x1="114.097" y1="170.125" x2="114.097" y2="183.125" style="stroke:#181818;stroke-width:1;"/><line x1="73.097" y1="183.125" x2="114.097" y2="183.125" style="stroke:#181818;stroke-width:1;"/><polygon points="83.097,179.125,73.097,183.125,83.097,187.125,79.097,183.125" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="79.097" y="159.946" fill="#000" font-size="10" font-family="Helvetica">(03)</text><text x="103.624" y="154.126" fill="#000" font-size="10" font-family="Helvetica">Signiere SHA-256(PuK.Client.Sig || nonce) mit PrK.Client.Sig</text><text x="103.624" y="165.767" fill="#000" font-size="10" font-family="Helvetica">-> signed_hash_puk_client_sig</text><polygon points="539.884,321.172,549.884,325.172,539.884,329.172,543.884,325.172" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="72.097" y1="325.172" x2="545.884" y2="325.172" style="stroke:#181818;stroke-width:1;"/><text x="79.097" y="262.61" fill="#000" font-size="10" font-family="Helvetica">(04)</text><text x="103.624" y="204.407" fill="#000" font-size="10" font-family="Helvetica">POST /register</text><text x="103.624" y="216.048" fill="#000" font-size="10" font-family="Helvetica">{</text><text x="109.981" y="227.688" fill="#000" font-size="10" font-family="Helvetica">"client_name": "myClient",</text><text x="109.981" y="239.329" fill="#000" font-size="10" font-family="Helvetica">"grant_types": ["urn:ietf:params:oauth:grant-type:token-exchange", "refresh_token"],</text><text x="109.981" y="250.97" fill="#000" font-size="10" font-family="Helvetica">"jwks": { "keys": [ PuK.Client.Sig ] },</text><text x="109.981" y="262.61" fill="#000" font-size="10" font-family="Helvetica">"token_endpoint_auth_method": "private_key_jwt",</text><text x="109.981" y="274.251" fill="#000" font-size="10" font-family="Helvetica">"platform": "windows",</text><text x="109.981" y="285.892" fill="#000" font-size="10" font-family="Helvetica">"product_id": "&lt;gematik-Produktbezeichner>",</text><text x="109.981" y="297.532" fill="#000" font-size="10" font-family="Helvetica">"nonce": "&lt;nonce>",</text><text x="109.981" y="309.173" fill="#000" font-size="10" font-family="Helvetica">"signed_hash_puk_client_sig": "&lt;PoP>"</text><text x="103.624" y="320.813" fill="#000" font-size="10" font-family="Helvetica">}</text><line x1="561.884" y1="362.453" x2="603.884" y2="362.453" style="stroke:#181818;stroke-width:1;"/><line x1="603.884" y1="362.453" x2="603.884" y2="375.453" style="stroke:#181818;stroke-width:1;"/><line x1="562.884" y1="375.453" x2="603.884" y2="375.453" style="stroke:#181818;stroke-width:1;"/><polygon points="572.884,371.453,562.884,375.453,572.884,379.453,568.884,375.453" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="568.884" y="352.274" fill="#000" font-size="10" font-family="Helvetica">(05)</text><text x="593.411" y="346.454" fill="#000" font-size="10" font-family="Helvetica">Prüfe nonce (frisch, einmalig) und</text><text x="593.411" y="358.095" fill="#000" font-size="10" font-family="Helvetica">signed_hash_puk_client_sig mit PuK.Client.Sig (PoP des Client Instance Keys)</text><line x1="561.884" y1="412.734" x2="603.884" y2="412.734" style="stroke:#181818;stroke-width:1;"/><line x1="603.884" y1="412.734" x2="603.884" y2="425.734" style="stroke:#181818;stroke-width:1;"/><line x1="562.884" y1="425.734" x2="603.884" y2="425.734" style="stroke:#181818;stroke-width:1;"/><polygon points="572.884,421.734,562.884,425.734,572.884,429.734,568.884,425.734" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="568.884" y="402.556" fill="#000" font-size="10" font-family="Helvetica">(06)</text><text x="593.411" y="396.735" fill="#000" font-size="10" font-family="Helvetica">Pinne attestation_type="software" (immer) sowie platform und product_id</text><text x="593.411" y="408.376" fill="#000" font-size="10" font-family="Helvetica">(sofern übermittelt) im Registrierungsdatensatz — kein ak_jkt; binding_status: pinned</text><line x1="561.884" y1="451.375" x2="603.884" y2="451.375" style="stroke:#181818;stroke-width:1;"/><line x1="603.884" y1="451.375" x2="603.884" y2="464.375" style="stroke:#181818;stroke-width:1;"/><line x1="562.884" y1="464.375" x2="603.884" y2="464.375" style="stroke:#181818;stroke-width:1;"/><polygon points="572.884,460.375,562.884,464.375,572.884,468.375,568.884,464.375" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="568.884" y="447.017" fill="#000" font-size="10" font-family="Helvetica">(07)</text><text x="593.411" y="447.017" fill="#000" font-size="10" font-family="Helvetica">Store Client Placeholder</text><polygon points="83.097,486.016,73.097,490.016,83.097,494.016,79.097,490.016" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="77.097" y1="490.016" x2="550.884" y2="490.016" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="89.097" y="485.657" fill="#000" font-size="10" font-family="Helvetica">(08)</text><text x="113.624" y="485.657" fill="#000" font-size="10" font-family="Helvetica">201 Created {client_id}</text><path d="M561.884,503.016 L561.884,582.016 L1025.884,582.016 L1025.884,513.016 L1015.884,503.016 L561.884,503.016" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1015.884,503.016 L1015.884,513.016 L1025.884,513.016 L1015.884,503.016" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="567.884" y="517.298" fill="#000" font-size="10" font-family="Helvetica">Abwärtskompatibilität: nonce, signed_hash_puk_client_sig, platform und product_id sind</text><text x="567.884" y="528.938" fill="#000" font-size="10" font-family="Helvetica">im Software-Zweig optional; eine Registrierung ohne sie bleibt gültig — attestation_type</text><text x="567.884" y="540.579" fill="#000" font-size="10" font-family="Helvetica">wird trotzdem gepinnt, nur platform/product_id bleiben dann ungepinnt.</text><text x="567.884" y="552.22" fill="#000" font-size="10" font-family="Helvetica">Ohne Besitznachweis ist die Registrierung jedoch nicht an den Besitz</text><text x="567.884" y="563.86" fill="#000" font-size="10" font-family="Helvetica">von PrK.Client.Sig gebunden — ein Dritter kann einen fremden öffentlichen Schlüssel</text><text x="567.884" y="575.501" fill="#000" font-size="10" font-family="Helvetica">registrieren und dessen spätere Registrierung per 409 registrationConflict blockieren.</text><?plantuml-src VLHTRkCs47xtAQPwiX7BIOEsGBsf0TSsKYExi62d2tJhXK19OucHH0ea5SVE1kWXUeGzGv_ovflq91rITXedo3xfPsO-Vlo-cVcEYxYe4uHUxxIgoy8ls4RMfcVkJAlLYkGTU6EyvJ5wC9vyd8ucuMZsVZPl0RXOe7Yv-whqHXiiFGZcqm_3oNpnn-9wyk4f4w1Yol2OLqmO61KSwS4qU9ycryFzjmSN5riqR32W0XI9XMyTdWsFeOWu6bHmFONptXcCgKuRU-ZiutGycHypSzYNDLE91_OzlFnzE1-_mMbOcspXA0NZO2difrHyomoN0XQeRb5zcs1pYPEJ_GluWmQp3vUJQpWLKiJOQaxnATPazU7yx0ncLt3luW_FYWy92vuAZWfXyTlGF__nftPGN_MQO8zYyEKBkDeEbDn0e9u7buA0D05W4cPCPs5Lvs7imY7zVadrvAGFmMn1R1McdFnKIt6_503UlaQm4hq-UELcRrdNHLD52ePcKw6cw9zUhKIVV5hrIM1MwhvaXDvtMRxDwXkPe_3nBiwOID7hWgTmfP08keZtkS6zMUSMy1wy73SE6bvS_ZCyDAckBYGpAic9YpqmB94yJ2pVIl5RPZ0acF1cVQ1T5Soif2fjnfgBHAxr8Q9aKiScvAxw8iMI-Y3t0_ixDn5kaSUPG3NOvpi3NAfxE_n-MtcN6yXWu2t5mw4hdXecKBl75JQsGdkbk8wpBY0N9Ijuse5Q94lnDdZJ2CT2jUamI50VPczASyCi_1KfstdDW0k1m8n1IhCZuDpznTDoPTPCqIfeyx94rG4jrnpX8AMb1l-hjnHjga0bOFSOeI9U1WlJ0Lx2t7MOeiwkHQeJSaTePhRmxrz_GqvN1PQ7Dxbv1n4vmqKQMYArxaDbgIMl62-Cf1dPtoueM8oPB19KhqREz-tGVGyZXNHe0lTxuNZoq6e9QH0KJpC3SjL0qwmFepLjEADpMLQaHiGBRdPVQJQTGzrlJ5ZtBMMeHYG4JKeizfhwdzP8JidAwisATzPmFDO997KTbI941VB8GBfxB0mLMTLUkaNeQwuIC4gQRO8bf6YrCrqGjNhYTVgCamD50GaJWlZkyti4DBFd_egQcwrWSKP4DH0jIFXBXZUOo3W3GGD26vwm2