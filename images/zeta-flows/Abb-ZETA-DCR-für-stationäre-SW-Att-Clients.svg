<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1042px;height:657px;background:#FFFFFF;" width="1042px" height="657px" viewBox="0 0 1042 657" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif"><rect x="16" y="11" width="397.54" height="631.141" fill="#FEFCFF" style="stroke:#181818;stroke-width:0.5;"/><text x="195.9" y="20.282" fill="#000" font-size="10" font-weight="700" font-family="Helvetica">Device</text><rect x="16" y="27.641" width="397.54" height="614.5" fill="#E6E6FA" style="stroke:#181818;stroke-width:0.5;"/><text x="175.673" y="36.923" fill="#000" font-size="10" font-weight="700" font-family="Helvetica">Primärsystem</text><rect x="482.992" y="11" width="552.242" height="631.141" fill="#EDFDEC" style="stroke:#181818;stroke-width:0.5;"/><text x="697.22" y="20.282" fill="#000" font-size="10" font-weight="700" font-family="Helvetica">Anbieter TI 2.0 Dienst</text><rect x="482.992" y="27.641" width="552.242" height="614.5" fill="#FFF3E5" style="stroke:#181818;stroke-width:0.5;"/><text x="725.968" y="36.923" fill="#000" font-size="10" font-weight="700" font-family="Helvetica">ZETA Guard</text><g><title>ZETA Client</title><rect x="63.597" y="81.563" width="8" height="516.297" fill="#000" fill-opacity="0"/><line x1="67.097" y1="81.563" x2="67.097" y2="597.859" style="stroke:#000;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title></title><rect x="62.097" y="89.563" width="10" height="508.297" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><g><title>PDP</title><rect x="553.384" y="81.563" width="8" height="516.297" fill="#000" fill-opacity="0"/><line x1="556.884" y1="81.563" x2="556.884" y2="597.859" style="stroke:#000;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title></title><rect x="551.884" y="325.172" width="10" height="164.844" fill="#FFF" style="stroke:#181818;stroke-width:1;