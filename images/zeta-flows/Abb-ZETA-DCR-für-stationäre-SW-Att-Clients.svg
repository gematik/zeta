dth="10" x="546.8838" y="320.1719"/></g><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="25.9731" y="49.9219"/><text fill="#000000" font-family="Helvetica" font-size="10" x="32.9731" y="66.2041">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="493.4092" y="38.2813"/><text fill="#000000" font-family="Helvetica" font-size="10" x="542.0034" y="54.5635">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="500.4092" y="66.2041">Authorization Server</text><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="25.9731" y="592.8594"/><text fill="#000000" font-family="Helvetica" font-size="10" x="32.9731" y="609.1416">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="493.4092" y="592.8594"/><text fill="#000000" font-family="Helvetica" font-size="10" x="542.0034" y="609.1416">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="500.4092" y="620.7822">Authorization Server</text><polygon fill="#181818" points="539.8838,98.2031,549.8838,102.2031,539.8838,106.2031,543.8838,102.2031" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="67.0967" x2="545.8838" y1="102.2031" y2="102.2031"/><text fill="#000000" font-family="Helvetica" font-size="10" x="74.0967" y="97.8447">(01)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="97.8447">GET /nonce</text><polygon fill="#181818" points="78.0967,123.8438,68.0967,127.8438,78.0967,131.8438,74.0967,127.8438" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="72.0967" x2="550.8838" y1="127.8438" y2="127.8438"/><text fill="#000000" font-family="Helvetica" font-size="10" x="84.0967" y="123.4854">(02)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="108.624" y="123.4854">200 OK {nonce}</text><line style="stroke:#181818;stroke-width:1;" x1="67.0967" x2="109.0967" y1="165.125" y2="165.125"/><line style="stroke:#181818;stroke-width:1;" x1="109.0967" x2="109.0967" y1="165.125" y2="178.125"/><line style="stroke:#181818;stroke-width:1;" x1="68.0967" x2="109.0967" y1="178.125" y2="178.125"/><polygon fill="#181818" points="78.0967,174.125,68.0967,178.125,78.0967,182.125,74.0967,178.125" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="74.0967" y="154.9463">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="149.126">Signiere SHA-256(PuK.Client.Sig || nonce) mit PrK.Client.Sig</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="160.7666">-&gt; signed_hash_puk_client_sig</text><polygon fill="#181818" points="534.8838,316.1719,544.8838,320.1719,534.8838,324.1719,538.8838,320.1719" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="67.0967" x2="540.8838" y1="320.1719" y2="320.1719"/><text fill="#000000" font-family="Helvetica" font-size="10" x="74.0967" y="257.6104">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="199.4072">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="211.0479">{</text><text fill="#000000" font-family="Helvetica" font-size="10" x="104.9814" y="222.6885">"client_name": "myClient",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="104.9814" y="234.3291">"grant_types": ["urn:ietf:params:oauth:grant-type:token-exchange", "refresh_token"],</text><text fill="#000000" font-family="Helvetica" font-size="10" x="104.9814" y="245.9697">"jwks": { "keys": [ PuK.Client.Sig ] },</text><text fill="#000000" font-family="Helvetica" font-size="10" x="104.9814" y="257.6104">"token_endpoint_auth_method": "private_key_jwt",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="104.9814" y="269.251">"platform": "windows",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="104.9814" y="280.8916">"product_id": "&lt;gematik-Produktbezeichner&gt;",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="104.9814" y="292.5322">"nonce": "&lt;nonce&gt;",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="104.9814" y="304.1729">"signed_hash_puk_client_sig": "&lt;PoP&gt;"</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="315.8135">}</text><line style="stroke:#181818;stroke-width:1;" x1="556.8838" x2="598.8838" y1="357.4531" y2="357.4531"/><line style="stroke:#181818;stroke-width:1;" x1="598.8838" x2="598.8838" y1="357.4531" y2="370.4531"/><line style="stroke:#181818;stroke-width:1;" x1="557.8838" x2="598.8838" y1="370.4531" y2="370.4531"/><polygon fill="#181818" points="567.8838,366.4531,557.8838,370.4531,567.8838,374.4531,563.8838,370.4531" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="563.8838" y="347.2744">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="588.4111" y="341.4541">Pr&#252;fe nonce (frisch, einmalig) und</text><text fill="#000000" font-family="Helvetica" font-size="10" x="588.4111" y="353.0947">signed_hash_puk_client_sig mit PuK.Client.Sig (PoP des Client Instance Keys)</text><line style="stroke:#181818;stroke-width:1;" x1="556.8838" x2="598.8838" y1="407.7344" y2="407.7344"/><line style="stroke:#181818;stroke-width:1;" x1="598.8838" x2="598.8838" y1="407.7344" y2="420.7344"/><line style="stroke:#181818;stroke-width:1;" x1="557.8838" x2="598.8838" y1="420.7344" y2="420.7344"/><polygon fill="#181818" points="567.8838,416.7344,557.8838,420.7344,567.8838,424.7344,563.8838,420.7344" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="563.8838" y="397.5557">(06)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="588.4111" y="391.7354">Pinne attestation_type="software" (immer) sowie platform und product_id</text><text fill="#000000" font-family="Helvetica" font-size="10" x="588.4111" y="403.376">(sofern &#252;bermittelt) im Registrierungsdatensatz &#8212; kein ak_jkt; binding_status: pinned</text><line style="stroke:#181818;stroke-width:1;" x1="556.8838" x2="598.8838" y1="446.375" y2="446.375"/><line style="stroke:#181818;stroke-width:1;" x1="598.8838" x2="598.8838" y1="446.375" y2="459.375"/><line style="stroke:#181818;stroke-width:1;" x1="557.8838" x2="598.8838" y1="459.375" y2="459.375"/><polygon fill="#181818" points="567.8838,455.375,557.8838,459.375,567.8838,463.375,563.8838,459.375" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="563.8838" y="442.0166">(07)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="588.4111" y="442.0166">Store Client Placeholder</text><polygon fill="#181818" points="78.0967,481.0156,68.0967,485.0156,78.0967,489.0156,74.0967,485.0156" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="72.0967" x2="545.8838" y1="485.0156" y2="485.0156"/><text fill="#000000" font-family="Helvetica" font-size="10" x="84.0967" y="480.6572">(08)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="108.624" y="480.6572">201 Created {client_id}</text><path d="M556.8838,498.0156 L556.8838,577.0156 L1020.8838,577.0156 L1020.8838,508.0156 L1010.8838,498.0156 L556.8838,498.0156" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1010.8838,498.0156 L1010.8838,508.0156 L1020.8838,508.0156 L1010.8838,498.0156" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="562.8838" y="512.2979">Abw&#228;rtskompatibilit&#228;t: nonce, signed_hash_puk_client_sig, platform und product_id sind</text><text fill="#000000" font-family="Helvetica" font-size="10" x="562.8838" y="523.9385">im Software-Zweig optional; eine Registrierung ohne sie bleibt g&#252;ltig &#8212; attestation_type</text><text fill="#000000" font-family="Helvetica" font-size="10" x="562.8838" y="535.5791">wird trotzdem gepinnt, nur platform/product_id bleiben dann ungepinnt.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="562.8838" y="547.2197">Ohne Besitznachweis ist die Registrierung jedoch nicht an den Besitz</text><text fill="#000000" font-family="Helvetica" font-size="10" x="562.8838" y="558.8604">von PrK.Client.Sig gebunden &#8212; ein Dritter kann einen fremden &#246;ffentlichen Schl&#252;ssel</text><text fill="#000000" font-family="Helvetica" font-size="10" x="562.8838" y="570.501">registrieren und dessen sp&#228;tere Registrierung per 409 registrationConflict blockieren.</text><!--SRC=[VLHTRkCs47xtAQPwiX7BIOEsGBsf0TSsKYExi62d2tJhXK19OucHH0ea5SVE1kWXUeGzGv_ovflq91rITXedo3xfPsO-Vlo-cVcEYxYe4uHUxxIgoy8ls4RMfcVkJAlLYkGTU6EyvJ5wC9vyd8ucuMZsVZPl0RXOe7Yv-whqHXiiFGZcqm_3oNpnn-9wyk4f4w1Yol2OLqmO61KSwS4qU9ycryFzjmSN5riqR32W0XI9XMyTdWsFeOWu6bHmFONptXcCgKuRU-ZiutGycHypSzYNDLE91_OzlFnzE1-_mMbOcspXA0NZO2difrHyomoN0XQeRb5zcs1pYPEJ_GluWmQp3vUJQpWLKiJOQaxnATPazU7yx0ncLt3luW_FYWy92vuAZWfXyTlGF__nftPGN_MQO8zYyEKBkDeEbDn0e9u7buA0D05W4cPCPs5Lvs7imY7zVadrvAGFmMn1R1McdFnKIt6_503UlaQm4hq-UELcRrdNHLD52ePcKw6cw9zUhKIVV5hrIM1MwhvaXDvtMRxDwXkPe_3nBiwOID7hWgTmfP08keZtkS6zMUSMy1wy73SE6bvS_ZCyDAckBYGpAic9YpqmB94yJ2pVIl5RPZ0acF1cVQ1T5Soif2fjnfgBHAxr8Q9aKiScvAxw8iMI-Y3t0_ixDn5kaSUPG3NOvpi3NAfxE_n-MtcN6yXWu2t5mw4hdXecKBl75JQsGdkbk8wpBY0N9Ijuse5Q94lnDdZJ2CT2jUamI50VPczASyCi_1KfstdDW0k1m8n1IhCZuDpznTDoPTPCqIfeyx94rG4jrnpX8AMb1l-hjnHjga0bOFSOeI9U1WlJ0Lx2t7MOeiwkHQeJSaTePhRmxrz_GqvN1PQ7Dxbv1n4vmqKQMYArxaDbgIMl62-Cf1dPtoueM8oPB19KhqREz-tGVGyZXNHe0lTxuNZoq6e9QH0KJpC3SjL0qwmFepLjEADpMLQaHiGBRdPVQJQTGzrlJ5ZtBMMeHYG4JKeizfhwdzP8JidAwisATzPmFDO997KTbI941VB8GBfxB0m