ETA Attestation Token vorhanden]</text><polygon fill="#181818" points="444.0781,149.125,454.0781,153.125,444.0781,157.125,448.0781,153.125" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="67.0967" x2="450.0781" y1="153.125" y2="153.125"/><text fill="#000000" font-family="Helvetica" font-size="10" x="74.0967" y="137.126">(01)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="125.4854">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="137.126">{attestation_type="apple", Apple_Attestation_Object, PuK.Client.Sig,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="148.7666">nonce, signed_Hash_PuK.Client.Sig}</text><line style="stroke:#181818;stroke-width:1;" x1="466.0781" x2="508.0781" y1="213.6875" y2="213.6875"/><line style="stroke:#181818;stroke-width:1;" x1="508.0781" x2="508.0781" y1="213.6875" y2="226.6875"/><line style="stroke:#181818;stroke-width:1;" x1="467.0781" x2="508.0781" y1="226.6875" y2="226.6875"/><polygon fill="#181818" points="477.0781,222.6875,467.0781,226.6875,477.0781,230.6875,473.0781,226.6875" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="473.0781" y="191.8682">(02)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="497.6055" y="174.4072">Validiere Apple_Attestation_Object;</text><text fill="#000000" font-family="Helvetica" font-size="10" x="497.6055" y="186.0479">pr&#252;fe und verbrauche nonce; pr&#252;fe signed_hash_puk_client_sig mit PuK.Client.Sig</text><text fill="#000000" font-family="Helvetica" font-size="10" x="497.6055" y="197.6885">&#252;ber SHA-256(PuK.Client.Sig || nonce) (Selbstsignatur, PoP des Client Instance Keys;</text><text fill="#000000" font-family="Helvetica" font-size="10" x="497.6055" y="209.3291">ohne nonce Legacy-Form &#252;ber SHA-256(PuK.Client.Sig) bis 01.01.2028, A_30193)</text><path d="M471.0781,239.6875 L471.0781,283.6875 L706.0781,283.6875 L706.0781,249.6875 L696.0781,239.6875 L471.0781,239.6875" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M696.0781,239.6875 L696.0781,249.6875 L706.0781,249.6875 L696.0781,239.6875" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="477.0781" y="253.9697">AuthS verifiziert Apple App Attest Root CA.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="477.0781" y="265.6104">Extrahiert Hash(PuK.Client.Sig) aus Objekt</text><text fill="#000000" font-family="Helvetica" font-size="10" x="477.0781" y="277.251">und vergleicht ihn mit dem Payload.</text><polygon fill="#181818" points="444.0781,367.8125,454.0781,371.8125,444.0781,375.8125,448.0781,371.8125" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="67.0967" x2="450.0781" y1="371.8125" y2="371.8125"/><text fill="#000000" font-family="Helvetica" font-size="10" x="74.0967" y="349.9932">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="332.5322">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="344.1729">{attestation_type="zeta_attestation_token",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="355.8135">zeta_attestation_token, PuK.Client.Sig,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="367.4541">nonce, signed_Hash_PuK.Client.Sig, attestation_pop}</text><line style="stroke:#181818;stroke-width:1;" x1="466.0781" x2="508.0781" y1="409.0938" y2="409.0938"/><line style="stroke:#181818;stroke-width:1;" x1="508.0781" x2="508.0781" y1="409.0938" y2="422.0938"/><line style="stroke:#181818;stroke-width:1;" x1="467.0781" x2="508.0781" y1="422.0938" y2="422.0938"/><polygon fill="#181818" points="477.0781,418.0938,467.0781,422.0938,477.0781,426.0938,473.0781,422.0938" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="473.0781" y="398.915">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="497.6055" y="393.0947">Pr&#252;fe Token-Signatur &amp; Vertrauensstellung;</text><text fill="#000000" font-family="Helvetica" font-size="10" x="497.6055" y="404.7354">pr&#252;fe und verbrauche nonce</text><line style="stroke:#181818;stroke-width:1;" x1="466.0781" x2="508.0781" y1="482.6563" y2="482.6563"/><line style="stroke:#181818;stroke-width:1;" x1="508.0781" x2="508.0781" y1="482.6563" y2="495.6563"/><line style="stroke:#181818;stroke-width:1;" x1="467.0781" x2="508.0781" y1="495.6563" y2="495.6563"/><polygon fill="#181818" points="477.0781,491.6563,467.0781,495.6563,477.0781,499.6563,473.0781,495.6563" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="473.0781" y="460.8369">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="497.6055" y="443.376">Extrahiere PuK.AK.Sig (cnf.jwk) aus Token; pr&#252;fe signed_Hash_PuK.Client.Sig</text><text fill="#000000" font-family="Helvetica" font-size="10" x="497.6055" y="455.0166">&#252;ber SHA-256(PuK.Client.Sig || nonce) mit PuK.Client.Sig;</text><text fill="#000000" font-family="Helvetica" font-size="10" x="497.6055" y="466.6572">validiere attestation_pop als App-Attest-Assertion mit PuK.AK.Sig</text><text fill="#000000" font-family="Helvetica" font-size="10" x="497.6055" y="478.2979">(clientDataHash = SHA-256(PuK.Client.Sig || nonce), rpIdHash, Counter-Monotonie)</text><path d="M471.0781,508.6563 L471.0781,564.6563 L882.0781,564.6563 L882.0781,518.6563 L872.0781,508.6563 L471.0781,508.6563" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M872.0781,508.6563 L872.0781,518.6563 L882.0781,518.6563 L872.0781,508.6563" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="477.0781" y="522.9385">nonce vom nonce_endpoint (GET /nonce, nicht dargestellt).</text><text fill="#000000" font-family="Helvetica" font-size="10" x="477.0781" y="534.5791">attestation_pop bindet den (ggf. neuen) Client Instance Key frisch an den</text><text fill="#000000" font-family="Helvetica" font-size="10" x="477.0781" y="546.2197">bereits attestierten Attestation Key. Legacy-Form ohne nonce (Pr&#252;fung gegen</text><text fill="#000000" font-family="Helvetica" font-size="10" x="477.0781" y="557.8604">SHA-256(PuK.Client.Sig)) nur bis 01.01.2028 (A_30193).</text><line style="stroke:#181818;stroke-width:1;" x1="466.0781" x2="508.0781" y1="613.5" y2="613.5"/><line style="stroke:#181818;stroke-width:1;" x1="508.0781" x2="508.0781" y1="613.5" y2="626.5"/><line style="stroke:#181818;stroke-width:1;" x1="467.0781" x2="508.0781" y1="626.5" y2="626.5"/><polygon fill="#181818" points="477.0781,622.5,467.0781,626.5,477.0781,630.5,473.0781,626.5" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="473.0781" y="603.3213">(06)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="497.6055" y="597.501">Pinne attestation_type, platform, product_id und ak_jkt (Thumbprint PuK.AK.Sig)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="497.6055" y="609.1416">im Registrierungsdatensatz (binding_status: pinned)</text><line style="stroke:#181818;stroke-width:1;" x1="466.0781" x2="508.0781" y1="652.1406" y2="652.1406"/><line style="stroke:#181818;stroke-width:1;" x1="508.0781" x2="508.0781" y1="652.1406" y2="665.1406"/><line style="stroke:#181818;stroke-width:1;" x1="467.0781" x2="508.0781" y1="665.1406" y2="665.1406"/><polygon fill="#181818" points="477.0781,661.1406,467.0781,665.1406,477.0781,669.1406,473.0781,665.1406" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="473.0781" y="647.7822">(07)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="497.6055" y="647.7822">S