<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="775px" preserveAspectRatio="none" style="width:1189px;height:775px;background:#FFFFFF;" version="1.1" viewBox="0 0 1189 775" width="1189px" zoomAndPan="magnify"><defs/><g><rect fill="#FEFCFF" height="763.8281" style="stroke:#181818;stroke-width:0.5;" width="103.3066" x="11" y="6"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="23" y="15.2822">mobile Device</text><rect fill="#E6E6FA" height="747.1875" style="stroke:#181818;stroke-width:0.5;" width="103.3066" x="11" y="22.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="51.6255" y="31.9229">App</text><rect fill="#EDFDEC" height="763.8281" style="stroke:#181818;stroke-width:0.5;" width="147.7842" x="589.4858" y="6"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="601.4858" y="15.2822">Anbieter TI 2.0 Dienst</text><rect fill="#FFF3E5" height="747.1875" style="stroke:#181818;stroke-width:0.5;" width="147.7842" x="589.4858" y="22.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="630.2334" y="31.9229">ZETA Guard</text><g><title>ZETA Client</title><rect fill="#000000" fill-opacity="0.00000" height="648.9844" width="8" x="59.1533" y="76.5625"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="62.6533" x2="62.6533" y1="76.5625" y2="725.5469"/></g><g><title/><rect fill="#FFFFFF" height="640.9844" style="stroke:#000000;stroke-width:1;" width="10" x="57.6533" y="84.5625"/></g><g><title>PDP</title><rect fill="#000000" fill-opacity="0.00000" height="648.9844" width="8" x="659.8779" y="76.5625"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="663.3779" x2="663.3779" y1="76.5625" y2="725.5469"/></g><g><title/><rect fill="#FFFFFF" height="359.4531" style="stroke:#000000;stroke-width:1;" width="10" x="658.3779" y="281.5313"/></g><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="26.5298" y="49.9219"/><text fill="#000000" font-family="Helvetica" font-size="10" x="33.5298" y="66.2041">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="604.9033" y="38.2813"/><text fill="#000000" font-family="Helvetica" font-size="10" x="653.4976" y="54.5635">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="611.9033" y="66.2041">Authorization Server</text><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="26.5298" y="725.5469"/><text fill="#000000" font-family="Helvetica" font-size="10" x="33.5298" y="741.8291">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="604.9033" y="725.5469"/><text fill="#000000" font-family="Helvetica" font-size="10" x="653.4976" y="741.8291">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="611.9033" y="753.4697">Authorization Server</text><polygon fill="#181818" points="651.3779,98.2031,661.3779,102.2031,651.3779,106.2031,655.3779,102.2031" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="67.6533" x2="657.3779" y1="102.2031" y2="102.2031"/><text fill="#000000" font-family="Helvetica" font-size="10" x="74.6533" y="97.8447">(01)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="99.1807" y="97.8447">GET /nonce</text><polygon fill="#181818" points="78.6533,123.8438,68.6533,127.8438,78.6533,131.8438,74.6533,127.8438" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="72.6533" x2="662.3779" y1="127.8438" y2="127.8438"/><text fill="#000000" font-family="Helvetica" font-size="10" x="84.6533" y="123.4854">(02)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="109.1807" y="123.4854">200 OK {nonce}</text><polygon fill="#181818" points="646.3779,277.5313,656.3779,281.5313,646.3779,285.5313,650.3779,281.5313" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="67.6533" x2="652.3779" y1="281.5313" y2="281.5313"/><text fill="#000000" font-family="Helvetica" font-size="10" x="74.6533" y="213.1494">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="99.1807" y="149.126">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="99.1807" y="160.7666">{</text><text fill="#000000" font-family="Helvetica" font-size="10" x="105.5381" y="172.4072">"client_name": "myClient",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="105.5381" y="184.0479">"grant_types": ["authorization_code", "urn:ietf:params:oauth:grant-type:token-exchange", "refresh_token"],</text><text fill="#000000" font-family="Helvetica" font-size="10" x="105.5381" y="195.6885">"jwks": { "keys": [ PuK.Client.Sig ] },</text><text fill="#000000" font-family="Helvetica" font-size="10" x="105.5381" y="207.3291">"token_endpoint_auth_method": "private_key_jwt",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="105.5381" y="218.9697">"redirect_uris": ["https:</text><text fill="#000000" font-family="Helvetica" font-size="10" font-style="italic" x="221.4023" y="218.9697">&lt;App-FQDN&gt;/cb/&lt;app&gt;/oidc", "https:</text><text fill="#000000" font-family="Helvetica" font-size="10" x="413.0479" y="218.9697">&lt;App-FQDN&gt;/cb/&lt;app&gt;/app"],</text><text fill="#000000" font-family="Helvetica" font-size="10" x="105.5381" y="230.6104">"platform": "android",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="105.5381" y="242.251">"product_id": "&lt;gematik-Produktbezeichner&gt;",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="105.5381" y="253.8916">"nonce": "&lt;nonce&gt;",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="105.5381" y="265.5322">"signed_hash_puk_client_sig": "&lt;PoP &#252;ber SHA-256(PuK.Client.Sig || nonce)&gt;"</text><text fill="#000000" font-family="Helvetica" font-size="10" x="99.1807" y="277.1729">}</text><path d="M673.3779,294.5313 L673.3779,443.5313 L1117.3779,443.5313 L1117.3779,304.5313 L1107.3779,294.5313 L673.3779,294.5313" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1107.3779,294.5313 L1107.3779,304.5313 L1117.3779,304.5313 L1107.3779,294.5313" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="679.3779" y="308.8135">Es werden zwei redirect_uris je App registriert (RFC 8252, claimed-HTTPS</text><text fill="#000000" font-family="Helvetica" font-size="10" x="679.3779" y="320.4541">Universal-/App-Links auf einer vom App-Hersteller kontrollierten Domain):</text><text fill="#000000" font-family="Helvetica" font-size="10" x="679.3779" y="332.0947">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/oidc = oidc_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="685.7354" y="343.7354">(SekIDP Auth Code Flow, redirection_endpoint des AuthS, nicht /token)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="679.3779" y="355.376">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/app = app_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="685.7354" y="367.0166">(ZETA Guard Auth Code Flow, /token-Endpunkt des AuthS)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="679.3779" y="378.6572">Beide Callbacks enden &#252;ber denselben App-Link/Universal-Link in der App;</text><text fill="#000000" font-family="Helvetica" font-size="10" x="679.3779" y="390.2979">der ZETA Client unterscheidet den zu nutzenden AuthS-Endpunkt anhand des Pfads.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="679.3779" y="401.9385">Die OS-seitige Verkn&#252;pfung erfolgt &#252;ber apple-app-site-association bzw.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="679.3779" y="413.5791">assetlinks.json (Deployment, kein Laufzeit-Flow). Die App ist inkl. redirect_uris</text><text fill="#000000" font-family="Helvetica" font-size="10" x="679.3779" y="425.2197">bei der gematik registriert; der AuthS pr&#252;ft beim DCR, ob die &#252;bergebenen</text><text fill="#000000" font-family="Helvetica" font-size="10" x="679.3779" y="436.8604">redirect_uris registriert sind.</text><line style="stroke:#181818;stroke-width:1;" x1="668.3779" x2="710.3779" y1="490.1406" y2="490.1406"/><line style="stroke:#181818;stroke-width:1;" x1="710.3779" x2="710.3779" y1="490.1406" y2="503.1406"/><line style="stroke:#181818;stroke-width:1;" x1="669.3779" x2="710.3779" y1="503.1406" y2="503.1406"/><polygon fill="#181818" points="679.3779,499.1406,669.3779,503.1406,679.3779,507.1406,675.3779,503.1406" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="675.3779" y="474.1416">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="699.9053" y="462.501">Pr&#252;fe und verbrauche nonce (zuerst, A_30515: frisch, einmalig), dann</text><text fill="#000000" font-family="Helvetica" font-size="10" x="699.9053" y="474.1416">signed_hash_puk_client_sig mit PuK.Client.Sig (PoP des Client Instance Keys);</text><text fill="#000000" font-family="Helvetica" font-size="10" x="699.9053" y="485.7822">bei Fehlschlag Ablehnung (A_30192)</text><line style="stroke:#181818;stroke-width:1;" x1="668.3779" x2="710.3779" y1="540.4219" y2="540.4219"/><line style="stroke:#181818;stroke-width:1;" x1="710.3779" x2="710.3779" y1="540.4219" y2="553.4219"/><line style="stroke:#181818;stroke-width:1;" x1="669.3779" x2="710.3779" y1="553.4219" y2="553.4219"/><polygon fill="#181818" points="679.3779,549.4219,669.3779,553.4219,679.3779,557.4219,675.3779,553.4219" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="675.3779" y="530.2432">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="699.9053" y="524.4229">Pinne attestation_type="software" (immer) sowie platform und product_id</text><text fill="#000000" font-family="Helvetica" font-size="10" x="699.9053" y="536.0635">(sofern &#252;bermittelt) im Registrierungsdatensatz &#8212; kein ak_jkt; binding_status: pinned</text><line style="stroke:#181818;stroke-width:1;" x1="668.3779" x2="710.3779" y1="590.7031" y2="590.7031"/><line style="stroke:#181818;stroke-width:1;" x1="710.3779" x2="710.3779" y1="590.7031" y2="603.7031"/><line style="stroke:#181818;stroke-width:1;" x1="669.3779" x2="710.3779" y1="603.7031" y2="603.7031"/><polygon fill="#181818" points="679.3779,599.7031,669.3779,603.7031,679.3779,607.7031,675.3779,603.7031" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="675.3779" y="580.5244">(06)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="699.9053" y="574.7041">Store Client (status: pending_user_binding,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="699.9053" y="586.3447">grant_types mit authorization_code, A_30086)</text><polygon fill="#181818" points="78.6533,636.9844,68.6533,640.9844,78.6533,644.9844,74.6533,640.9844" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="72.6533" x2="657.3779" y1="640.9844" y2="640.9844"/><text fill="#000000" font-family="Helvetica" font-size="10" x="84.6533" y="630.8057">(07)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="109.1807" y="624.9854">201 Created {client_id[, status: pending_user_binding]}</text><text fill="#000000" font-family="Helvetica" font-size="10" x="109.1807" y="636.626">(status informativ, Werte gem&#228;&#223; dcr-response.yaml)</text><path d="M668.3779,653.9844 L668.3779,709.9844 L1182.3779,709.9844 L1182.3779,663.9844 L1172.3779,653.9844 L668.3779,653.9844" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1172.3779,653.9844 L1172.3779,663.9844 L1182.3779,663.9844 L1172.3779,653.9844" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="674.3779" y="668.2666">Abw&#228;rtskompatibilit&#228;t: nonce, signed_hash_puk_client_sig, platform und product_id sind</text><text fill="#000000" font-family="Helvetica" font-size="10" x="674.3779" y="679.9072">im Software-Zweig optional; eine Registrierung ohne sie bleibt g&#252;ltig &#8212; attestation_type</text><text fill="#000000" font-family="Helvetica" font-size="10" x="674.3779" y="691.5479">wird trotzdem gepinnt, nur platform/product_id bleiben dann ungepinnt. Fehlt der Besitznachweis,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="674.3779" y="703.1885">protokolliert der AuthS das Fehlen; ab 01.01.2028 lehnt er ab (A_30192, A_30193).</text><!--SRC=[hLRDRjj84hxxAMfr6GaMATk333AoOq2HbDZ8ZxMM9eETSK0qoHBL5jaacaqhLYR0FiJUzvB7oCrlia-oNpSfMSuucSiO1aLsLrTzNJzVrJ-aYj8gPlBzNb5bgPUAsxmollbWzlP-e6T_un_K3Tw-74y6q-cCRexy0_-mJsFlZP2fTp6Ra2mDlJqVdiqeuuMc6SkKRd95FSq9zbZxz8gb8iXwxrYNGiLTw5pQjQrCxuQrdDzIcpFe3N9JTBfEXEbjPTROL90IIoDpvTD8CicObP56i2aJ3Yk5JuRQ1jXpgU9A9SHwdgS900w6PnHpHXVdew7t8irNL778cdfhDgBNABljXJZdEGnjO2jPnGso3dItIyaBfa4OUh-DPmFFwPhbIrRUSrvNISU_ln11RPXArePKfUbSbKQeTHajqehBabFQXy9fFZSheTaR6CEbWJGm7zFK25EL50ibeaMV2g2GAWcgadLW0UB3_xk3l1Vc7wYLvQ5CcKPy8oDkqMZyxdmu3eONhoykzuYSoA0eMZIvF7yp65zE_pMTZTzizuaAeOsCP26KeI5kZnzHKijwg_bkqSc9TVdfAGxWObRftkQt1Z5GeMJhmjav8TrijE4zQ_JYtVbeVFaGZzFziX8wRf5z3rx-ChWSVGFJe3ABgOCq6KskbFtCjLmBcrOqPOrOVnzWVOdz_UQ5lDDQPvzUZcVKKxcAUA-suc6lbkhJqS41NRoYZsx_qzU7z_VxDBb0TMspvqfzl594hSW91afatEeZFBUD4xjkDz6uKs1k2own-tjBx5udYFAOMrrgLLhruSzv7uuGMTdFhLZVdVNisRvn6SmVeeLGYJkYUOxaNmHkf_M-jdQzMbep7wcrv5jda2RLAxz6v4zbGk_fKotgpWLmMf6ZRWDhCCWOu69xYqBB6s4uW9hWUhMvZE