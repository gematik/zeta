<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1077px;height:743px;background:#FFFFFF;" width="1077px" height="743px" viewBox="0 0 1077 743" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif"><rect x="16" y="11" width="103.307" height="717.266" fill="#FEFCFF" style="stroke:#181818;stroke-width:0.5;"/><text x="28" y="20.282" fill="#000" font-size="10" font-weight="700" font-family="Helvetica">mobile Device</text><rect x="16" y="27.641" width="103.307" height="700.625" fill="#E6E6FA" style="stroke:#181818;stroke-width:0.5;"/><text x="56.625" y="36.923" fill="#000" font-size="10" font-weight="700" font-family="Helvetica">App</text><rect x="517.899" y="11" width="552.242" height="717.266" fill="#EDFDEC" style="stroke:#181818;stroke-width:0.5;"/><text x="732.128" y="20.282" fill="#000" font-size="10" font-weight="700" font-family="Helvetica">Anbieter TI 2.0 Dienst</text><rect x="517.899" y="27.641" width="552.242" height="700.625" fill="#FFF3E5" style="stroke:#181818;stroke-width:0.5;"/><text x="760.875" y="36.923" fill="#000" font-size="10" font-weight="700" font-family="Helvetica">ZETA Guard</text><g><title>ZETA Client</title><rect x="64.153" y="81.563" width="8" height="602.422" fill="#000" fill-opacity="0"/><line x1="67.653" y1="81.563" x2="67.653" y2="683.984" style="stroke:#000;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title></title><rect x="62.653" y="89.563" width="10" height="594.422" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><g><title>PDP</title><rect x="588.291" y="81.563" width="8" height="602.422" fill="#000" fill-opacity="0"/><line x1="591.791" y1="81.563" x2="591.791" y2="683.984" style="stroke:#000;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title></title><rect x="586.791" y="286.531" width="10" height="324.531" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><rect x="31.53" y="54.922" width="72.247" height="25.641" fill="#FFE6CC" style="stroke:#D79B00;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="38.53" y="71.204" fill="#000" font-size="10" font-family="Helvetica">ZETA Client</text><rect x="533.316" y="43.281" width="116.949" height="37.281" fill="#FFE6CC" style="stroke:#D79B00;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="581.911" y="59.563" fill="#000" font-size="10" font-family="Helvetica">PDP</text><text x="540.316" y="71.204" fill="#000" font-size="10" font-family="Helvetica">Authorization Server</text><rect x="31.53" y="683.984" width="72.247" height="25.641" fill="#FFE6CC" style="stroke:#D79B00;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="38.53" y="700.267" fill="#000" font-size="10" font-family="Helvetica">ZETA Client</text><rect x="533.316" y="683.984" width="116.949" height="37.281" fill="#FFE6CC" style="stroke:#D79B00;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="581.911" y="700.267" fill="#000" font-size="10" font-family="Helvetica">PDP</text><text x="540.316" y="711.907" fill="#000" font-size="10" font-family="Helvetica">Authorization Server</text><polygon points="579.791,103.203,589.791,107.203,579.791,111.203,583.791,107.203" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="72.653" y1="107.203" x2="585.791" y2="107.203" style="stroke:#181818;stroke-width:1;"/><text x="79.653" y="102.845" fill="#000" font-size="10" font-family="Helvetica">(01)</text><text x="104.181" y="102.845" fill="#000" font-size="10" font-family="Helvetica">GET /nonce</text><polygon points="83.653,128.844,73.653,132.844,83.653,136.844,79.653,132.844" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="77.653" y1="132.844" x2="590.791" y2="132.844" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="89.653" y="128.485" fill="#000" font-size="10" font-family="Helvetica">(02)</text><text x="114.181" y="128.485" fill="#000" font-size="10" font-family="Helvetica">200 OK {nonce}</text><polygon points="574.791,282.531,584.791,286.531,574.791,290.531,578.791,286.531" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="72.653" y1="286.531" x2="580.791" y2="286.531" style="stroke:#181818;stroke-width:1;"/><text x="79.653" y="218.149" fill="#000" font-size="10" font-family="Helvetica">(03)</text><text x="104.181" y="154.126" fill="#000" font-size="10" font-family="Helvetica">POST /register</text><text x="104.181" y="165.767" fill="#000" font-size="10" font-family="Helvetica">{</text><text x="110.538" y="177.407" fill="#000" font-size="10" font-family="Helvetica">"client_name": "myClient",</text><text x="110.538" y="189.048" fill="#000" font-size="10" font-family="Helvetica">"grant_types": ["urn:ietf:params:oauth:grant-type:token-exchange", "refresh_token"],</text><text x="110.538" y="200.688" fill="#000" font-size="10" font-family="Helvetica">"jwks": { "keys": [ PuK.Client.Sig ] },</text><text x="110.538" y="212.329" fill="#000" font-size="10" font-family="Helvetica">"token_endpoint_auth_method": "private_key_jwt",</text><text x="110.538" y="223.97" fill="#000" font-size="10" font-family="Helvetica">"redirect_uris": ["https:</text><text x="226.402" y="223.97" fill="#000" font-size="10" font-style="italic" font-family="Helvetica">&lt;App-FQDN>/cb/&lt;app>/oidc", "https:</text><text x="418.048" y="223.97" fill="#000" font-size="10" font-family="Helvetica">&lt;App-FQDN>/cb/&lt;app>/app"],</text><text x="110.538" y="235.61" fill="#000" font-size="10" font-family="Helvetica">"platform": "android",</text><text x="110.538" y="247.251" fill="#000" font-size="10" font-family="Helvetica">"product_id": "&lt;gematik-Produktbezeichner>",</text><text x="110.538" y="258.892" fill="#000" font-size="10" font-family="Helvetica">"nonce": "&lt;nonce>",</text><text x="110.538" y="270.532" fill="#000" font-size="10" font-family="Helvetica">"signed_hash_puk_client_sig": "&lt;PoP über SHA-256(PuK.Client.Sig || nonce)>"</text><text x="104.181" y="282.173" fill="#000" font-size="10" font-family="Helvetica">}</text><path d="M601.791,299.531 L601.791,448.531 L1045.791,448.531 L1045.791,309.531 L1035.791,299.531 L601.791,299.531" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1035.791,299.531 L1035.791,309.531 L1045.791,309.531 L1035.791,299.531" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="607.791" y="313.813" fill="#000" font-size="10" font-family="Helvetica">Es werden zwei redirect_uris je App registriert (RFC 8252, claimed-HTTPS</text><text x="607.791" y="325.454" fill="#000" font-size="10" font-family="Helvetica">Universal-/App-Links auf einer vom App-Hersteller kontrollierten Domain):</text><text x="607.791" y="337.095" fill="#000" font-size="10" font-family="Helvetica">- https://&lt;App-FQDN>/cb/&lt;app>/oidc = oidc_redirect_uri</text><text x="614.148" y="348.735" fill="#000" font-size="10" font-family="Helvetica">(SekIDP Auth Code Flow, redirection_endpoint des AuthS, nicht /token)</text><text x="607.791" y="360.376" fill="#000" font-size="10" font-family="Helvetica">- https://&lt;App-FQDN>/cb/&lt;app>/app = app_redirect_uri</text><text x="614.148" y="372.017" fill="#000" font-size="10" font-family="Helvetica">(ZETA Guard Auth Code Flow, /token-Endpunkt des AuthS)</text><text x="607.791" y="383.657" fill="#000" font-size="10" font-family="Helvetica">Beide Callbacks enden über denselben App-Link/Universal-Link in der App;</text><text x="607.791" y="395.298" fill="#000" font-size="10" font-family="Helvetica">der ZETA Client unterscheidet den zu nutzenden AuthS-Endpunkt anhand des Pfads.</text><text x="607.791" y="406.938" fill="#000" font-size="10" font-family="Helvetica">Die OS-seitige Verknüpfung erfolgt über apple-app-site-association bzw.</text><text x="607.791" y="418.579" fill="#000" font-size="10" font-family="Helvetica">assetlinks.json (Deployment, kein Laufzeit-Flow). Die App ist inkl. redirect_uris</text><text x="607.791" y="430.22" fill="#000" font-size="10" font-family="Helvetica">bei der gematik registriert; der AuthS prüft beim DCR, ob die übergebenen</text><text x="607.791" y="441.86" fill="#000" font-size="10" font-family="Helvetica">redirect_uris registriert sind.</text><line x1="596.791" y1="483.5" x2="638.791" y2="483.5" style="stroke:#181818;stroke-width:1;"/><line x1="638.791" y1="483.5" x2="638.791" y2="496.5" style="stroke:#181818;stroke-width:1;"/><line x1="597.791" y1="496.5" x2="638.791" y2="496.5" style="stroke:#181818;stroke-width:1;"/><polygon points="607.791,492.5,597.791,496.5,607.791,500.5,603.791,496.5" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="603.791" y="473.321" fill="#000" font-size="10" font-family="Helvetica">(04)</text><text x="628.318" y="467.501" fill="#000" font-size="10" font-family="Helvetica">Prüfe nonce (frisch, einmalig) und</text><text x="628.318" y="479.142" fill="#000" font-size="10" font-family="Helvetica">signed_hash_puk_client_sig mit PuK.Client.Sig (PoP des Client Instance Keys)</text><line x1="596.791" y1="533.781" x2="638.791" y2="533.781" style="stroke:#181818;stroke-width:1;"/><line x1="638.791" y1="533.781" x2="638.791" y2="546.781" style="stroke:#181818;stroke-width:1;"/><line x1="597.791" y1="546.781" x2="638.791" y2="546.781" style="stroke:#181818;stroke-width:1;"/><polygon points="607.791,542.781,597.791,546.781,607.791,550.781,603.791,546.781" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="603.791" y="523.603" fill="#000" font-size="10" font-family="Helvetica">(05)</text><text x="628.318" y="517.782" fill="#000" font-size="10" font-family="Helvetica">Pinne attestation_type="software" (immer) sowie platform und product_id</text><text x="628.318" y="529.423" fill="#000" font-size="10" font-family="Helvetica">(sofern übermittelt) im Registrierungsdatensatz — kein ak_jkt; binding_status: pinned</text><line x1="596.791" y1="572.422" x2="638.791" y2="572.422" style="stroke:#181818;stroke-width:1;"/><line x1="638.791" y1="572.422" x2="638.791" y2="585.422" style="stroke:#181818;stroke-width:1;"/><line x1="597.791" y1="585.422" x2="638.791" y2="585.422" style="stroke:#181818;stroke-width:1;"/><polygon points="607.791,581.422,597.791,585.422,607.791,589.422,603.791,585.422" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="603.791" y="568.063" fill="#000" font-size="10" font-family="Helvetica">(06)</text><text x="628.318" y="568.063" fill="#000" font-size="10" font-family="Helvetica">Store Client (state: pending_user_binding)</text><polygon points="83.653,607.063,73.653,611.063,83.653,615.063,79.653,611.063" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="77.653" y1="611.063" x2="585.791" y2="611.063" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="89.653" y="606.704" fill="#000" font-size="10" font-family="Helvetica">(07)</text><text x="114.181" y="606.704" fill="#000" font-size="10" font-family="Helvetica">201 Created {client_id, status: pending_user_binding}</text><path d="M596.791,624.063 L596.791,668.063 L1060.791,668.063 L1060.791,634.063 L1050.791,624.063 L596.791,624.063" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1050.791,624.063 L1050.791,634.063 L1060.791,634.063 L1050.791,624.063" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="602.791" y="638.345" fill="#000" font-size="10" font-family="Helvetica">Abwärtskompatibilität: nonce, signed_hash_puk_client_sig, platform und product_id sind</text><text x="602.791" y="649.985" fill="#000" font-size="10" font-family="Helvetica">im Software-Zweig optional; eine Registrierung ohne sie bleibt gültig — attestation_type</text><text x="602.791" y="661.626" fill="#000" font-size="10" font-family="Helvetica">wird trotzdem gepinnt, nur platform/product_id bleiben dann ungepinnt.</text><?plantuml-src hLPTRjj647xtAQPygGIBP68WHI4x1XH9iGKdbYef0Pew89RaY5gJN1AxIokMOw27w15o3B_v9Zr9PvUK_5CxUOaVP98x-ysty_FD_i95b5KnWkVvPPLdRiOkYqfx-elUsVaLNl_4FuBhdHuD9xtPR0uNUzuBxsKNXkvxnZDtF9y0LnfEH_tZEUIub317di558S2NcD0QIWzEa0iWM_SZIiL4t27Cr7pRslWNAFdY4bgO4svGwBBTiIO8fvLUqw8WAvPgNWWF1Xo1noWqrmorIZ2i1BqYmJR4td0HLo81b8iYIuXWhtyCCUOm7WtwxjkiM4658KhmrwYPtu1T-Y7jSos75d5JAEA6MPkmMuhZ4g4NXkwduRpdMgnvaQ9mt-2wIjhUtO60OCECezGWAWaZeJGJQnKjimgLmWns2N1MBFIAINHxMgFIP4sSzs6ccQuKn4omQDc5abXmaGILGXaOWlJY_UmaxuJ55t3o8kGPmW0lU8GE38OVH_rXq1-_6qzt0An9homTc4n7xtl3wUpFsNpuVhiEK3AfUSHB9ZJqwVJqZobmJBIQTmSE3ap83mzf0ntCWEvi_jSaUYBaQ48u7m6LcyasHSyu7NyS3ORJXtmizb75PEo0UGwEFlIcWsSuzIgzd5bAay7aJ9ZNGl8rCsK5CvIKw-yJh0-nkziyW7jOOtRXQ3W7NnGYmftQYqjhjLKNzbwyWF49NDdrwyURTtUxC1bJTsshvqnSdGa09xA6WM0vEbrApsKJn8vTJIITAT2N9IfQ_SkffEXIv1PTEZBBLRTWXDwrLgwnwcfRg_WbMZAHeDC1H-A2odmPs1NdSurxlaeDu1KuALvQQ9XK9rxjsvln13x3TMrgzmKKdhAW3WsCmo17Ycfi-9QINp2D0S44vwiDROanbnZfe9Ay9hxKkbHTtp-WudBV_Z4uFVIZq3zWPNde5poE3DFlsT3FXdkPCRqeP6xSaz98sjwuBMKHL-ILMse72NMvvgaxCPzJ7U8QURGKA0yRUvihQsgVDfyLJmJ6mP9HrCeg3PeKqMThEoacS7jZb6Lst7FtNltMUXIwhr_1uhKFdJDnlICAZI1vijHGBEfoeBeRAbYX9562zGevF8WOd9C4bINKjIAjnBIcR_lm-zwhlGv46UCvnkxnV3unK1y4lp2gcxc-YTmxBb85h5g04LT9IfqRDFUOR3Hc6NrA2w5baLdn8WQ3WkHGjBk4vSAFCWMlmVmBxZEsNTYQOJeQJEm9eL_Gv38YtDaUZHfmMqOarAeEHGS49KM3R-ki_KCAz4CCwFS90dT2yJyIDRmx9F-LIE_vDnxV84q7wBCi2rb4iKCpQfeSqnDfUKZlczZwT_4shq13BYP3MjudBFDuJmoXCbEDXe9nOTnIlYkQ5pJmh1FBuOuM4zItiMKtMR1OUOHeHk5uvYhacYS8D61JSNjJBkuFlvehHIL3btvTnJKzA5L4l5Q-SBqoMFG9TMOAn3jNzBarm38hBdDYMWzZU4U5GtsYxGHjruFOrAAv0z2-p7jOgaQZgNpDgPjskr-r-tLah5YMylPceOrr3eF-j0D52361M-eqtscu2q9xs0ZtEq3HNFIiJfkEsh4fRtHuAz4JumJhzeFMWY2YPSVqGSuodhGf6_6PUBw_8UVwiH2sJB-RX3G9hUSymP-GShQVPi45tMgOdVWs_5R1NpkgkGmuqE9vZh8DgbXH23QAPkZ1dOYTYHRjGDcK8d6ZzjLje01Ejt6XAb0nAR1GJA_Xtx__gTF8qk0yfVWtbub0sGi7tJGCjVX9rZDTIDoSicKsuDCtamU7tev0rpL3y2Nq9TBE6AwQiFAu0rllJw1TrvbyMYMjet1r-qrgbHPvIT6awml