<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="729px" preserveAspectRatio="none" style="width:1062px;height:729px;background:#FFFFFF;" version="1.1" viewBox="0 0 1062 729" width="1062px" zoomAndPan="magnify"><defs/><g><rect fill="#FEFCFF" height="717.2656" style="stroke:#181818;stroke-width:0.5;" width="103.3066" x="11" y="6"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="23" y="15.2822">mobile Device</text><rect fill="#E6E6FA" height="700.625" style="stroke:#181818;stroke-width:0.5;" width="103.3066" x="11" y="22.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="51.6255" y="31.9229">App</text><rect fill="#EDFDEC" height="717.2656" style="stroke:#181818;stroke-width:0.5;" width="147.7842" x="512.8989" y="6"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="524.8989" y="15.2822">Anbieter TI 2.0 Dienst</text><rect fill="#FFF3E5" height="700.625" style="stroke:#181818;stroke-width:0.5;" width="147.7842" x="512.8989" y="22.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="553.6465" y="31.9229">ZETA Guard</text><g><title>ZETA Client</title><rect fill="#000000" fill-opacity="0.00000" height="602.4219" width="8" x="59.1533" y="76.5625"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="62.6533" x2="62.6533" y1="76.5625" y2="678.9844"/></g><g><title/><rect fill="#FFFFFF" height="594.4219" style="stroke:#000000;stroke-width:1;" width="10" x="57.6533" y="84.5625"/></g><g><title>PDP</title><rect fill="#000000" fill-opacity="0.00000" height="602.4219" width="8" x="583.291" y="76.5625"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="586.791" x2="586.791" y1="76.5625" y2="678.9844"/></g><g><title/><rect fill="#FFFFFF" height="324.5313" style="stroke:#000000;stroke-width:1;" width="10" x="581.791" y="281.5313"/></g><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="26.5298" y="49.9219"/><text fill="#000000" font-family="Helvetica" font-size="10" x="33.5298" y="66.2041">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="528.3164" y="38.2813"/><text fill="#000000" font-family="Helvetica" font-size="10" x="576.9106" y="54.5635">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="535.3164" y="66.2041">Authorization Server</text><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="26.5298" y="678.9844"/><text fill="#000000" font-family="Helvetica" font-size="10" x="33.5298" y="695.2666">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="528.3164" y="678.9844"/><text fill="#000000" font-family="Helvetica" font-size="10" x="576.9106" y="695.2666">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="535.3164" y="706.9072">Authorization Server</text><polygon fill="#181818" points="574.791,98.2031,584.791,102.2031,574.791,106.2031,578.791,102.2031" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="67.6533" x2="580.791" y1="102.2031" y2="102.2031"/><text fill="#000000" font-family="Helvetica" font-size="10" x="74.6533" y="97.8447">(01)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="99.1807" y="97.8447">GET /nonce</text><polygon fill="#181818" points="78.6533,123.8438,68.6533,127.8438,78.6533,131.8438,74.6533,127.8438" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="72.6533" x2="585.791" y1="127.8438" y2="127.8438"/><text fill="#000000" font-family="Helvetica" font-size="10" x="84.6533" y="123.4854">(02)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="109.1807" y="123.4854">200 OK {nonce}</text><polygon fill="#181818" points="569.791,277.5313,579.791,281.5313,569.791,285.5313,573.791,281.5313" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="67.6533" x2="575.791" y1="281.5313" y2="281.5313"/><text fill="#000000" font-family="Helvetica" font-size="10" x="74.6533" y="213.1494">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="99.1807" y="149.126">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="99.1807" y="160.7666">{</text><text fill="#000000" font-family="Helvetica" font-size="10" x="105.5381" y="172.4072">"client_name": "myClient",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="105.5381" y="184.0479">"grant_types": ["urn:ietf:params:oauth:grant-type:token-exchange", "refresh_token"],</text><text fill="#000000" font-family="Helvetica" font-size="10" x="105.5381" y="195.6885">"jwks": { "keys": [ PuK.Client.Sig ] },</text><text fill="#000000" font-family="Helvetica" font-size="10" x="105.5381" y="207.3291">"token_endpoint_auth_method": "private_key_jwt",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="105.5381" y="218.9697">"redirect_uris": ["https:</text><text fill="#000000" font-family="Helvetica" font-size="10" font-style="italic" x="221.4023" y="218.9697">&lt;App-FQDN&gt;/cb/&lt;app&gt;/oidc", "https:</text><text fill="#000000" font-family="Helvetica" font-size="10" x="413.0479" y="218.9697">&lt;App-FQDN&gt;/cb/&lt;app&gt;/app"],</text><text fill="#000000" font-family="Helvetica" font-size="10" x="105.5381" y="230.6104">"platform": "android",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="105.5381" y="242.251">"product_id": "&lt;gematik-Produktbezeichner&gt;",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="105.5381" y="253.8916">"nonce": "&lt;nonce&gt;",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="105.5381" y="265.5322">"signed_hash_puk_client_sig": "&lt;PoP &#252;ber SHA-256(PuK.Client.Sig || nonce)&gt;"</text><text fill="#000000" font-family="Helvetica" font-size="10" x="99.1807" y="277.1729">}</text><path d="M596.791,294.5313 L596.791,443.5313 L1040.791,443.5313 L1040.791,304.5313 L1030.791,294.5313 L596.791,294.5313" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1030.791,294.5313 L1030.791,304.5313 L1040.791,304.5313 L1030.791,294.5313" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="602.791" y="308.8135">Es werden zwei redirect_uris je App registriert (RFC 8252, claimed-HTTPS</text><text fill="#000000" font-family="Helvetica" font-size="10" x="602.791" y="320.4541">Universal-/App-Links auf einer vom App-Hersteller kontrollierten Domain):</text><text fill="#000000" font-family="Helvetica" font-size="10" x="602.791" y="332.0947">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/oidc = oidc_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="609.1484" y="343.7354">(SekIDP Auth Code Flow, redirection_endpoint des AuthS, nicht /token)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="602.791" y="355.376">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/app = app_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="609.1484" y="367.0166">(ZETA Guard Auth Code Flow, /token-Endpunkt des AuthS)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="602.791" y="378.6572">Beide Callbacks enden &#252;ber denselben App-Link/Universal-Link in der App;</text><text fill="#000000" font-family="Helvetica" font-size="10" x="602.791" y="390.2979">der ZETA Client unterscheidet den zu nutzenden AuthS-Endpunkt anhand des Pfads.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="602.791" y="401.9385">Die OS-seitige Verkn&#252;pfung erfolgt &#252;ber apple-app-site-association bzw.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="602.791" y="413.5791">assetlinks.json (Deployment, kein Laufzeit-Flow). Die App ist inkl. redirect_uris</text><text fill="#000000" font-family="Helvetica" font-size="10" x="602.791" y="425.2197">bei der gematik registriert; der AuthS pr&#252;ft beim DCR, ob die &#252;bergebenen</text><text fill="#000000" font-family="Helvetica" font-size="10" x="602.791" y="436.8604">redirect_uris registriert sind.</text><line style="stroke:#181818;stroke-width:1;" x1="591.791" x2="633.791" y1="478.5" y2="478.5"/><line style="stroke:#181818;stroke-width:1;" x1="633.791" x2="633.791" y1="478.5" y2="491.5"/><line style="stroke:#181818;stroke-width:1;" x1="592.791" x2="633.791" y1="491.5" y2="491.5"/><polygon fill="#181818" points="602.791,487.5,592.791,491.5,602.791,495.5,598.791,491.5" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="598.791" y="468.3213">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="623.3184" y="462.501">Pr&#252;fe nonce (frisch, einmalig) und</text><text fill="#000000" font-family="Helvetica" font-size="10" x="623.3184" y="474.1416">signed_hash_puk_client_sig mit PuK.Client.Sig (PoP des Client Instance Keys)</text><line style="stroke:#181818;stroke-width:1;" x1="591.791" x2="633.791" y1="528.7813" y2="528.7813"/><line style="stroke:#181818;stroke-width:1;" x1="633.791" x2="633.791" y1="528.7813" y2="541.7813"/><line style="stroke:#181818;stroke-width:1;" x1="592.791" x2="633.791" y1="541.7813" y2="541.7813"/><polygon fill="#181818" points="602.791,537.7813,592.791,541.7813,602.791,545.7813,598.791,541.7813" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="598.791" y="518.6025">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="623.3184" y="512.7822">Pinne attestation_type="software" (immer) sowie platform und product_id</text><text fill="#000000" font-family="Helvetica" font-size="10" x="623.3184" y="524.4229">(sofern &#252;bermittelt) im Registrierungsdatensatz &#8212; kein ak_jkt; binding_status: pinned</text><line style="stroke:#181818;stroke-width:1;" x1="591.791" x2="633.791" y1="567.4219" y2="567.4219"/><line style="stroke:#181818;stroke-width:1;" x1="633.791" x2="633.791" y1="567.4219" y2="580.4219"/><line style="stroke:#181818;stroke-width:1;" x1="592.791" x2="633.791" y1="580.4219" y2="580.4219"/><polygon fill="#181818" points="602.791,576.4219,592.791,580.4219,602.791,584.4219,598.791,580.4219" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="598.791" y="563.0635">(06)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="623.3184" y="563.0635">Store Client (state: pending_user_binding)</text><polygon fill="#181818" points="78.6533,602.0625,68.6533,606.0625,78.6533,610.0625,74.6533,606.0625" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="72.6533" x2="580.791" y1="606.0625" y2="606.0625"/><text fill="#000000" font-family="Helvetica" font-size="10" x="84.6533" y="601.7041">(07)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="109.1807" y="601.7041">201 Created {client_id, status: pending_user_binding}</text><path d="M591.791,619.0625 L591.791,663.0625 L1055.791,663.0625 L1055.791,629.0625 L1045.791,619.0625 L591.791,619.0625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1045.791,619.0625 L1045.791,629.0625 L1055.791,629.0625 L1045.791,619.0625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="597.791" y="633.3447">Abw&#228;rtskompatibilit&#228;t: nonce, signed_hash_puk_client_sig, platform und product_id sind</text><text fill="#000000" font-family="Helvetica" font-size="10" x="597.791" y="644.9854">im Software-Zweig optional; eine Registrierung ohne sie bleibt g&#252;ltig &#8212; attestation_type</text><text fill="#000000" font-family="Helvetica" font-size="10" x="597.791" y="656.626">wird trotzdem gepinnt, nur platform/product_id bleiben dann ungepinnt.</text><!--SRC=[hLPTRjj647xtAQPygGIBP68WHI4x1XH9iGKdbYef0Pew89RaY5gJN1AxIokMOw27w15o3B_v9Zr9PvUK_5CxUOaVP98x-ysty_FD_i95b5KnWkVvPPLdRiOkYqfx-elUsVaLNl_4FuBhdHuD9xtPR0uNUzuBxsKNXkvxnZDtF9y0LnfEH_tZEUIub317di558S2NcD0QIWzEa0iWM_SZIiL4t27Cr7pRslWNAFdY4bgO4svGwBBTiIO8fvLUqw8WAvPgNWWF1Xo1noWqrmorIZ2i1BqYmJR4td0HLo81b8iYIuXWhtyCCUOm7WtwxjkiM4658KhmrwYPtu1T-Y7jSos75d5JAEA6MPkmMuhZ4g4NXkwduRpdMgnvaQ9mt-2wIjhUtO60OCECezGWAWaZeJGJQnKjimgLmWns2N1MBFIAINHxMgFIP4sSzs6ccQuKn4omQDc5abXmaGILGXaOWlJY_UmaxuJ55t3o8kGPmW0lU8GE38OVH_rXq1-_6qzt0An9homTc4n7xtl3wUpFsNpuVhiEK3AfUSHB9ZJqwVJqZobmJBIQTmSE3ap83mzf0ntCWEvi_jSaUYBaQ48u7m6LcyasHSyu7NyS3ORJXtmizb75PEo0UGwEFlIcWsSuzIgzd5bAay7aJ9ZNGl8rCsK5CvIKw-yJh0-nkziyW7jOOtRXQ3W7NnGYmftQYqjhjLKNzbwyWF49NDdrwyURTtUxC1bJTsshvqnSdGa09xA6WM0vEbrApsKJn8vTJIITAT2N9IfQ_SkffEXIv1PTEZBBLRTWXDwrLgwnwcfRg_WbMZAHeDC1H-A2odmPs1NdSurxlaeDu1KuALvQQ9XK9rxjsvln13x3TMrgzmKKdhAW3WsCmo17Ycfi-9QINp2D0S44vwiDROanbnZfe9Ay9hxKkbHTtp-WudBV_Z4uFVIZq3zWPNde5poE3DFlsT3FXdkPCRqeP6xSaz98sjwuBMKHL-ILMse72NMvvgaxCPzJ7U8QURGKA0yRUvihQsgVDfyLJmJ6mP9HrCeg3PeKqMThEoacS7jZb6Lst7FtNltMUXIwhr_1uhKFdJDnlICAZI1vijHGBEfoeBeRAbYX9562zGevF8WOd9C4bINKjIAjnBIcR_lm-zwhlGv46UCvnkxnV3unK1y4lp2gcxc-YTmxBb85h5g04LT9IfqRDFUOR3Hc6NrA2w5baLdn8WQ3WkHGjBk4vSAFCWMlmVmBxZEsNTYQOJeQJEm9eL_Gv38YtDaUZHfmMqOarAeEHGS49KM3R-ki_KCAz4CCwFS90dT2yJyIDRmx9F-LIE_vDnxV84q7wBCi2rb4iKCpQfeSqnDfUKZlczZwT_4shq13BYP3MjudBFDuJmoXCbEDXe9nOTnIlYkQ5pJmh1FBuOuM4zItiMKtMR1OUOHeHk5uvYhacYS8D61JSNjJBkuFlvehHIL3btvTnJKzA5L4l5Q-SBqoMFG9TMOAn3jNzBarm38hBdDYMWzZU4U5GtsYxGHjruFOrAAv0z2-p7jOgaQZgNpDgPjskr-r-tLah5YMylPceOrr3eF-j0D52361M-eqtscu2q9xs0ZtEq3HNFIiJfkEsh4fRtHuAz4JumJhzeFMWY2YPSVqGSuodhGf6_6PUBw_8UVwiH2sJB-RX3G9hUSymP-GShQVPi45tMgOdVWs_5R1NpkgkGmuqE9vZh8DgbXH23QAPkZ1d