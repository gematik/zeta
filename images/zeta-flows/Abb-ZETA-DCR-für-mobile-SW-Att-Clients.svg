<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="489px" preserveAspectRatio="none" style="width:1058px;height:489px;background:#FFFFFF;" version="1.1" viewBox="0 0 1058 489" width="1058px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><rect fill="#FEFCFF" height="463.9375" style="stroke:#181818;stroke-width:0.5;" width="103.3066" x="16" y="11"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="28" y="20.2822">mobile Device</text><rect fill="#E6E6FA" height="447.2969" style="stroke:#181818;stroke-width:0.5;" width="103.3066" x="16" y="27.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="56.6255" y="36.9229">App</text><rect fill="#EDFDEC" height="463.9375" style="stroke:#181818;stroke-width:0.5;" width="147.7842" x="514.7202" y="11"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="526.7202" y="20.2822">Anbieter TI 2.0 Dienst</text><rect fill="#FFF3E5" height="447.2969" style="stroke:#181818;stroke-width:0.5;" width="147.7842" x="514.7202" y="27.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="555.4678" y="36.9229">ZETA Guard</text><g><title>ZETA Client</title><rect fill="#000000" fill-opacity="0.00000" height="349.0938" width="8" x="64.1533" y="81.5625"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5,5;" x1="67.6533" x2="67.6533" y1="81.5625" y2="430.6563"/></g><g><title/><rect fill="#FFFFFF" height="341.0938" style="stroke:#181818;stroke-width:1;" width="10" x="62.6533" y="89.5625"/></g><g><title>PDP</title><rect fill="#000000" fill-opacity="0.00000" height="349.0938" width="8" x="585.1123" y="81.5625"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5,5;" x1="588.6123" x2="588.6123" y1="81.5625" y2="430.6563"/></g><g><title/><rect fill="#FFFFFF" height="223.9688" style="stroke:#181818;stroke-width:1;" width="10" x="583.6123" y="188.6875"/></g><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="31.5298" y="54.9219"/><text fill="#000000" font-family="Helvetica" font-size="10" x="38.5298" y="71.2041">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="530.1377" y="43.2813"/><text fill="#000000" font-family="Helvetica" font-size="10" x="578.7319" y="59.5635">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="537.1377" y="71.2041">Authorization Server</text><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="31.5298" y="430.6563"/><text fill="#000000" font-family="Helvetica" font-size="10" x="38.5298" y="446.9385">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="530.1377" y="430.6563"/><text fill="#000000" font-family="Helvetica" font-size="10" x="578.7319" y="446.9385">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="537.1377" y="458.5791">Authorization Server</text><polygon fill="#181818" points="571.6123,184.6875,581.6123,188.6875,571.6123,192.6875,575.6123,188.6875" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="72.6533" x2="577.6123" y1="188.6875" y2="188.6875"/><text fill="#000000" font-family="Helvetica" font-size="10" x="79.6533" y="143.5869">(01)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="104.1807" y="102.8447">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="104.1807" y="114.4854">{</text><text fill="#000000" font-family="Helvetica" font-size="10" x="110.5381" y="126.126">"client_name": "myClient",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="110.5381" y="137.7666">"grant_types": ["urn:ietf:params:oauth:grant-type:token-exchange", "refresh_token"],</text><text fill="#000000" font-family="Helvetica" font-size="10" x="110.5381" y="149.4072">"jwks": { "keys": [ PuK.Client.Sig ] },</text><text fill="#000000" font-family="Helvetica" font-size="10" x="110.5381" y="161.0479">"token_endpoint_auth_method": "private_key_jwt",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="110.5381" y="172.6885">"redirect_uris": ["https:</text><text fill="#000000" font-family="Helvetica" font-size="10" font-style="italic" x="226.4023" y="172.6885">&lt;App-FQDN&gt;/cb/&lt;app&gt;/oidc", "https:</text><text fill="#000000" font-family="Helvetica" font-size="10" x="418.0479" y="172.6885">&lt;App-FQDN&gt;/cb/&lt;app&gt;/app"]</text><text fill="#000000" font-family="Helvetica" font-size="10" x="104.1807" y="184.3291">}</text><path d="M598.6123,201.6875 L598.6123,350.6875 L1042.6123,350.6875 L1042.6123,211.6875 L1032.6123,201.6875 L598.6123,201.6875" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1032.6123,201.6875 L1032.6123,211.6875 L1042.6123,211.6875 L1032.6123,201.6875" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="604.6123" y="215.9697">Es werden zwei redirect_uris je App registriert (RFC 8252, claimed-HTTPS</text><text fill="#000000" font-family="Helvetica" font-size="10" x="604.6123" y="227.6104">Universal-/App-Links auf einer vom App-Hersteller kontrollierten Domain):</text><text fill="#000000" font-family="Helvetica" font-size="10" x="604.6123" y="239.251">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/oidc = oidc_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="610.9697" y="250.8916">(SekIDP Auth Code Flow, redirection_endpoint des AuthS, nicht /token)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="604.6123" y="262.5322">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/app = app_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="610.9697" y="274.1729">(ZETA Guard Auth Code Flow, /token-Endpunkt des AuthS)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="604.6123" y="285.8135">Beide Callbacks enden &#252;ber denselben App-Link/Universal-Link in der App;</text><text fill="#000000" font-family="Helvetica" font-size="10" x="604.6123" y="297.4541">der ZETA Client unterscheidet den zu nutzenden AuthS-Endpunkt anhand des Pfads.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="604.6123" y="309.0947">Die OS-seitige Verkn&#252;pfung erfolgt &#252;ber apple-app-site-association bzw.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="604.6123" y="320.7354">assetlinks.json (Deployment, kein Laufzeit-Flow). Die App ist inkl. redirect_uris</text><text fill="#000000" font-family="Helvetica" font-size="10" x="604.6123" y="332.376">bei der gematik registriert; der AuthS pr&#252;ft beim DCR, ob die &#252;bergebenen</text><text fill="#000000" font-family="Helvetica" font-size="10" x="604.6123" y="344.0166">redirect_uris registriert sind.</text><line style="stroke:#181818;stroke-width:1;" x1="593.6123" x2="635.6123" y1="374.0156" y2="374.0156"/><line style="stroke:#181818;stroke-width:1;" x1="635.6123" x2="635.6123" y1="374.0156" y2="387.0156"/><line style="stroke:#181818;stroke-width:1;" x1="594.6123" x2="635.6123" y1="387.0156" y2="387.0156"/><polygon fill="#181818" points="604.6123,383.0156,594.6123,387.0156,604.6123,391.0156,600.6123,387.0156" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="600.6123" y="369.6572">(02)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="625.1396" y="369.6572">Store Client (state: pending_user_binding)</text><polygon fill="#181818" points="83.6533,408.6563,73.6533,412.6563,83.6533,416.6563,79.6533,412.6563" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="77.6533" x2="582.6123" y1="412.6563" y2="412.6563"/><text fill="#000000" font-family="Helvetica" font-size="10" x="89.6533" y="408.2979">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="114.1807" y="408.2979">201 Created {client_id, status: pending_user_binding}</text><?plantuml-src hLLHJ-Cu47xlhvZBoxMYINQHLZe55gaq1Qe5sckxI7S7YfnacfecJcGxb1RnptZZZztOAL1qtExBzY6Du_4ttundllcDYoIlKmJFywkwoDsShSjQU_fUjrg_mzTV-2EutkNfODoRJcTmj-zzyZu7C70l6C_TqMmCN6cu7FRFPb3WGi8CUGvtfG1VOaPxA3tuXbm0sRfNA1KJQPSmb-RRgur_XvBFrz36Wd2ZKbUThZL1kAprXZO5MR6bvgNm8EG8F4MXkMQeLOPnBMY91BibTin5MeiCKCxBF2E2lVuPf5Z0Q1ZstPEyN46DCKhmDwYPlmLR-p6TSos7zfPIXq3RYkC2eHV7xj-3MS-r8BDoYS8znasTTRotI83mufoZr21g2KEXD1CRbIpo6fN27FO8S5hEzOf9T7jQez9aJMGFOAgPhXMaJB1a4K258kKYYsg5CZBCQE7zwjjjnUKzE4KPynmXn3kUe0FXu6hO7qJzqVbeqWAm9hsgSc0y6Lxq1fFfNzFPuE9r7w1YKlE4Lqnew5FqzCSKE2PRsxK3XuScrqT7T802Cw2jb_-6H4_474qAPqEWEZFNJDapJaTNmt0mUS_7Of_MJAOEcFVez7jl4luFfrwj5rDBQHoEhuLPbf9lcAadcAAak_unmIQ8lRtj2xX73URUNW3Z4NN6Qm5SYuTh0U0arZ0Ih40de0oljtdesjrC4gr8hojKjFkFKqiHKF3pW5YpGWKb8_J0Mhd6Aj2stF0-MJ2HeTC5H-9Sebf4TiUvQN1lLqi3-03E4jSM6iRrDw_nxKrv1ZVms9ZQSn55M9NKNP5n61L8YKaDtqhoEwOn8fZeTlL2MsBA9IOwgYLlY2-qhbJW-uTK7-x9d-7baP_4_Y6hgYE_v6bYcFx8XXxEpRLuR8bI8qYUBJIKyoQvT1431IkKr9wmMI67T_xXbdgogg39lBGzrvwSzE6F_I_xNKXonWjCtRFPR6oWlWj-P_GdTtt3uvoBfG9Mpy78Z2JDAWoQUqOs6lESFYrBeMMPssuc1c59mY0w0M6vyBEuuIkOlsYNiItBzXINmt1i8uH-IHfkvAZx6XfLvEkba6If9XLT43oXrFZsrZe_fK0FOa3F3mYyTSv_I3Jmxe3yrsAvuzzuF4RIIUYpF8zPGhb38xhm_6HqbDv8t69Ql-JMVyktMGB9VKg6j7r0MEPrHnsWDlfEAcbS6BTqtpK9A4c_TM8vlD5YWheWjUp6SvOgZn3DK1XDNOLSymo1HirIF3zLyzqnq72bhEJeqjDLNDEBKcN26oc8Dok3HPzGvwP0l5j5dziXLdcvBeXfCvRWd0fdGwxiBEaq8ydKefc6T2xttfUg4IqgNnDrHkD5y-LkrHuqcR4QLSddfxasrWM4_KaNoXXI0hVKQTBHc1E4zhuHTZj0qQ3mh72PZchPAs-WNpGhe45JIdn9VPicbCQFnqrdzpYTRuwuRW3xdpv3NoATJE5XgtKyxOAoC-nZjCVMlm00?></g></svg>