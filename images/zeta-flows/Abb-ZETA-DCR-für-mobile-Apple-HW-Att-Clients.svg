<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="831px" preserveAspectRatio="none" style="width:1177px;height:831px;background:#FFFFFF;" version="1.1" viewBox="0 0 1177 831" width="1177px" zoomAndPan="magnify"><defs/><g><rect fill="#FEFCFF" height="819.7031" style="stroke:#181818;stroke-width:0.5;" width="139.0537" x="148.001" y="6"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="160.001" y="15.2822">mobile Apple Device</text><rect fill="#E6E6FA" height="803.0625" style="stroke:#181818;stroke-width:0.5;" width="139.0537" x="148.001" y="22.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="206.5" y="31.9229">App</text><rect fill="#EDFDEC" height="819.7031" style="stroke:#181818;stroke-width:0.5;" width="147.7842" x="614.668" y="6"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="626.668" y="15.2822">Anbieter TI 2.0 Dienst</text><rect fill="#FFF3E5" height="803.0625" style="stroke:#181818;stroke-width:0.5;" width="147.7842" x="614.668" y="22.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="655.4155" y="31.9229">ZETA Guard</text><g><title>ZETA Client</title><rect fill="#000000" fill-opacity="0.00000" height="704.8594" width="8" x="214.0278" y="76.5625"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="217.5278" x2="217.5278" y1="76.5625" y2="781.4219"/></g><g><title/><rect fill="#FFFFFF" height="696.8594" style="stroke:#000000;stroke-width:1;" width="10" x="212.5278" y="84.5625"/></g><g><title>PDP</title><rect fill="#000000" fill-opacity="0.00000" height="704.8594" width="8" x="685.0601" y="76.5625"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="688.5601" x2="688.5601" y1="76.5625" y2="781.4219"/></g><g><title/><rect fill="#FFFFFF" height="309.6094" style="stroke:#000000;stroke-width:1;" width="10" x="683.5601" y="141.4844"/></g><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="181.4043" y="49.9219"/><text fill="#000000" font-family="Helvetica" font-size="10" x="188.4043" y="66.2041">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="630.0854" y="38.2813"/><text fill="#000000" font-family="Helvetica" font-size="10" x="678.6797" y="54.5635">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="637.0854" y="66.2041">Authorization Server</text><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="181.4043" y="781.4219"/><text fill="#000000" font-family="Helvetica" font-size="10" x="188.4043" y="797.7041">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="630.0854" y="781.4219"/><text fill="#000000" font-family="Helvetica" font-size="10" x="678.6797" y="797.7041">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="637.0854" y="809.3447">Authorization Server</text><path d="M201.5278,88.5625 L261.4839,88.5625 L261.4839,92.2031 L251.4839,102.2031 L201.5278,102.2031 L201.5278,88.5625" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="613.9375" style="stroke:#000000;stroke-width:1.5;" width="969.0908" x="201.5278" y="88.5625"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="216.5278" y="98.8447">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="276.4839" y="99.8447">[Kein ZETA Attestation Token vorhanden]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="201.5278" x2="1170.6187" y1="470.0938" y2="470.0938"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="206.5278" y="481.376">[ZETA Attestation Token vorhanden (Fast-Path)]</text><polygon fill="#181818" points="671.5601,137.4844,681.5601,141.4844,671.5601,145.4844,675.5601,141.4844" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="222.5278" x2="677.5601" y1="141.4844" y2="141.4844"/><text fill="#000000" font-family="Helvetica" font-size="10" x="229.5278" y="131.3057">(01)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="254.0552" y="125.4854">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="254.0552" y="137.126">{attestation_type="apple", Apple_Attestation_Object, PuK.Client.Sig, redirect_uris}</text><line style="stroke:#181818;stroke-width:1;" x1="693.5601" x2="735.5601" y1="167.125" y2="167.125"/><line style="stroke:#181818;stroke-width:1;" x1="735.5601" x2="735.5601" y1="167.125" y2="180.125"/><line style="stroke:#181818;stroke-width:1;" x1="694.5601" x2="735.5601" y1="180.125" y2="180.125"/><polygon fill="#181818" points="704.5601,176.125,694.5601,180.125,704.5601,184.125,700.5601,180.125" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="700.5601" y="162.7666">(02)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="725.0874" y="162.7666">Validiere Apple_Attestation_Object</text><path d="M698.5601,193.125 L698.5601,226.125 L1149.5601,226.125 L1149.5601,203.125 L1139.5601,193.125 L698.5601,193.125" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1139.5601,193.125 L1139.5601,203.125 L1149.5601,203.125 L1139.5601,193.125" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="704.5601" y="207.4072">AuthS verifiziert Apple App Attest Root CA. Extrahiert Hash(PuK.Client.Sig) aus Objekt</text><text fill="#000000" font-family="Helvetica" font-size="10" x="704.5601" y="219.0479">und vergleicht ihn mit dem Payload.</text><path d="M698.5601,236.4063 L698.5601,339.4063 L1143.5601,339.4063 L1143.5601,246.4063 L1133.5601,236.4063 L698.5601,236.4063" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1133.5601,236.4063 L1133.5601,246.4063 L1143.5601,246.4063 L1133.5601,236.4063" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="704.5601" y="250.6885">Es werden zwei redirect_uris je App registriert (RFC 8252, claimed-HTTPS</text><text fill="#000000" font-family="Helvetica" font-size="10" x="704.5601" y="262.3291">Universal-/App-Links auf einer vom App-Hersteller kontrollierten Domain):</text><text fill="#000000" font-family="Helvetica" font-size="10" x="704.5601" y="273.9697">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/oidc = oidc_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="710.9175" y="285.6104">(SekIDP Auth Code Flow, redirection_endpoint des AuthS, nicht /token)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="704.5601" y="297.251">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/app = app_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="710.9175" y="308.8916">(ZETA Guard Auth Code Flow, /token-Endpunkt des AuthS)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="704.5601" y="320.5322">Beide Callbacks enden &#252;ber denselben App-Link/Universal-Link in der App.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="704.5601" y="332.1729">Der ZETA Client unterscheidet den zu nutzenden AuthS-Endpunkt anhand des Pfads.</text><line style="stroke:#181818;stroke-width:1;" x1="693.5601" x2="735.5601" y1="373.8125" y2="373.8125"/><line style="stroke:#181818;stroke-width:1;" x1="735.5601" x2="735.5601" y1="373.8125" y2="386.8125"/><line style="stroke:#181818;stroke-width:1;" x1="694.5601" x2="735.5601" y1="386.8125" y2="386.8125"/><polygon fill="#181818" points="704.5601,382.8125,694.5601,386.8125,704.5601,390.8125,700.5601,386.8125" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="700.5601" y="363.6338">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="725.0874" y="357.8135">Pinne attestation_type, platform, product_id und ak_jkt (Thumbprint PuK.AK.Sig)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="725.0874" y="369.4541">im Registrierungsdatensatz (binding_status: pinned)</text><line style="stroke:#181818;stroke-width:1;" x1="693.5601" x2="735.5601" y1="412.4531" y2="412.4531"/><line style="stroke:#181818;stroke-width:1;" x1="735.5601" x2="735.5601" y1="412.4531" y2="425.4531"/><line style="stroke:#181818;stroke-width:1;" x1="694.5601" x2="735.5601" y1="425.4531" y2="425.4531"/><polygon fill="#181818" points="704.5601,421.4531,694.5601,425.4531,704.5601,429.4531,700.5601,425.4531" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="700.5601" y="408.0947">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="725.0874" y="408.0947">Store Client (state: pending_user_binding)</text><polygon fill="#181818" points="233.5278,447.0938,223.5278,451.0938,233.5278,455.0938,229.5278,451.0938" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="227.5278" x2="682.5601" y1="451.0938" y2="451.0938"/><text fill="#000000" font-family="Helvetica" font-size="10" x="239.5278" y="446.7354">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="264.0552" y="446.7354">201 Created {client_id, status: pending_user_binding}</text><polygon fill="#181818" points="676.5601,537.2969,686.5601,541.2969,676.5601,545.2969,680.5601,541.2969" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="222.5278" x2="682.5601" y1="541.2969" y2="541.2969"/><text fill="#000000" font-family="Helvetica" font-size="10" x="229.5278" y="519.4775">(06)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="254.0552" y="502.0166">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="254.0552" y="513.6572">{attestation_type="zeta_attestation_token",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="254.0552" y="525.2979">zeta_attestation_token, PuK.Client.Sig,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="254.0552" y="536.9385">Besitznachweis (Signatur/Assertion)}</text><line style="stroke:#181818;stroke-width:1;" x1="688.5601" x2="730.5601" y1="566.9375" y2="566.9375"/><line style="stroke:#181818;stroke-width:1;" x1="730.5601" x2="730.5601" y1="566.9375" y2="579.9375"/><line style="stroke:#181818;stroke-width:1;" x1="689.5601" x2="730.5601" y1="579.9375" y2="579.9375"/><polygon fill="#181818" points="699.5601,575.9375,689.5601,579.9375,699.5601,583.9375,695.5601,579.9375" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="695.5601" y="562.5791">(07)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="720.0874" y="562.5791">Pr&#252;fe Token-Signatur &amp; Vertrauensstellung</text><line style="stroke:#181818;stroke-width:1;" x1="688.5601" x2="730.5601" y1="605.5781" y2="605.5781"/><line style="stroke:#181818;stroke-width:1;" x1="730.5601" x2="730.5601" y1="605.5781" y2="618.5781"/><line style="stroke:#181818;stroke-width:1;" x1="689.5601" x2="730.5601" y1="618.5781" y2="618.5781"/><polygon fill="#181818" points="699.5601,614.5781,689.5601,618.5781,699.5601,622.5781,695.5601,618.5781" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="695.5601" y="601.2197">(08)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="720.0874" y="601.2197">Extrahiere PuK.AK.Sig aus Token, verifiziere Besitznachweis</text><line style="stroke:#181818;stroke-width:1;" x1="688.5601" x2="730.5601" y1="655.8594" y2="655.8594"/><line style="stroke:#181818;stroke-width:1;" x1="730.5601" x2="730.5601" y1="655.8594" y2="668.8594"/><line style="stroke:#181818;stroke-width:1;" x1="689.5601" x2="730.5601" y1="668.8594" y2="668.8594"/><polygon fill="#181818" points="699.5601,664.8594,689.5601,668.8594,699.5601,672.8594,695.5601,668.8594" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="695.5601" y="645.6807">(09)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="720.0874" y="639.8604">&#220;bernimm registrierte redirect_uris aus dem Token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="720.0874" y="651.501">(kein erneutes Senden im Fast-Path)</text><polygon fill="#181818" points="233.5278,690.5,223.5278,694.5,233.5278,698.5,229.5278,694.5" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="227.5278" x2="687.5601" y1="694.5" y2="694.5"/><text fill="#000000" font-family="Helvetica" font-size="10" x="239.5278" y="690.1416">(10)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="264.0552" y="690.1416">201 Created {client_id, status: bound}</text><path d="M10,721.5 L10,765.5 L896,765.5 L896,731.5 L886,721.5 L10,721.5" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M886,721.5 L886,731.5 L896,731.5 L886,721.5" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="735.7822">Der zeta_attestation_token zertifiziert die erfolgreiche Apple App Attest Attestierung, ist an PuK.AK.Sig gebunden (cnf) und enth&#228;lt die registrierten</text><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="747.4229">redirect_uris. Er wird NICHT mehr bei /register ausgestellt, sondern erst nach der identit&#228;tsgebundenen E-Mail-Bindung im Token-Flow (siehe Abb-ZETA-OIDC-Token-Bezug).</text><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="759.0635">Er kann bei einer erneuten Registrierung im Fast-Path vorgelegt werden, sodass Hardware-Attestierung und redirect_uris nicht erneut &#252;bertragen werden m&#252;ssen.</text><!--SRC=[hLRDRXf94Bxp5BKSTa5cPX9BAwsyZYKCE4P9R1Q8fLrPGZrC0Hs67jJTOyT4UPCzvZ5oyuljrpt3duCtEOJ3CDtJLVLr_NnLlqWrJlE4AGoZPRv8WrGyPBaDxKTRgVn6htxY3-gQLwyxlUPWCAIxu_15-FA4Ei4x8TFWUjWZQInTTLkNGrhmJDEGPKftcQ98ynJVM8VqXgKYd0rkM1kXaWPqpjtUvanqnrfE7gZ62-WTPNPPR_WZJ5UvNU6ZmYanjp9J8RKbaqnOMMa5MpFbE5TOCjIMmCwbId8r9TQJB9q2OBDrIGalwBhRRWKNQNPFESUiALgn5L6fx26A8HTu33LWCwoI4baTkcj6yeof6SV1FvrXC_2wXjcSLN3EgtnQ3xSN8gYDKydQaierTPMnGgtCU9RcR0odTEJykboc73IjPMDn583_f84LDZUK22N6inDQ0e9Kqr5kM8ySEYp2dntXIfnzfEeYYsNA1IXgyvqSSvNQdPjkgpDgNR-zxbU8_46Sg5AltttNxFG7Vm-6dNURxqHBeQqSowLGbbfm0Fw4eQfpMBckqkcfy_hP6GHmFQUqilule3HLBDbvSTWbP9mBE1peZ5xVTDkT_ZuUh_jrBdHI9VS-Uls-sMy_WwcPszd0G-grUxVABJCjLy9b5WrO8zp_3x2unD5HHQIso6nlluXYeSRd18f0puJBIu_1Fqg716S5ZAEZ4-fTewmsQNEhFecjef5zMFAhgd0HgJQAo8ns38skumyyjWtgvM_2GdSuaDC6QKwanfTHhgNvx4qNzrvRFg4RaSe4ISVFglLYAhDCMavdbhB9MhRGvGj3hdoE5qc3P-a7wcSPujyCgVFHQZ7pXow5cTNseTP98DcTlRczLQXYftMQiXp3e9mfMaZhwxOd7j9C967bELH-dwXZw9urd4whUvRxZg0F1SJ2sTfZglKlMlJ7yU_73HgdGYuu2Iw7mzvQtNibxnndfK44oU2jL7C3o1DorAGHueNJ65pYZEKqnTOyKrPdgIzze6Xd81DLFodr1JIpTcbEekZKoLtyrRuwYyPnT8eOdqMPJCRqYjpVQ1TvAKnK6_2ys-xv6rCh0_yxAjl6smKFYRhCG9TmcobSqo3b_HbPbvVr7uA21v3W-GoGRSrz0wOm4tI08rVp7Hnho-SClgMMIDDOZE5FTaL2ZryT7-CDx1XZlVPtj8s1Mn8ABi51V0vBVMqiT_Y5SjShGBNEZ3EFNCZ1mcWZtf37ieKdbAjIZx8t4OafjBfoTrbMELWyFQdGcPvMQeEMgR2JJ2_mfhCaXzDaGYwhnNpq0RPgmrc-Y9Ukc_cQRRxnHN2hv8Bwcwn47p29GFOOOLTKArb_P7ndG4jmnfFwGM03cw6YIp_Kd0GVxY5xuf0lH8BWX8vVlAIMPaWcz6dijt6B1ctC7z3skLBXrF1tcP1g5yBOe2Vih7w847-83XqrZ_QsdP5gurOT_l8DFTwgSpRIhbo71KaOb9MSAjnEHqtqPkr4wuTPiwSVlqwuk5Qmbg9V2OCDQ2v7o3mF8887nJTao3lXznGuB91kEPLf7-H1VO__ecQGF8jTJkCdhEVKEmhr9cvLpKzU4ECSZaBByu510Zu9pTFS-7vcn1bI_RFhb9MAP-WCrocb6nkMTjLwE53OXk_NBGNDgHpVj6i7_6sFsHsS6duE5MhNh-kva6fZDQdxEWIIsUENjD2-wpFNfFVSXiwbwLw2ttQ6snWjPJlYmR5Jzl76zKm6Kze