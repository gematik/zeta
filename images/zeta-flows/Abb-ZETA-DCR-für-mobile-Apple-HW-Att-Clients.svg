ke:#181818;stroke-width:1;" width="10" x="688.5601" y="146.4844"/></g><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="186.4043" y="54.9219"/><text fill="#000000" font-family="Helvetica" font-size="10" x="193.4043" y="71.2041">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="635.0854" y="43.2813"/><text fill="#000000" font-family="Helvetica" font-size="10" x="683.6797" y="59.5635">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="642.0854" y="71.2041">Authorization Server</text><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="186.4043" y="736.1406"/><text fill="#000000" font-family="Helvetica" font-size="10" x="193.4043" y="752.4229">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="635.0854" y="736.1406"/><text fill="#000000" font-family="Helvetica" font-size="10" x="683.6797" y="752.4229">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="642.0854" y="764.0635">Authorization Server</text><path d="M206.5278,93.5625 L266.4839,93.5625 L266.4839,97.2031 L256.4839,107.2031 L206.5278,107.2031 L206.5278,93.5625" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="563.6563" style="stroke:#000000;stroke-width:1.5;" width="969.0908" x="206.5278" y="93.5625"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="221.5278" y="103.8447">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="281.4839" y="104.8447">[Kein ZETA Attestation Token vorhanden]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="206.5278" x2="1175.6187" y1="424.8125" y2="424.8125"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="211.5278" y="436.0947">[ZETA Attestation Token vorhanden (Fast-Path)]</text><polygon fill="#181818" points="676.5601,142.4844,686.5601,146.4844,676.5601,150.4844,680.5601,146.4844" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="227.5278" x2="682.5601" y1="146.4844" y2="146.4844"/><text fill="#000000" font-family="Helvetica" font-size="10" x="234.5278" y="136.3057">(01)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="259.0552" y="130.4854">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="259.0552" y="142.126">{attestation_type="apple", Apple_Attestation_Object, PuK.Client.Sig, redirect_uris}</text><line style="stroke:#181818;stroke-width:1;" x1="698.5601" x2="740.5601" y1="172.125" y2="172.125"/><line style="stroke:#181818;stroke-width:1;" x1="740.5601" x2="740.5601" y1="172.125" y2="185.125"/><line style="stroke:#181818;stroke-width:1;" x1="699.5601" x2="740.5601" y1="185.125" y2="185.125"/><polygon fill="#181818" points="709.5601,181.125,699.5601,185.125,709.5601,189.125,705.5601,185.125" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="705.5601" y="167.7666">(02)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="730.0874" y="167.7666">Validiere Apple_Attestation_Object</text><path d="M703.5601,198.125 L703.5601,231.125 L1154.5601,231.125 L1154.5601,208.125 L1144.5601,198.125 L703.5601,198.125" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1144.5601,198.125 L1144.5601,208.125 L1154.5601,208.125 L1144.5601,198.125" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="709.5601" y="212.4072">AuthS verifiziert Apple App Attest Root CA. Extrahiert Hash(PuK.Client.Sig) aus Objekt</text><text fill="#000000" font-family="Helvetica" font-size="10" x="709.5601" y="224.0479">und vergleicht ihn mit dem Payload.</text><path d="M703.5601,241.4063 L703.5601,344.4063 L1148.5601,344.4063 L1148.5601,251.4063 L1138.5601,241.4063 L703.5601,241.4063" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1138.5601,241.4063 L1138.5601,251.4063 L1148.5601,251.4063 L1138.5601,241.4063" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="709.5601" y="255.6885">Es werden zwei redirect_uris je App registriert (RFC 8252, claimed-HTTPS</text><text fill="#000000" font-family="Helvetica" font-size="10" x="709.5601" y="267.3291">Universal-/App-Links auf einer vom App-Hersteller kontrollierten Domain):</text><text fill="#000000" font-family="Helvetica" font-size="10" x="709.5601" y="278.9697">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/oidc = oidc_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="715.9175" y="290.6104">(SekIDP Auth Code Flow, redirection_endpoint des AuthS, nicht /token)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="709.5601" y="302.251">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/app = app_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="715.9175" y="313.8916">(ZETA Guard Auth Code Flow, /token-Endpunkt des AuthS)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="709.5601" y="325.5322">Beide Callbacks enden &#252;ber denselben App-Link/Universal-Link in der App.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="709.5601" y="337.1729">Der ZETA Client unterscheidet den zu nutzenden AuthS-Endpunkt anhand des Pfads.</text><line style="stroke:#181818;stroke-width:1;" x1="698.5601" x2="740.5601" y1="367.1719" y2="367.1719"/><line style="stroke:#181818;stroke-width:1;" x1="740.5601" x2="740.5601" y1="367.1719" y2="380.1719"/><line style="stroke:#181818;stroke-width:1;" x1="699.5601" x2="740.5601" y1="380.1719" y2="380.1719"/><polygon fill="#181818" points="709.5601,376.1719,699.5601,380.1719,709.5601,384.1719,705.5601,380.1719" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="705.5601" y="362.8135">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="730.0874" y="362.8135">Store Client (state: pending_user_binding)</text><polygon fill="#181818" points="238.5278,401.8125,228.5278,405.8125,238.5278,409.8125,234.5278,405.8125" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="232.5278" x2="687.5601" y1="405.8125" y2="405.8125"/><text fill="#000000" font-family="Helvetica" font-size="10" x="244.5278" y="401.4541">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="269.0552" y="401.4541">201 Created {client_id, status: pending_user_binding}</text><polygon fill="#181818" points="681.5601,492.0156,691.5601,496.0156,681.5601,500.0156,685.5601,496.0156" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="227.5278" x2="687.5601" y1="496.0156" y2="496.0156"/><text fill="#000000" font-family="Helvetica" font-size="10" x="234.5278" y="474.1963">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="259.0552" y="456.7354">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="259.0552" y="468.376">{attestation_type="zeta_attestation_token",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="259.0552" y="480.0166">zeta_attestation_token, PuK.Client.Sig,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="259.0552" y="491.6572">Besitznachweis (Signatur/Assertion)}</text><line style="stroke:#181818;stroke-width:1;" x1="693.5601" x2="735.5601" y1="521.6563" y2="521.6563"/><line style="stroke:#181818;stroke-width:1;" x1="735.5601" x2="735.5601" y1="521.6563" y2="534.6563"/><line style="stroke:#181818;stroke-width:1;" x1="694.5601" x2="735.5601" y1="534.6563" y2="534.6563"/><polygon fill="#181818" points="704.5601,530.6563,694.5601,534.6563,704.5601,538.6563,700.5601,534.6563" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="700.5601" y="517.2979">(06)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="725.0874" y="517.2979">Pr&#252;fe Token-Signatur &amp; Vertrauensstellung</text><line style="stroke:#181818;stroke-width:1;" x1="693.5601" x2="735.5601" y1="560.2969" y2="560.2969"/><line style="stroke:#181818;stroke-width:1;" x1="735.5601" x2="735.5601" y1="560.2969" y2="573.2969"/><line style="stroke:#181818;stroke-width:1;" x1="694.5601" x2="735.5601" y1="573.2969" y2="573.2969"/><polygon fill="#181818" points="704.5601,569.2969,694.5601,573.2969,704.5601,577.2969,700.5601,573.2969" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="700.5601" y="555.9385">(07)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="725.0874" y="555.9385">Extrahiere PuK.AK.Sig aus Token, verifiziere Besitznachweis</text><line style="stroke:#181818;stroke-width:1;" x1="693.5601" x2="735.5601" y1="610.5781" y2="610.5781"/><line style="stroke:#181818;stroke-width:1;" x1="735.5601" x2="735.5601" y1="610.5781" y2="623.5781"/><line style="stroke:#181818;stroke-width:1;" x1="694.5601" x2="735.5601" y1="623.5781" y2="623.5781"/><polygon fill="#181818" points="704.5601,619.5781,694.5601,623.5781,704.5601,627.5781,700.5601,623.5781" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="700.5601" y="600.3994">(08)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="725.0874" y="594.5791">&#220;bernimm registrierte redirect_uris aus dem Token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="725.0874" y="606.2197">(kein erneutes Senden im Fast-Path)</text><polygon fill="#181818" points="238.5278,645.2188,228.5278,649.2188,238.5278,653.2188,234.5278,649.2188" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="232.5278" x2="692.5601" y1="649.2188" y2="649.2188"/><text fill="#000000" font-family="Helvetica" font-size="10" x="244.5278" y="644.8604">(09)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="269.0552" y="644.8604">201 Created {client_id, status: bound}</text><path d="M15,676.2188 L15,720.2188 L901,720.2188 L901,686.2188 L891,676.2188 L15,676.2188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M891,676.2188 L891,686.2188 L901,686.2188 L891,676.2188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="21" y="690.501">Der zeta_attestation_token zertifiziert die erfolgreiche Apple App Attest Attestierung, ist an PuK.AK.Sig gebunden (cnf) und enth&#228;lt die registrierten</text><text fill="#000000" font-family="Helvetica" font-size="10" x="21" y="702.1416">redirect_uris. Er wird NICHT mehr bei /register ausgestellt, sondern erst nach der identit&#228;tsgebundenen E-Mail-Bindung im Token-Flow (siehe Abb-ZETA-OIDC-Token-Bezug).</text><text fill="#000000" font-family="Helvetica" font-size="10" x="21" y="713.7822">Er kann bei einer erneuten Registrierung im Fast-Path vorgelegt werden, sodass Hardware-Attestierung und redirect_uris nicht erneut &#252;bertragen werden m&#252;ssen.</text><?plantuml-src hLRDRjiu4BxhAMPzsBKHIse3BB3mfW4KsscCjh7MTWFi8e11MME9jKmP99KqBlecU-nZz9ONso4f_wNEjeVc88SIvvkFy_DnVk5YLbGfGX24gsfP-0LxA2iTw8_Qytw3Lp_nZ-2YwzVzE1gF9t1t6hm8NdQWxxzZlF27anYuqd0zw5vDO8cv