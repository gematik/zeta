<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1195px;height:833px;background:#FFFFFF;" width="1195px" height="833px" viewBox="0 0 1195 833" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif"><rect x="-182.217" y="11" width="474.272" height="807.703" fill="#FEFCFF" style="stroke:#181818;stroke-width:0.5;"/><text x="-2.608" y="20.282" fill="#000" font-size="10" font-weight="700" font-family="Helvetica">mobile Apple Device</text><rect x="-182.217" y="27.641" width="474.272" height="791.063" fill="#E6E6FA" style="stroke:#181818;stroke-width:0.5;"/><text x="43.891" y="36.923" fill="#000" font-size="10" font-weight="700" font-family="Helvetica">App</text><rect x="619.668" y="11" width="543.951" height="807.703" fill="#EDFDEC" style="stroke:#181818;stroke-width:0.5;"/><text x="829.751" y="20.282" fill="#000" font-size="10" font-weight="700" font-family="Helvetica">Anbieter TI 2.0 Dienst</text><rect x="619.668" y="27.641" width="543.951" height="791.063" fill="#FFF3E5" style="stroke:#181818;stroke-width:0.5;"/><text x="858.499" y="36.923" fill="#000" font-size="10" font-weight="700" font-family="Helvetica">ZETA Guard</text><rect x="206.528" y="93.563" width="969.091" height="601.938" fill="none" style="stroke:#000;stroke-width:1.5;"/><g><title>ZETA Client</title><rect x="219.028" y="81.563" width="8" height="692.859" fill="#000" fill-opacity="0"/><line x1="222.528" y1="81.563" x2="222.528" y2="774.422" style="stroke:#000;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title></title><rect x="217.528" y="89.563" width="10" height="684.859" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><g><title>PDP</title><rect x="690.06" y="81.563" width="8" height="692.859" fill="#000" fill-opacity="0"/><line x1="693.56" y1="81.563" x2="693.56" y2="774.422" style="stroke:#000;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title></title><rect x="688.56" y="146.484" width="10" height="309.609" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><rect x="186.404" y="54.922" width="72.247" height="25.641" fill="#FFE6CC" style="stroke:#D79B00;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="193.404" y="71.204" fill="#000" font-size="10" font-family="Helvetica">ZETA Client</text><rect x="635.085" y="43.281" width="116.949" height="37.281" fill="#FFE6CC" style="stroke:#D79B00;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="683.68" y="59.563" fill="#000" font-size="10" font-family="Helvetica">PDP</text><text x="642.085" y="71.204" fill="#000" font-size="10" font-family="Helvetica">Authorization Server</text><rect x="186.404" y="774.422" width="72.247" height="25.641" fill="#FFE6CC" style="stroke:#D79B00;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="193.404" y="790.704" fill="#000" font-size="10" font-family="Helvetica">ZETA Client</text><rect x="635.085" y="774.422" width="116.949" height="37.281" fill="#FFE6CC" style="stroke:#D79B00;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="683.68" y="790.704" fill="#000" font-size="10" font-family="Helvetica">PDP</text><text x="642.085" y="802.345" fill="#000" font-size="10" font-family="Helvetica">Authorization Server</text><path d="M206.528,93.563 L266.484,93.563 L266.484,97.203 L256.484,107.203 L206.528,107.203 L206.528,93.563" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="206.528" y="93.563" width="969.091" height="601.938" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="221.528" y="103.845" fill="#000" font-size="10" font-weight="700" font-family="Helvetica">alt</text><text x="281.484" y="104.845" fill="#000" font-size="10" font-weight="700" font-family="Helvetica">[Kein ZETA Attestation Token vorhanden]</text><polygon points="676.56,142.484,686.56,146.484,676.56,150.484,680.56,146.484" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="227.528" y1="146.484" x2="682.56" y2="146.484" style="stroke:#181818;stroke-width:1;"/><text x="234.528" y="136.306" fill="#000" font-size="10" font-family="Helvetica">(01)</text><text x="259.055" y="130.485" fill="#000" font-size="10" font-family="Helvetica">POST /register</text><text x="259.055" y="142.126" fill="#000" font-size="10" font-family="Helvetica">{attestation_type="apple", Apple_Attestation_Object, PuK.Client.Sig, redirect_uris}</text><line x1="698.56" y1="172.125" x2="740.56" y2="172.125" style="stroke:#181818;stroke-width:1;"/><line x1="740.56" y1="172.125" x2="740.56" y2="185.125" style="stroke:#181818;stroke-width:1;"/><line x1="699.56" y1="185.125" x2="740.56" y2="185.125" style="stroke:#181818;stroke-width:1;"/><polygon points="709.56,181.125,699.56,185.125,709.56,189.125,705.56,185.125" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="705.56" y="167.767" fill="#000" font-size="10" font-family="Helvetica">(02)</text><text x="730.087" y="167.767" fill="#000" font-size="10" font-family="Helvetica">Validiere Apple_Attestation_Object</text><path d="M703.56,198.125 L703.56,231.125 L1154.56,231.125 L1154.56,208.125 L1144.56,198.125 L703.56,198.125" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1144.56,198.125 L1144.56,208.125 L1154.56,208.125 L1144.56,198.125" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="709.56" y="212.407" fill="#000" font-size="10" font-family="Helvetica">AuthS verifiziert Apple App Attest Root CA. Extrahiert Hash(PuK.Client.Sig) aus Objekt</text><text x="709.56" y="224.048" fill="#000" font-size="10" font-family="Helvetica">und vergleicht ihn mit dem Payload.</text><path d="M703.56,241.406 L703.56,344.406 L1148.56,344.406 L1148.56,251.406 L1138.56,241.406 L703.56,241.406" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1138.56,241.406 L1138.56,251.406 L1148.56,251.406 L1138.56,241.406" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="709.56" y="255.688" fill="#000" font-size="10" font-family="Helvetica">Es werden zwei redirect_uris je App registriert (RFC 8252, claimed-HTTPS</text><text x="709.56" y="267.329" fill="#000" font-size="10" font-family="Helvetica">Universal-/App-Links auf einer vom App-Hersteller kontrollierten Domain):</text><text x="709.56" y="278.97" fill="#000" font-size="10" font-family="Helvetica">- https://&lt;App-FQDN>/cb/&lt;app>/oidc = oidc_redirect_uri</text><text x="715.917" y="290.61" fill="#000" font-size="10" font-family="Helvetica">(SekIDP Auth Code Flow, redirection_endpoint des AuthS, nicht /token)</text><text x="709.56" y="302.251" fill="#000" font-size="10" font-family="Helvetica">- https://&lt;App-FQDN>/cb/&lt;app>/app = app_redirect_uri</text><text x="715.917" y="313.892" fill="#000" font-size="10" font-family="Helvetica">(ZETA Guard Auth Code Flow, /token-Endpunkt des AuthS)</text><text x="709.56" y="325.532" fill="#000" font-size="10" font-family="Helvetica">Beide Callbacks enden über denselben App-Link/Universal-Link in der App.</text><text x="709.56" y="337.173" fill="#000" font-size="10" font-family="Helvetica">Der ZETA Client unterscheidet den zu nutzenden AuthS-Endpunkt anhand des Pfads.</text><line x1="698.56" y1="378.813" x2="740.56" y2="378.813" style="stroke:#181818;stroke-width:1;"/><line x1="740.56" y1="378.813" x2="740.56" y2="391.813" style="stroke:#181818;stroke-width:1;"/><line x1="699.56" y1="391.813" x2="740.56" y2="391.813" style="stroke:#181818;stroke-width:1;"/><polygon points="709.56,387.813,699.56,391.813,709.56,395.813,705.56,391.813" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="705.56" y="368.634" fill="#000" font-size="10" font-family="Helvetica">(03)</text><text x="730.087" y="362.813" fill="#000" font-size="10" font-family="Helvetica">Pinne attestation_type, platform, product_id und ak_jkt (Thumbprint PuK.AK.Sig)</text><text x="730.087" y="374.454" fill="#000" font-size="10" font-family="Helvetica">im Registrierungsdatensatz (binding_status: pinned)</text><line x1="698.56" y1="417.453" x2="740.56" y2="417.453" style="stroke:#181818;stroke-width:1;"/><line x1="740.56" y1="417.453" x2="740.56" y2="430.453" style="stroke:#181818;stroke-width:1;"/><line x1="699.56" y1="430.453" x2="740.56" y2="430.453" style="stroke:#181818;stroke-width:1;"/><polygon points="709.56,426.453,699.56,430.453,709.56,434.453,705.56,430.453" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="705.56" y="413.095" fill="#000" font-size="10" font-family="Helvetica">(04)</text><text x="730.087" y="413.095" fill="#000" font-size="10" font-family="Helvetica">Store Client (state: pending_user_binding)</text><polygon points="238.528,452.094,228.528,456.094,238.528,460.094,234.528,456.094" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="232.528" y1="456.094" x2="687.56" y2="456.094" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="244.528" y="451.735" fill="#000" font-size="10" font-family="Helvetica">(05)</text><text x="269.055" y="451.735" fill="#000" font-size="10" font-family="Helvetica">201 Created {client_id, status: pending_user_binding}</text><line x1="206.528" y1="465.094" x2="1175.619" y2="465.094" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="211.528" y="476.376" fill="#000" font-size="10" font-weight="700" font-family="Helvetica">[ZETA Attestation Token vorhanden (Fast-Path)]</text><polygon points="681.56,530.297,691.56,534.297,681.56,538.297,685.56,534.297" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="227.528" y1="534.297" x2="687.56" y2="534.297" style="stroke:#181818;stroke-width:1;"/><text x="234.528" y="512.478" fill="#000" font-size="10" font-family="Helvetica">(06)</text><text x="259.055" y="495.017" fill="#000" font-size="10" font-family="Helvetica">POST /register</text><text x="259.055" y="506.657" fill="#000" font-size="10" font-family="Helvetica">{attestation_type="zeta_attestation_token",</text><text x="259.055" y="518.298" fill="#000" font-size="10" font-family="Helvetica">zeta_attestation_token, PuK.Client.Sig,</text><text x="259.055" y="529.938" fill="#000" font-size="10" font-family="Helvetica">Besitznachweis (Signatur/Assertion)}</text><line x1="693.56" y1="559.938" x2="735.56" y2="559.938" style="stroke:#181818;stroke-width:1;"/><line x1="735.56" y1="559.938" x2="735.56" y2="572.938" style="stroke:#181818;stroke-width:1;"/><line x1="694.56" y1="572.938" x2="735.56" y2="572.938" style="stroke:#181818;stroke-width:1;"/><polygon points="704.56,568.938,694.56,572.938,704.56,576.938,700.56,572.938" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="700.56" y="555.579" fill="#000" font-size="10" font-family="Helvetica">(07)</text><text x="725.087" y="555.579" fill="#000" font-size="10" font-family="Helvetica">Prüfe Token-Signatur &amp; Vertrauensstellung</text><line x1="693.56" y1="598.578" x2="735.56" y2="598.578" style="stroke:#181818;stroke-width:1;"/><line x1="735.56" y1="598.578" x2="735.56" y2="611.578" style="stroke:#181818;stroke-width:1;"/><line x1="694.56" y1="611.578" x2="735.56" y2="611.578" style="stroke:#181818;stroke-width:1;"/><polygon points="704.56,607.578,694.56,611.578,704.56,615.578,700.56,611.578" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="700.56" y="594.22" fill="#000" font-size="10" font-family="Helvetica">(08)</text><text x="725.087" y="594.22" fill="#000" font-size="10" font-family="Helvetica">Extrahiere PuK.AK.Sig aus Token, verifiziere Besitznachweis</text><line x1="693.56" y1="648.859" x2="735.56" y2="648.859" style="stroke:#181818;stroke-width:1;"/><line x1="735.56" y1="648.859" x2="735.56" y2="661.859" style="stroke:#181818;stroke-width:1;"/><line x1="694.56" y1="661.859" x2="735.56" y2="661.859" style="stroke:#181818;stroke-width:1;"/><polygon points="704.56,657.859,694.56,661.859,704.56,665.859,700.56,661.859" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="700.56" y="638.681" fill="#000" font-size="10" font-family="Helvetica">(09)</text><text x="725.087" y="632.86" fill="#000" font-size="10" font-family="Helvetica">Übernimm registrierte redirect_uris aus dem Token</text><text x="725.087" y="644.501" fill="#000" font-size="10" font-family="Helvetica">(kein erneutes Senden im Fast-Path)</text><polygon points="238.528,683.5,228.528,687.5,238.528,691.5,234.528,687.5" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="232.528" y1="687.5" x2="692.56" y2="687.5" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="244.528" y="683.142" fill="#000" font-size="10" font-family="Helvetica">(10)</text><text x="269.055" y="683.142" fill="#000" font-size="10" font-family="Helvetica">201 Created {client_id, status: bound}</text><path d="M15,714.5 L15,758.5 L901,758.5 L901,724.5 L891,714.5 L15,714.5" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M891,714.5 L891,724.5 L901,724.5 L891,714.5" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="21" y="728.782" fill="#000" font-size="10" font-family="Helvetica">Der zeta_attestation_token zertifiziert die erfolgreiche Apple App Attest Attestierung, ist an PuK.AK.Sig gebunden (cnf) und enthält die registrierten</text><text x="21" y="740.423" fill="#000" font-size="10" font-family="Helvetica">redirect_uris. Er wird NICHT mehr bei /register ausgestellt, sondern erst nach der identitätsgebundenen E-Mail-Bindung im Token-Flow (siehe Abb-ZETA-OIDC-Token-Bezug).</text><text x="21" y="752.063" fill="#000" font-size="10" font-family="Helvetica">Er kann bei einer erneuten Registrierung im Fast-Path vorgelegt werden, sodass Hardware-Attestierung und redirect_uris nicht erneut übertragen werden müssen.</text><?plantuml-src hLRDRXf94Bxp5BKSTa5cPX9BAwsyZYKCE4P9R1Q8fLrPGZrC0Hs67jJTOyT4UPCzvZ5oyuljrpt3duCtEOJ3CDtJLVLr_NnLlqWrJlE4AGoZPRv8WrGyPBaDxKTRgVn6htxY3-gQLwyxlUPWCAIxu_15-FA4Ei4x8TFWUjWZQInTTLkNGrhmJDEGPKftcQ98ynJVM8VqXgKYd0rkM1kXaWPqpjtUvanqnrfE7gZ62-WTPNPPR_WZJ5UvNU6ZmYanjp9J8RKbaqnOMMa5MpFbE5TOCjIMmCwbId8r9TQJB9q2OBDrIGalwBhRRWKNQNPFESUiALgn5L6fx26A8HTu33LWCwoI4baTkcj6yeof6SV1FvrXC_2wXjcSLN3EgtnQ3xSN8gYDKydQaierTPMnGgtCU9RcR0odTEJykboc73IjPMDn583_f84LDZUK22N6inDQ0e9Kqr5kM8ySEYp2dntXIfnzfEeYYsNA1IXgyvqSSvNQdPjkgpDgNR-zxbU8_46Sg5AltttNxFG7Vm-6dNURxqHBeQqSowLGbbfm0Fw4eQfpMBckqkcfy_hP6GHmFQUqilule3HLBDbvSTWbP9mBE1peZ5xVTDkT_ZuUh_jrBdHI9VS-Uls-sMy_WwcPszd0G-grUxVABJCjLy9b5WrO8zp_3x2unD5HHQIso6nlluXYeSRd18f0puJBIu_1Fqg716S5ZAEZ4-fTewmsQNEhFecjef5zMFAhgd0HgJQAo8ns38skumyyjWtgvM_2GdSuaDC6QKwanfTHhgNvx4qNzrvRFg4RaSe4ISVFglLYAhDCMavdbhB9MhRGvGj3hdoE5qc3P-a7wcSPujyCgVFHQZ7pXow5cTNseTP98DcTlRczLQXYftMQiXp3e9mfMaZhwxOd7j9C967bELH-dwXZw9urd4whUvRxZg0F1SJ2sTfZglKlMlJ7yU_73HgdGYuu2Iw7mzvQtNibxnndfK44oU2jL7C3o1DorAGHueNJ65pYZEKqnTOyKrPdgIzze6Xd81DLFodr1JIpTcbEekZKoLtyrRuwYyPnT8eOdqMPJCRqYjpVQ1TvAKnK6_2ys-xv6rCh0_yxAjl6smKFYRhCG9TmcobSqo3b_HbPbvVr7uA21v3W-GoGRSrz0wOm4tI08rVp7Hnho-SClgMMIDDOZE5FTaL2ZryT7-CDx1XZlVPtj8s1Mn8ABi51V0vBVMqiT_Y5SjShGBNEZ3EFNCZ1mcWZtf37ieKdbAjIZx8t4OafjBfoTrbMELWyFQdGcPvMQeEMgR2JJ2_mfhCaXzDaGYwhnNpq0RPgmrc-Y9Ukc_cQRRxnHN2hv8Bwcwn47p29GFOOOLTKArb_P7ndG4jmnfFwGM03cw6YIp_Kd0GVxY5xuf0lH8BWX8vVlAIMPaWcz6dijt6B1ctC7z3skLBXrF1tcP1g5yBOe2Vih7w847-83XqrZ_QsdP5gurOT_l8DFTwgSpRIhbo71KaOb9MSAjnEHqtqPkr4wuTPiwSVlqwuk5Qmbg9V2OCDQ2v7o3mF8887nJTao3lXznGuB91kEPLf7-H1VO__ecQGF8jTJkCdhEVKEmhr9cvLpKzU4ECSZaBByu510Zu9pTFS-7vcn1bI_RFhb9MAP-WCrocb6nkMTjLwE53OXk_NBGNDgHpVj6i7_6sFsHsS6duE5MhNh-kva6fZDQdxEWIIsUENjD2-wpFNfFVSXiwbwLw2ttQ6snWjPJlYmR5Jzl76zKm6Kzev5ZXSq3nBbOFbuvUTALKz7L9b6PjYBlt-b0cem3ONIdb0HIig0whsUMGlhguEfvmovk6YHphKYJ06dLadzqBlpwBUOVkfLFIHmbH1sCZdAOoMFNVn-1K