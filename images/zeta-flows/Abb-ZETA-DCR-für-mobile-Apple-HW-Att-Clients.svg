<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="1046px" preserveAspectRatio="none" style="width:1142px;height:1046px;background:#FFFFFF;" version="1.1" viewBox="0 0 1142 1046" width="1142px" zoomAndPan="magnify"><defs/><g><rect fill="#FEFCFF" height="1034.3125" style="stroke:#181818;stroke-width:0.5;" width="139.0537" x="184.0264" y="6"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="196.0264" y="15.2822">mobile Apple Device</text><rect fill="#E6E6FA" height="1017.6719" style="stroke:#181818;stroke-width:0.5;" width="139.0537" x="184.0264" y="22.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="242.5254" y="31.9229">App</text><rect fill="#EDFDEC" height="1034.3125" style="stroke:#181818;stroke-width:0.5;" width="147.7842" x="578.6426" y="6"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="590.6426" y="15.2822">Anbieter TI 2.0 Dienst</text><rect fill="#FFF3E5" height="1017.6719" style="stroke:#181818;stroke-width:0.5;" width="147.7842" x="578.6426" y="22.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="619.3901" y="31.9229">ZETA Guard</text><g><title>ZETA Client</title><rect fill="#000000" fill-opacity="0.00000" height="919.4688" width="8" x="250.0532" y="76.5625"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="253.5532" x2="253.5532" y1="76.5625" y2="996.0313"/></g><g><title/><rect fill="#FFFFFF" height="911.4688" style="stroke:#000000;stroke-width:1;" width="10" x="248.5532" y="84.5625"/></g><g><title>PDP</title><rect fill="#000000" fill-opacity="0.00000" height="919.4688" width="8" x="649.0347" y="76.5625"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="652.5347" x2="652.5347" y1="76.5625" y2="996.0313"/></g><g><title/><rect fill="#FFFFFF" height="344.5313" style="stroke:#000000;stroke-width:1;" width="10" x="647.5347" y="208.0469"/></g><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="217.4297" y="49.9219"/><text fill="#000000" font-family="Helvetica" font-size="10" x="224.4297" y="66.2041">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="594.0601" y="38.2813"/><text fill="#000000" font-family="Helvetica" font-size="10" x="642.6543" y="54.5635">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="601.0601" y="66.2041">Authorization Server</text><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="217.4297" y="996.0313"/><text fill="#000000" font-family="Helvetica" font-size="10" x="224.4297" y="1012.3135">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="594.0601" y="996.0313"/><text fill="#000000" font-family="Helvetica" font-size="10" x="642.6543" y="1012.3135">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="601.0601" y="1023.9541">Authorization Server</text><path d="M237.5532,88.5625 L297.5093,88.5625 L297.5093,92.2031 L287.5093,102.2031 L237.5532,102.2031 L237.5532,88.5625" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="828.5469" style="stroke:#000000;stroke-width:1.5;" width="897.751" x="237.5532" y="88.5625"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="252.5532" y="98.8447">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="312.5093" y="99.8447">[Kein ZETA Attestation Token vorhanden]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="237.5532" x2="1135.3042" y1="571.5781" y2="571.5781"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="242.5532" y="582.8604">[ZETA Attestation Token vorhanden (Fast-Path)]</text><path d="M263.5532,117.2031 L263.5532,161.2031 L692.5532,161.2031 L692.5532,127.2031 L682.5532,117.2031 L263.5532,117.2031" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M682.5532,117.2031 L682.5532,127.2031 L692.5532,127.2031 L682.5532,117.2031" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="269.5532" y="131.4854">nonce vom nonce_endpoint (GET /nonce, nicht dargestellt). Sie geht nur in</text><text fill="#000000" font-family="Helvetica" font-size="10" x="269.5532" y="143.126">signed_hash_puk_client_sig ein; clientDataHash (Apple) und attestationChallenge</text><text fill="#000000" font-family="Helvetica" font-size="10" x="269.5532" y="154.7666">(Android) bleiben SHA-256(PuK.Client.Sig).</text><polygon fill="#181818" points="635.5347,204.0469,645.5347,208.0469,635.5347,212.0469,639.5347,208.0469" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="258.5532" x2="641.5347" y1="208.0469" y2="208.0469"/><text fill="#000000" font-family="Helvetica" font-size="10" x="265.5532" y="192.0479">(01)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="290.0806" y="180.4072">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="290.0806" y="192.0479">{attestation_type="apple", Apple_Attestation_Object, PuK.Client.Sig,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="290.0806" y="203.6885">nonce, signed_Hash_PuK.Client.Sig, redirect_uris}</text><line style="stroke:#181818;stroke-width:1;" x1="657.5347" x2="699.5347" y1="268.6094" y2="268.6094"/><line style="stroke:#181818;stroke-width:1;" x1="699.5347" x2="699.5347" y1="268.6094" y2="281.6094"/><line style="stroke:#181818;stroke-width:1;" x1="658.5347" x2="699.5347" y1="281.6094" y2="281.6094"/><polygon fill="#181818" points="668.5347,277.6094,658.5347,281.6094,668.5347,285.6094,664.5347,281.6094" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="664.5347" y="246.79">(02)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="689.062" y="229.3291">Validiere Apple_Attestation_Object;</text><text fill="#000000" font-family="Helvetica" font-size="10" x="689.062" y="240.9697">pr&#252;fe und verbrauche nonce; pr&#252;fe signed_hash_puk_client_sig mit PuK.Client.Sig</text><text fill="#000000" font-family="Helvetica" font-size="10" x="689.062" y="252.6104">&#252;ber SHA-256(PuK.Client.Sig || nonce) (Selbstsignatur, PoP des Client Instance Keys;</text><text fill="#000000" font-family="Helvetica" font-size="10" x="689.062" y="264.251">ohne nonce Legacy-Form &#252;ber SHA-256(PuK.Client.Sig) bis 01.01.2028, A_30193)</text><path d="M662.5347,294.6094 L662.5347,327.6094 L1113.5347,327.6094 L1113.5347,304.6094 L1103.5347,294.6094 L662.5347,294.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1103.5347,294.6094 L1103.5347,304.6094 L1113.5347,304.6094 L1103.5347,294.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="668.5347" y="308.8916">AuthS verifiziert Apple App Attest Root CA. Extrahiert Hash(PuK.Client.Sig) aus Objekt</text><text fill="#000000" font-family="Helvetica" font-size="10" x="668.5347" y="320.5322">und vergleicht ihn mit dem Payload.</text><path d="M662.5347,337.8906 L662.5347,440.8906 L1107.5347,440.8906 L1107.5347,347.8906 L1097.5347,337.8906 L662.5347,337.8906" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1097.5347,337.8906 L1097.5347,347.8906 L1107.5347,347.8906 L1097.5347,337.8906" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="668.5347" y="352.1729">Es werden zwei redirect_uris je App registriert (RFC 8252, claimed-HTTPS</text><text fill="#000000" font-family="Helvetica" font-size="10" x="668.5347" y="363.8135">Universal-/App-Links auf einer vom App-Hersteller kontrollierten Domain):</text><text fill="#000000" font-family="Helvetica" font-size="10" x="668.5347" y="375.4541">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/oidc = oidc_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="674.8921" y="387.0947">(SekIDP Auth Code Flow, redirection_endpoint des AuthS, nicht /token)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="668.5347" y="398.7354">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/app = app_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="674.8921" y="410.376">(ZETA Guard Auth Code Flow, /token-Endpunkt des AuthS)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="668.5347" y="422.0166">Beide Callbacks enden &#252;ber denselben App-Link/Universal-Link in der App.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="668.5347" y="433.6572">Der ZETA Client unterscheidet den zu nutzenden AuthS-Endpunkt anhand des Pfads.</text><line style="stroke:#181818;stroke-width:1;" x1="657.5347" x2="699.5347" y1="475.2969" y2="475.2969"/><line style="stroke:#181818;stroke-width:1;" x1="699.5347" x2="699.5347" y1="475.2969" y2="488.2969"/><line style="stroke:#181818;stroke-width:1;" x1="658.5347" x2="699.5347" y1="488.2969" y2="488.2969"/><polygon fill="#181818" points="668.5347,484.2969,658.5347,488.2969,668.5347,492.2969,664.5347,488.2969" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="664.5347" y="465.1182">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="689.062" y="459.2979">Pinne attestation_type, platform, product_id und ak_jkt (Thumbprint PuK.AK.Sig)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="689.062" y="470.9385">im Registrierungsdatensatz (binding_status: pinned)</text><line style="stroke:#181818;stroke-width:1;" x1="657.5347" x2="699.5347" y1="513.9375" y2="513.9375"/><line style="stroke:#181818;stroke-width:1;" x1="699.5347" x2="699.5347" y1="513.9375" y2="526.9375"/><line style="stroke:#181818;stroke-width:1;" x1="658.5347" x2="699.5347" y1="526.9375" y2="526.9375"/><polygon fill="#181818" points="668.5347,522.9375,658.5347,526.9375,668.5347,530.9375,664.5347,526.9375" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="664.5347" y="509.5791">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="689.062" y="509.5791">Store Client (state: pending_user_binding)</text><polygon fill="#181818" points="269.5532,548.5781,259.5532,552.5781,269.5532,556.5781,265.5532,552.5781" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="263.5532" x2="646.5347" y1="552.5781" y2="552.5781"/><text fill="#000000" font-family="Helvetica" font-size="10" x="275.5532" y="548.2197">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="300.0806" y="548.2197">201 Created {client_id, status: pending_user_binding}</text><polygon fill="#181818" points="640.5347,638.7813,650.5347,642.7813,640.5347,646.7813,644.5347,642.7813" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="258.5532" x2="646.5347" y1="642.7813" y2="642.7813"/><text fill="#000000" font-family="Helvetica" font-size="10" x="265.5532" y="620.9619">(06)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="290.0806" y="603.501">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="290.0806" y="615.1416">{attestation_type="zeta_attestation_token",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="290.0806" y="626.7822">zeta_attestation_token, PuK.Client.Sig,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="290.0806" y="638.4229">nonce, signed_Hash_PuK.Client.Sig, attestation_pop}</text><line style="stroke:#181818;stroke-width:1;" x1="652.5347" x2="694.5347" y1="680.0625" y2="680.0625"/><line style="stroke:#181818;stroke-width:1;" x1="694.5347" x2="694.5347" y1="680.0625" y2="693.0625"/><line style="stroke:#181818;stroke-width:1;" x1="653.5347" x2="694.5347" y1="693.0625" y2="693.0625"/><polygon fill="#181818" points="663.5347,689.0625,653.5347,693.0625,663.5347,697.0625,659.5347,693.0625" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="659.5347" y="669.8838">(07)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="684.062" y="664.0635">Pr&#252;fe Token-Signatur &amp; Vertrauensstellung;</text><text fill="#000000" font-family="Helvetica" font-size="10" x="684.062" y="675.7041">pr&#252;fe und verbrauche nonce</text><line style="stroke:#181818;stroke-width:1;" x1="652.5347" x2="694.5347" y1="753.625" y2="753.625"/><line style="stroke:#181818;stroke-width:1;" x1="694.5347" x2="694.5347" y1="753.625" y2="766.625"/><line style="stroke:#181818;stroke-width:1;" x1="653.5347" x2="694.5347" y1="766.625" y2="766.625"/><polygon fill="#181818" points="663.5347,762.625,653.5347,766.625,663.5347,770.625,659.5347,766.625" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="659.5347" y="731.8057">(08)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="684.062" y="714.3447">Extrahiere PuK.AK.Sig (cnf.jwk) aus Token; pr&#252;fe signed_Hash_PuK.Client.Sig</text><text fill="#000000" font-family="Helvetica" font-size="10" x="684.062" y="725.9854">&#252;ber SHA-256(PuK.Client.Sig || nonce) mit PuK.Client.Sig;</text><text fill="#000000" font-family="Helvetica" font-size="10" x="684.062" y="737.626">validiere attestation_pop als App-Attest-Assertion mit PuK.AK.Sig</text><text fill="#000000" font-family="Helvetica" font-size="10" x="684.062" y="749.2666">(clientDataHash = SHA-256(PuK.Client.Sig || nonce), rpIdHash, Counter-Monotonie)</text><path d="M657.5347,779.625 L657.5347,835.625 L1068.5347,835.625 L1068.5347,789.625 L1058.5347,779.625 L657.5347,779.625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1058.5347,779.625 L1058.5347,789.625 L1068.5347,789.625 L1058.5347,779.625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="663.5347" y="793.9072">nonce vom nonce_endpoint (GET /nonce, nicht dargestellt).</text><text fill="#000000" font-family="Helvetica" font-size="10" x="663.5347" y="805.5479">attestation_pop bindet den (ggf. neuen) Client Instance Key frisch an den</text><text fill="#000000" font-family="Helvetica" font-size="10" x="663.5347" y="817.1885">bereits attestierten Attestation Key. Legacy-Form ohne nonce (Pr&#252;fung gegen</text><text fill="#000000" font-family="Helvetica" font-size="10" x="663.5347" y="828.8291">SHA-256(PuK.Client.Sig)) nur bis 01.01.2028 (A_30193).</text><line style="stroke:#181818;stroke-width:1;" x1="652.5347" x2="694.5347" y1="870.4688" y2="870.4688"/><line style="stroke:#181818;stroke-width:1;" x1="694.5347" x2="694.5347" y1="870.4688" y2="883.4688"/><line style="stroke:#181818;stroke-width:1;" x1="653.5347" x2="694.5347" y1="883.4688" y2="883.4688"/><polygon fill="#181818" points="663.5347,879.4688,653.5347,883.4688,663.5347,887.4688,659.5347,883.4688" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="659.5347" y="860.29">(09)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="684.062" y="854.4697">&#220;bernimm registrierte redirect_uris aus dem Token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="684.062" y="866.1104">(kein erneutes Senden im Fast-Path)</text><polygon fill="#181818" points="269.5532,905.1094,259.5532,909.1094,269.5532,913.1094,265.5532,909.1094" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="263.5532" x2="651.5347" y1="909.1094" y2="909.1094"/><text fill="#000000" font-family="Helvetica" font-size="10" x="275.5532" y="904.751">(10)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="300.0806" y="904.751">201 Created {client_id, status: bound}</text><path d="M10,936.1094 L10,980.1094 L896,980.1094 L896,946.1094 L886,936.1094 L10,936.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M886,936.1094 L886,946.1094 L896,946.1094 L886,936.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="950.3916">Der zeta_attestation_token zertifiziert die erfolgreiche Apple App Attest Attestierung, ist an PuK.AK.Sig gebunden (cnf) und enth&#228;lt die registrierten</text><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="962.0322">redirect_uris. Er wird NICHT mehr bei /register ausgestellt, sondern erst nach der identit&#228;tsgebundenen E-Mail-Bindung im Token-Flow (siehe Abb-ZETA-OIDC-Token-Bezug).</text><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="973.6729">Er kann bei einer erneuten Registrierung im Fast-Path vorgelegt werden, sodass Hardware-Attestierung und redirect_uris nicht erneut &#252;bertragen werden m&#252;ssen.</text><!--SRC=[hLTTRzl64dtNhvZwuLQ2HSfnqOjU9p6WI78ivCEwbXgWXG5YAOx8ZQYbi5pQiTlya_lOdv4t_x5xTfUI9KMEWwA68OdaxipXp9apipz8DSshX2aCEyjgaGUvk2qg4vfFfj7uaLx-Wtymrtt_UZ3gZiSJkZuEZy9d9pG8tWcP1nUJ4SdIqFjXxtn22yuqJLZcT5qewcXEyOnrI6zOAiBQu0FhKgYa3PjpUs-zfdFDMivkgSaBs8qAisortHAczvMvmqE5LM9kPA52waiccR0oqWWsPSfnfN39C5i3UoLLKgcKMC-AF0N0Rk-S4bxGnR3V2yxoueOgZbbJvuwDwDJ6RZinzWKEGnFOIbP9ZQm5syrISiRKZUFWzy6a6pXRasBEAdZ5TrNQ2XzUY60spYLhGwhID5Ib4Ugkd6PvnMN9EHtQk2wNEGTTOxWqM0h0psbiXAbAIeGIq-o4be0WLHfL9Ul8eiD5-4zdk14Nd-XWKSGoPm-A-dmjftn0_S67OMyGzIxUNbmsYDn2h3YWqUNmNNTmEVvjF1cyMpydMWfjv5GkXJBKGm3m9Kewi06hhm_enGiRzTDJRC3hMQEDrRU7qbMnP1l5oP30E9jm1D0wlVWmx0ykj_4uswyheP