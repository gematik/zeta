det]</text><polygon fill="#181818" points="344.5313,654.0156,334.5313,658.0156,344.5313,662.0156,340.5313,658.0156" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="338.5313" x2="674.3447" y1="658.0156" y2="658.0156"/><text fill="#000000" font-family="Helvetica" font-size="10" x="350.5313" y="653.6572">(11)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="375.0586" y="653.6572">401 Unauthorized {"error": "invalid_client"}</text><polygon fill="#181818" points="344.5313,709.2969,334.5313,713.2969,344.5313,717.2969,340.5313,713.2969" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="338.5313" x2="674.3447" y1="713.2969" y2="713.2969"/><text fill="#000000" font-family="Helvetica" font-size="10" x="350.5313" y="708.9385">(12)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="375.0586" y="708.9385">400 Bad Request {"error": "invalid_dpop_proof"}</text><polygon fill="#181818" points="344.5313,764.5781,334.5313,768.5781,344.5313,772.5781,340.5313,768.5781" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="338.5313" x2="674.3447" y1="768.5781" y2="768.5781"/><text fill="#000000" font-family="Helvetica" font-size="10" x="350.5313" y="764.2197">(13)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="375.0586" y="764.2197">400 Bad Request {"error": "invalid_grant"}</text><path d="M10,809.5781 L10,888.5781 L998,888.5781 L998,819.5781 L988,809.5781 L10,809.5781" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M988,809.5781 L988,819.5781 L998,819.5781 L988,809.5781" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="823.8604">Fehlercodes gem&#228;&#223; [RFC6749]#section-5.2 (Refresh Grant &#167;6):</text><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="835.501">400 = technischer Grant-/Request-Fehler (invalid_dpop_proof [RFC9449]; invalid_grant f&#252;r jedes nicht\n  nutzbare Refresh Token: abgelaufen, wiederverwendet, widerrufen, Session terminiert),</text><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="847.1416">401 = Client-Authentifizierung fehlgeschlagen (invalid_client),</text><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="858.7822">403 = Policy-Ablehnung bei g&#252;ltigen Credentials (access_denied).</text><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="870.4229">Zuordnung je Fehlerfall: Tabelle ZT_PDP_Fehlerfaelle.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="882.0635">Response-Body gem&#228;&#223; [zeta-error.yaml].</text><!--SRC=[ZLNDRjj64BxpAIRieH8iKhRZfeYQ650isL1JLu8akwZhG5YH8seJQfTPBkr8HfwbFHJeI-GKlrXdbwGaodQG2ydzcMzcllbc-8oB8Cv21Dzl9jaYzcAsb9dszIVjECwFeBcE4SRo0meOuiSCKmstNCzfCLEOplCZntcMA1Oj66YKAz0gGyUPoa_WTl261-X2ftlPE-bEJlg_zOSEW3qRABwu_rUborJZmeN1i7VUxWv7Vux6tVFrJO24ASq3dZ2XuIJcI2-MWdlL7RUBjGklNgrGi-DZCa0H6dYdVETnjCMKeqO5unuS-llG8RjK6wVzorwdEwn6Ph7FCgP25yptvEoYFUmy4LCxq_EH3MdG6LmBivIAhvZcKi08rGsgIe1Lw_wWlR4To9W7I-YAY0lyTbPvvdjxvHTunoKxBJXHo3H2Po07C51Ipg1cYaQ5XT-b2B3-3QDYtKvJL3Q5N_yORypRMfC4R6xR89Q3lRqM3FgZCJIrrKkOoAHbdvF4175DKZC64xR6hX5uWq9yw-TO_eX7aF98SBfGRu3ALJQnWDSYKaJPH2yJV5qvQNpzXnOoKm7IPnh819syB6LibDybYtbeCYnrNDjDjR75MAEgyFeENWjwucO3cD-qiJX2qfRYqLm34MzlKm4hQ32KEOTGwtAnOB78z2eJKTqtmeHBgM8M8I2f88KfAkGw9GmbjU45HPFdplFL3dR4O-gGE3LGKwhLFFPw8kGVc9OACX4IqFd5Q0Ha3H6cRA6B1lTEsO8J9SqHfga9ZlfbmKqf2BLsjByFXTk9hKFTjseqwJgCN1Ry6iCq2mB2c6KnETibhY9oeZ4XMQ6Y6H37nDxMVMgDZQHk3fe4pfgCJbTmzmZ8Px8rtUILhZnlxQo30JSfqHKJwiukxSNorhPcuNpT5oqufBpxR-6kRLFAcTeHX_6CSOeFS4CKooTWZ_QVmwbKKnxI9RXpKIcft1QupFgPq2x7qFrSz3v5xLWNMopFS1wZchEPBjBAiJtZZDvynbTKEvALlKcb3kP6LkAXyEjF1da05u8L4mt3xJXBBUGzxQuvC2tavKE7NDz_YJMFdeJVXpSiN3Va8-YRwR7nK9NxsacJJIECMJQZ_hWbxkpalINoK3_gtyZZEoAmMY_hu9IroBjSaeSSjr60qhLJMvP0