a" font-size="10" x="98.624" y="175.126">POST /token dpop: dpop_proof</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="186.7666">client_assertion (JWT, PrK.Client.Sig signiert), refresh_token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="198.4072">grant_type=refresh_token,&#160;resource,&#160;scope</text><line style="stroke:#181818;stroke-width:1;" x1="418.9102" x2="460.9102" y1="228.4063" y2="228.4063"/><line style="stroke:#181818;stroke-width:1;" x1="460.9102" x2="460.9102" y1="228.4063" y2="241.4063"/><line style="stroke:#181818;stroke-width:1;" x1="419.9102" x2="460.9102" y1="241.4063" y2="241.4063"/><polygon fill="#181818" points="429.9102,237.4063,419.9102,241.4063,429.9102,245.4063,425.9102,241.4063" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="425.9102" y="224.0479">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="450.4375" y="224.0479">Validate Request (Client Assertion, DPoP Proof, Refresh Token)</text><line style="stroke:#181818;stroke-width:1;" x1="418.9102" x2="460.9102" y1="267.0469" y2="267.0469"/><line style="stroke:#181818;stroke-width:1;" x1="460.9102" x2="460.9102" y1="267.0469" y2="280.0469"/><line style="stroke:#181818;stroke-width:1;" x1="419.9102" x2="460.9102" y1="280.0469" y2="280.0469"/><polygon fill="#181818" points="429.9102,276.0469,419.9102,280.0469,429.9102,284.0469,425.9102,280.0469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="425.9102" y="262.6885">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="450.4375" y="262.6885">Invalidate Refresh token</text><path d="M423.9102,293.0469 L423.9102,337.0469 L815.9102,337.0469 L815.9102,303.0469 L805.9102,293.0469 L423.9102,293.0469" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M805.9102,293.0469 L805.9102,303.0469 L815.9102,303.0469 L805.9102,293.