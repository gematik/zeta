" y="186.7666">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="365.0586" y="175.126">POST /token dpop: dpop_proof</text><text fill="#000000" font-family="Helvetica" font-size="10" x="365.0586" y="186.7666">client_assertion (JWT, PrK.Client.Sig signiert), refresh_token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="365.0586" y="198.4072">grant_type=refresh_token,&#160;resource,&#160;scope</text><line style="stroke:#181818;stroke-width:1;" x1="685.3447" x2="727.3447" y1="228.4063" y2="228.4063"/><line style="stroke:#181818;stroke-width:1;" x1="727.3447" x2="727.3447" y1="228.4063" y2="241.4063"/><line style="stroke:#181818;stroke-width:1;" x1="686.3447" x2="727.3447" y1="241.4063" y2="241.4063"/><polygon fill="#181818" points="696.3447,237.4063,686.3447,241.4063,696.3447,245.4063,692.3447,241.4063" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="692.3447" y="224.0479">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="716.8721" y="224.0479">Validate Request (Client Assertion, DPoP Proof, Refresh Token)</text><line style="stroke:#181818;stroke-width:1;" x1="685.3447" x2="727.3447" y1="267.0469" y2="267.0469"/><line style="stroke:#181818;stroke-width:1;" x1="727.3447" x2="727.3447" y1="267.0469" y2="280.0469"/><line style="stroke:#181818;stroke-width:1;" x1="686.3447" x2="727.3447" y1="280.0469" y2="280.0469"/><polygon fill="#181818" points="696.3447,276.0469,686.3447,280.0469,696.3447,284.0469,692.3447,280.0469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="692.3447" y="262.6885">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="716.8721" y="262.6885">Invalidate Refresh token</text><path d="M690.3447,293.0469 L690.3447,337.0469 L1082.3447,337.0469 L1082.3447,303.0469 L1072.3447,293.0469 L690.3447,293.0469" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><pa