etica" font-size="10" x="16" y="835.501">400 = technischer Grant-/Request-Fehler (invalid_dpop_proof [RFC9449]; invalid_grant f&#252;r jedes nicht\n  nutzbare Refresh Token: abgelaufen, wiederverwendet, widerrufen, Session terminiert, SM(C)-B gesperrt),</text><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="847.1416">401 = Client-Authentifizierung fehlgeschlagen (invalid_client),</text><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="858.7822">403 = Policy-Ablehnung bei g&#252;ltigen Credentials (access_denied).</text><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="870.4229">Zuordnung je Fehlerfall: Tab-ZETA-PDP-Fehlerfaelle-Token-Endpunkt.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="16" y="882.0635">Response-Body gem&#228;&#223; [zeta-error.yaml].</text><!--SRC=[ZLNRRjj647tdLqpOXqgmADcEao9gOa2MP4DD7GcIxAAf0s55ZiYDgLrckRGZ6VcMzg50Vo9FyOzrTadgPZl8YwYzp3bpEJFxZ0i_pWA4UhsHPFFOYzb2PhgkFsl7SNu6pNMCC9RNA628dp9CDTno7T5YfZ2DyYF7UPOe5iuPQ9HBq2f3nvdAp-1sy8Rxw4AdUzbhToVj_k_zeGDWpmQAp-__LUaYrJXtOJ3idRUwmz6Vet7tV7KJ865ASvydJ6Xennpfmr9mttV7hMBjmklNIzJi-9WCK0G6tYc_kHyjCUMeKS6u1uVrVUYGNQeDQV-or-aEjpsps6SPKu4Bvl_axA8rx3pXKolJqSYwDEWCheHPIiMNJ7CfO8Jg1jMMWzlM_K5hRJkGCVSNq1KX5_ZzgFB8z_RAV-0TbzbfGbiXqmYTWHp0G4avWuef6XKMtadXO_KxHiMwbQQeR0Y__J5UcxUq9WdOs3P1R0xszfemw8_6qD1MBq4YawRzdIJ6YIkIcZ6Oi1LsXS1hvEBRUevL7_4GKXuAJXUgDL2voYOMy4g4Yb8sqOi4tsoTrBxzGmkPAH_fR-hB19syBALl5DybYtbW8YnrNDaDjRQHiTgsmgixU4teYPirO7xJ-k88ILkAXv46IhozJGNSGeEXp7C8bIuNSnQBJ2yp4LRhHfXmALNCGWGa5QGmHOLSfuIXf3PvGT7WENc-si4EUKmT4gS6QagrYcAl9m9-pRHKa8c0WCulHYCWQmWnPNDTDBXtokQSKj8OOPeQvwXVvjoKWb0hH_lxKD1ER1sgTQj64wx3YBB8hp5CCzydZ5aM4zbkuhP4JcbCI5QeQ0R4CMLlupwrnbfIDmSD0cSDHgTBk7i4v0lPccxoIYhFMv5rqESc9BfYNDtPfRrOtjhMBCXNVT64Gugx_nRkMZQaF5CxuZ3C6AVu03T0iNW2zcZ_EPnADUK1NO8x5vMIocs2oopFX7Ov1kwNelV9QyTIR6HvXb6CAc8pNOILOtk6ZBvynfTKEvALlKcbzYCZA_5G-DKddJo02y6AYOR1ff-b5lAUTbSvC2tavKE7gE-_nfg7JyBlmmaBLWtv2FfwUgmPjkM-8ccmQOWnosRK7xUKEpjvRobvg1_bD_Bu0