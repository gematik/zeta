>(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="171.7261" y="175.126">POST /token dpop: dpop_proof</text><text fill="#000000" font-family="Helvetica" font-size="10" x="171.7261" y="186.7666">client_assertion (JWT, PrK.Client.Sig signiert), refresh_token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="171.7261" y="198.4072">grant_type=refresh_token,&#160;resource,&#160;scope</text><line style="stroke:#181818;stroke-width:1;" x1="492.0122" x2="534.0122" y1="228.4063" y2="228.4063"/><line style="stroke:#181818;stroke-width:1;" x1="534.0122" x2="534.0122" y1="228.4063" y2="241.4063"/><line style="stroke:#181818;stroke-width:1;" x1="493.0122" x2="534.0122" y1="241.4063" y2="241.4063"/><polygon fill="#181818" points="503.0122,237.4063,493.0122,241.4063,503.0122,245.4063,499.0122,241.4063" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="499.0122" y="224.0479">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="523.5396" y="224.0479">Validate Request (Client Assertion, DPoP Proof, Refresh Token)</text><line style="stroke:#181818;stroke-width:1;" x1="492.0122" x2="534.0122" y1="267.0469" y2="267.0469"/><line style="stroke:#181818;stroke-width:1;" x1="534.0122" x2="534.0122" y1="267.0469" y2="280.0469"/><line style="stroke:#181818;stroke-width:1;" x1="493.0122" x2="534.0122" y1="280.0469" y2="280.0469"/><polygon fill="#181818" points="503.0122,276.0469,493.0122,280.0469,503.0122,284.0469,499.0122,280.0469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="499.0122" y="262.6885">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="523.5396" y="262.6885">Invalidate Refresh token</text><path d="M497.0122,293.0469 L497.0122,337.0469 L889.0122,337.0469 L889.0122,303.0469 L879.0122,293.0469 L497.0122,293.0469" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M879.0122,2