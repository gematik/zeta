5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="80.5723" x="814.6465" y="1006.2656"/><text fill="#000000" font-family="Helvetica" font-size="10" x="845.0522" y="1022.5479">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="821.6465" y="1034.1885">Policy Engine</text><line style="stroke:#181818;stroke-width:1;" x1="67.0967" x2="109.0967" y1="102.2031" y2="102.2031"/><line style="stroke:#181818;stroke-width:1;" x1="109.0967" x2="109.0967" y1="102.2031" y2="115.2031"/><line style="stroke:#181818;stroke-width:1;" x1="68.0967" x2="109.0967" y1="115.2031" y2="115.2031"/><polygon fill="#181818" points="78.0967,111.2031,68.0967,115.2031,78.0967,119.2031,74.0967,115.2031" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="74.0967" y="97.8447">(01)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="97.8447">Create DPoP Proof (without Nonce)</text><line style="stroke:#181818;stroke-width:1;" x1="67.0967" x2="109.0967" y1="140.8438" y2="140.8438"/><line style="stroke:#181818;stroke-width:1;" x1="109.0967" x2="109.0967" y1="140.8438" y2="153.8438"/><line style="stroke:#181818;stroke-width:1;" x1="68.0967" x2="109.0967" y1="153.8438" y2="153.8438"/><polygon fill="#181818" points="78.0967,149.8438,68.0967,153.8438,78.0967,157.8438,74.0967,153.8438" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="74.0967" y="136.4854">(02)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="136.4854">Create Client Assertion JWT (without Attestation)</text><polygon fill="#181818" points="479.5029,198.7656,489.5029,202.7656,479.5029,206.7656,483.5029,202.7656" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="67.0967" x2="485.5029" y1="202.7656" y2="202.7656"/><text fill="#000000" font-family="Helvetica" font-size="10" x="74.0967" y="186.7666">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="175.126">POST /token dpop: dpop_proof</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="186.7666">client_assertion (JWT, PrK.Client.Sig signiert), refresh_token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="98.624" y="198.4072">grant_type=refresh_token,&#160;resource,&#160;scope</text><line style="stroke:#181818;stroke-width:1;" x1="501.5029" x2="543.5029" y1="228.4063" y2="228.4063"/><line style="stroke:#181818;stroke-width:1;" x1="543.5029" x2="543.5029" y1="228.4063" y2="241.4063"/><line style="stroke:#181818;stroke-width:1;" x1="502.5029" x2="543.5029" y1="241.4063" y2="241.4063"/><polygon fill="#181818" points="512.5029,237.4063,502.5029,241.4063,512.5029,245.4063,508.5029,241.4063" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="508.5029" y="224.0479">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="533.0303" y="224.0479">Validate Request (Client Assertion, DPoP Proof, Refresh Token)</text><line style="stroke:#181818;stroke-width:1;" x1="501.5029" x2="543.5029" y1="267.0469" y2="267.0469"/><line style="stroke:#181818;stroke-width:1;" x1="543.5029" x2="543.5029" y1="267.0469" y2="280.0469"/><line style="stroke:#181818;stroke-width:1;" x1="502.5029" x2="543.5029" y1="280.0469" y2="280.0469"/><polygon fill="#181818" points="512.5029,276.0469,502.5029,280.0469,512.5029,284.0469,508.5029,280.0469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="508.5029" y="262.6885">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="533.0303" y="262.6885">Invalidate Refresh token</text><path d="M506.5029,293.0469 L506.5029,337.0469 L898.5029,337.0469 L898.5029,303.0469 L888.5029,293.0469 L506.5029,293.0469" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M888.5029,293.0469 L888.5029,303.0469 L898.5029,303.0469 L888.5029,293.0469" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="512.5029" y="307.3291">Refresh Token Rotation (Einmalnutzung). Die Vorlage eines bereits</text><text fill="#000000" font-family="Helvetica" font-size="10" x="512.5029" y="318.9697">rotierten/invalidierten Refresh Token gilt als Diebstahl-Indikator und</text><text fill="#000000" font-family="Helvetica" font-size="10" x="512.5029" y="330.6104">MUSS die gesamte Token-Familie/Session terminieren (400 invalid_grant).</text><path d="M27.0967,346.9688 L87.0527,346.9688 L87.0527,350.6094 L77.0527,360.6094 L27.0967,360.6094 L27.0967,346.9688" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="498.8906" style="stroke:#000000;stroke-width:1.5;" width="848.8359" x="27.0967" y="346.9688"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="42.0967" y="357.251">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="102.0527" y="358.251">[Validation successful]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="27.0967" x2="875.9326" y1="649.375" y2="649.375"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="32.0967" y="660.6572">[Validation fehlerhaft]</text><line style="stroke:#181818;stroke-width:1;" x1="501.5029" x2="543.5029" y1="388.25" y2="388.25"/><line style="stroke:#181818;stroke-width:1;" x1="543.5029" x2="543.5029" y1="388.25" y2="401.25"/><line style="stroke:#181818;stroke-width:1;" x1="502.5029" x2="543.5029" y1="401.25" y2="401.25"/><polygon fill="#181818" points="512.5029,397.25,502.5029,401.25,512.5029,405.25,508.5029,401.25" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="508.5029" y="383.8916">(06)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="533.0303" y="383.8916">Policy Engine Input erstellen</text><polygon fill="#181818" points="837.9326,422.8906,847.9326,426.8906,837.9326,430.8906,841.9326,426.8906" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="501.5029" x2="843.9326" y1="426.8906" y2="426.8906"/><text fill="#000000" font-family="Helvetica" font-size="10" x="508.5029" y="422.5322">(07)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="533.0303" y="422.5322">POST /v1/data/authz {Policy Engine Input}</text><polygon fill="#181818" points="512.5029,448.5313,502.5029,452.5313,512.5029,456.5313,508.5029,452.5313" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="506.5029" x2="848.9326" y1="452.5313" y2="452.5313"/><text fill="#000000" font-family="Helvetica" font-size="10" x="518.5029" y="448.1729">(08)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="543.0303" y="448.1729">Policy Decision</text><path d="M46.0967,464.5313 L106.0527,464.5313 L106.0527,468.1719 L96.0527,478.1719 L46.0967,478.1719 L46.0967,464.5313" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="159.8438" style="stroke:#000000;stroke-width:1.5;" width="659.0654" x="46.0967" y="464.5313"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="61.0967" y="474.8135">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="121.0527" y="475.8135">[Policy Decision allow]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="46.0967" x2="705.1621" y1="524.8125" y2="524.8125"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="51.0967" y="536.0947">[Policy Decision deny wegen acr oder Alter der Authentisierung (required_acr), Session mit Nutzerauthentisierung]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="46.0967" x2="705.1621" y1="580.0938" y2="580.0938"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="51.0967" y="591.376">[Policy Decision deny]</text><polygon fill="#181818" points="78.0967,501.8125,68.0967,505.8125,78.0967,509.8125,74.0967,505.8125" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="72.0967" x2="490.5029" y1="505.8125" y2="505.8125"/><text fill="#000000" font-family="Helvetica" font-size="10" x="84.0967" y="501.4541">(09)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="108.624" y="501.4541">200 OK {Access Token, Refresh Token}</text><polygon fill="#181818" points="78.0967,557.0938,68.0967,561.0938,78.0967,565.0938,74.0967,561.0938" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="72.0967" x2="490.5029" y1="561.0938" y2="561.0938"/><text fill="#000000" font-family="Helvetica" font-size="10" x="84.0967" y="556.7354">(10)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="108.624" y="556.7354">403 Forbidden {"error": "insufficient_acr", "acr_values": ..., "max_age": ...}</text><polygon fill="#181818" points="78.0967,612.375,68.0967,616.375,78.0967,620.375,74.0967,616.375" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="72.0967" x2="490.5029" y1="616.375" y2="616.375"/><text fill="#000000" font-family="Helvetica" font-size="10" x="84.0967" y="612.0166">(11)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="108.624" y="612.0166">403 Forbidden {"error": "access_denied"}</text><path d="M46.0967,672.0156 L106.0527,672.0156 L106.0527,675.6563 L96.0527,685.6563 L46.0967,685.6563 L46.0967,672.0156" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="159.8438" style="stroke:#000000;stroke-width:1.5;" width="466.4063" x="46.0967" y="672.0156"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="61.0967" y="682.2979">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="121.0527" y="683.2979">[Client-Authentifizierung fehlgeschlagen (Client Assertion)]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="46.0967" x2="512.5029" y1="732.2969" y2="732.2969"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="51.0967" y="743.5791">[DPoP-Proof ung&#252;ltig]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="46.0967" x2="512.5029" y1="787.5781" y2="787.5781"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="51.0967" y="798.8604">[Refresh Token ung&#252;ltig/abgelaufen/wiederverwendet]</text><polygon fill="#181818" points="78.0967,709.2969,68.0967,713.2969,78.0967,717.2969,74.0967,713.2969" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="72.0967" x2="490.5029" y1="713.2969" y2="713.2969"/><text fill="#000000" font-family="Helvetica" font-size="10" x="84.0967" y="708.9385">(12)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="108.624" y="708.9385">401 Unauthorized {"error": "invalid_client"}</text><polygon fill="#181818" points="78.0967,764.5781,68.0967,768.5781,78.0967,772.5781,74.0967,768.5781" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="72.0967" x2="490.5029" y1="768.5781" y2="768.5781"/><text fill="#000000" font-family="Helvetica" font-size="10" x="84.0967" y="764.2197">(13)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="108.624" y="764.2197">400 Bad Request {"error": "invalid_dpop_proof"}</text><polygon fill="#181818" points="78.0967,819.8594,68.0967,823.8594,78.0967,827.8594,74.0967,823.8594" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="72.0967" x2="490.5029" y1="823.8594" y2="823.8594"/><text fill="#000000" font-family="Helvetica" font-size="10" x="84.0967" y="819.501">(14)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="108.624" y="819.501">400 Bad Request {"error": "invalid_grant"}</text><path d="M72.0967,864.8594 L72.0967,990.8594 L686.0967,990.8594 L686.0967,874.8594 L676.0967,864.8594 L72.0967,864.8594" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M676.0967,864.8594 L676.0967,874.8594 L686.0967,874.8594 L676.0967,864.8594" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="78.0967" y="879.1416">Fehlercodes gem&#228;&#223; [RFC6749]#section-5.2 (Refresh Grant &#167;6):</text><text fill="#000000" font-family="Helvetica" font-size="10" x="78.0967" y="890.7822">400 = technischer Grant-/Request-Fehler (invalid_dpop_proof [RFC9449];</text><text fill="#000000" font-family="Helvetica" font-size="10" x="78.0967" y="902.4229">invalid_grant f&#252;r jedes nicht\n  nutzbare Refresh Token: abgelaufen, wiederverwendet, widerrufen, Session terminiert,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="78.0967" y="914.0635">401 = Client-Authentifizierung fehlgeschlagen (invalid_client),</text><text fill="#000000" font-family="Helvetica" font-size="10" x="78.0967" y="925.7041">403 = Policy-Ablehnung bei g&#252;ltigen Credentials (access_denied;</text><text fill="#000000" font-family="Helvetica" font-size="10" x="78.0967" y="937.3447">insufficient_acr bei zu niedrigem acr oder zu alter</text><text fill="#000000" font-family="Helvetica" font-size="10" x="78.0967" y="948.9854">Authentisierung in Sessions mit</text><text fill="#000000" font-family="Helvetica" font-size="10" x="78.0967" y="960.626">Nutzerauthentisierung, T15).</text><text fill="#000000" font-family="Helvetica" font-size="10" x="78.0967" y="972.2666">Zuordnung je Fehlerfall: Tab-ZETA-PDP-Fehlerf&#228;lle-Token-Endpunk