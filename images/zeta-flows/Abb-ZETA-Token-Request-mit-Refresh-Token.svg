="Helvetica" font-size="10" x="762.9316" y="383.8916">Policy Engine Input erstellen</text><polygon fill="#181818" points="1067.834,422.8906,1077.834,426.8906,1067.834,430.8906,1071.834,426.8906" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="731.4043" x2="1073.834" y1="426.8906" y2="426.8906"/><text fill="#000000" font-family="Helvetica" font-size="10" x="738.4043" y="422.5322">(07)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="762.9316" y="422.5322">POST /v1/data/authz {Policy Engine Input}</text><polygon fill="#181818" points="742.4043,448.5313,732.4043,452.5313,742.4043,456.5313,738.4043,452.5313" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="736.4043" x2="1078.834" y1="452.5313" y2="452.5313"/><text fill="#000000" font-family="Helvetica" font-size="10" x="748.4043" y="448.1729">(08)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="772.9316" y="448.1729">Policy Decision</text><path d="M358.5908,464.5313 L418.5469,464.5313 L418.5469,468.1719 L408.5469,478.1719 L358.5908,478.1719 L358.5908,464.5313" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="104.5625" style="stroke:#000000;stroke-width:1.5;" width="383.8135" x="358.5908" y="464.5313"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="373.5908" y="474.8135">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="433.5469" y="475.8135">[Policy Decision allow]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="358.5908" x2="742.4043" y1="524.8125" y2="524.8125"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="363.5908" y="536.0947">[Policy Decision deny]</text><polygon fill="#181818" points="390.5908,501.8125,380.5908,505.8125,390.5908,509.8125,386.5908,505.8125" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="384.5908" x2="720.4043" y1="505.8125" y2="505.8125"/><text fill="#000000" font-family="Helvetica" font-size="10" x="396.5908" y="501.4541">(09)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="421.1182" y="501.4541">200 OK {Access Token, Refresh Token}</text><polygon fill="#181818" points="390.5908,557.0938,380.5908,561.0938,390.5908,565.0938,386.5908,561.0938" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="384.5908" x2="720.4043" y1="561.0938" y2="561.0938"/><text fill="#000000" font-family="Helvetica" font-size="10" x="396.5908" y="556.7354">(10)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="421.1182" y="556.7354">403 Forbidden {"error": "access_denied"}</text><path d="M358.5908,616.7344 L418.5469,616.7344 L418.5469,620.375 L408.5469,630.375 L358.5908,630.375 L358.5908,616.7344" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="159.8438" style="stroke:#000000;stroke-width:1.5;" width="427.9971" x="358.5908" y="616.7344"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="373.5908" y="627.0166">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="433.5469" y="628.0166">[Client-Authentifizierung fehlgeschlagen (Client Assertion)]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="358.5908" x2="786.5879" y1="677.0156" y2="677.0156"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="363.5908" y="688.2979">[DPoP-Proof ung&#252;ltig]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="358.5908" x2="786.5879" y1="732.2969" y2="732.2969"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="363.5908" y="743.5791">[Refresh Token ung&#252;ltig/abgelaufen/wiederverwendet]</t