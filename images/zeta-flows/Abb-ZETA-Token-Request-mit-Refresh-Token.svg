1="145.1987" x2="481.0122" y1="207.7656" y2="207.7656"/><text fill="#000000" font-family="Helvetica" font-size="10" x="152.1987" y="191.7666">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="176.7261" y="180.126">POST /token dpop: dpop_proof</text><text fill="#000000" font-family="Helvetica" font-size="10" x="176.7261" y="191.7666">client_assertion (JWT, PrK.Client.Sig signiert), refresh_token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="176.7261" y="203.4072">grant_type=refresh_token,&#160;resource,&#160;scope</text><line style="stroke:#181818;stroke-width:1;" x1="497.0122" x2="539.0122" y1="233.4063" y2="233.4063"/><line style="stroke:#181818;stroke-width:1;" x1="539.0122" x2="539.0122" y1="233.4063" y2="246.4063"/><line style="stroke:#181818;stroke-width:1;" x1="498.0122" x2="539.0122" y1="246.4063" y2="246.4063"/><polygon fill="#181818" points="508.0122,242.4063,498.0122,246.4063,508.0122,250.4063,504.0122,246.4063" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="504.0122" y="229.0479">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="528.5396" y="229.0479">Validate Request (Client Assertion, DPoP Proof, Refresh Token)</text><line style="stroke:#181818;stroke-width:1;" x1="497.0122" x2="539.0122" y1="272.0469" y2="272.0469"/><line style="stroke:#181818;stroke-width:1;" x1="539.0122" x2="539.0122" y1="272.0469" y2="285.0469"/><line style="stroke:#181818;stroke-width:1;" x1="498.0122" x2="539.0122" y1="285.0469" y2="285.0469"/><polygon fill="#181818" points="508.0122,281.0469,498.0122,285.0469,508.0122,289.0469,504.0122,285.0469" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="504.0122" y="267.6885">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="528.5396" y="267.6885">Invalidate Refresh token</text><path d="M502.0122,298.0469 L502.0122,342.0469 L894.0122,342.0469 L894.0122,308.0469 L884.0122,298.0469 L502.0122,298.0469" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M884.0122,298.0469 L884.0122,308.0469 L894.0122,308.0469 L884.0122,298.0469" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="508.0122" y="312.3291">Refresh Token Rotation (Einmalnutzung). Die Vorlage eines bereits</text><text fill="#000000" font-family="Helvetica" font-size="10" x="508.0122" y="323.9697">rotierten/invalidierten Refresh Token gilt als Diebstahl-Indikator und</text><text fill="#000000" font-family="Helvetica" font-size="10" x="508.0122" y="335.6104">MUSS die gesamte Token-Familie/Session terminieren (400 invalid_grant).</text><path d="M105.1987,351.9688 L165.1548,351.9688 L165.1548,355.6094 L155.1548,365.6094 L105.1987,365.6094 L105.1987,351.9688" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="443.6094" style="stroke:#000000;stroke-width:1.5;" width="766.2432" x="105.1987" y="351.9688"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="120.1987" y="362.251">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="180.1548" y="363.251">[Validation successful]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="105.1987" x2="871.4419" y1="599.0938" y2="599.0938"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="110.1987" y="610.376">[Validation fehlerhaft]</text><line style="stroke:#181818;stroke-width:1;" x1="497.0122" x2="539.0122" y1="393.25" y2="393.25"/><line style="stroke:#181818;stroke-width:1;" x1="539.0122" x2="539.0122" y1="393.25" y2="406.25"/><line style="stroke:#181818;stroke-width:1;" x1="498.0122" x2="539.0122" y1="406.25" y2="406.25"/><polygon fill="#181818" points="508.0122,402.25,498.0122,406.25,508