818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="72.0967" x2="407.9102" y1="658.0156" y2="658.0156"/><text fill="#000000" font-family="Helvetica" font-size="10" x="84.0967" y="653.6572">(11)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="108.624" y="653.6572">401 Unauthorized {"error": "invalid_client"}</text><polygon fill="#181818" points="78.0967,709.2969,68.0967,713.2969,78.0967,717.2969,74.0967,713.2969" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="72.0967" x2="407.9102" y1="713.2969" y2="713.2969"/><text fill="#000000" font-family="Helvetica" font-size="10" x="84.0967" y="708.9385">(12)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="108.624" y="708.9385">400 Bad Request {"error": "invalid_dpop_proof"}</text><polygon fill="#181818" points="78.0967,764.5781,68.0967,768.5781,78.0967,772.5781,74.0967,768.5781" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="72.0967" x2="407.9102" y1="768.5781" y2="768.5781"/><text fill="#000000" font-family="Helvetica" font-size="10" x="84.0967" y="764.2197">(13)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="108.624" y="764.2197">400 Bad Request {"error": "invalid_grant"}</text><path d="M72.0967,809.5781 L72.0967,900.5781 L686.0967,900.5781 L686.0967,819.5781 L676.0967,809.5781 L72.0967,809.5781" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M676.0967,809.5781 L676.0967,819.5781 L686.0967,819.5781 L676.0967,809.5781" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="78.0967" y="823.8604">Fehlercodes gem&#228;&#223; [RFC6749]#section-5.2 (Refresh Grant &#167;6):</text><text fill="#000000" font-family="Helvetica" font-size="10" x="78.0967" y="835.501">400 = technischer Grant-/Request-Fehler (invalid_dpop_proof [RFC9449];</text><text fill="#000000" font-family="Helvetica" font-size="10" x="78.0967" y="847.1416">invalid_grant f&#252;r jedes nicht\n  nutzbare Refresh Token: abgelaufen, wiederverwendet, widerrufen, Session terminiert,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="78.0967" y="858.7822">401 = Client-Authentifizierung fehlgeschlagen (invalid_client),</text><text fill="#000000" font-family="Helvetica" font-size="10" x="78.0967" y="870.4229">403 = Policy-Ablehnung bei g&#252;ltigen Credentials (access_denied).</text><text fill="#000000" font-family="Helvetica" font-size="10" x="78.0967" y="882.0635">Zuordnung je Fehlerfall: Tab-ZETA-PDP-Fehlerfaelle-Token-Endpunkt.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="78.0967" y="893.7041">Response-Body gem&#228;&#223; [zeta-error.yaml].</text><!--SRC=[ZLLVSzf647_NfzYe3uKn4hRZfXEQU8OOxA6f2mFOdQREC8UqY8l5dN8wsG5FFalxq9b-YJp5Nwnx9maGjZDvGToV_UtkRt-xzuoB8Cv21Dzl9jaYzcAsb9dszIVjECwFeBcE4SRo6WKCyME6gOPRhkUqc2bCv_cHupnB58iM33JA5MYLeUDCvITmEtZ30tIXqxtidNGd9_tV-aC7m9uD55_S_wlIPQfnuS9Ws3jlTuUZFqVZxldw9a32bEO1JvZGS19pf0zBmNtN7RUBjGklNgrGi-DZCa0H6dYd_EPnjCMKeqO5unuS-llG8RjK6wVzorwdEwn6Ph7FCgP25yp_oTb5UzXv8gPsfkSZ6zAWCxWIPYaLNp7DfO0HgXjKbG2hrlr1UsCxa34Fbj0L4HVuxQpopFVsod_W7PVijE148TC8dO4Sm419EOEQAHeL5dwN8i3wDuoATJjDKTaKVlrZl35lQqqIiBbjWrWEzlPQCEYFnj3KLYzX8fEM_Pqa9eWhafencB0rTet06nJYMp_7yaSyWfH7WjE5UWDKhhA91RmIaIBA9dgPuElAIUFhFxIGcGgG_gQ1JD39orB6HlbTifY79iDInxNTL1jRZ3Mg2g_luBMW9susWFbD6uiZ96qf7iqr4F7sDXMmWWP3cNC8jIuN2nQBJAyo4TLz8qoub2fc4GAI2bAOeaAkKy9GKXjUK3HvxZnVxM17FAOEYLC3DQLQpMEl9q9-pRHKa8cGWCulHYCWQuWmPGjTDBXtoXQSA6cEC4rDSDGl2svAGQYre_rzADnER1tglbMZITTXvBBWrnYcMH0GnYoBoTakSHMH4uq9oGeLpO0u9lQsxbDhR2HrSz0aSDPaTBg2kqT0FfEjwIQlTELvQsST3BX9YQwOK7TsQI-MjxOr2-VhlcZ18UNTVmjtRPjIpjIEE8ndZ5DyW1kYM3u1UxJ_74wbclAGBi6TYqf9vRR0PTRFX7OvXkxdelSfQiUws69vXlCOrPpDT95MZkqPP_JbCxwYsf6ix4qgTJ0tiX8FXLz_CiW3k12ic6WORiTPQY7lQNVDWMaXBnywvFh-Iwnvz2JyFhnXuReX7q7VJ8-DXwhSrqwQR1fXpB8PzSSjSMSdxosHX_fH_qOU