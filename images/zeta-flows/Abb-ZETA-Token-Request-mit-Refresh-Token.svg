" y="186.7666">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="411.1182" y="175.126">POST /token dpop: dpop_proof</text><text fill="#000000" font-family="Helvetica" font-size="10" x="411.1182" y="186.7666">client_assertion (JWT, PrK.Client.Sig signiert), refresh_token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="411.1182" y="198.4072">grant_type=refresh_token,&#160;resource,&#160;scope</text><line style="stroke:#181818;stroke-width:1;" x1="731.4043" x2="773.4043" y1="228.4063" y2="228.4063"/><line style="stroke:#181818;stroke-width:1;" x1="773.4043" x2="773.4043" y1="228.4063" y2="241.4063"/><line style="stroke:#181818;stroke-width:1;" x1="732.4043" x2="773.4043" y1="241.4063" y2="241.4063"/><polygon fill="#181818" points="742.4043,237.4063,732.4043,241.4063,742.4043,245.4063,738.4043,241.4063" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="738.4043" y="224.0479">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="762.9316" y="224.0479">Validate Request (Client Assertion, DPoP Proof, Refresh Token)</text><line style="stroke:#181818;stroke-width:1;" x1="731.4043" x2="773.4043" y1="267.0469" y2="267.0469"/><line style="stroke:#181818;stroke-width:1;" x1="773.4043" x2="773.4043" y1="267.0469" y2="280.0469"/><line style="stroke:#181818;stroke-width:1;" x1="732.4043" x2="773.4043" y1="280.0469" y2="280.0469"/><polygon fill="#181818" points="742.4043,276.0469,732.4043,280.0469,742.4043,284.0469,738.4043,280.0469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="738.4043" y="262.6885">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="762.9316" y="262.6885">Invalidate Refresh token</text><path d="M736.4043,293.0469 L736.4043,337.0469 L1128.4043,337.0469 L1128.4043,303.0469 L1118.4043,293.0469 L736.4043,293.0469" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><pa