ica" font-size="10" x="94.3613" y="367.9932">(07)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="118.8887" y="362.1729">Signiere clientDataHash</text><text fill="#000000" font-family="Helvetica" font-size="10" x="118.8887" y="373.8135">mit PrK.AK.Sig</text><polygon fill="#181818" points="234.6113,399.8125,244.6113,403.8125,234.6113,407.8125,238.6113,403.8125" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="77.3613" x2="240.6113" y1="403.8125" y2="403.8125"/><text fill="#000000" font-family="Helvetica" font-size="10" x="84.3613" y="399.4541">(08)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="108.8887" y="399.4541">ECDSA Signatur</text><polygon fill="#181818" points="562.1963,425.4531,572.1963,429.4531,562.1963,433.4531,566.1963,429.4531" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="256.6113" x2="568.1963" y1="429.4531" y2="429.4531"/><text fill="#000000" font-family="Helvetica" font-size="10" x="263.6113" y="425.0947">(09)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="288.1387" y="425.0947">signed_client_data_hash</text><path d="M123.2744,442.4531 L123.2744,510.4531 L573.2744,510.4531 L573.2744,452.4531 L563.2744,442.4531 L123.2744,442.4531" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M563.2744,442.4531 L563.2744,452.4531 L573.2744,452.4531 L563.2744,442.4531" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="129.2744" y="456.7354">android_key_attestation_certificate_chain wurde beim DCR &#252;bermittelt; kein erneutes</text><text fill="#000000" font-family="Helvetica" font-size="10" x="129.2744" y="468.376">Erzeugen eines Schl&#252;sselpaars. AuthS hat dort verifiziert: attestationChallenge im</text><text fill="#000000" font-family="Helvetica" font-size="10" x="129.2744" y="480.0166">Blatt-Zertifikat == SHA-256(PuK.Client.Sig) und PuK.AK.Sig als ak_jkt gepinnt.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="129.2744" y="491.6572">Zur Laufzeit pr&#252;ft der AuthS signed_client_data_hash gegen den gepinnten AK</text><text fill="#000000" font-family="Helvetica" font-size="10" x="129.2744" y="503.2979">und rechnet clientDataHash selbst nach (Details: posture-android.yaml).</text><path d="M235.6113,519.6563 L299.4199,519.6563 L299.4199,523.2969 L289.4199,533.2969 L235.6113,533.2969 L235.6113,519.6563" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="98.2031" style="stroke:#000000;stroke-width:1.5;" width="359.585" x="235.6113" y="519.6563"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="250.6113" y="529.9385">opt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="314.4199" y="530.9385">[Play Integrity API (erg&#228;nzend)]</text><polygon fill="#181818" points="267.6113,568.5781,257.6113,572.5781,267.6113,576.5781,263.6113,572.5781" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="261.6113" x2="573.1963" y1="572.5781" y2="572.5781"/><text fill="#000000" font-family="Helvetica" font-size="10" x="273.6113" y="562.3994">(10)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="298.1387" y="556.5791">IntegrityTokenProvider.request(</text><text fill="#000000" font-family="Helvetica" font-size="10" x="298.1387" y="568.2197">requestHash = Base64url(clientDataHash))</text><polygon fill="#181818" points="562.1963,605.8594,572.1963,609.8594,562.1963,613.8594,566.1963,609.8594" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="256.6113" x2="568.1963" y1="609.8594" y2="609.8594"/><text fill="#000000" font-family="Helvetica" font-size="10" x="263.6113" y="599.6807">(11)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="288.1387" y="593.8604">integrityToken</text><text fill="#000000" font-family="Helvetica" font-size="10" x="288.1387" y="605.501">(JWS: deviceIntegrity + appIntegrity + accountDetails)</text><line style="stroke:#181818;stroke-width:1;" x1="584.1963" x2="626.1963" y1="672.7813" y2="672.7813"/><line style="stroke:#181818;stroke-width:1;" x1="626.1963" x2="626.1963" y1="672.7813" y2="685.7813"/><line style="stroke:#181818;stroke-width:1;" x1="585.1963" x2="626.1963" y1="685.7813" y2="685.7813"/><polygon fill="#181818" points="595.1963,681.7813,585.1963,685.7813,595.1963,689.7813,591.1963,685.7813" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="591.1963" y="656.7822">(12)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="615.7236" y="645.1416">Generiere client_statement</text><text fill="#000000" font-family="Helvetica" font-size="10" x="615.7236" y="656.7822">(posture = Posture-Daten im Klartext + nonce</text><text fill="#000000" font-family="Helvetica" font-size="10" x="615.7236" y="668.4229">+ signed_client_data_hash + [play_integrity_token])</text><line style="stroke:#181818;stroke-width:1;" x1="584.1963" x2="626.1963" y1="752.7031" y2="752.7031"/><line style="stroke:#181818;stroke-width:1;" x1="626.1963" x2="626.1963" y1="752.7031" y2="765.7031"/><line style="stroke:#181818;stroke-width:1;" x1="585.1963" x2="626.1963" y1="765.7031" y2="765.7031"/><polygon fill="#181818" points="595.1963,761.7031,585.1963,765.7031,595.1963,769.7031,591.1963,765.7031" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="591.1963" y="742.5244">(13)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="615.7236" y="736.7041">Generiere client_statement</text><text fill="#000000" font-family="Helvetica" font-size="10" x="615.7236" y="748.3447">(OS und PS Daten ungesichert)</text><!--SRC=[bLN1RkCs4BthAsPzac1RAHRj7j9D0CLI4w-JM