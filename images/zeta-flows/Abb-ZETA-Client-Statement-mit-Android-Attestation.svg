6">Blatt-Zertifikat == SHA-256(PuK.Client.Sig) und PuK.AK.Sig als ak_jkt gepinnt.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="129.2744" y="491.6572">Zur Laufzeit pr&#252;ft der AuthS signed_client_data_hash gegen den gepinnten AK</text><text fill="#000000" font-family="Helvetica" font-size="10" x="129.2744" y="503.2979">und rechnet clientDataHash selbst nach (Details: posture-android.yaml).</text><path d="M235.6113,519.6563 L299.4199,519.6563 L299.4199,523.2969 L289.4199,533.2969 L235.6113,533.2969 L235.6113,519.6563" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="98.2031" style="stroke:#000000;stroke-width:1.5;" width="359.585" x="235.6113" y="519.6563"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="250.6113" y="529.9385">opt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="bold" x="314.4199" y="530.9385">[Play Integrity API (erg&#228;nzend)]</text><polygon fill="#181818" points="267.6113,568.5781,257.6113,572.5781,267.6113,576.5781,263.6113,572.5781" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="261.6113" x2="573.1963" y1="572.5781" y2="572.5781"/><text fill="#000000" font-family="Helvetica" font-size="10" x="273.6113" y="562.3994">(10)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="298.1387" y="556.5791">IntegrityTokenProvider.request(</text><text fill="#000000" font-family="Helvetica" font-size="10" x="298.1387" y="568.2197">requestHash = Base64url(clientDataHash))</text><polygon fill="#181818" points="562.1963,605.8594,572.1963,609.8594,562.1963,613.8594,566.1963,609.8594" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="256.6113" x2="568.1963" y1="609.8594" y2="609.8594"/><text fill="#000000" font-family="Helvetica" font-size="10" x="263.6113" y="599.6807">(11)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="288.1387" y="593.8604">integrityToken</text><text fill="#000000" font-family="Helvetica" font-size="10" x="288.1387" y="605.501">(JWS: deviceIntegrity + appIntegrity + accountDetails)</text><line style="stroke:#181818;stroke-width:1;" x1="584.1963" x2="626.1963" y1="672.7813" y2="672.7813"/><line style="stroke:#181818;stroke-width:1;" x1="626.1963" x2="626.1963" y1="672.7813" y2="685.7813"/><line style="stroke:#181818;stroke-width:1;" x1="585.1963" x2="626.1963" y1="685.7813" y2="685.7813"/><polygon fill="#181818" points="595.1963,681.7813,585.1963,685.7813,595.1963,689.7813,591.1963,685.7813" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="591.1963" y="656.7822">(12)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="615.7236" y="645.1416">Generiere client_statement</text><text fill="#000000" font-family="Helvetica" font-size="10" x="615.7236" y="656.7822">(posture = Posture-Daten im Klartext + nonce</text><text fill="#000000" font-family="Helvetica" font-size="10" x="615.7236" y="668.4229">+ signed_client_data_hash + [play_integrity_token])</text><line style="stroke:#181818;stroke-width:1;" x1="584.1963" x2="626.1963" y1="752.7031" y2="752.7031"/><line style="stroke:#181818;stroke-width:1;" x1="626.1963" x2="626.1963" y1="752.7031" y2="765.7031"/><line style="stroke:#181818;stroke-width:1;" x1="585.1963" x2="626.1963" y1="765.7031" y2="765.7031"/><polygon fill="#181818" points="595.1963,761.7031,585.1963,765.7031,595.1963,769.7031,591.1963,765.7031" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="591.1963" y="742.5244">(13)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="615.7236" y="736.7041">Generiere client_statement</text><text fill="#000000" font-family="Helvetica" font-size="10" x="615.7236" y="748.3447">(OS und PS Daten ungesichert)</text><!--SRC=[bLNHSk8s57ttLzpboHx0wUoq-v1kCkE0cx0amODfEa