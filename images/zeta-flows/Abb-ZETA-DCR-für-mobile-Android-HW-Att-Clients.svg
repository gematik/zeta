<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="1026px" preserveAspectRatio="none" style="width:1135px;height:1026px;background:#FFFFFF;" version="1.1" viewBox="0 0 1135 1026" width="1135px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><rect fill="#FEFCFF" height="1000.5469" style="stroke:#181818;stroke-width:0.5;" width="109.625" x="252.5859" y="11"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="264.5859" y="20.2822">Android Device</text><rect fill="#E6E6FA" height="983.9063" style="stroke:#181818;stroke-width:0.5;" width="109.625" x="252.5859" y="27.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="296.3706" y="36.9229">App</text><rect fill="#EDFDEC" height="1000.5469" style="stroke:#181818;stroke-width:0.5;" width="147.7842" x="564.9585" y="11"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="576.9585" y="20.2822">Anbieter TI 2.0 Dienst</text><rect fill="#FFF3E5" height="983.9063" style="stroke:#181818;stroke-width:0.5;" width="147.7842" x="564.9585" y="27.6406"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="605.7061" y="36.9229">ZETA Guard</text><g><title>ZETA Client</title><rect fill="#000000" fill-opacity="0.00000" height="885.7031" width="8" x="303.8984" y="81.5625"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5,5;" x1="307.3984" x2="307.3984" y1="81.5625" y2="967.2656"/></g><g><title/><rect fill="#FFFFFF" height="877.7031" style="stroke:#181818;stroke-width:1;" width="10" x="302.3984" y="89.5625"/></g><g><title>PDP</title><rect fill="#000000" fill-opacity="0.00000" height="885.7031" width="8" x="635.3506" y="81.5625"/><line style="stroke:#000000;stroke-width:0.5;stroke-dasharray:5,5;" x1="638.8506" x2="638.8506" y1="81.5625" y2="967.2656"/></g><g><title/><rect fill="#FFFFFF" height="455.5313" style="stroke:#181818;stroke-width:1;" width="10" x="633.8506" y="181.4063"/></g><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="271.2749" y="54.9219"/><text fill="#000000" font-family="Helvetica" font-size="10" x="278.2749" y="71.2041">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="580.376" y="43.2813"/><text fill="#000000" font-family="Helvetica" font-size="10" x="628.9702" y="59.5635">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="587.376" y="71.2041">Authorization Server</text><rect fill="#FFE6CC" height="25.6406" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="72.2471" x="271.2749" y="967.2656"/><text fill="#000000" font-family="Helvetica" font-size="10" x="278.2749" y="983.5479">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="580.376" y="967.2656"/><text fill="#000000" font-family="Helvetica" font-size="10" x="628.9702" y="983.5479">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="587.376" y="995.1885">Authorization Server</text><path d="M291.3984,93.5625 L351.3545,93.5625 L351.3545,97.2031 L341.3545,107.2031 L291.3984,107.2031 L291.3984,93.5625" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="794.7813" style="stroke:#000000;stroke-width:1.5;" width="824.0029" x="291.3984" y="93.5625"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="306.3984" y="103.8447">alt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="366.3545" y="104.8447">[Kein ZETA Attestation Token vorhanden]</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="291.3984" x2="1115.4014" y1="655.9375" y2="655.9375"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="296.3984" y="667.2197">[ZETA Attestation Token vorhanden (Fast-Path)]</text><polygon fill="#181818" points="621.8506,177.4063,631.8506,181.4063,621.8506,185.4063,625.8506,181.4063" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="312.3984" x2="627.8506" y1="181.4063" y2="181.4063"/><text fill="#000000" font-family="Helvetica" font-size="10" x="319.3984" y="153.7666">(01)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="343.9258" y="130.4854">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="343.9258" y="142.126">{attestation_type="android", PuK.AK.Sig,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="343.9258" y="153.7666">Android_Key_Attestation_Certificate_Chain,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="343.9258" y="165.4072">PuK.Client.Sig, signed_Hash_PuK.Client.Sig,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="343.9258" y="177.0479">play_integrity_token, redirect_uris}</text><line style="stroke:#181818;stroke-width:1;" x1="643.8506" x2="685.8506" y1="207.0469" y2="207.0469"/><line style="stroke:#181818;stroke-width:1;" x1="685.8506" x2="685.8506" y1="207.0469" y2="220.0469"/><line style="stroke:#181818;stroke-width:1;" x1="644.8506" x2="685.8506" y1="220.0469" y2="220.0469"/><polygon fill="#181818" points="654.8506,216.0469,644.8506,220.0469,654.8506,224.0469,650.8506,220.0469" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="650.8506" y="202.6885">(02)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="675.3779" y="202.6885">Validiere Zertifikatskette gegen Google Root CA</text><line style="stroke:#181818;stroke-width:1;" x1="643.8506" x2="685.8506" y1="245.6875" y2="245.6875"/><line style="stroke:#181818;stroke-width:1;" x1="685.8506" x2="685.8506" y1="245.6875" y2="258.6875"/><line style="stroke:#181818;stroke-width:1;" x1="644.8506" x2="685.8506" y1="258.6875" y2="258.6875"/><polygon fill="#181818" points="654.8506,254.6875,644.8506,258.6875,654.8506,262.6875,650.8506,258.6875" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="650.8506" y="241.3291">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="675.3779" y="241.3291">Pr&#252;fe signed_Hash_PuK.Client.Sig</text><path d="M622.8506,270.6875 L686.6592,270.6875 L686.6592,274.3281 L676.6592,284.3281 L622.8506,284.3281 L622.8506,270.6875" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="139.5625" style="stroke:#000000;stroke-width:1.5;" width="405.3906" x="622.8506" y="270.6875"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="637.8506" y="280.9697">opt</text><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="701.6592" y="281.9697">[Play Integrity Pr&#252;fung]</text><line style="stroke:#181818;stroke-width:1;" x1="643.8506" x2="685.8506" y1="311.9688" y2="311.9688"/><line style="stroke:#181818;stroke-width:1;" x1="685.8506" x2="685.8506" y1="311.9688" y2="324.9688"/><line style="stroke:#181818;stroke-width:1;" x1="644.8506" x2="685.8506" y1="324.9688" y2="324.9688"/><polygon fill="#181818" points="654.8506,320.9688,644.8506,324.9688,654.8506,328.9688,650.8506,324.9688" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="650.8506" y="307.6104">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="675.3779" y="307.6104">Entschl&#252;ssele play_integrity_token (lokal/remote)</text><line style="stroke:#181818;stroke-width:1;" x1="643.8506" x2="685.8506" y1="350.6094" y2="350.6094"/><line style="stroke:#181818;stroke-width:1;" x1="685.8506" x2="685.8506" y1="350.6094" y2="363.6094"/><line style="stroke:#181818;stroke-width:1;" x1="644.8506" x2="685.8506" y1="363.6094" y2="363.6094"/><polygon fill="#181818" points="654.8506,359.6094,644.8506,363.6094,654.8506,367.6094,650.8506,363.6094" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="650.8506" y="346.251">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="675.3779" y="346.251">Verifiziere Nonce (Muss Hash(PuK.Client.Sig) entsprechen)</text><line style="stroke:#181818;stroke-width:1;" x1="643.8506" x2="685.8506" y1="389.25" y2="389.25"/><line style="stroke:#181818;stroke-width:1;" x1="685.8506" x2="685.8506" y1="389.25" y2="402.25"/><line style="stroke:#181818;stroke-width:1;" x1="644.8506" x2="685.8506" y1="402.25" y2="402.25"/><polygon fill="#181818" points="654.8506,398.25,644.8506,402.25,654.8506,406.25,650.8506,402.25" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="650.8506" y="384.8916">(06)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="675.3779" y="384.8916">Werte Verdicts aus (appIntegrity, deviceIntegrity, accountDetails)</text><path d="M648.8506,429.25 L648.8506,462.25 L1069.8506,462.25 L1069.8506,439.25 L1059.8506,429.25 L648.8506,429.25" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1059.8506,429.25 L1059.8506,439.25 L1069.8506,439.25 L1059.8506,429.25" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="654.8506" y="443.5322">PuK.AK.Sig muss mit dem Blatt-Zertifikat der Certificate Chain &#252;bereinstimmen.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="654.8506" y="455.1729">Sicherheitsniveau: TrustedEnvironment oder StrongBox.</text><path d="M648.8506,472.5313 L648.8506,575.5313 L1093.8506,575.5313 L1093.8506,482.5313 L1083.8506,472.5313 L648.8506,472.5313" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1083.8506,472.5313 L1083.8506,482.5313 L1093.8506,482.5313 L1083.8506,472.5313" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="654.8506" y="486.8135">Es werden zwei redirect_uris je App registriert (RFC 8252, claimed-HTTPS</text><text fill="#000000" font-family="Helvetica" font-size="10" x="654.8506" y="498.4541">Universal-/App-Links auf einer vom App-Hersteller kontrollierten Domain):</text><text fill="#000000" font-family="Helvetica" font-size="10" x="654.8506" y="510.0947">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/oidc = oidc_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="661.208" y="521.7354">(SekIDP Auth Code Flow, redirection_endpoint des AuthS, nicht /token)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="654.8506" y="533.376">- https://&lt;App-FQDN&gt;/cb/&lt;app&gt;/app = app_redirect_uri</text><text fill="#000000" font-family="Helvetica" font-size="10" x="661.208" y="545.0166">(ZETA Guard Auth Code Flow, /token-Endpunkt des AuthS)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="654.8506" y="556.6572">Beide Callbacks enden &#252;ber denselben App-Link/Universal-Link in der App.</text><text fill="#000000" font-family="Helvetica" font-size="10" x="654.8506" y="568.2979">Der ZETA Client unterscheidet den zu nutzenden AuthS-Endpunkt anhand des Pfads.</text><line style="stroke:#181818;stroke-width:1;" x1="643.8506" x2="685.8506" y1="598.2969" y2="598.2969"/><line style="stroke:#181818;stroke-width:1;" x1="685.8506" x2="685.8506" y1="598.2969" y2="611.2969"/><line style="stroke:#181818;stroke-width:1;" x1="644.8506" x2="685.8506" y1="611.2969" y2="611.2969"/><polygon fill="#181818" points="654.8506,607.2969,644.8506,611.2969,654.8506,615.2969,650.8506,611.2969" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="650.8506" y="593.9385">(07)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="675.3779" y="593.9385">Store Client (state: pending_user_binding)</text><polygon fill="#181818" points="323.3984,632.9375,313.3984,636.9375,323.3984,640.9375,319.3984,636.9375" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="317.3984" x2="632.8506" y1="636.9375" y2="636.9375"/><text fill="#000000" font-family="Helvetica" font-size="10" x="329.3984" y="632.5791">(08)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="353.9258" y="632.5791">201 Created {client_id, status: pending_user_binding}</text><polygon fill="#181818" points="626.8506,723.1406,636.8506,727.1406,626.8506,731.1406,630.8506,727.1406" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="312.3984" x2="632.8506" y1="727.1406" y2="727.1406"/><text fill="#000000" font-family="Helvetica" font-size="10" x="319.3984" y="705.3213">(09)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="343.9258" y="687.8604">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="343.9258" y="699.501">{attestation_type="zeta_attestation_token",</text><text fill="#000000" font-family="Helvetica" font-size="10" x="343.9258" y="711.1416">zeta_attestation_token, PuK.Client.Sig,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="343.9258" y="722.7822">Besitznachweis (Signatur/Assertion)}</text><line style="stroke:#181818;stroke-width:1;" x1="638.8506" x2="680.8506" y1="752.7813" y2="752.7813"/><line style="stroke:#181818;stroke-width:1;" x1="680.8506" x2="680.8506" y1="752.7813" y2="765.7813"/><line style="stroke:#181818;stroke-width:1;" x1="639.8506" x2="680.8506" y1="765.7813" y2="765.7813"/><polygon fill="#181818" points="649.8506,761.7813,639.8506,765.7813,649.8506,769.7813,645.8506,765.7813" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="645.8506" y="748.4229">(10)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="670.3779" y="748.4229">Pr&#252;fe Token-Signatur &amp; Vertrauensstellung</text><line style="stroke:#181818;stroke-width:1;" x1="638.8506" x2="680.8506" y1="791.4219" y2="791.4219"/><line style="stroke:#181818;stroke-width:1;" x1="680.8506" x2="680.8506" y1="791.4219" y2="804.4219"/><line style="stroke:#181818;stroke-width:1;" x1="639.8506" x2="680.8506" y1="804.4219" y2="804.4219"/><polygon fill="#181818" points="649.8506,800.4219,639.8506,804.4219,649.8506,808.4219,645.8506,804.4219" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="645.8506" y="787.0635">(11)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="670.3779" y="787.0635">Extrahiere PuK.AK.Sig aus Token, verifiziere Besitznachweis</text><line style="stroke:#181818;stroke-width:1;" x1="638.8506" x2="680.8506" y1="841.7031" y2="841.7031"/><line style="stroke:#181818;stroke-width:1;" x1="680.8506" x2="680.8506" y1="841.7031" y2="854.7031"/><line style="stroke:#181818;stroke-width:1;" x1="639.8506" x2="680.8506" y1="854.7031" y2="854.7031"/><polygon fill="#181818" points="649.8506,850.7031,639.8506,854.7031,649.8506,858.7031,645.8506,854.7031" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="645.8506" y="831.5244">(12)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="670.3779" y="825.7041">&#220;bernimm registrierte redirect_uris aus dem Token</text><text fill="#000000" font-family="Helvetica" font-size="10" x="670.3779" y="837.3447">(kein erneutes Senden im Fast-Path)</text><polygon fill="#181818" points="323.3984,876.3438,313.3984,880.3438,323.3984,884.3438,319.3984,880.3438" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="317.3984" x2="637.8506" y1="880.3438" y2="880.3438"/><text fill="#000000" font-family="Helvetica" font-size="10" x="329.3984" y="875.9854">(13)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="353.9258" y="875.9854">201 Created {client_id, status: bound}</text><path d="M15,907.3438 L15,951.3438 L931,951.3438 L931,917.3438 L921,907.3438 L15,907.3438" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M921,907.3438 L921,917.3438 L931,917.3438 L921,907.3438" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="21" y="921.626">Der zeta_attestation_token zertifiziert die erfolgreiche Android Key Attestation, ist an PuK.AK.Sig gebunden (cnf) und enth&#228;lt die registrierten redirect_uris. Er wird</text><text fill="#000000" font-family="Helvetica" font-size="10" x="21" y="933.2666">NICHT mehr bei /register ausgestellt, sondern erst nach der identit&#228;tsgebundenen E-Mail-Bindung im Token-Flow (siehe Abb-ZETA-OIDC-Token-Bezug). Er kann bei einer erneuten</text><text fill="#000000" font-family="Helvetica" font-size="10" x="21" y="944.9072">Registrierung im Fast-Path vorgelegt werden, sodass Hardware-Attestierung und redirect_uris nicht erneut &#252;bertragen werden m&#252;ssen.</text><?plantuml-src hLVDRjj64BxhAQOwj18iaec10eNg690bEHOSswgak6XWW5YH8t8hQaaibxAjm6_IOnuZDxzOPvRKdsCxESG7ILpkpdupyyqtur-a2f8YH71TBoiMYPE8-xGmhhapjTflyEud_f6vpkNx_h0p7azWUUY-ST-seUzS29auLvCXoDp0vQ1xDe45nXecA1DOfWeyZH6zG-t2EKe5jDUvHfqB5RR8vfpNDdky9MevkuS6BiYkdvgisR9R42uBiwANYdQ9kP6fSg4d4MI8oaWZqEGHJWj5ZqXcAs0dKeM5YW3rB4qY0jZfda682xWQzBhE