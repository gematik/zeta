etica" font-size="10" x="304.6313" y="610.0166">ZETA Client</text><rect fill="#FFE6CC" height="37.2813" rx="2.5" ry="2.5" style="stroke:#D79B00;stroke-width:0.5;" width="116.9492" x="642.709" y="593.7344"/><text fill="#000000" font-family="Helvetica" font-size="10" x="691.3032" y="610.0166">PDP</text><text fill="#000000" font-family="Helvetica" font-size="10" x="649.709" y="621.6572">Authorization Server</text><path d="M13,126.9219 L379.123,126.9219 L379.123,130.5625 L369.123,140.5625 L13,140.5625 L13,126.9219" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="442.8125" style="stroke:#000000;stroke-width:1.5;" width="1083.4092" x="13" y="126.9219"/><text fill="#000000" font-family="Helvetica" font-size="10" font-weight="700" x="28" y="137.2041">Account Recovery: Verlust von E-Mail-Zugang UND Ger&#228;t</text><path d="M14.5757,155.5625 L14.5757,223.5625 L734.5757,223.5625 L734.5757,165.5625 L724.5757,155.5625 L14.5757,155.5625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M724.5757,155.5625 L724.5757,165.5625 L734.5757,165.5625 L724.5757,155.5625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="155.4048" y="169.8447">Der Nutzer hat weder Zugriff auf sein altes Ger&#228;t (mobile Client) noch auf sein</text><text fill="#000000" font-family="Helvetica" font-size="10" x="155.4048" y="181.4854">altes E-Mail-Konto. Mit dem zuvor erhaltenen recovery_code registriert er einen</text><text fill="#000000" font-family="Helvetica" font-size="10" x="155.4048" y="193.126">neuen Client mit NEUER E-Mail-Adresse. Die Hardware-Attestierung des neuen Ger&#228;ts</text><text fill="#000000" font-family="Helvetica" font-size="10" x="155.4048" y="204.7666">l&#228;uft wie oben (Apple/Android/TPM); statt der OTP-Verifikation dient der</text><text fill="#000000" font-family="Helvetica" font-size="10" x="155.4048" y="216.4072">recovery_code als Besitz-/Identit&#228;tsnachweis f&#252;r den bestehenden Nutzer-Account.</text><polygon fill="#181818" points="316.7549,254.0469,326.7549,258.0469,316.7549,262.0469,320.7549,258.0469" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="53.626" x2="322.7549" y1="258.0469" y2="258.0469"/><text fill="#000000" font-family="Helvetica" font-size="10" x="60.626" y="247.8682">(01)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="85.1533" y="242.0479">Startet Wiederherstellung, gibt recovery_code</text><text fill="#000000" font-family="Helvetica" font-size="10" x="85.1533" y="253.6885">und neue E-Mail-Adresse ein</text><polygon fill="#181818" points="684.1836,314.6094,694.1836,318.6094,684.1836,322.6094,688.1836,318.6094" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="338.7549" x2="690.1836" y1="318.6094" y2="318.6094"/><text fill="#000000" font-family="Helvetica" font-size="10" x="345.7549" y="296.79">(02)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="370.2822" y="279.3291">POST /register</text><text fill="#000000" font-family="Helvetica" font-size="10" x="370.2822" y="290.9697">{attestation_type, &lt;Hardware-Attestation des neuen Ger&#228;ts&gt;,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="370.2822" y="302.6104">PuK.Client.Sig, signed_hash_puk_client_sig, redirect_uris,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="370.2822" y="314.251">user_email=&lt;neue E-Mail&gt;, recovery_code}</text><line style="stroke:#181818;stroke-width:1;" x1="706.1836" x2="748.1836" y1="344.25" y2="344.25"/><line style="stroke:#181818;stroke-width:1;" x1="748.1836" x2="748.1836" y1="344.25" y2="357.25"/><line style="stroke:#181818;stroke-width:1;" x1="707.1836" x2="748.1836" y1="357.25" y2="357.25"/><polygon fill="#181818" points="717.1836,353.25,707.1836,357.25,717.1836,361.25,713.1836,357.25" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="713.1836" y="339.8916">(03)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="737.7109" y="339.8916">Validiere Hardware-Attestation (wie beim normalen DCR-Flow)</text><line style="stroke:#181818;stroke-width:1;" x1="706.1836" x2="748.1836" y1="382.8906" y2="382.8906"/><line style="stroke:#181818;stroke-width:1;" x1="748.1836" x2="748.1836" y1="382.8906" y2="395.8906"/><line style="stroke:#181818;stroke-width:1;" x1="707.1836" x2="748.1836" y1="395.8906" y2="395.8906"/><polygon fill="#181818" points="717.1836,391.8906,707.1836,395.8906,717.1836,399.8906,713.1836,395.8906" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="713.1836" y="378.5322">(04)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="737.7109" y="378.5322">Verifiziere recovery_code gegen gespeicherten Hash</text><line style="stroke:#181818;stroke-width:1;" x1="706.1836" x2="748.1836" y1="433.1719" y2="433.1719"/><line style="stroke:#181818;stroke-width:1;" x1="748.1836" x2="748.1836" y1="433.1719" y2="446.1719"/><line style="stroke:#181818;stroke-width:1;" x1="707.1836" x2="748.1836" y1="446.1719" y2="446.1719"/><polygon fill="#181818" points="717.1836,442.1719,707.1836,446.1719,717.1836,450.1719,713.1836,446.1719" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="713.1836" y="422.9932">(05)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="737.7109" y="417.1729">Binde neuen Client &amp; neue E-Mail an bestehenden Nutzer-Account,</text><text fill="#000000" font-family="Helvetica" font-size="10" x="737.7109" y="428.8135">invalidiere alten recovery_code</text><line style="stroke:#181818;stroke-width:1;" x1="706.1836" x2="748.1836" y1="471.8125" y2="471.8125"/><line style="stroke:#181818;stroke-width:1;" x1="748.1836" x2="748.1836" y1="471.8125" y2="484.8125"/><line style="stroke:#181818;stroke-width:1;" x1="707.1836" x2="748.1836" y1="484.8125" y2="484.8125"/><polygon fill="#181818" points="717.1836,480.8125,707.1836,484.8125,717.1836,488.8125,713.1836,484.8125" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="10" x="713.1836" y="467.4541">(06)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="737.7109" y="467.4541">Generiere neuen recovery_code, speichere neuen Hash</text><polygon fill="#181818" points="64.626,506.4531,54.626,510.4531,64.626,514.4531,60.626,510.4531" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="58.626" x2="695.1836" y1="510.4531" y2="510.4531"/><text fill="#000000" font-family="Helvetica" font-size="10" x="70.626" y="506.0947">(07)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="95.1533" y="506.0947">neuer recovery_code (Out-of-Band, einmalige Anzeige)</text><polygon fill="#181818" points="349.7549,532.0938,339.7549,536.0938,349.7549,540.0938,345.7549,536.0938" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="343.7549" x2="695.1836" y1="536.0938" y2="536.0938"/><text fill="#000000" font-family="Helvetica" font-size="10" x="355.7549" y="531.7354">(08)</text><text fill="#000000" font-family="Helvetica" font-size="10" x="380.2822" y="531.7354">201 Created {client_id}</text><polygon fill="#181818" points="64.626,557.7344,54.626,561.7344,64.626,565.7344,60.626,561.7344" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-da