# =============================================================================
# PEP-Routen der Client-Management-API (src/openapi/zeta-guard-client-management.yaml
# 1.0.0-draft).
#
# Geprüft gegen Helm-Chart zeta-guard v1.2.4 (PEP fronted /auth). Für v1.3.x
# siehe README, Abschnitt „Chart v1.3.x“ (zusätzliche Ingress-Regel nötig).
#
# Einbindung: in den server-Block des PEP HTTP Proxy (Chart v1.2.x:
# pepproxy.nginxConf.locations). Annahmen wie im Chart:
#   - Issuer des Authorization Servers: https://<host>/auth/realms/zeta-guard
#     -> Ressourcenbezeichner der API: <issuer>/zeta
#   - Upstream des Authorization Servers: http://authserver
#   - logische Audience der API: cm_resource
#
# Regeln:
#   - Alle Operationen laufen über den PEP. Jeder Pfad hat genau eine
#     Location und genau eine Autorisierungsklasse. Andere Methoden beantwortet
#     die Location mit 405 und Allow-Header; HEAD ist nur zugelassen, wo die
#     OpenAPI es nennt (limit_except GET würde HEAD stillschweigend erlauben).
#   - Exakte Locations (`location =`) bzw. enge Regex; `/zeta/` ist keine
#     Routenregel. Die Auffang-Location am Ende beantwortet jeden anderen Pfad
#     unter .../zeta und .../register mit 404 – für jeden Realm-Namen –, damit er
#     nicht über die allgemeine /auth-Location ohne PEP-Prüfung beim
#     Authorization Server landet (fail closed).
#   - Pfadvarianten: Ein Pfad unter /auth/realms/ mit `;` (auch kodiert als %3B)
#     wird mit 400 abgelehnt. Matrix-Parameter und `..;`-Segmente wertet nginx
#     anders aus als ein JAX-RS-Server (Keycloak); ohne den Filter erreichte z. B.
#     .../zeta;x=1/clients den Authorization Server über /auth ohne PEP.
#   - Ablehnungen am PEP liefern JSON nach zeta-error.yaml (400, 404, 405, 413).
#   - Mindest-acr: libngx_pep.so hat dafür keine Direktive. Der Authorization
#     Server prüft acr und Sitzungsalter selbst; siehe README.
#   - ZETA/ASL: Diese Locations setzen kein `allow all`. Ist ASL
#     aktiviert, erben sie `allow 127.0.0.1; deny all;` des server-Blocks und
#     sind nur über den ASL-Kanal erreichbar.
# =============================================================================

# --- Pfadfilter (vor allen anderen Regex-Locations) ---------------------------

# `;` im Pfad (Matrix-Parameter, `..;`-Segmente; %3B ist in $uri bereits
# dekodiert). Die ZETA-Endpunkte verwenden keine Matrix-Parameter.
location ~ "^/auth/realms/[^?]*;" {
    pep off;
    default_type application/json;
    return 400 '{"error":"invalid_request","error_description":"invalid path"}';
}

# --- Durchleitungs-Routen: Registrierung (ohne Token) ------------------------

# Body-Grenze vor dem Parsen (OpenAPI POST /register: 413 ab 64 KiB).
location = /auth/realms/zeta-guard/register {
    include zeta-cm-passthrough-route.conf;
    client_max_body_size 64k;
    if ($request_method !~ ^(POST)$) {
        add_header Allow "POST" always;
        return 405 '{"error":"invalid_request","error_description":"method not allowed"}';
    }
}

location = /auth/realms/zeta-guard/register/verify {
    include zeta-cm-passthrough-route.conf;
    client_max_body_size 16k;
    if ($request_method !~ ^(POST)$) {
        add_header Allow "POST" always;
        return 405 '{"error":"invalid_request","error_description":"method not allowed"}';
    }
}

# --- Durchleitungs-Routen: Client Assertion (F2) -----------------------------

# GET/DELETE /register/{client_id}, PUT (Rollover, application/zeta-rollover+jws)
location ~ ^/auth/realms/zeta-guard/register/[^/]+$ {
    include zeta-cm-passthrough-route.conf;
    client_max_body_size 32k;
    if ($request_method !~ ^(GET|PUT|DELETE)$) {
        add_header Allow "GET, PUT, DELETE" always;
        return 405 '{"error":"invalid_request","error_description":"method not allowed"}';
    }
}

location = /auth/realms/zeta-guard/zeta/rollover-nonce {
    include zeta-cm-passthrough-route.conf;
    client_max_body_size 1k;
    if ($request_method !~ ^(HEAD)$) {
        add_header Allow "HEAD" always;
        return 405 '{"error":"invalid_request","error_description":"method not allowed"}';
    }
}

location = /auth/realms/zeta-guard/zeta/identity/rebind/status {
    include zeta-cm-passthrough-route.conf;
    client_max_body_size 1k;
    if ($request_method !~ ^(GET)$) {
        add_header Allow "GET" always;
        return 405 '{"error":"invalid_request","error_description":"method not allowed"}';
    }
}

# --- Token-Routen: E-Mail-Binding-Token ----------------------------

location = /auth/realms/zeta-guard/zeta/identity/bind-email {
    include zeta-cm-token-route.conf;
    pep_require_scope "zeta:email-binding";
    if ($request_method !~ ^(POST)$) {
        add_header Allow "POST" always;
        return 405 '{"error":"invalid_request","error_description":"method not allowed"}';
    }
}

location = /auth/realms/zeta-guard/zeta/identity/bind-email/resend {
    include zeta-cm-token-route.conf;
    pep_require_scope "zeta:email-verify";
    if ($request_method !~ ^(POST)$) {
        add_header Allow "POST" always;
        return 405 '{"error":"invalid_request","error_description":"method not allowed"}';
    }
}

location = /auth/realms/zeta-guard/zeta/identity/bind-email/verify {
    include zeta-cm-token-route.conf;
    pep_require_scope "zeta:email-verify";
    if ($request_method !~ ^(POST)$) {
        add_header Allow "POST" always;
        return 405 '{"error":"invalid_request","error_description":"method not allowed"}';
    }
}

# Start der Neubindung; Mindest-acr des zugrunde liegenden Auth Code Flows
# prüft der Authorization Server (x-zeta-step-up: acr).
location = /auth/realms/zeta-guard/zeta/identity/rebind {
    include zeta-cm-token-route.conf;
    pep_require_scope "zeta:email-verify";
    if ($request_method !~ ^(POST)$) {
        add_header Allow "POST" always;
        return 405 '{"error":"invalid_request","error_description":"method not allowed"}';
    }
}

location = /auth/realms/zeta-guard/zeta/identity/rebind/verify {
    include zeta-cm-token-route.conf;
    pep_require_scope "zeta:email-verify";
    if ($request_method !~ ^(POST)$) {
        add_header Allow "POST" always;
        return 405 '{"error":"invalid_request","error_description":"method not allowed"}';
    }
}

# --- Token-Routen: Verwaltungs-Token ----------------------

# Step-up immer (x-zeta-step-up: always): acr und Sitzungsalter prüft der AuthS.
location = /auth/realms/zeta-guard/zeta/identity/email {
    include zeta-cm-token-route.conf;
    pep_require_scope "zeta:email-change";
    if ($request_method !~ ^(POST)$) {
        add_header Allow "POST" always;
        return 405 '{"error":"invalid_request","error_description":"method not allowed"}';
    }
}

location = /auth/realms/zeta-guard/zeta/identity/email/verify {
    include zeta-cm-token-route.conf;
    pep_require_scope "zeta:email-change";
    if ($request_method !~ ^(POST)$) {
        add_header Allow "POST" always;
        return 405 '{"error":"invalid_request","error_description":"method not allowed"}';
    }
}

location = /auth/realms/zeta-guard/zeta/clients {
    include zeta-cm-token-route.conf;
    pep_require_scope "zeta:client-management";
    if ($request_method !~ ^(GET)$) {
        add_header Allow "GET" always;
        return 405 '{"error":"invalid_request","error_description":"method not allowed"}';
    }
}

# PATCH (Umbenennen) und DELETE (Löschen, bedingter Step-up im AuthS).
# Beide Methoden: derselbe Scope, dieselbe Klasse.
location ~ ^/auth/realms/zeta-guard/zeta/clients/[^/]+$ {
    include zeta-cm-token-route.conf;
    pep_require_scope "zeta:client-management";
    if ($request_method !~ ^(PATCH|DELETE)$) {
        add_header Allow "PATCH, DELETE" always;
        return 405 '{"error":"invalid_request","error_description":"method not allowed"}';
    }
}

location = /auth/realms/zeta-guard/zeta/identity/rebind/cancel {
    include zeta-cm-token-route.conf;
    pep_require_scope "zeta:client-management";
    if ($request_method !~ ^(POST)$) {
        add_header Allow "POST" always;
        return 405 '{"error":"invalid_request","error_description":"method not allowed"}';
    }
}

# Wiederherstellungscode (optional); Step-up beim Anfordern.
location = /auth/realms/zeta-guard/zeta/identity/recovery-code {
    include zeta-cm-token-route.conf;
    pep_require_scope "zeta:email-change";
    if ($request_method !~ ^(POST)$) {
        add_header Allow "POST" always;
        return 405 '{"error":"invalid_request","error_description":"method not allowed"}';
    }
}

location = /auth/realms/zeta-guard/zeta/identity/recovery-code/verify {
    include zeta-cm-token-route.conf;
    pep_require_scope "zeta:email-change";
    if ($request_method !~ ^(POST)$) {
        add_header Allow "POST" always;
        return 405 '{"error":"invalid_request","error_description":"method not allowed"}';
    }
}

location = /auth/realms/zeta-guard/zeta/identity/events {
    include zeta-cm-token-route.conf;
    pep_require_scope "zeta:client-management";
    if ($request_method !~ ^(GET)$) {
        add_header Allow "GET" always;
        return 405 '{"error":"invalid_request","error_description":"method not allowed"}';
    }
}

# --- Auffang-Location (fail closed) ------------------------------------------

# Jeder andere Pfad unter .../zeta und .../register, für jeden Realm-Namen. Regex
# (nach den Regex-Routen oben, die zuerst passen); trifft nicht Keycloak-Pfade
# wie .../zeta-guard-nonce, weil nach zeta/register ein `/` oder das Ende folgen muss.
# Bewusst kein `^~`-Präfix: das würde die Regex-Routen oben abschalten.
location ~ "^/auth/realms/[^/]+/(zeta|register)(/|$)" {
    pep off;
    default_type application/json;
    return 404 '{"error":"invalid_request","error_description":"unknown path"}';
}

# JSON-Antwort für zu große Bodies (error_page 413 in den Routen-Snippets).
location @zeta_cm_body_too_large {
    default_type application/json;
    return 413 '{"error":"invalid_request","error_description":"request body too large"}';
}
