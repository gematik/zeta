# =============================================================================
# BEISPIEL - NICHT NORMATIV
# Gemeinsamer Teil aller Token-Routen der Client-Management-API.
# Wird in jeder Token-Location per `include` eingebunden; die Location setzt
# zusätzlich `pep_require_scope` und die zulässige Methode (`limit_except`).
# =============================================================================

# PEP-Prüfung: Access Token, DPoP-Proof einschließlich Replay (A_25668-01,
# A_25667, A_30003, A_28803-01), Audience genau die der Client-Management-API.
pep on;
pep_require_aud cm_resource;
# PoPP gilt für den Fachdienstzugriff, nicht für die Verwaltung. Ist global
# `pep_require_popp on;` gesetzt (poppIssuer), hier ausschalten.
pep_require_popp off;
pep_forward_client_data off;

# Kleine JSON-Bodies; größere Anfragen weist nginx mit 413 (JSON) ab.
client_max_body_size 8k;

proxy_pass http://authserver;
proxy_http_version 1.1;

# Eigene proxy_set_header-Direktiven: nginx vererbt proxy_headers.conf dann
# nicht (nicht-additive Vererbung) -> erneut einbinden, sonst HTTP 500
# (ProxyHeadersMissing).
include proxy_headers.conf;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

# Der Authorization Server prüft Token und DPoP-Proof selbst noch einmal. proxy_headers.conf entfernt Authorization und DPoP für den
# Upstream; für diese Routen werden sie deshalb wieder gesetzt.
# Getestet mit nginx 1.27.5 und einer Nachbildung der Strips
# (proxy_set_header Authorization ""; ...): nginx übernimmt bei mehrfachem
# proxy_set_header für dasselbe Feld jeden Eintrag, ein Eintrag mit leerem Wert
# wird nicht gesendet. Gegen die proxy_headers.conf des PEP-Images ist das noch
# zu bestätigen. Der AuthS vergleicht htu mit der konfigurierten externen URL,
# nicht mit Host/X-Forwarded-*.
proxy_set_header Authorization $http_authorization;
proxy_set_header DPoP $http_dpop;

# Ablehnungen des PEP selbst im Format von zeta-error.yaml (405 und 413 hier,
# 400/404 in den Filter- bzw. Auffang-Locations).
default_type application/json;
error_page 413 @zeta_cm_body_too_large;
