# =============================================================================
# BEISPIEL - NICHT NORMATIV
# Gemeinsamer Teil aller Durchleitungs-Routen der Client-Management-API: selbstauthentisierende Registrierung und Client Assertion.
# Der PEP prüft kein Access Token; der Authorization Server prüft den Nachweis
# selbst, bei Client Assertions einschließlich jti-Replay-Cache, htm/htu und
# Lebensdauer.
# =============================================================================

pep off;

proxy_pass http://authserver;
proxy_http_version 1.1;

include proxy_headers.conf;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
# Der Header Client-Assertion wird von proxy_headers.conf nicht entfernt und
# erreicht den Authorization Server unverändert.

# Ablehnungen des PEP selbst im Format von zeta-error.yaml (405 und 413 hier,
# 400/404 in den Filter- bzw. Auffang-Locations).
default_type application/json;
error_page 413 @zeta_cm_body_too_large;
