# Policy Engine Input Schema for ZETA Guard
# This schema combines authorization_request data, client-statement.yaml and user-info.yaml.
$schema: "http://json-schema.org/draft-07/schema#"
schemaVersion: "1.5.0"
title: Policy Engine Input Schema for ZETA Guard
type: object
description: >
  Schema for OPA policy decisions based on client registration data, client
  assertion, user info and authorization request. This schema is used as input
  for the OPA policy engine.
  Change 1.1.0 -> 1.2.0: grant_type no longer lists client_credentials. No
  ZETA flow uses that grant and the token endpoint does not support it, so the
  Authorization Server never produced such an input.
  Change 1.2.0 -> 1.3.0 (backward compatible): optional authorization_request.auth_time,
  the time of the last user authentication of the session, so that a policy can
  demand a maximum age (pdp-decision.yaml required_max_age; T15). Description of acr corrected (no value 'loa2';
  values gematik-ehealth-loa-*, as access-token.yaml); examples adjusted.
  Change 1.3.0 -> 1.4.0 (backward compatible): optional ocsp_failures, the
  OCSP checks of this request without a usable OCSP response (responder not
  reachable, timeout, error), so that the policy decides between fail open and
  fail closed; set only if the Authorization Server is configured to hand the
  decision to the policy (default: the Authorization Server fails closed).
  Change 1.4.0 -> 1.5.0 (backward compatible, from Stufe 3 on): optional
  schema_version, so that the policy can make its decision depend on the
  version of the input (reason_codes only from 1.5.0 on; pdp-decision.yaml
  1.4.0).
properties:
  schema_version:
    description: >-
      Added in 1.5.0 (to be implemented from Stufe 3 on). Version of this schema (schemaVersion) according to which
      the Authorization Server built the input. The Policy Engine shapes its
      decision by it: `result.reason_codes` (pdp-decision.yaml 1.4.0) only if
      the value is 1.5.0 or later.
      Absent: Authorization Server of Stufe 2; the policy answers in the form
      of pdp-decision.yaml 1.3.0 without reason_codes. Independent of
      `version`, which names the contract for `aud`.
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    example: "1.5.0"
  version:
    description: >-
      The version of the schema. `1.0` corresponds to the legacy contract where
      the access token `aud` is taken verbatim from the `audience` parameter.
      `1.1` corresponds to the contract where the client supplies a `resource`
      indicator (RFC 8707) and the Policy Engine determines the `aud` claim
      (returned in the decision).
    type: string
    enum:
      - "1.0"
      - "1.1"
  client_registration_data:
    description: The client registration data stored at the authorization server.
    "$ref": "./policy-engine-client-data.yaml"
  user_info:
    description: The user information data
    "$ref": "./zeta-user-info.yaml"
  authorization_request:
    description: The authorization request data
    type: object
    properties:
      scopes:
        type: array
        description: The purpose of use for the authorization
        items:
          type: string
      audience:
        type: array
        description: >-
          LEGACY (contract v1 / schema version 1.0). The logical,
          deployment-independent audience identifier(s) taken verbatim from the
          client-supplied `audience` parameter and written verbatim into the
          access token `aud` claim. Present only for legacy requests; for
          contract v2 the client sends `resource` instead and the Policy Engine
          determines the `aud` (returned in the decision). MUST NOT be the
          environment-specific resource URL.
        items:
          type: string
      resource:
        type: string
        format: uri
        description: >-
          Resource indicator (RFC 8707), contract v2 / schema version 1.1: the
          single absolute endpoint URL at the resource server for which the
          access token is requested. The Policy Engine uses it to determine the
          logical `aud` returned in the decision. Does NOT itself become the
          `aud`. Exactly one endpoint per access token.
      country_code:
        type: string
        description: "ISO 3166-1 alpha-2 country code of the source IP, resolved by
          AuthS via GeoIP."
        pattern: "^[A-Z]{2}$"
      http_method:
        type: string
        description: The HTTP method of the request.
        enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - HEAD
          - OPTIONS
      ip_address:
        type: string
        description: The source IP address of the request.
      previous_ip_address:
        type: string
        description: The previously used source IP address; for impossible travel detection
      grant_type:
        type: string
        description: The OAuth 2.0 grant type being used.
        enum:
          - authorization_code
          - urn:ietf:params:oauth:grant-type:token-exchange
          - refresh_token
          - urn:ietf:params:oauth:grant-type:jwt-bearer
      amr:
        type: array
        description: Methods used for user authentication (Authentication Methods
          References).
        items:
          type: string
      acr:
        type: string
        description: >-
          Authentication Context Class Reference, values as access-token.yaml
          `acr`: for grants with user authentication the `acr` of the ID token of
          the sectoral IDP (gematik-ehealth-loa-substantial or
          gematik-ehealth-loa-high, gemSpec_IDP_Sek 3.3.0 A_22987, A_22988);
          gematik-ehealth-loa-low for clients without user authentication.
      auth_time:
        type: integer
        minimum: 0
        description: >-
          Added in 1.3.0. Time of the last user authentication of the session
          as a Unix timestamp (seconds), taken from `auth_time` of the ID token
          of the sectoral IDP (mandatory there when max_age was requested,
          gemSpec_IDP_Sek 3.3.0 A_25753; a value after the receipt of the ID
          token is replaced by the time of receipt) and unchanged by refresh.
          Set by the Authorization Server for grants with user authentication
          if known, absent otherwise. A maximum age N
          is fulfilled only if auth_time is present and (time of the decision
          − auth_time) ≤ N + 60 s.
        example: 1761740000
    required:
      - scopes
      - ip_address
      - previous_ip_address
      - grant_type
      - acr
  ocsp_failures:
    description: >-
      Added in 1.4.0. OCSP checks of this request for which the Authorization
      Server obtained no usable OCSP response: no
      answer within the configured timeout, connection error, HTTP status other
      than 200, OCSP responseStatus other than successful, or a response that
      fails validation (format, signature, signer, certID, thisUpdate/
      nextUpdate). One entry per failed check; present only if at least one
      check failed and no valid cached response (gemSpec_ZETA 2.0.1 A_29046)
      was available. Absent: every OCSP check of the request had a usable
      response, or none was made.
      A usable response with certStatus revoked or unknown is not a failure in
      this sense: the Authorization Server rejects the request itself (400
      invalid_grant, T05) and does not ask the Policy Engine.
      Set only if the Authorization Server is configured to hand a missing
      revocation status to the Policy Engine. In the default configuration
      (fail closed) the Authorization Server rejects such a request itself
      with 503 temporarily_unavailable and does not ask the Policy Engine, so
      the field never occurs.
      The policy decides whether the request is allowed despite the missing
      revocation status (fail open) or denied (fail closed). Note: a policy
      that does not evaluate this field accepts the request without revocation
      status (fail open); the operator should therefore only enable this mode
      for a service whose policy evaluates the field (documented trade-off,
      not a testable obligation).
    type: array
    minItems: 1
    maxItems: 4
    items:
      type: object
      additionalProperties: false
      properties:
        certificate_usage:
          type: string
          description: >-
            Certificate whose revocation status was requested.
            smcb_subject_token: the SM(C)-B certificate (C.HCI.AUT) from the
            x5c header of the subject token of a token exchange (gemSpec_ZETA
            2.0.1 A_25645-02, A_30643). Adding a value requires a new schema
            version; inputs with the new value are invalid against older
            versions.
          enum:
            - smcb_subject_token
          example: smcb_subject_token
        certificate_issuer:
          type: string
          maxLength: 1024
          description: >-
            Issuer distinguished name of the checked certificate (RFC 4514
            string representation), identifies the CA of the TSP. Contains no
            data of the certificate holder.
          example: "CN=GEM.SMCB-CA57 TEST-ONLY,OU=Institution des Gesundheitswesens-CA der Telematikinfrastruktur,O=gematik GmbH NOT-VALID,C=DE"
        responder_url:
          type: string
          format: uri
          maxLength: 2048
          description: >-
            Base URL of the OCSP responder that was queried, as listed in the
            TSL for the issuing TSP service. Never the
            request URL of an OCSP GET request: that URL carries the encoded
            OCSPRequest including the serial number of the certificate.
          example: "http://ocsp.example-tsp.de/ocsp"
        failure:
          type: string
          description: >-
            What happened. timeout: no complete response within the configured
            timeout. connection_error: DNS, TCP or TLS connection to the
            responder failed. http_error: HTTP status other than 200
            (http_status is set). ocsp_error_status: OCSP responseStatus other
            than successful (ocsp_response_status is set). invalid_response:
            response received but not usable (not parseable, signature or
            signer invalid, certID does not match, thisUpdate/nextUpdate
            outside the permitted window).
          enum:
            - timeout
            - connection_error
            - http_error
            - ocsp_error_status
            - invalid_response
          example: timeout
        http_status:
          type: integer
          minimum: 100
          maximum: 599
          description: Only with failure http_error. HTTP status code of the responder.
          example: 503
        ocsp_response_status:
          type: string
          description: >-
            Only with failure ocsp_error_status. OCSPResponseStatus of the
            response (RFC 6960, section 4.2.1).
          enum:
            - malformedRequest
            - internalError
            - tryLater
            - sigRequired
            - unauthorized
          example: tryLater
        attempted_at:
          type: integer
          minimum: 0
          description: >-
            Time of the OCSP request actually sent, as a Unix timestamp
            (seconds). If the failure was taken from the cache of failed
            requests, this is the time of the cached
            request and may lie before the current request.
          example: 1761822000
        duration_ms:
          type: integer
          minimum: 0
          description: >-
            Time in milliseconds from sending the OCSP request until the
            failure was detected (for timeout: the configured timeout). If the
            failure was taken from the cache of failed requests, the duration
            of the cached request.
          example: 5000
        last_good_response_at:
          type: integer
          minimum: 0
          description: >-
            thisUpdate of the last usable OCSP response with certStatus good
            for this certificate that the Authorization Server has kept within
            its configured retention period, as a Unix timestamp (seconds);
            its validity (nextUpdate) may have expired. Absent if none is kept. Keeping it across
            Authorization Server instances is not required, so a policy must
            expect it to be absent. Allows a policy to accept a recently
            confirmed certificate during an outage (grace period).
          example: 1761800400
      required:
        - certificate_usage
        - certificate_issuer
        - responder_url
        - failure
        - attempted_at
      # http_status only and always with http_error; ocsp_response_status only
      # and always with ocsp_error_status. Code generators ignore these rules.
      allOf:
        - if:
            properties:
              failure:
                const: http_error
                example: http_error
            required: [failure]
          then:
            required: [http_status]
          else:
            not:
              required: [http_status]
        - if:
            properties:
              failure:
                const: ocsp_error_status
                example: ocsp_error_status
            required: [failure]
          then:
            required: [ocsp_response_status]
          else:
            not:
              required: [ocsp_response_status]
  delegation_context:
    description: The delegation context if the client is acting on behalf of a user.
    type: [ "object", "null" ]
    properties:
      principal_user_info:
        $ref: "./user-info.yaml"
      allowed_scopes:
        type: array
        items:
          type: string
      valid_until:
        type: integer
    required:
      - principal_user_info
      - allowed_scopes
      - valid_until
required:
  - version
  - client_registration_data
  - authorization_request
