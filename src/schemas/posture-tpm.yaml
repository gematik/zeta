# Posture schema for generic software clients with TPM attestation
# 
$schema: "http://json-schema.org/draft-07/schema#"
schemaVersion: "2.0.0"
title: Posture with TPM attestation
description: >-
  The posture of the client instance. The structure depends on the platform.

  Change 1.0.0 -> 1.1.0 (compatible): optional field nonce added
  (gemSpec_ZETA 2.0.1 A_30515, proposal A_NEU-ABL-03).

  Change 1.1.0 -> 2.0.0 (breaking): nonce is required; the legacy rules
  until the cutoff date of A_30193 (posture without nonce, verification of
  tpm_quote against tpm_attestation_key for legacy_unpinned registrations)
  are removed. Reason: TPM attestation is not part of stages 1 and 2, so no
  TPM client exists that would need a transition rule (proposal
  A_NEU-ABL-03).
type: object
properties:
  platform_product_id:
    oneOf:
      - $ref: "./product-id-windows.yaml"
      - $ref: "./product-id-linux.yaml"
    description: The product identifier
  product_id:
    type: string
    description: The gematik product identifier
  product_version:
    type: string
    description: The product version
  os:
    type: string
    description: Operating system name
  os_version:
    type: string
    description: Operating system version
  arch:
    type: string
    description: Hardware Architecture
  tpm_attestation_key:
    type: string
    description: >-
      The public key of the TPM-resident attestation key (PEM or base64 DER
      encoded). Reference and diagnostic value only — NOT a trust anchor: the
      AuthS verifies tpm_quote against the attestation key pinned at
      registration (ak_jkt in the client record) and rejects the assertion if
      this value does not match it (proposal A_NEU-ABL-03).
  nonce:
    type: string
    pattern: "^[A-Za-z0-9_-]{22}$"
    description: >-
      Die vom AuthS über GET /nonce bezogene Nonce, unverändert als String
      (Format nach A_28144-01, siehe dcr-request.yaml, definitions/nonce).
      Dieselbe Nonce ist als qualifyingData in TPM2_Quote eingegangen und steht
      damit in extraData von tpm_quote. Der AuthS prüft und verbraucht sie nach
      gemSpec_ZETA 2.0.1 A_30515 und lehnt das Client Statement mit
      invalid_client ab, wenn nonce und extraData nicht übereinstimmen
      (Vorschlag A_NEU-ABL-03). Pflicht seit 2.0.0.
  tpm_quote:
    type: string
    description: The TPM quote of the client instance
  tpm_event_log:
    type: string
    description: The TPM event log of the client instance
  tpm_ek_certificate_chain:
    type: array
    description: The endorsement key certificate chain from the TPM manufacturer (PEM or base64 DER encoded).
    items:
      type: string
required:
  - product_id
  - product_version
  - os
  - os_version
  - arch
  - tpm_attestation_key
  - nonce
  - tpm_quote
  - tpm_event_log
  - tpm_ek_certificate_chain
