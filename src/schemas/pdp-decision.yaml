$schema: "http://json-schema.org/draft-07/schema#"
schemaVersion: "1.2.0"
title: PDP Decision Response
description: Schema for the PDP Decision as provided by the OPA Policy Engine
  REST API (/v1/data/...).
type: object
properties:
  decision_id:
    description: Unique identifier for the decision (generated by OPA if decision
      logging is enabled).
    type: string
  result:
    type: object
    description: >
      The evaluated decision value. Contains 'allow' and either 'ttl' (on
      success) or 'reasons' (on denial).
    additionalProperties: false
    properties:
      allow:
        description: Whether the access is allowed or not.
        type: boolean
      ttl:
        description: >
          Time to live for the issued tokens. Only present when allow is true.
        type: object
        additionalProperties: false
        properties:
          access_token:
            type: integer
          refresh_token:
            type: integer
        required:
          - access_token
          - refresh_token
      aud:
        description: >
          The logical, deployment-independent audience identifier assigned by the
          Policy Engine for the issued access token (contract v2). The
          Authorization Server writes this value into the `aud` claim and sets
          `ver: 2`. Only present when `allow` is true and the request supplied a
          `resource` indicator (RFC 8707). Absent for legacy (contract v1)
          decisions, where `aud` is taken verbatim from the client-supplied
          `audience` parameter. Value: a string or an array of strings (RFC 7519
          section 4.1.3).
        # Deliberately no `type` and no oneOf here: generators have no working
        # mapping for "string or array of strings" (openapi-generator emits
        # Java that does not compile and an empty Kotlin class). The value is
        # therefore generated as an untyped JSON value; the rule below is
        # enforced by the JSON Schema validator and accepts exactly the same
        # instances as the former oneOf.
        if:
          type: array
        then:
          items:
            type: string
        else:
          type: string
      scope:
        description: >
          Optional (added in 1.2.0). The scopes the Policy Engine permits for
          this request, as an array of scope values. If present, the
          Authorization Server issues the access token with exactly these
          scopes — a subset of the requested scopes — and returns the granted
          scope in the token response if it differs from the request (RFC 6749
          section 5.1). Additional scopes, authorization details or claims from
          an Authorization Backend are only accepted within this set
          (A_30245). If absent (decisions of policies written for 1.1.0), the
          Authorization Server grants the requested scopes as before. Only
          present when allow is true.
          The Authorization Server MUST NOT issue a token if the decision
          names a scope that was not requested or a reserved scope
          (zeta:email-binding, zeta:email-verify, asl) that it did not itself
          put into the request; it answers 500 server_error and reports a
          policy error. An empty array means that no scope is granted: the
          token is issued without scope.
        type: array
        items:
          type: string
        uniqueItems: true
      reasons:
        description: >
          Map of denial reasons. Keys are human-readable reason strings, values
          are always true.
        type: object
        additionalProperties:
          type: boolean
    required:
      - allow
required:
  - result
