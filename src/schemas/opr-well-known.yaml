# Schema for the OAuth protected resource server .well-known JSON object
$schema: "http://json-schema.org/draft-07/schema#"
schemaVersion: "1.1.0"
title: OAuth Protected Resource Server .well-known JSON Object
description: |-
  Schema for the protected resource metadata document (RFC 9728) of the main
  resource of a ZETA Guard. The main resource is the Fachdienst (the specialist
  service, e.g. VSDM) behind the PEP. Only the main resource publishes this document;
  the Notification Service and the Client Management are fixed resources without such
  a document.

  History:

  - 1.1.0: `resource` restricted to the origin of the main resource followed by a
    single `/` (`https://<host>[:<port>]/`, no further path), enforced by `pattern` and
    `maxLength`. Rules for the endpoint URL, the well-known location, the token request,
    `aud` and the client's resource check added to the description. Every provider
    whose `resource` is not exactly of this form (path prefix such as `/pep/`, or no
    trailing `/`) must adapt its configuration. Consumers stay compatible: a ZETA
    Client compares the configured value with `resource` after normalization (RFC 3986
    Sections 6.2.2.1 and 6.2.3), so `https://<host>` and `https://<host>/` match. New
    ZETA Client rules (form check, same-origin check, excluded ZETA paths, fixed
    resources) are listed under `resource`. Minor version because only producers of
    the document must change.

  - 1.0.0: Initial version.
type: object
properties:
  resource:
    type: string
    description: |-
      Identifier for the protected resource (RFC 9728 Section 1.2: URL with the `https`
      scheme, no fragment). ZETA restricts this further.

      - Form: The value MUST be the origin of the main resource followed by a single
        `/`, i.e. `https://<host>[:<port>]/`, for example `https://vsdm2.gematik-kk.de/`
        (form as in RFC 8707 Section 2, `https://api.example.com/`). It MUST NOT
        contain a path other than `/`, a query, a fragment or userinfo. The host MUST be
        lowercase; the default port 443 MUST be omitted; a port has no leading zero.
        Exactly one Fachdienst is served per host.

      - Endpoint URL: The URL of a Fachdienst operation is this value followed by the
        path from the Fachdienst specification without its leading `/`, e.g.
        `https://vsdm2.gematik-kk.de/vsdservice/v1/vsdmbundle`. Note: the PEP forwards
        the path to the resource server unchanged and removes no prefix
        (gemSpec_ZETA, PEP HTTP Proxy).

      - Location: This document is retrieved from
        `https://<host>[:<port>]/.well-known/oauth-protected-resource`; the trailing `/`
        of the value is removed before the well-known path is inserted, so no path
        remains (RFC 9728 Section 3.1).

      - ZETA Client, start: The ZETA Client MUST reject a configured value with a path
        other than empty or `/`. It MUST compare the configured value with `resource` of
        this document after normalization according to RFC 3986 Sections 6.2.2.1 and
        6.2.3 (case of scheme and host, empty path, default port) and MUST discard the
        document if they differ. This deviates from the identity required by RFC 9728
        Section 3.3, limited to these normalizations.

      - Token request and `aud`: The ZETA Client MUST send `resource` of this document
        unchanged as `resource` (contract v2) or `audience` (contract v1) in the token
        request; the `aud` claim of the access token equals it character by character.

      - Fixed resources: The Notification Service has the resource identifier
        `resource` of this document followed by `notification-service/` (e.g.
        `https://vsdm2.gematik-kk.de/notification-service/`, port kept). The Client
        Management has `issuer` of the authorization server metadata without a trailing
        `/`, followed by `/zeta/`. Both are not discovered via this document. The ZETA
        Client sends them as `resource`; the Client Management also as `audience` in
        contract v1, the Notification Service is used with contract v2 only.

      - Resource check: For every request URL passed by the Fachdienst client, the ZETA
        Client MUST compare scheme, host and port after parsing (origin) and paths by
        segment; a string prefix check without the trailing `/` is not permitted.
        (1) Same origin as a fixed resource identifier and path under its path: sent
        only with the token of that fixed resource. (2) Same origin as this value and
        path equal to or under the path of `issuer`, under `/.well-known/`, equal to or
        under `/ASL`, or equal to an endpoint of the authorization server metadata:
        rejected. (3) Any other URL with the same origin as this value: sent with the
        token of this resource. (4) Any other URL: rejected. A rejected URL causes an
        error to the Fachdienst client; the ZETA Client sends neither the request nor
        an access token. The ZETA Client's own requests (discovery, registration,
        nonce, token, PAR, revocation, `/ASL`) are not subject to this check.

      - Path space: The path of `issuer` is not empty; no endpoint path of the
        Fachdienst is equal to or lies under the path of `issuer`, lies under
        `/.well-known/` or `/notification-service/`, is equal to or lies under `/ASL`, or
        is equal to the path of an endpoint of the authorization server metadata.
    format: uri
    maxLength: 270
    pattern: "^https://[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*(:([1-9][0-9]?|[1-35-9][0-9]{2}|4[0-35-9][0-9]|44[0-24-9]|[1-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?/$"
  authorization_servers:
    type: array
    description: >-
      A JSON array listing the Issuer Identifiers ([RFC8414]) of the OAuth Authorization
      Servers that can authorize access to this protected resource. The resource MAY omit
      some supported authorization servers from this list. If the set of supported
      authorization servers is not enumerable or discoverable via this mechanism,
      this parameter SHOULD be omitted.
    items:
      type: string
      format: uri
  jwks_uri:
    type: string
    description: >-
      URL of the protected resource's JSON Web Key Set (JWK Set) [RFC7517] document.
      This document contains public keys owned by the protected resource, potentially
      including keys used for signing resource responses (e.g., according to
      [Reference to FAPI Message Signing spec]). This URL MUST use the `https` scheme.
      If the JWK Set contains keys for both signing (`sig`) and encryption (`enc`),
      the `use` (public key use) parameter is REQUIRED for each key to declare its
      intended purpose.
    format: uri
  scopes_supported:
    type: array
    description: >-
      A JSON array listing the OAuth 2.0 [RFC6749] scope values supported by this
      protected resource for requesting access. The resource MAY omit some supported
      scope values from this list.
    items:
      type: string
  bearer_methods_supported:
    type: array
    description: >-
      A JSON array listing the methods supported by the protected resource for receiving
      OAuth 2.0 Bearer Tokens [RFC6750]. Valid values are `"header"`, `"body"`, and
      `"query"`, corresponding to Sections 2.1, 2.2, and 2.3 of RFC 6750, respectively.
      An empty array `[]` indicates that Bearer Tokens transmitted using these methods
      are not supported. Omission of this parameter implies no defaults and indicates
      nothing about supported methods.
    items:
      type: string
      enum: [header, body, query]
  resource_signing_alg_values_supported:
    type: array
    description: >-
      A JSON array listing the JWS [RFC7515] signing algorithms (`alg` values) [RFC7518]
      supported by the protected resource for signing its responses (e.g., as described
      in [Reference to FAPI Message Signing spec]). Omission of this parameter implies
      no default algorithms. The value `"none"` MUST NOT be included in this list.
    items:
      type: string
  resource_name:
    type: string
    description: >-
      A human-readable name for the protected resource, suitable for display to end-users.
      Inclusion of this field is RECOMMENDED. The value MAY be internationalized
      (e.g., using language tags as specified in [Reference to relevant spec, e.g., RFC XXXX Section 2.1]).
  resource_documentation:
    type: string
    description: >-
      URL of a web page providing human-readable documentation for developers about
      using this protected resource. The target content MAY be internationalized
      (e.g., as specified in [Reference to relevant spec, e.g., RFC XXXX Section 2.1]).
    format: uri
  resource_policy_uri:
    type: string
    description: >-
      URL of a web page detailing the protected resource's policy regarding client
      usage of the data it provides. The target content MAY be internationalized
      (e.g., as specified in [Reference to relevant spec, e.g., RFC XXXX Section 2.1]).
    format: uri
  resource_tos_uri:
    type: string
    description: >-
      URL of a web page specifying the protected resource's terms of service. The
      target content MAY be internationalized (e.g., as specified in [Reference to relevant spec, e.g., RFC XXXX Section 2.1]).
    format: uri
  tls_client_certificate_bound_access_tokens:
    type: boolean
    description: >-
      Boolean value indicating whether the protected resource supports mutual-TLS
      client certificate-bound access tokens [RFC8705]. If omitted, the default
      value is `false`.
    default: false
  authorization_details_types_supported:
    type: array
    description: >-
      A JSON array listing the `type` values supported by the resource server for
      the `authorization_details` parameter defined in [RFC9396].
    items:
      type: string
  dpop_signing_alg_values_supported:
    type: array
    description: >-
      A JSON array listing the JWS `alg` values (from the IANA "JSON Web Signature
      and Encryption Algorithms" registry [IANA.JOSE]) supported by the resource
      server for validating DPoP proof JWTs [RFC9449].
    items:
      type: string
  dpop_bound_access_tokens_required:
    type: boolean
    description: >-
      Boolean value indicating whether the protected resource requires DPoP-bound
      access tokens [RFC9449] for all authorized requests. If omitted, the default
      value is `true`.
    default: true # Explicitly adding default for clarity.
  signed_metadata:
    type: string
    description: >-
      A JWT [RFC7519] containing metadata parameters about the protected resource
      as claims. The value is the JWT itself, represented as a string. This
      `signed_metadata` parameter itself SHOULD NOT appear as a claim within the
      signed JWT; metadata containing such a claim SHOULD be rejected.

  # --- ZETA/ASL Custom Parameters ---
  zeta_asl_use:
    type: string
    description: >-
      Indicates whether and how the ZETA/ASL protocol is utilized by this resource server.
      `not_supported`: ZETA/ASL is not used or supported.
      `required`: ZETA/ASL is mandatory for interaction with this resource server. ZETA/ASL is terminated at the HTTP Proxy.
      `required_passthrough`: ZETA/ASL is mandatory for interaction with this resource server. ZETA/ASL is terminated at the Resource Server.
    enum:
      - not_supported
      - required
      - required_passthrough

  # --- API Versioning ---
  api_versions_supported:
    type: array
    description: >-
      A JSON array listing the supported API versions for this protected resource.
    items:
      type: object
      properties:
        major_version:
          type: integer
          description: The major version number of the API.
        version:
          type: string
          description: The full, stable Semantic Versioning (SemVer) compliant string for this API version.
        status:
          type: string
          description: The release status of this API version.
          enum: [stable, beta, alpha, deprecated, retired]
        documentation_uri:
          type: string
          format: uri
          description: >-
            URL of the documentation specific to this API version.
      required:
        - major_version
        - version
        - status

required:
  - resource
  - authorization_servers
  - scopes_supported
  - zeta_asl_use
