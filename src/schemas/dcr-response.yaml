# Schema für die Antworten des AuthS auf die Dynamic Client Registration
#
# Fasst alle erfolgreichen Antworten der Client-Registrierung zusammen:
#   - 201 Created  → definitions/ClientInformationResponse (dieses Schema)
#   - 202 Accepted → dcr-response-202.yaml (führend, unverändert eingebunden)
# Fehlerantworten (RFC 7591 Abschnitt 3.2.2, z. B. invalid_redirect_uri,
# invalid_client_metadata) folgen zeta-error.yaml.
$schema: "http://json-schema.org/draft-07/schema#"
schemaVersion: "1.2.0"
title: DCR Response
description: >-
  Antwort des AuthS auf POST /register, POST /register/verify sowie
  GET /register/{client_id}.

  Welche Antwort vorliegt, ergibt sich aus dem HTTP-Status: 201 Created
  (Registrierung abgeschlossen bzw. Lesen der Registrierung) liefert eine
  ClientInformationResponse; 202 Accepted (asynchrone Challenge, nur
  stationäre TPM-Clients) liefert eine Antwort gemäß dcr-response-202.yaml.
  Die beiden Zweige sind auch am Body eindeutig unterscheidbar: Nur die
  ClientInformationResponse enthält client_id, nur die 202-Antwort
  transaction_id.

  Fehlerantworten (HTTP 4xx) folgen zeta-error.yaml.

  Für Codegeneratoren: Die Wurzel ist bewusst kein oneOf. Generierter Code
  bindet je HTTP-Status direkt an definitions/ClientInformationResponse (201)
  bzw. dcr-response-202.yaml (202). Die Wurzel dient nur der Validierung eines
  Bodys ohne Kenntnis des Status.
type: object
# Validierungsregel "genau eine der beiden Antworten" als if/then/else statt
# oneOf an der Wurzel. Ohne gemeinsames Unterscheidungsfeld (discriminator)
# führt openapi-generator (Kotlin) ein oneOf zu einer Klasse zusammen, die
# nicht kompiliert. Gleiche gültige Instanzen wie zuvor: Ohne transaction_id
# kann nur die ClientInformationResponse zutreffen (die 202-Antwort verlangt
# das Feld); mit transaction_id gilt unverändert "genau eine von beiden".
if:
  required: [transaction_id]
then:
  oneOf:
    - $ref: "#/definitions/ClientInformationResponse"
    - $ref: "./dcr-response-202.yaml"
else:
  $ref: "#/definitions/ClientInformationResponse"

definitions:
  ClientInformationResponse:
    title: Client Information Response (201 Created)
    type: object
    description: >-
      Client Information Response gemäß RFC 7591 Abschnitt 3.2.1, ergänzt um die
      ZETA-spezifischen Pinning-Attribute. Wird zurückgegeben bei

        - POST /register: Registrierung direkt abgeschlossen (mobile Clients,
          Fast-Path, stationäre Apple- und Software-Clients),
        - POST /register/verify: TPM-Challenge erfolgreich gelöst,
        - GET /register/{client_id}: Lesen der eigenen Registrierung (RFC 7592).

      Es wird KEIN Registration Access Token (registration_access_token,
      registration_client_uri) ausgestellt (A_30101); Folgeoperationen auf die
      Registrierung autorisiert der Client je Request per Client Assertion.

      Pflicht ist ausschließlich client_id. Alle weiteren Felder sind optional:
      Für Clients, die vor Einführung des Pinnings registriert wurden, fehlen die
      Pinning-Attribute im Datensatz (binding_status: legacy_unpinned), und die
      Verwaltungsfelder (email_verification, key_overlap, registered_at,
      resource) sind nur bei GET /register/{client_id} sinnvoll belegt.
    required: [client_id]
    properties:
      client_id:
        type: string
        description: >-
          Vom AuthS vergebene Client-Kennung. Nicht geheim; dient als Selektor für
          die Verwaltungsoperationen unter /register/{client_id}. Die Autorisierung
          erfolgt stets per Client Assertion (F2).
      client_id_issued_at:
        type: integer
        description: Zeitpunkt der Vergabe der client_id (Unix-Zeit in Sekunden, RFC 7591).
      status:
        description: >-
          Informativer Registrierungsstatus. Der Client DARF seine Ablauflogik NICHT
          auf dieses Feld stützen: Ob eine E-Mail-Bindung (TOFU) erforderlich ist,
          ergibt sich für mobile Clients ausschließlich aus dem am Token-Endpunkt
          gewährten scope (zeta:email-binding / zeta:email-verify); stationäre
          Clients setzen nach der Registrierung stets mit dem Token Exchange fort.
          Der AuthS KANN das Feld weglassen.

          Werte gemäß Registrierungs-Statusmodell A_30086 (seit Schema 1.2.0). Den
          Lebenszyklus bestimmt der AuthS bei POST /register aus grant_types, nicht
          aus der Plattform:
            - pending_user_binding: mobile, identitätsgebundene Registrierung
              (grant_types mit authorization_code) nach POST /register;
              TI-Identität und E-Mail (F1) noch nicht gebunden.
            - bound: identitätsgebundene Registrierung mit TI-Identität und
              verifizierter E-Mail (F1), z. B. Fast-Path mit zeta_attestation_token.
            - registered: stationäre (SMC-B) oder identitätslose Registrierung nach
              POST /register bzw. bei TPM nach erfolgreichem POST /register/verify.
            - active: stationäre oder identitätslose Registrierung nach dem ersten
              erfolgreichen Token Exchange mit Policy-Entscheidung allow (nur bei
              GET /register/{client_id} zu erwarten).
          Der Status tombstone (A_30086) wird nicht zurückgegeben, da die
          Registrierung dann entfernt ist.

          Veraltete Werte (bis Schema 1.1.0, Implementierungen vor A_30086). Der
          AuthS SOLL sie nicht mehr ausgeben. Der Client behandelt sie wie jeden
          anderen Wert: status ist informativ und steuert keine Ablauflogik.
            - pending_attestation: entspricht registered (stationärer TPM-Client).
            - pending_verification: entspricht registered (stationärer Apple- oder
              Software-Client). Unberührt davon bleibt pending_verification
              Pflichtwert der 202-Antwort gemäß dcr-response-202.yaml (offene
              Challenge, kein Registrierungsstatus).

          Offenes Enum: weitere Werte sind zulässig und vom Client zu ignorieren.
        # Offenes Enum: type: string ohne constrainendes enum; die bekannten Werte
        # stehen dokumentarisch in x-extensible-enum. Gültig ist wie bisher jeder
        # String (vorher anyOf aus enum und string, das Generatoren als Union
        # mit untypisiertem Zweig abbilden).
        type: string
        x-extensible-enum: [pending_user_binding, bound, registered, active, pending_attestation, pending_verification]
      client_name:
        type: string
        description: Echo des registrierten client_name (RFC 7591).
      token_endpoint_auth_method:
        type: string
        description: Echo der registrierten Authentisierungsmethode, in ZETA "private_key_jwt".
      grant_types:
        type: array
        items: { type: string }
        description: Echo der registrierten grant_types (RFC 7591).
      redirect_uris:
        $ref: "./dcr-request.yaml#/definitions/redirect_uris"
      jwks:
        type: object
        description: Registrierter öffentlicher Client-Instanzschlüssel (PuK.Client.Sig).
        properties:
          keys:
            type: array
            items: { $ref: "./dcr-request.yaml#/definitions/jwk" }
        required: [keys]
      attestation_type:
        type: string
        enum: [tpm, apple, android, software]
        description: >-
          Bei der Erstregistrierung nachgewiesenes Attestierungsverfahren; im
          Fast-Path aus dem zeta_attestation_token übernommen (dort nie
          "software"). Unveränderlich für die Lebensdauer der client_id. Fehlt nur
          bei Datensätzen von vor Einführung des Pinnings
          (binding_status: legacy_unpinned).
      platform:
        $ref: "./dcr-request.yaml#/definitions/platform"
      product_id:
        $ref: "./dcr-request.yaml#/definitions/product_id"
      product_version:
        $ref: "./dcr-request.yaml#/definitions/product_version"
      ak_jkt:
        type: string
        description: >-
          RFC-7638-Thumbprint des bei der Registrierung verifizierten Attestation
          Keys (PuK.AK.Sig). Vertrauensanker für alle späteren Attestierungen:
          Der AuthS prüft Posture-Nachweise am Token-Endpunkt gegen DIESEN
          Schlüssel, nie gegen einen im Request gelieferten. Fehlt bei
          attestation_type "software" und bei Legacy-Datensätzen.
      ek_root_fingerprint:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: >-
          Nur bei attestation_type "tpm": bei der Registrierung gepinnter
          Vertrauensanker der EK-Zertifikatskette (A_30335), SHA-256 über die
          DER-Kodierung des Ankerzertifikats, 64 Hexadezimalzeichen in
          Kleinbuchstaben. Ergänzt in Schema 1.1.0.
      client_key_binding:
        type: string
        enum: [none, pop_static, pop, tpm_certified]
        description: >-
          Wie der Besitz und die Hardware-Bindung des Client Instance Keys
          bei der Registrierung nachgewiesen wurden:
          "none" – kein Besitznachweis (Software-Registrierung ohne
          signed_hash_puk_client_sig; TPM-Registrierung ohne client_key_pop);
          "pop_static" – Selbstsignatur mit PrK.Client.Sig über
          SHA-256(puk_client_sig) OHNE Nonce geprüft (Zweige apple,
          android, Fast-Path und Software, wenn der Request keine nonce
          enthält). Die Signatur ist
          statisch und von jedem wiederverwendbar, der einen
          Registrierungs-Request gesehen hat; sie belegt nicht, dass der
          Absender den Schlüssel besitzt;
          "pop" – Selbstsignatur über SHA-256(puk_client_sig || nonce) mit
          einer frischen Nonce des AuthS geprüft (signed_hash_puk_client_sig
          mit nonce bzw. client_key_pop);
          "tpm_certified" – wie "pop", zusätzlich tpm_certify_info geprüft:
          der Schlüssel liegt im selben TPM wie der Attestation Key. Der Wert
          gilt erst nach erfolgreichem POST /register/verify.
          Optional aus Kompatibilitätsgründen; fehlt das Feld, ist "none"
          anzunehmen. Ergänzt in Schema 1.1.0. Der Wert
          wird an die Policy Engine übergeben (policy-engine-client-data.yaml).
          Nach einem Schlüssel-Rollover bestimmt
          der AuthS den Wert für den NEUEN Schlüssel neu: Der Rollover weist
          dessen Besitz mit einer Nonce nach (innere Signatur), also "pop";
          "tpm_certified" bleibt nur, wenn der Rollover einen neuen
          Certify-Nachweis für den neuen Schlüssel trägt – das heutige
          Rollover-Format trägt keinen, der Wert fällt also auf "pop".
      binding_status:
        type: string
        enum: [pinned, legacy_unpinned]
        default: legacy_unpinned
        description: >-
          Ob attestation_type (und ggf. ak_jkt) im Datensatz gepinnt sind.
          "pinned" gilt für jede Registrierung nach dieser Spezifikationsversion,
          auch wenn platform/product_id im Request fehlten. "legacy_unpinned"
          kennzeichnet Clients von vor Einführung des Pinnings; sie wechseln nach
          einer erneuten Registrierung (für Hardware-Clients über den Fast-Path)
          zu "pinned". Der Wert wird an die Policy Engine übergeben
          (policy-engine-client-data.yaml).
      registered_at:
        type: integer
        description: >-
          Zeitpunkt der Erstregistrierung (Unix-Zeit in Sekunden). Quelle für
          registration_timestamp in policy-engine-client-data.yaml.
      resource:
        type: array
        items: { type: string, format: uri }
        description: Resource-Indikatoren (RFC 8707), für die der Client registriert ist.
      email_verification:
        type: object
        description: >-
          Stand der identitätsgebundenen E-Mail-Bindung (F1), die nach der
          OIDC-Nutzerauthentisierung über /zeta/identity/bind-email erfolgt
          (A_30085). Nur bei mobilen Clients; die Korrelation erfolgt über das
          E-Mail-Binding-Token, nicht über eine transaction_id.
        properties:
          required: { type: boolean }
          status: { type: string, enum: [pending, verified] }
      key_overlap:
        type: object
        description: Nur nach einem Schlüssel-Rollover vorhanden.
        properties:
          old_jkt: { type: string }
          grace_until: { type: integer }
