# Schema for HTTP ZETA Error Response
#
# Wird von allen ZETA Guard Endpunkten (Authorization Server / PDP, PEP HTTP Proxy,
# Client-Registrierung und Client Management) für Fehlerantworten verwendet
# (A_26662, Content-Type application/json).
#
# 1.4.0: Fehlercodes vereinheitlicht (gemSpec_ZETA V11, Tabelle ZT_PDP_Fehlerfaelle):
# session_terminated/refresh_token_revoked deprecated (jetzt 400 invalid_grant),
# use_dpop_nonce in ZETA nicht verwendet, Codes des Client Management in snake_case
# aufgenommen (ersetzen den camelCase-ProblemCode aus application/problem+json). Fachliche Fehler des
# dahinterliegenden Resource Servers werden hingegen unverändert durchgereicht und
# folgen NICHT diesem Schema (A_29853).
#
# 1.5.0 (abwärtskompatibel, offenes Enum): tpm_certify_required ergänzt
# (Rollover im TPM-Zweig ohne Key Certification nach dem Stichtag, Vorschlag
# A_30189-01); invalid_attestation auch beim Rollover.
#
# 1.6.0 (abwärtskompatibel, keine neuen Codes): Client Management nach Zielbild
# (Ersatz gemSpec_ZETA 2.0.1 Kap. 5.5.5–5.5.10, Platzhalter-IDs A_CM-nn,
# Tab_ZETA_CM_Fehler). registration_conflict und otp_send_limited präzisiert;
# tombstoned, factor_required, pop_required und email_mismatch haben im Client
# Management keinen Auslöser mehr (DEPRECATED, bleiben im offenen Enum).
# attestation_pop_required bleibt für den fehlenden attestation_pop nach dem
# Stichtag (Tab-ZETA-PDP-Fehlerfälle-Rollover O03, A_CM-44).
#
# 1.6.1 (nur Kommentar): tpm_certify_required gilt sofort, ohne Stichtag;
# attestation_pop_required gilt bei attestation_type tpm ebenfalls sofort
# (TPM-Attestierung nicht Teil von Stufe 1 und 2; dcr-request.yaml 2.0.0).
$schema: "http://json-schema.org/draft-07/schema#"
schemaVersion: "1.6.1"
title: HTTP ZETA Error Response
description: Schema for transmitting error information for HTTP ZETA error response.
type: object
properties:
  error:
    # Der maschinenlesbare Fehlercode. Der Wertebereich (definitions/errorCode)
    # umfasst die ZETA-spezifischen Codes sowie die von den jeweiligen Endpunkten
    # gemäß den zugrunde liegenden RFCs (OAuth 2.0, Token Exchange, Bearer, DPoP)
    # verwendeten Standard-Codes.
    $ref: "#/definitions/errorCode"
  error_description:
    type: string
    description: A human-readable explanation of the error.
  error_uri:
    type: string
    format: uri
    description: A URI that provides more information about the error.
required:
  - error

definitions:
  errorCode:
    type: string
    description: >-
      Standardisierter, maschinenlesbarer Fehlercode einer ZETA-Guard-Fehlerantwort.
      Die Reaktion des Clients richtet sich nach der Kombination aus HTTP-Status
      und Code gemäß Tabelle ZT_PDP_Fehlerfaelle (gemSpec_ZETA 5.4.6.1), z. B.
      erneute Authentifizierung bei `invalid_grant` am Token-Endpunkt beim Refresh,
      Step-Up bei `insufficient_user_authentication`. `error_description` wird vom
      Client nicht ausgewertet. Alle Codes sind snake_case.

      Offenes Enum: Die folgende Liste dokumentiert die bekannten Codes (für
      Codegen und Doku), ist aber NICHT abschließend — jeder weitere String ist
      gültig, damit künftige oder implementierungsspezifische Codes die Validierung
      nicht brechen.
    # anyOf statt eines constrainenden `enum`: Der erste Zweig listet die bekannten
    # Codes (rein dokumentarisch), der zweite akzeptiert jeden weiteren String.
    # Dadurch schlägt die Validierung bei einem nicht gelisteten Code NICHT fehl.
    anyOf:
      - description: Bekannte, standardisierte Fehlercodes.
        enum:
          # --- ZETA-spezifische Codes (gemSpec_ZETA) --------------------------
          # DEPRECATED (1.4.0): Der Authorization Server sendet diese Codes nicht
          # mehr; terminierte Session und widerrufenes Refresh Token werden mit
          # 400 invalid_grant beantwortet (A_29856, A_29998). Ein Client, der sie
          # von einem älteren Server erhält, MUSS sie wie 400 invalid_grant am
          # Token-Endpunkt behandeln (A_NEU_V11-02).
          - session_terminated
          - refresh_token_revoked
          # Step-Up-Authentifizierung erforderlich; 401 mit WWW-Authenticate (RFC 9470),
          # nur von geschützten Endpunkten: PEP mit `zeta-error-origin: pep` (A_29860)
          # und Client Management (Step-up A_CM-25, auch bedingt bei A_CM-33).
          # Der Token-Endpunkt sendet diesen Code nie.
          - insufficient_user_authentication
          # `resource`-Indicator (RFC 8707) benennt eine nicht unterstützte
          # Zielressource; Ablehnung am Token Endpoint. (A_29694, S. 84)
          - invalid_target
          # Rate Limit des Endpunkts überschritten; 429 mit Header `Retry-After`
          # (Sekunden bis zum nächsten zulässigen Versuch). Client SOLL Exponential
          # Backoff anwenden. (A_26668, A_25339)
          - rate_limit_exceeded
          # Rollover: vorhandenes attestation_pop nicht verifizierbar (Signatur,
          # Schlüssel ≠ gepinnter ak_jkt, Daten); 400. (A_30189)
          - invalid_attestation_pop
          # Rollover ohne attestation_pop bei attestation_type ≠ software nach dem
          # Stichtag gemäß A_30193, bei tpm sofort; 400, Client wiederholt einmal mit
          # attestation_pop. (A_30189, Tab-ZETA-PDP-Fehlerfälle-Rollover O03, A_CM-44)
          - attestation_pop_required
          # Rollover bei attestation_type tpm ohne tpm_certify_info/-signature/
          # tpm_client_key_public; 400.
          # (Vorschlag A_30189-01)
          - tpm_certify_required

          # --- Client Management (zeta-guard-client-management.yaml) ----------
          # Replay-Nonce des Rollovers fehlt/verbraucht; 400 mit neuem Header
          # Replay-Nonce, Client wiederholt einmal. (A_29923)
          - bad_nonce
          # Rollover-Envelope nicht an HTTP-Methode/Ziel-URI gebunden (htm/htu); 400. (A_29923)
          - invalid_binding
          # Rollover-Envelope nicht an die Guard-Audience gebunden; 400. (A_29923)
          - wrong_audience
          # Rollover-Envelope zu alt (iat); 400.
          - stale_request
          # Unzulässiger Schlüsselwechsel im Rollover-Envelope; 400.
          - invalid_key_change
          # Äußere Signatur (alter Instanzschlüssel) ungültig; 401. (A_29922)
          - invalid_signature
          # Innere Signatur (neuer Instanzschlüssel) ungültig; 401. (A_29922)
          - invalid_new_key_proof
          # DEPRECATED (1.6.0): Rollover ohne gültige Client Assertion des
          # bisherigen Schlüssels → 401 invalid_client (A_CM-41).
          - pop_required
          # DEPRECATED (1.6.0): kein Tombstone mehr (keine außerordentliche
          # Löschung, A_CM-50).
          - tombstoned
          # Registrierung: Attestierung ungültig; Rollover (TPM): Key Certification
          # nicht verifizierbar; 400.
          - invalid_attestation
          # Registrierung an diesem Guard nicht erlaubt; 403.
          - registration_forbidden
          # Fast-Path-Registrierung für eine TI-Identität, für die an diesem Guard
          # bereits ein Identitätsdatensatz besteht; 409, Client nutzt die
          # Folgeregistrierung. (A_CM-60)
          - registration_conflict
          # TPM ActivateCredential: Aktivierungsgeheimnis falsch; 400.
          - invalid_activation_secret
          # Challenge (TPM, E-Mail-OTP) abgelaufen; 400.
          - challenge_expired
          # E-Mail-OTP falsch; 400.
          - invalid_otp
          # Keine offene Challenge (E-Mail-Bindung, E-Mail-Änderung, Neubindung,
          # Wiederherstellungscode) für diese Registrierung; 404.
          - no_open_challenge
          # Versandgrenze je Challenge (Abstand, Anzahl; A_CM-15) oder Grenze für
          # Fehlversuche bzw. Code-Versand je Identität erreicht (A_CM-17; Sperre
          # für die Sperrdauer); 429 mit Retry-After.
          - otp_send_limited
          # DEPRECATED (1.6.0): bisher nur im Enum geführt, kein Auslöser.
          - email_mismatch
          # DEPRECATED (1.6.0): kein „überlebender Faktor“ mehr; Step-up
          # (insufficient_user_authentication, A_CM-25).
          - factor_required
          # Ziel unbekannt, fremder Identität zugeordnet oder (E-Mail-Änderung,
          # Wiederherstellungscode) Challenge einer anderen Registrierung; 403.
          # (A_CM-27, A_CM-35, A_CM-55)
          - forbidden_target

          # --- OAuth 2.0 Authorization Server / Token Endpoint (RFC 6749 §5.2) -
          - invalid_request
          - invalid_client
          - invalid_grant
          - unauthorized_client
          - unsupported_grant_type
          - invalid_scope
          - access_denied
          - server_error
          - temporarily_unavailable

          # --- Dynamic Client Registration (RFC 7591 §3.2.2) -----------------
          # redirect_uri nicht in der Client-Registry des Provisioning Images
          # für die product_id registriert. (A_xxxx1)
          - invalid_redirect_uri
          - invalid_client_metadata

          # --- Bearer Token / geschützte Ressource (RFC 6750 §3.1) ------------
          - invalid_token
          - insufficient_scope

          # --- DPoP (RFC 9449 §7) ---------------------------------------------
          - invalid_dpop_proof
          # In ZETA nicht verwendet: Nonces kommen ausschließlich aus GET /nonce,
          # es gibt keinen DPoP-Nonce-Header (A_NEU_V11-01). Nur zur
          # Interoperabilität mit generischen RFC-9449-Clients gelistet.
          - use_dpop_nonce
      - description: >-
          Weiterer, hier nicht enumerierter Fehlercode (Forward-Compatibility).
        type: string
