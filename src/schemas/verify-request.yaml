$schema: "http://json-schema.org/draft-07/schema#"
schemaVersion: "1.0.0"
title: Registration Verify Request
type: object
description: >-
  Payload zur Beantwortung einer Challenge mit transaction_id. Bei
  POST /register/verify schließt der Zweig tpm_activation die Registrierung
  stationärer TPM-Clients ab. Der Zweig email_otp wird für
  POST /zeta/identity/email/verify (Änderung der E-Mail-Adresse)
  wiederverwendet; mobile Clients nutzen POST /register/verify nicht.
# Die Variante wird über den `const`-Wert von `verify_type` in den beiden
# oneOf-Zweigen eindeutig bestimmt; die Validierung unter draft-07 ist damit
# deterministisch. Das nachfolgende `discriminator`-Feld ist ein OpenAPI-3-Konstrukt
# (kein draft-07-Keyword) und wird von JSON-Schema-Validatoren ignoriert; es dient
# ausschließlich als Hinweis für den Code-Generator.
oneOf:
  - $ref: "#/definitions/OtpVerifyRequest"
  - $ref: "#/definitions/TpmVerifyRequest"
discriminator:
  propertyName: verify_type

definitions:
  # --- Gemeinsame Basis-Felder ---
  BaseVerifyRequest:
    type: object
    required: [transaction_id]
    properties:
      transaction_id:
        type: string
        format: uuid
        description: Die im 202 Accepted Request empfangene Transaktions-ID.

  # --- E-Mail OTP Fall (nur E-Mail-Änderung über /zeta/identity/email/verify;
  #     die TOFU-E-Mail-Bindung nutzt /zeta/identity/bind-email/verify ohne transaction_id) ---
  OtpVerifyRequest:
    type: object
    allOf:
      - $ref: "#/definitions/BaseVerifyRequest"
      - type: object
        required: [verify_type, code]
        properties:
          verify_type:
            type: string
            const: email_otp
          code:
            type: string
            description: Der vom Nutzer eingegebene Bestätigungscode (OTP).
            minLength: 4
            maxLength: 10
            example: "123456"

  # --- TPM MakeCredential Fall ---
  TpmVerifyRequest:
    type: object
    allOf:
      - $ref: "#/definitions/BaseVerifyRequest"
      - type: object
        required: [verify_type, tpm_decrypted_secret]
        properties:
          verify_type:
            type: string
            const: tpm_activation
          tpm_decrypted_secret:
            type: string
            description: >-
              Das entschlüsselte Geheimnis (Secret/Seed) im Base64-Format. 
              Dies ist der Output des lokalen TPM2_ActivateCredential Befehls 
              auf dem Client-Gerät. Der Server vergleicht diesen Wert mit 
              dem ursprünglich generierten Klartext-Geheimnis.
