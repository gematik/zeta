# Schema for the Client Assertion JWT
$schema: "http://json-schema.org/draft-07/schema#"
schemaVersion: "1.0.2"
title: Client Assertion JWT
description: >-
  Schema for the payload of a Client Assertion JWT used in ZETA, as
  defined in RFC 7523, with custom claims for client attestation.

  Clarification 1.0.2 (description only, valid instances unchanged): following
  the client-management target model (replacing
  gemSpec_ZETA 2.0.1 A_30101), the per-request assertion in the
  `Client-Assertion` header is used only for operations on the caller's own
  registration — read and self-deregistration (`/register/{client_id}`), rollover nonce and rollover and the status of a
  re-binding. All other Client Management operations use an
  access token (management token or email-binding token).
type: object
properties:
  header:
    type: object
    properties:
      typ:
        type: string
        description: Type of the JWT, which MUST be 'JWT'.
        enum:
          - JWT
      alg:
        type: string
        description: Algorithm used to sign the JWT, which MUST be 'ES256'.
        enum:
          - ES256
      jwk:
        type: object
        description: >
          Public key of the client in JWK format.   Used instead of x5c because
          no X.509 certificate is present.
        properties:
          kty:
            type: string
            enum: [ "EC" ]
            description: Key type (elliptic curve).
          crv:
            type: string
            enum: [ "P-256" ]
            description: Elliptic curve used for ES256.
          x:
            type: string
            # contentEncoding statt format: byte – der Wert ist Base64URL (RFC
            # 7518); format: byte steht für Standard-Base64, und generierter
            # Java-Code scheitert damit an den Zeichen "-" und "_".
            contentEncoding: base64url
            description: X coordinate of the EC public key (Base64URL).
          y:
            type: string
            contentEncoding: base64url
            description: Y coordinate of the EC public key (Base64URL).
        required:
          - kty
          - crv
          - x
          - y
    required:
      - typ
      - alg
      - jwk
  payload:
    type: object
    properties:
      iss:
        type: string
        description: Issuer of the JWT, which MUST be the client_id of the client.
      sub:
        type: string
        description: Subject of the JWT, which MUST be the OAuth 2.0 client_id of the
          client.
      aud:
        type: array
        items:
          type: string
          description: Audience for the JWT. It MUST identify the Authorization Server;
            for OAuth requests the Authorization Server's token endpoint URL, for
            own-registration operations the issuer of the Authorization
            Server.
        minItems: 1
      exp:
        type: integer
        description: Expiration time of the JWT in seconds since epoch. For
          own-registration operations the lifetime MUST NOT exceed 60
          seconds.
      jti:
        type: string
        description: JWT ID, a unique identifier for the token. For own-registration
          operations the Authorization Server rejects a re-used jti within
          the lifetime of the assertion (replay protection).

      htm:
        type: string
        description: >
          HTTP method of the request in upper case, formed as defined in RFC 9449
          section 4.2. Only present for own-registration operations, where it
          binds the assertion to the request and prevents its re-use against another
          endpoint.
        example: DELETE
      htu:
        type: string
        format: uri
        description: >
          Target URI of the request without query and fragment, formed as defined in
          RFC 9449 section 4.2. Only present for own-registration operations.
        example: https://as.example.com/register/abc123

      client_statement:
        description: A client statement object, as defined in client-statement.yaml.
          The following rule is a clarification of this schema (1.0.1); it is
          NOT stated in gemSpec_ZETA 2.0.0, whose table says "only present in
          the registration flow", and presupposes a change request to the
          specification.
          Present in token requests that open a session — token exchange with an
          SM(C)-B signed subject token, authorization_code and jwt-bearer —
          where the Authorization Server verifies the posture and passes it to
          the Policy Engine. Optional for the refresh_token grant and for the
          redemption of the email-binding token; if absent there, the
          Authorization Server uses the client data verified when the session
          was opened, together with their original attestation_timestamp
          (policy-engine-client-data.yaml), so that the policy can judge
          their age. If it is missing in a request that opens a session, the
          Authorization Server answers 400 invalid_request. Not used for PAR,
          revocation and client-management requests; if sent there, the
          Authorization Server ignores it. It is never sent with POST
          /register, which carries no client assertion.
        $ref: "client-statement.yaml"

    required:
      - iss
      - sub
      - aud
      - exp
      - jti
