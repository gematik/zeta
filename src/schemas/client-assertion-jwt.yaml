# Schema for the Client Assertion JWT
$schema: "http://json-schema.org/draft-07/schema#"
schemaVersion: "1.0.0"
title: Client Assertion JWT
description: Schema for the payload of a Client Assertion JWT used in ZETA, as
  defined in RFC 7523, with custom claims for client attestation.
type: object
properties:
  header:
    type: object
    properties:
      typ:
        type: string
        description: Type of the JWT, which MUST be 'JWT'.
        enum:
          - JWT
      alg:
        type: string
        description: Algorithm used to sign the JWT, which MUST be 'ES256'.
        enum:
          - ES256
      jwk:
        type: object
        description: >
          Public key of the client in JWK format.   Used instead of x5c because
          no X.509 certificate is present.
        properties:
          kty:
            type: string
            enum: [ "EC" ]
            description: Key type (elliptic curve).
          crv:
            type: string
            enum: [ "P-256" ]
            description: Elliptic curve used for ES256.
          x:
            type: string
            format: byte
            description: X coordinate of the EC public key (Base64URL).
          y:
            type: string
            format: byte
            description: Y coordinate of the EC public key (Base64URL).
        required:
          - kty
          - crv
          - x
          - y
    required:
      - typ
      - alg
      - jwk
  payload:
    type: object
    properties:
      iss:
        type: string
        description: Issuer of the JWT, which MUST be the client_id of the client.
      sub:
        type: string
        description: Subject of the JWT, which MUST be the OAuth 2.0 client_id of the
          client.
      aud:
        type: array
        items:
          type: string
          description: Audience for the JWT. It MUST identify the Authorization Server;
            for OAuth requests the Authorization Server's token endpoint URL, for
            client-management operations (A_30101) the issuer of the Authorization
            Server.
        minItems: 1
      exp:
        type: integer
        description: Expiration time of the JWT in seconds since epoch. For
          client-management operations (A_30101) the lifetime MUST NOT exceed 60
          seconds.
      jti:
        type: string
        description: JWT ID, a unique identifier for the token. For client-management
          operations (A_30101) the Authorization Server rejects a re-used jti within
          the lifetime of the assertion (replay protection).

      htm:
        type: string
        description: >
          HTTP method of the request in upper case, formed as defined in RFC 9449
          section 4.2. Only present for client-management operations (A_30101), where it
          binds the assertion to the request and prevents its re-use against another
          management endpoint.
        example: DELETE
      htu:
        type: string
        format: uri
        description: >
          Target URI of the request without query and fragment, formed as defined in
          RFC 9449 section 4.2. Only present for client-management operations (A_30101).
        example: https://as.example.com/zeta/clients/abc123

      client_statement:
        description: A client statement object, as defined in client-statement.yaml.
          This property is optional and only present during an attestation flow.
        $ref: "client-statement.yaml"

    required:
      - iss
      - sub
      - aud
      - exp
      - jti
