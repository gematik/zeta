$schema: "http://json-schema.org/draft-07/schema#"
schemaVersion: "1.0.1"
title: DCR Accepted Response (202)
type: object
description: >-
  Wird vom ZETA Guard zurückgegeben, wenn eine Anfrage kryptografisch valide
  war, aber eine asynchrone Herausforderung (Challenge) gelöst werden muss.
  Bei POST /register betrifft das ausschließlich stationäre TPM-Clients
  (challenge_type tpm_activation), die vor Vergabe der endgültigen client_id
  die ActivateCredential-Challenge über POST /register/verify lösen. Mobile
  Clients erhalten bei POST /register direkt 201 Created (Status
  pending_user_binding); ihre E-Mail-Bindung (TOFU) erfolgt nach der
  OIDC-Nutzerauthentisierung über /zeta/identity/bind-email ohne
  transaction_id. Der Zweig email_otp wird nur noch für die Änderung der
  E-Mail-Adresse (POST /zeta/identity/email) verwendet.
# Die Variante wird über den `const`-Wert von `challenge_type` in den beiden
# oneOf-Zweigen eindeutig bestimmt; die Validierung unter draft-07 ist damit
# deterministisch. Das nachfolgende `discriminator`-Feld ist ein OpenAPI-3-Konstrukt
# (kein draft-07-Keyword) und wird von JSON-Schema-Validatoren ignoriert; es dient
# ausschließlich als Hinweis für den Code-Generator.
oneOf:
  - $ref: "#/definitions/OtpChallengeResponse"
  - $ref: "#/definitions/TpmChallengeResponse"
discriminator:
  propertyName: challenge_type

definitions:
  # --- Gemeinsame Basis-Felder ---
  BaseResponse:
    type: object
    required: [transaction_id, status, expires_in]
    properties:
      transaction_id:
        type: string
        format: uuid
        description: >-
          Temporäre Transaktions-ID. Muss vom Client im /verify Request 
          wieder mitgeschickt werden.
      status:
        type: string
        enum: [pending_verification]
        description: Der aktuelle Status der Registrierung.
      expires_in:
        type: integer
        description: Zeit in Sekunden, bis die transaction_id abläuft (z.B. 600).

  # --- E-Mail OTP Fall (nur E-Mail-Änderung, nicht POST /register) ---
  OtpChallengeResponse:
    type: object
    allOf:
      - $ref: "#/definitions/BaseResponse"
      - type: object
        required: [challenge_type, message_id]
        properties:
          challenge_type:
            type: string
            const: email_otp
          message_id:
            type: string
            enum: [otp_verification, otp_email_change]
            description: >-
              Identifikator des Nachrichtentyps gemäß Nachrichtenkatalog
              (gemSpec_ZETA, Tab_gemSpec_ZETA_Nachrichtenkatalog). Der Client
              zeigt dazu einen lokalisierten Text aus den eigenen
              App-Ressourcen an. otp_email_change (N8): Bestätigungscode an
              die neue Adresse bei POST /zeta/identity/email – der Wert für
              diesen Zweig. otp_verification (N7): Bestätigungscode der
              E-Mail-Bindung; bleibt zulässig, weil Schema 1.0.0 nur diesen
              Wert kannte (seit 1.0.1 ist otp_email_change ergänzt).

  # --- TPM MakeCredential Fall ---
  TpmChallengeResponse:
    type: object
    allOf:
      - $ref: "#/definitions/BaseResponse"
      - type: object
        required: [challenge_type, tpm_credential_blob, tpm_encrypted_secret]
        properties:
          challenge_type:
            type: string
            const: tpm_activation
          tpm_credential_blob:
            type: string
            description: >-
              Base64-kodierter CredentialBlob (TPM2B_ID_OBJECT), generiert 
              durch den TPM-Befehl MakeCredential auf dem Server.
          tpm_encrypted_secret:
            type: string
            description: >-
              Base64-kodiertes verschlüsseltes Geheimnis (TPM2B_ENCRYPTED_SECRET), 
              generiert durch MakeCredential. Der Client benötigt dies für ActivateCredential.
