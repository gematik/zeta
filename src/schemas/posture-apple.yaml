# ===================================================================
# Hauptschema für Apple Posture
# ===================================================================
# Beschreibt die Daten, die von einer Apple-App (iOS, iPadOS, macOS) zur Überprüfung ihrer
# Integrität gesendet werden. Die Struktur ist flach und enthält
# die dekodierten Inhalte der Attestation- und Assertion-Objekte.
# ===================================================================
$schema: "http://json-schema.org/draft-07/schema#"
schemaVersion: "1.1.0"
title: Apple Posture
description: >-
  The posture of the client instance. The structure depends on the platform.
  Hardware-gestützter Laufzeitnachweis (A_29810,
  Abb-ZETA-Client-Statement-mit-Apple-AppAttest): Der ZETA Client bildet
    clientDataHash = SHA-256(nonce || posture_c14n || puk_client_sig)
  mit
  - nonce: UTF-8-Bytes des vom AuthS gelieferten Nonce-Strings (= Feld nonce),
  - posture_c14n: UTF-8-Bytes der JCS-Kanonisierung (RFC 8785) dieses
    Posture-Objekts OHNE die Felder assertion, signature und
    assertionAuthenticatorData (sie entstehen erst nach der Hashbildung).
    Alle übrigen gesendeten Felder gehen ein: nonce, die Basis-Felder sowie –
    falls ein Client sie noch sendet – fmt, attStmt, authData und
    client_data_json. Der AuthS kanonisiert genau das empfangene Objekt ohne
    die drei ausgenommenen Felder,
  - puk_client_sig: PuK.Client.Sig in der Byte-Repräsentation nach
    dcr-request.yaml, definitions/puk_client_sig_bytes,
  und übergibt clientDataHash an DCAppAttestService.generateAssertion. Das
  Ergebnis sendet er unverändert im Feld assertion.
  Der AuthS prüft nonce (ausgestellt, unverbraucht, nicht abgelaufen), rechnet
  clientDataHash nach, verifiziert die Signatur der Assertion über
  SHA-256(authenticatorData || clientDataHash) gegen den bei der DCR gepinnten
  Attestation Key (ak_jkt), vergleicht rpIdHash mit der gepinnten App-Identität
  und prüft, dass der Counter größer ist als der zuletzt gespeicherte Wert.
  Änderungen 1.0.0 → 1.1.0 (abwärtskompatibel, kein required-Block erweitert):
  nonce und assertion ergänzt. Ohne das Feld assertion liegen dem AuthS die
  signierten authenticatorData-Bytes nicht vor (assertionAuthenticatorData
  enthält die Flags nicht); die Signatur ist dann nicht nachprüfbar. Neue
  Clients MÜSSEN nonce und assertion senden. Im Schema sind beide Felder aus
  Kompatibilitätsgründen nicht verpflichtend. Fehlt assertion (Client nach
  Schema 1.0.0), lehnt der AuthS den Request nicht ab, setzt aber
  attestation_result.apple.assertion_verified = false
  (policy-engine-client-data.yaml); die Policy Engine entscheidet. Das ist
  eine Legacy-Form: Ab dem Stichtag (Vorschlag: 01.01.2028, wie die übrigen
  Legacy-Formen in A_30193) lehnt der AuthS ein Client Statement mit
  posture_type "apple" ohne assertion mit invalid_client ab. Ist
  assertion vorhanden und schlägt eine der Prüfungen fehl (nonce,
  clientDataHash, Signatur, rpIdHash, Counter nicht gestiegen), lehnt der
  AuthS den Request mit invalid_client ab – wie A_30349 für Android und wie
  A_30192 für einen vorhandenen, aber ungültigen Besitznachweis. Ein nicht
  gestiegener Counter ist das Signal für einen kopierten Schlüssel.
  Nonce-Verbrauch: dcr-request.yaml, definitions/nonce.
  Die Felder fmt, attStmt und authData stammen aus der Initial-Attestierung,
  die bereits bei der DCR als apple_attestation_object übertragen wird; sie
  sind hier nur informativ und KEIN Vertrauensanker. client_data_json ist
  ebenfalls nur informativ; neue Clients SOLLEN diese vier Felder weglassen.
  Hinweis: format: base64 ist kein in draft-07 definiertes Format und wird
  von Validatoren nicht geprüft; es dokumentiert die Kodierung.
type: object
properties:
  # -------------------------------------------------------------------
  # Basis-Felder (ehemals BasePosture)
  # -------------------------------------------------------------------
  platform_product_id:
    $ref: "./product-id-apple.yaml"
    description: The product identifier for Apple apps
  product_id:
    type: string
    description: The gematik product identifier
  product_version:
    type: string
    description: The product version
  system_version:
    type: string
    description: Operating system version, e.g., 10.15.7
  system_name:
    type: string
    description: The name of the operating system running on the device.
  device_model:
    type: string
    description: The model of the device, e.g., "iPhone6,2"
  key_id:
    type: string
    format: base64
    description: The key identifier associated with the cryptographic key on the device (base64 encoded).

  # -------------------------------------------------------------------
  # Felder aus dekodiertem Attestation-Objekt (nur bei Initial-Attestation)
  # -------------------------------------------------------------------
  fmt:
    type: string
    description: The format of the attestation statement. For Apple App Attest, this is 'apple-appattest'.
    const: "apple-appattest"
  attStmt:
    type: object
    description: The attestation statement containing the actual attestation data.
    properties:
      x5c:
        type: array
        items:
          type: string
          format: base64
        description: A chain of X.509 certificates, starting with the credential certificate.
      receipt:
        type: string
        format: base64
        description: An Apple-specific receipt for device risk assessment.
    required:
      - x5c
      - receipt
  authData:
    type: object
    description: Structured authenticator data from the initial attestation.
    properties:
      rpidHash:
        type: string
        # format: base64 wie die übrigen Felder dieses Schemas (vorher
        # format: byte, das Generatoren als Byte-Array mit strengem
        # Standard-Base64-Dekoder abbilden).
        format: base64
        description: SHA256 hash of the Relying Party ID (App ID).
      flags:
        type: string
        description: A byte of flags indicating the authenticator's state.
      counter:
        type: integer
        description: Signature counter, which is 0 during initial attestation.
      aaguid:
        type: string
        description: Authenticator Attestation Globally Unique Identifier, indicating the environment (dev/prod).
      credentialId:
        type: string
        description: Hash of the public key of the attested key pair.
    required:
      - rpidHash
      - flags
      - counter
      - aaguid
      - credentialId

  # -------------------------------------------------------------------
  # Laufzeitnachweis (Assertion)
  # -------------------------------------------------------------------
  nonce:
    type: string
    description: >-
      Die vom AuthS über GET /nonce bezogene Nonce, unverändert als String.
      Geht als UTF-8-Bytes in clientDataHash ein (siehe Schemabeschreibung).
      Einmalig verwendbar. Format nach A_28144-01 (base64url ohne Padding, 22 Zeichen; siehe dcr-request.yaml, definitions/nonce).
  assertion:
    type: string
    format: base64
    description: >-
      Das von DCAppAttestService.generateAssertion(keyId:clientDataHash:)
      gelieferte CBOR-Objekt (Map mit signature und authenticatorData),
      unverändert und Base64-kodiert. Der AuthS entnimmt ihm die
      authenticatorData-Bytes (rpIdHash, Flags, Counter) und die Signatur und
      verifiziert ausschließlich gegen den gepinnten Attestation Key (ak_jkt).
      Entspricht funktional signed_client_data_hash in posture-android.yaml.
  # -------------------------------------------------------------------
  # Felder aus dekodiertem Assertion-Objekt (informativ; maßgeblich ist das
  # Feld assertion)
  # -------------------------------------------------------------------
  signature:
    type: string
    format: base64
    description: The cryptographic signature created by the private key on the device.
  assertionAuthenticatorData:
    type: object
    description: Simplified authenticator data for subsequent assertions.
    properties:
      rpidHash:
        type: string
        # format: base64 wie die übrigen Felder dieses Schemas (vorher
        # format: byte, das Generatoren als Byte-Array mit strengem
        # Standard-Base64-Dekoder abbilden).
        format: base64
        description: SHA256 hash of the Relying Party ID (App ID).
      counter:
        type: integer
        description: Signature counter, incremented for each assertion to prevent replay attacks.
    required:
      - rpidHash
      - counter
  client_data_json:
    type: string
    # contentMediaType statt format: json – "json" ist kein definiertes Format;
    # Generatoren bilden daraus einen rohen JSON-Wert statt eines Strings.
    contentMediaType: application/json
    description: A JSON string containing the request data to be signed, including a server-provided challenge.

required:
  - platform_product_id
  - product_id
  - product_version
  - system_version
  - system_name
  - device_model
  - key_id
