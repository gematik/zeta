# Schema for the Token Endpoint response of the PDP authorization server.
# Returned by POST /token. The issued access token is
# DPoP-bound (RFC 9449) and follows access-token.yaml.
# See also https://www.rfc-editor.org/rfc/rfc6749#section-5.1
$schema: "http://json-schema.org/draft-07/schema#"
schemaVersion: "1.5.0"
title: Token Response
description: >-
  Schema for the JSON response body returned by the token endpoint of the PDP
  authorization server. The response depends on the Policy Engine decision
  (pdp-decision.yaml):

  - On an allow decision (`result.allow` = true) the endpoint issues the tokens
    and returns a success response as defined in RFC 6749 Section 5.1 with
    ZETA-specific DPoP binding.

  - On a deny decision (`result.allow` = false) NO tokens are issued; the
    endpoint returns an error response following zeta-error.yaml that conveys the
    denial `result.reasons` from pdp-decision.yaml.

  Change 1.2.1 -> 1.3.0: token_type "Bearer" added, permitted only for the
  token exchange of Workload Identity Federation (gemSpec_ZETA 2.0.1 A_28431); the access token then follows
  access-token-workload.yaml. Generated enums gain one value.

  Change 1.3.0 -> 1.4.0 (backward compatible): denyResponse gains the optional
  fields acr_values (required together with error `insufficient_acr`) and
  max_age; neither appears with any other error
  (Tab-ZETA-PDP-Fehlerfälle-Token-Endpunkt T15).

  Change 1.4.0 -> 1.5.0 (backward compatible; to be implemented from Stufe 3
  on): denyResponse gains the optional fields min_version and trace_id and rules for denial_reason, which
  zeta-error.yaml 1.8.0 adds (client code mapped by the Authorization Server
  from `result.reason_codes` of the Policy Engine decision according to
  Tab-ZETA-Ablehnungsgründe). `reasons` stays required
  and stays a map, also when the decision carries it as an array (pdp-decision.yaml
  1.4.0); from Stufe 3 on it carries the client code instead of the policy
  texts when the decision has `reason_codes`. A client
  that does not know denial_reason or a value of it treats the value like
  `policy_denied`; its reaction follows HTTP status and `error` only.

  For code generators: the root is deliberately not a oneOf. Generated code
  binds per HTTP status directly to definitions/successResponse (200) or
  definitions/denyResponse (403), as as-token-endpoint.yaml does. The root only
  serves to validate a body without knowing the status.
type: object
# "Exactly one of the two responses" as if/then/else instead of a root oneOf:
# without a common discriminating field, generated Java code finds two matching
# classes for a success response and fails, and openapi-generator (Kotlin)
# merges both branches into one class. Same valid instances as before: without
# access_token only denyResponse can apply (successResponse requires the
# field); with access_token the rule is unchanged "exactly one of both".
if:
  required: [access_token]
then:
  oneOf:
    - $ref: "#/definitions/successResponse"
    - $ref: "#/definitions/denyResponse"
else:
  $ref: "#/definitions/denyResponse"
definitions:
  successResponse:
    title: Token Success Response
    description: >-
      Success response returned when the Policy Engine allows the request
      (`result.allow` = true in pdp-decision.yaml). The issued tokens are
      DPoP-bound (RFC 9449).
    type: object
    properties:
      access_token:
        type: string
        description: >-
          The issued access token as a signed JWT. Its claims follow
          access-token.yaml (DPoP-bound) or, for the token exchange of Workload
          Identity Federation, access-token-workload.yaml.
      token_type:
        type: string
        description: >-
          The type of the issued token. "DPoP" indicates the token is bound to
          the client's DPoP key (RFC 9449). "Bearer" is permitted only for an
          access token according to access-token-workload.yaml issued in a token
          exchange of Workload Identity Federation without DPoP proof
          (gemSpec_ZETA 2.0.1 A_28431); in all other
          cases the value MUST be "DPoP". With "Bearer" the response carries no
          refresh token and expires_in is at most 3600.
        enum:
          - DPoP
          - Bearer
      expires_in:
        type: integer
        description: >-
          The lifetime in seconds of the access token. After this period the
          token is no longer accepted by the resource server.
      refresh_token:
        type: string
        description: >-
          The refresh token as a signed JWT, which can be used to obtain new
          access tokens using the same authorization grant. Optional.
      refresh_expires_in:
        type: integer
        description: The lifetime in seconds of the refresh token. Optional.
      zeta_attestation_token:
        type: string
        description: >-
          Signed JWT ("Fast-Path" attestation token) issued by the ZETA Guard
          after a successful hardware attestation (TPM / Secure Enclave / TEE /
          StrongBox). Its claims follow zeta-attestation-token.yaml. Only present
          when the token exchange included a hardware attestation; absent for
          software attestation (fallback).
      asl_access_token:
        type: string
        description: >-
          Signed JWT issued by the ZETA Authorization Server for access to the
          /ASL Endpoint. Only present when the attribute zeta_asl_use is set to
          required_passthrough in OAuth Protected Resource well-known;
          absent otherwise.
      scope:
        type: string
        description: >-
          The scope of the issued access token as a space-delimited list of scope
          values. Present if the granted scope differs from the requested scope.
      email_hint:
        type: string
        description: >-
          Masked hint at the stored bound email address (F1) of the identity.
          Optional; only present when the granted scope is "zeta:email-verify"
          without "zeta:email-binding", i.e. when the OTP was already sent to the
          stored address at token issuance (A_30085, subsequent registration).
          The value MUST be masked so that at most the first character of the local
          part, the first character of the domain label and the top-level domain
          remain visible; the full address MUST NOT be disclosed.
        example: "a***@d***.de"
      issued_token_type:
        type: string
        description: >-
          An identifier for the type of the issued token, as defined in RFC 8693.
          Present for token exchange responses.
        enum:
          - "urn:ietf:params:oauth:token-type:access_token"
          - "urn:ietf:params:oauth:token-type:jwt"
    required:
      - access_token
      - token_type
      - expires_in
    # Bearer (Workload Identity Federation only): no refresh token, lifetime at
    # most 3600 s. if/then instead of oneOf, so that
    # code generators keep one success class.
    if:
      required: [token_type]
      properties:
        token_type:
          const: Bearer
    then:
      not:
        required: [refresh_token]
      properties:
        expires_in:
          maximum: 3600
  denyResponse:
    title: Token Deny Response
    description: >-
      Error response returned when the Policy Engine denies the request
      (`result.allow` = false in pdp-decision.yaml). No tokens are issued. The
      response follows zeta-error.yaml (RFC 6749 Section 5.2) and carries the
      denial reasons taken from `result.reasons` of the Policy Engine decision
      or, from Stufe 3 on, the client code mapped from `result.reason_codes`.
      From Stufe 3 on `denial_reason`
      (zeta-error.yaml) names the reason (Tab-ZETA-Ablehnungsgründe).
    allOf:
      - $ref: "./zeta-error.yaml"
      # min_version only with the two update codes; with insufficient_acr only
      # the two authentication codes (Tab-ZETA-Ablehnungsgründe).
      - if:
          required: [min_version]
        then:
          required: [denial_reason]
          properties:
            denial_reason:
              enum: [client_update_required, os_update_required]
              example: client_update_required
      - if:
          properties:
            error:
              const: insufficient_acr
              example: insufficient_acr
          required: [error, denial_reason]
        then:
          properties:
            denial_reason:
              enum: [authentication_level_insufficient, authentication_too_old]
              example: authentication_level_insufficient
    properties:
      reasons:
        description: >-
          The denial reasons from the Policy Engine decision. Explains why no
          tokens were issued. Taken from `result.reasons` in pdp-decision.yaml;
          if the decision carries them as an array of strings, each string
          becomes a key with value true. From Stufe 3 on:
          if the decision carries `result.reason_codes`, the map contains
          exactly one key, the value of `denial_reason`; the policy texts then
          go to the TI-SIEM only (gemSpec_ZETA 2.0.1 A_28867). Without
          `reason_codes` the texts are taken over as before. Kept for backward
          compatibility; clients evaluate `denial_reason` instead.
        # Deliberately not a $ref to pdp-decision.yaml: there `reasons` may
        # also be an array (1.4.0); towards the client it stays a map.
        type: object
        additionalProperties:
          type: boolean
      acr_values:
        description: >-
          Added in 1.4.0. Only with error `insufficient_acr`: the acr values
          from `result.required_acr` of the Policy Engine decision, space
          separated in the order given there, without duplicates (format as `acr_values` in OpenID
          Connect Core 1.0 and RFC 9470; only gematik-ehealth-loa-substantial
          and gematik-ehealth-loa-high, gemSpec_IDP_Sek 3.3.0 A_22987, A_22988).
          The client authenticates once with a new authorization request
          carrying these acr_values (A_30220; T15).
        type: string
        maxLength: 56
        pattern: "^gematik-ehealth-loa-(substantial|high)( gematik-ehealth-loa-(substantial|high))?$"
        example: gematik-ehealth-loa-high
      max_age:
        description: >-
          Added in 1.4.0. Only with error `insufficient_acr` and only if the
          decision carries `result.required_max_age`: maximum age in seconds
          of the user authentication; the client passes it as `max_age` in the
          new authorization request (A_30220; RFC 9470).
        type: integer
        minimum: 0
        maximum: 86400
        example: 300
      min_version:
        description: >-
          Added in 1.5.0 (from Stufe 3 on). Only with denial_reason
          `client_update_required` (minimum product version of the ZETA
          Client) or `os_update_required` (minimum operating system version),
          and only if the decision names it (`result.reason_codes[].min_version`). The client may show it to the user; it does
          not change the reaction (T16).
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}$"
        example: "2.4.0"
      trace_id:
        $ref: "#/definitions/traceId"
    required:
      - reasons
    # acr_values is mandatory with insufficient_acr; acr_values and max_age
    # never appear with any other error.
    if:
      properties:
        error:
          const: insufficient_acr
          example: insufficient_acr
      required: [error]
    then:
      required: [acr_values]
    else:
      not:
        anyOf:
          - required: [acr_values]
          - required: [max_age]
  traceId:
    description: >-
      Added in 1.5.0 (to be implemented from Stufe 3 on). W3C Trace Context
      trace-id of the request at the Authorization Server, as also carried by
      its telemetry and the OTel log of the decision to the TI-SIEM
      (gemSpec_ZETA 2.0.1 A_28796, A_28867). Lets support correlate a denial
      reported by the user; never all zeros (W3C Trace Context), no further
      content.
    type: string
    pattern: "^[0-9a-f]{32}$"
    not:
      const: "00000000000000000000000000000000"
    example: 4bf92f3577b34da6a3ce929d0e0e4736
