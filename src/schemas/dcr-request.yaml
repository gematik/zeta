$schema: "http://json-schema.org/draft-07/schema#"
schemaVersion: "1.2.0"
title: RegistrationRequest
description: >-
  Payload Schema für den DCR POST /register Body.

  Abwärtskompatibilität (1.0.0 → 1.1.0): Alle in 1.1.0 ergänzten Felder
  (nonce, platform, product_id, product_version sowie
  signed_hash_puk_client_sig im Software-Zweig) sind OPTIONAL — kein
  required-Block wurde erweitert. Ein Request nach 1.0.0 bleibt gültig.
  Fehlt eines der Felder, verfährt der AuthS wie bisher (Legacy-Verhalten,
  jeweils bei der Feldbeschreibung dokumentiert); die Felder SOLLEN von
  neuen Client-Implementierungen gesetzt werden und werden in einer
  künftigen Major-Version verpflichtend.

  Präzisierung 1.1.1 (keine neuen Felder): Byte-Repräsentation von
  puk_client_sig in Hash-Eingaben (definitions/puk_client_sig_bytes) und
  Format aller Signaturen über einen solchen Hash
  (definitions/hash_signature) sind festgelegt; beides war zuvor offen.

  Präzisierung 1.1.2 (keine neuen Felder): Referenz für die Prüfung der
  redirect_uris ist die Client-Registry des Provisioning Images
  (client-registry.yaml); Fehlercode invalid_redirect_uri.

  Präzisierung 1.1.3 (keine neuen Felder): Dokumentation der optionalen
  Übernahme von Paketnamen und Signaturzertifikat-Digests aus der
  attestationApplicationId des Android-Blatt-Zertifikats an die Policy Engine.
  Ergänzung 1.2.0 (abwärtskompatibel, kein required-Block erweitert):
  (a) TPM-Zweig: optionale Felder nonce, client_key_pop,
  tpm_client_key_public, tpm_certify_info und tpm_certify_signature. Bis 1.1.3
  enthielt der TPM-Zweig als einziger weder einen Besitznachweis des Client
  Instance Keys noch einen Nachweis, dass dieser im TPM liegt. Die neuen
  Nachweise sind nur mit nonce zulässig (dependencies im TPM-Zweig); eine
  Legacy-Form ohne Nonce gibt es für sie nicht. Zweige Apple und Android:
  optionales Feld nonce; ist es gesetzt, geht es in signed_hash_puk_client_sig
  ein. (b) grant_types ist in
  definitions/grant_types beschrieben und wird von allen Zweigen referenziert;
  die zulässigen Kombinationen stehen dort. (c) Struktur für Codegeneratoren,
  ohne Änderung der gültigen Instanzen: Die fünf Zweige sind benannte
  Definitionen (definitions/registration_*), jwks ist einmal definiert
  (definitions/client_jwks), Binärfelder tragen contentEncoding (base64 bzw.
  base64url).

  Auswahl des Zweigs: attestation_type lesen; fehlt das Feld, gilt "software"
  (Requests nach Schema 1.0.0). tpm | apple | android | zeta_attestation_token
  | software bestimmen den Zweig; jeder andere Wert ist ungültig. Das Schema
  trägt dafür einen discriminator auf attestation_type (Hinweis für
  Codegeneratoren, ohne Wirkung auf die Validierung). Ein Server, der
  generierten Code verwendet, MUSS vor dem Binding attestation_type =
  "software" ergänzen, wenn das Feld fehlt – sonst kann der generierte Code
  einen Request nach Schema 1.0.0 nicht zuordnen. Generierte Typen prüfen
  required, const und dependencies in der Regel nicht; der Request ist
  zusätzlich mit einem JSON-Schema-Validator gegen dieses Schema zu prüfen.
type: object


# Die fünf Zweige stehen als benannte Definitionen unter definitions/
# (registration_*), damit Codegeneratoren stabile Typnamen bilden. Die Zweige
# schließen sich über den const-Wert von attestation_type aus.
oneOf:
  - $ref: "#/definitions/registration_tpm"
  - $ref: "#/definitions/registration_apple"
  - $ref: "#/definitions/registration_android"
  - $ref: "#/definitions/registration_zeta_attestation_token"
  - $ref: "#/definitions/registration_software"
# `discriminator` ist ein OpenAPI-Konstrukt (kein draft-07-Keyword). JSON-Schema-
# Validatoren ignorieren es; die Gültigkeit eines Requests ändert sich dadurch
# nicht. Es ist ein Hinweis für Codegeneratoren: Ohne ihn führt
# openapi-generator (Kotlin) die fünf Zweige zu EINER Klasse zusammen, in der
# alle Pflichtfelder aller Zweige Pflicht sind.
# attestation_type ist im Zweig registration_software optional (Requests nach
# Schema 1.0.0). Generierter Code kann einen Request ohne das Feld nicht
# zuordnen; ein Server setzt deshalb vor dem Binding attestation_type =
# "software", wenn das Feld fehlt (siehe Beschreibung, Auswahl des Zweigs).
discriminator:
  propertyName: attestation_type
  mapping:
    tpm: "#/definitions/registration_tpm"
    apple: "#/definitions/registration_apple"
    android: "#/definitions/registration_android"
    zeta_attestation_token: "#/definitions/registration_zeta_attestation_token"
    software: "#/definitions/registration_software"

definitions:
  # -----------------------------------------------------------------
  # 1. TPM Hardware Attestation (Windows / Linux)
  # -----------------------------------------------------------------
  registration_tpm:
    title: TPM Attestation
    type: object
    required:
      - attestation_type
      - client_name
      - jwks
      - puk_ek_enc
      - c_ek_enc
      - puk_ak_sig
      - signed_hash_puk_client_sig
    # Die in 1.2.0 ergänzten Nachweise sind nur mit nonce und nur vollständig
    # zulässig. dependencies (draft-07) statt allOf mit if/then: kein
    # Kompositions-Schlüsselwort im Zweig, das Codegeneratoren als Vererbung
    # oder Hilfstyp deuten. Generatoren ignorieren die Regel; sie wird zur
    # Laufzeit vom JSON-Schema-Validator geprüft.
    dependencies:
      client_key_pop: [nonce]
      tpm_certify_info: [nonce, client_key_pop, tpm_certify_signature, tpm_client_key_public]
      tpm_certify_signature: [tpm_certify_info]
      tpm_client_key_public: [tpm_certify_info]
    properties:
      attestation_type:
        type: string
        const: tpm
      client_name: { type: string }
      token_endpoint_auth_method: { type: string }
      grant_types: { $ref: "#/definitions/grant_types" }
      redirect_uris: { $ref: "#/definitions/redirect_uris" }
      jwks: { $ref: "#/definitions/client_jwks" }
      platform:        { $ref: "#/definitions/platform" }
      product_id:      { $ref: "#/definitions/product_id" }
      product_version: { $ref: "#/definitions/product_version" }
      puk_ek_enc:
        type: string
        contentEncoding: base64
        description: >-
          Öffentlicher Endorsement Key (EK) des TPM als Base64-kodierte 
          TPM2B_PUBLIC Struktur. Wird zur MakeCredential-Operation verwendet.
      c_ek_enc:
        type: string
        contentEncoding: base64
        description: >-
          Zertifikat des Endorsement Key (EK) des TPM im DER Format Base64-kodiert.
      puk_ak_sig:
        type: string
        contentEncoding: base64
        description: >-
          Öffentlicher Attestation Key (AK) des TPM (Base64-kodierte TPM2B_PUBLIC-Bytes).
          Wird vom AuthS zur Verifikation der TPM-Quote und von
          signed_hash_puk_client_sig verwendet.
      signed_hash_puk_client_sig:
        type: string
        contentEncoding: base64url
        description: >-
          Signatur des SHA-256-Hashes von puk_client_sig, erstellt mit
          dem TPM Attestation Key (prk_ak_sig). Base64url-kodiert.
          Signaturformat: definitions/hash_signature.
          Achtung: Anders als in den Zweigen Apple, Android und Fast-Path ist
          dies KEINE Selbstsignatur mit prk_client_sig, sondern eine
          AK-Signatur (funktional ein attestation_pop). Den Besitz des Client
          Instance Keys weist client_key_pop nach.
      # Im TPM-Zweig Pflicht, sobald client_key_pop oder tpm_certify_info
      # gesendet wird (dependencies). signed_hash_puk_client_sig (AK-Signatur)
      # bleibt unverändert ohne Nonce.
      nonce: { $ref: "#/definitions/nonce" }
      client_key_pop:
        type: string
        contentEncoding: base64url
        description: >-
          Selbstsignatur: Signatur über SHA-256(puk_client_sig || nonce),
          erstellt mit prk_client_sig (Proof-of-Possession des Client Instance
          Keys). Hash-Eingabe nach definitions/puk_client_sig_bytes und
          definitions/nonce. Base64url-kodiert, Signaturformat:
          definitions/hash_signature. Entspricht signed_hash_puk_client_sig
          der übrigen Zweige in der Form mit Nonce.
          Verhindert, dass ein Inhaber eines gültigen Attestation Keys einen
          fremden öffentlichen Schlüssel registriert und dessen spätere
          Registrierung per 409 registrationConflict blockiert. Das gilt nur,
          weil die Nonce eingeht: Eine Signatur über SHA-256(puk_client_sig)
          allein wäre statisch und von jedem wiederverwendbar, der einen
          Registrierungs-Request gesehen hat. Der MakeCredential-Handshake
          ersetzt die Nonce hier nicht – er belegt die Frische des Attestation
          Keys, nicht die des Client Instance Keys. Eine Form ohne nonce ist
          deshalb unzulässig.
          Optional aus Kompatibilitätsgründen (in Schema ≤ 1.1.3 nicht
          vorhanden): Ist das Feld vorhanden, prüft der AuthS Nonce und
          Signatur und lehnt bei Fehlschlag ab; fehlt es, registriert er wie
          bisher und MUSS das Fehlen protokollieren (wie A_30192 für den
          Software-Zweig). Neue Client-Implementierungen SOLLEN es setzen. Ob
          der Nachweis vorlag,
          führt der AuthS als client_key_binding im Registrierungsdatensatz
          (dcr-response.yaml) und übergibt es der Policy Engine; solange das
          Feld weggelassen werden darf, entsteht die Schutzwirkung erst
          dadurch, dass die Policy client_key_binding auswertet.
          Signatur mit dem Client Instance Key als gewöhnlichem (nicht
          restricted) Signaturschlüssel: TPM2_Sign über SHA-256(h) ohne
          Validierungsticket; der TPM-Sonderfall aus definitions/hash_signature
          gilt hier nicht.
      tpm_client_key_public:
        type: string
        contentEncoding: base64
        description: >-
          Optional. Öffentlicher Bereich des Client Instance Keys, wie ihn das
          TPM führt (Base64-kodierte TPM2B_PUBLIC-Bytes, Kodierung wie
          puk_ak_sig). Nötig für die Prüfung von tpm_certify_info: Der dort
          zertifizierte Name ist nameAlg || Hash(TPMT_PUBLIC) und umfasst
          Attribute, authPolicy und Parameter; aus dem JWK in jwks lässt er
          sich nicht berechnen. Der AuthS prüft: type = TPM_ALG_ECC, curveID =
          TPM_ECC_NIST_P256, unique (x, y) ist derselbe Punkt wie im JWK aus
          jwks; nameAlg = TPM_ALG_SHA256 (ein Name mit SHA-1 wird abgelehnt);
          objectAttributes enthält fixedTPM, fixedParent,
          sensitiveDataOrigin und sign, nicht restricted und nicht decrypt.
          Nur zusammen mit tpm_certify_info zulässig.
      tpm_certify_info:
        type: string
        contentEncoding: base64
        description: >-
          Optional. Base64-kodierte TPM2B_ATTEST-Struktur (Kodierung wie
          puk_ak_sig) aus TPM2_Certify über den Client Instance Key, signiert
          mit dem Attestation Key. Belegt, dass PrK.Client.Sig ein Schlüssel im
          selben TPM ist wie der Attestation Key. Auslegung von
          Abb-ZETA-TPM-Attestation-Key, Schritte (04)–(05): Die Spec spricht
          dort von einem "TPM2 Attest" und nennt das Kommando nicht.
          Der Client übergibt als qualifyingData die UTF-8-Bytes der nonce.
          Der AuthS prüft an der enthaltenen TPMS_ATTEST:
          (1) magic = TPM_GENERATED_VALUE und type = TPM_ST_ATTEST_CERTIFY;
          (2) extraData = UTF-8-Bytes der nonce des Requests (die der AuthS
          nach definitions/nonce bereits geprüft und verbraucht hat);
          (3) attested.certify.name = Name des Schlüssels aus
          tpm_client_key_public, d. h. nameAlg || Hash(TPMT_PUBLIC), und
          tpm_client_key_public besteht die dort genannten Prüfungen (u. a.
          derselbe Punkt wie im JWK aus jwks);
          (4) tpm_certify_signature ist eine gültige Signatur des in
          puk_ak_sig übermittelten Attestation Keys über die TPMS_ATTEST-Bytes
          (ohne das Längenpräfix der TPM2B_ATTEST).
          Zulässig für tpm_certify_signature sind TPM_ALG_ECDSA und
          TPM_ALG_RSASSA, jeweils mit hashAlg TPM_ALG_SHA256, passend zum
          Schlüsseltyp des Attestation Keys.
          Reihenfolge: Bei POST /register ist der Attestation Key noch nicht
          als TPM-Schlüssel belegt. Das Ergebnis der Prüfung gilt erst, wenn
          der MakeCredential-Handshake über POST /register/verify erfolgreich
          war; scheitert er, verwirft der AuthS es mit der Registrierung.
          Das Ergebnis führt der AuthS als client_key_binding im
          Registrierungsdatensatz (dcr-response.yaml) und übergibt es der
          Policy Engine (policy-engine-client-data.yaml).
          Nur bei erfolgreicher Prüfung gilt der Client Instance Key als
          hardware-gebunden; ohne das Feld ist die Hardware-Bindung von
          PrK.Client.Sig eine Selbstauskunft des Clients. Das Feld bleibt
          auch nach dem Stichtag aus A_30193 optional: Nicht jede Umgebung
          erzeugt den Client Instance Key im TPM; ob eine Registrierung ohne
          diesen Nachweis genügt, entscheidet die Policy über
          client_key_binding. Nur zusammen mit
          nonce, client_key_pop, tpm_certify_signature und
          tpm_client_key_public zulässig
          (dependencies im Zweig). Setzt voraus, dass der Client Instance Key im TPM
          erzeugt wurde.
      tpm_certify_signature:
        type: string
        contentEncoding: base64
        description: >-
          Optional. Base64-kodierte TPMT_SIGNATURE (Kodierung wie puk_ak_sig)
          zu tpm_certify_info, erstellt mit dem Attestation Key. Nur zusammen
          mit tpm_certify_info zulässig.

  # -----------------------------------------------------------------
  # 2. Apple Hardware Attestation (iOS, iPadOS & macOS)
  # -----------------------------------------------------------------
  # Die Apple App Attest API (DeviceCheck-Framework) ist auf iOS,
  # iPadOS und macOS identisch: gleiches CBOR-Format, gleiche Felder
  # (attStmt mit x5c + receipt, authData) und gleiches Key-Binding.
  # -----------------------------------------------------------------
  registration_apple:
    title: Apple Attestation
    type: object
    required:
      - attestation_type
      - client_name
      - jwks
      - apple_attestation_object
      - signed_hash_puk_client_sig
    description: >-
      Für iOS, iPadOS und macOS identisch. Die Apple App Attest API
      (DeviceCheck-Framework) produziert auf allen Plattformen dasselbe
      Objekt-Format und Key-Binding-Protokoll.
    properties:
      attestation_type:
        type: string
        const: apple
      client_name: { type: string }
      token_endpoint_auth_method: { type: string }
      grant_types: { $ref: "#/definitions/grant_types" }
      redirect_uris: { $ref: "#/definitions/redirect_uris" }
      jwks: { $ref: "#/definitions/client_jwks" }
      platform:        { $ref: "#/definitions/platform" }
      product_id:      { $ref: "#/definitions/product_id" }
      product_version: { $ref: "#/definitions/product_version" }
      apple_attestation_object:
        type: string
        contentEncoding: base64
        description: >-
          CBOR-kodiertes Attestation-Objekt der Apple App Attest API
          (fmt: "apple-appattest"). Enthält attStmt (x5c-Zertifikatskette inkl.
          puk_ak_sig + receipt) sowie authData (rpIdHash, counter, credentialId).
          Base64-kodiert.
      signed_hash_puk_client_sig:
        type: string
        contentEncoding: base64url
        description: >-
          Selbstsignatur: Signatur des SHA-256-Hashes von PuK.Client.Sig,
          erstellt mit PrK.Client.Sig (Proof-of-Possession des Client
          Instance Keys). Base64url-kodiert, Signaturformat:
          definitions/hash_signature. Die Bindung
          AK ↔ PuK.Client.Sig weist bereits das apple_attestation_object
          nach (clientDataHash == SHA-256(PuK.Client.Sig)); eine
          AK-Signatur ist hier daher nicht erforderlich.

          Der signierte Hash ist SHA-256(puk_client_sig || nonce), sofern das
          Feld nonce gesetzt ist, andernfalls SHA-256(puk_client_sig)
          (Legacy-Form). Der AuthS akzeptiert bis zum Stichtag (Vorschlag:
          01.01.2028, wie die übrigen Legacy-Formen in A_30193) beide Formen
          und wählt anhand der An-/Abwesenheit von nonce. Ohne nonce ist die
          Signatur statisch und von jedem wiederverwendbar, der einen
          Registrierungs-Request gesehen hat (client_key_binding =
          pop_static); neue Clients SOLLEN die nonce setzen.
      nonce: { $ref: "#/definitions/nonce" }

  # -----------------------------------------------------------------
  # 3. Android Hardware Attestation
  # -----------------------------------------------------------------
  # Nutzt die Android Keystore Key Attestation (TEE / StrongBox).
  # Der AuthS validiert die Zertifikatskette gegen die Google Hardware
  # Attestation Root CA. Optional kann ein Play Integrity Token zur
  # zusätzlichen App-Integritätsprüfung mitgeliefert werden.
  # -----------------------------------------------------------------
  registration_android:
    title: Android Attestation
    type: object
    required:
      - attestation_type
      - client_name
      - jwks
      - android_key_attestation_certificate_chain
      - signed_hash_puk_client_sig
    properties:
      attestation_type:
        type: string
        const: android
      client_name: { type: string }
      token_endpoint_auth_method: { type: string }
      grant_types: { $ref: "#/definitions/grant_types" }
      redirect_uris: { $ref: "#/definitions/redirect_uris" }
      jwks: { $ref: "#/definitions/client_jwks" }
      platform:        { $ref: "#/definitions/platform" }
      product_id:      { $ref: "#/definitions/product_id" }
      product_version: { $ref: "#/definitions/product_version" }
      android_key_attestation_certificate_chain:
        type: array
        description: >-
          X.509-Zertifikatskette der Android Key Attestation, beginnend
          mit dem Blatt-Zertifikat des attestierten Schlüssels (C.AK.Sig) bis zur
          Google Hardware Attestation Root CA. Jedes Zertifikat ist
          Base64-kodiert (DER-Format).

          Der AuthS kann aus der attestationApplicationId
          (OID 1.3.6.1.4.1.11129.2.1.17) des Blatt-Zertifikats (C.AK.Sig)
          die Paketnamen (package_infos) und SHA-256-Digests der
          Signaturzertifikate (signature_digests) extrahieren und im
          Registrierungsdatensatz speichern, um sie der Policy Engine
          (policy-engine-client-data.yaml → attestation_result.android)
          bereitzustellen. Aus Gründen der Abwärtskompatibilität ist die
          Übergabe an die Policy Engine optional (z. B. wenn ältere
          Keymaster-Zertifikate keine attestationApplicationId enthalten).
        items:
          type: string
          contentEncoding: base64
          description: Base64-kodiertes DER X.509-Zertifikat.
        minItems: 3
      signed_hash_puk_client_sig:
        type: string
        contentEncoding: base64url
        description: >-
          Selbstsignatur: Signatur des SHA-256-Hashes von puk_client_sig,
          erstellt mit prk_client_sig (Proof-of-Possession des Client
          Instance Keys). Base64url-kodiert, Signaturformat:
          definitions/hash_signature. Die Bindung
          AK ↔ puk_client_sig weist bereits die attestationChallenge im
          Blatt-Zertifikat der android_key_attestation_certificate_chain
          nach (attestationChallenge == SHA-256(puk_client_sig)); eine
          AK-Signatur ist hier daher nicht erforderlich.

          Der signierte Hash ist SHA-256(puk_client_sig || nonce), sofern das
          Feld nonce gesetzt ist, andernfalls SHA-256(puk_client_sig)
          (Legacy-Form). Der AuthS akzeptiert bis zum Stichtag (Vorschlag:
          01.01.2028, wie die übrigen Legacy-Formen in A_30193) beide Formen
          und wählt anhand der An-/Abwesenheit von nonce. Ohne nonce ist die
          Signatur statisch und von jedem wiederverwendbar, der einen
          Registrierungs-Request gesehen hat (client_key_binding =
          pop_static); neue Clients SOLLEN die nonce setzen.
      nonce: { $ref: "#/definitions/nonce" }
      play_integrity_token:
        type: string
        description: >-
          Optionales Token der Google Play Integrity API (Base64-kodiert).
          Ermöglicht dem AuthS die zusätzliche App-Integritätsprüfung
          (meets_basic_integrity, meets_device_integrity).

  # -----------------------------------------------------------------
  # 4. ZETA Attestation Token (Fast-Path)
  # -----------------------------------------------------------------
  # Wird verwendet, wenn bereits ein gültiger ZETA Guard Attestation
  # Token vorliegt (aus einer früheren Hardware-Attestierung).
  # Der AuthS prüft die Token-Signatur, verifiziert
  # signed_hash_puk_client_sig als Selbstsignatur mit puk_client_sig
  # (aus jwks) und extrahiert attestation_type sowie puk_ak_sig
  # (cnf.jwk) aus dem Token, um attestation_pop plattformspezifisch
  # zu verifizieren (apple: CBOR-Assertion; android/tpm: rohe Signatur).
  # -----------------------------------------------------------------
  registration_zeta_attestation_token:
    title: ZETA Attestation Token
    type: object
    required:
      - attestation_type
      - client_name
      - jwks
      - zeta_attestation_token
      - signed_hash_puk_client_sig
      - attestation_pop
    properties:
      attestation_type:
        type: string
        const: zeta_attestation_token
      client_name: { type: string }
      token_endpoint_auth_method: { type: string }
      grant_types: { $ref: "#/definitions/grant_types" }
      redirect_uris: { $ref: "#/definitions/redirect_uris" }
      jwks: { $ref: "#/definitions/client_jwks" }
      platform:        { $ref: "#/definitions/platform" }
      product_id:      { $ref: "#/definitions/product_id" }
      product_version: { $ref: "#/definitions/product_version" }
      zeta_attestation_token:
        type: string
        description: >-
          Signiertes JWT, ausgestellt vom ZETA Guard nach erfolgreicher
          Hardware-Attestierung. Enthält attestation_type
          (tpm | apple | android), puk_ak_sig (cnf.jwk) und verifizierte
          Plattform-Claims. Siehe zeta-attestation-token.yaml.
      signed_hash_puk_client_sig:
        type: string
        contentEncoding: base64url
        description: >-
          Selbstsignatur: Signatur des SHA-256-Hashes von puk_client_sig,
          erstellt mit prk_client_sig (Proof-of-Possession des Client
          Instance Keys). Base64url-kodiert, Signaturformat:
          definitions/hash_signature. Einheitlich für alle
          Plattformen.
      nonce: { $ref: "#/definitions/nonce" }
      attestation_pop:
        type: string
        description: >-
          Frischer Besitznachweis des Attestation Keys (prk_ak_sig). Bindet
          den (ggf. neuen) Client Instance Key an den bereits attestierten
          Attestation Key. Das Format bestimmt der AuthS anhand des
          attestation_type-Claims im zeta_attestation_token.

          Der signierte Hash ist SHA-256(puk_client_sig || nonce), sofern
          das Feld nonce gesetzt ist, andernfalls SHA-256(puk_client_sig)
          (Legacy-Form nach Schema 1.0.0). Der AuthS akzeptiert beide Formen
          und wählt anhand der An-/Abwesenheit von nonce; ohne nonce ist der
          Nachweis nicht challenge-gebunden und ein mitgeschnittener Request
          bleibt wiedereinlösbar (Restrisiko A_29915), weshalb neue Clients
          die nonce setzen SOLLEN.

          apple: Base64-kodiertes CBOR-Assertion-Objekt aus
          DCAppAttestService.generateAssertion(keyId:clientDataHash:) mit
          clientDataHash = dem oben bestimmten Hash. Der AuthS verifiziert
          die Signatur über SHA-256(authenticatorData || clientDataHash)
          gegen cnf.jwk (puk_ak_sig) aus dem Token und prüft rpIdHash
          sowie die Monotonie des Counters.

          android | tpm: Signatur über den oben bestimmten Hash, erstellt
          mit prk_ak_sig, im Format definitions/hash_signature (Android:
          SHA256withECDSA im Android Keystore; TPM: TPM2_Hash +
          TPM2_Sign mit Validierungsticket, da der AK ein restricted
          Signing Key ist). Der AuthS verifiziert gegen cnf.jwk
          (puk_ak_sig) aus dem Token; eine rohe Signatur über den Hash
          ohne die dort festgelegte SHA-256-Nachrichtenbildung wird
          abgelehnt.

  # -----------------------------------------------------------------
  # 5. Legacy / Software Attestation
  # -----------------------------------------------------------------
  registration_software:
    title: Legacy / Software Attestation
    type: object
    # required bleibt gegenüber Schema 1.0.0 unverändert. nonce und
    # signed_hash_puk_client_sig sind optional, damit bestehende Clients
    # weiter registrieren können; ohne sie ist die Registrierung NICHT an
    # den Besitz von prk_client_sig gebunden (siehe Feldbeschreibung).
    required:
      - client_name
      - jwks
      - token_endpoint_auth_method
    properties:
      # Optional (Abwärtskompatibilität zu 1.0.0): fehlt das Feld, gilt
      # "software".
      attestation_type:
        type: string
        const: software
      client_name: { type: string }
      nonce: { $ref: "#/definitions/nonce" }
      signed_hash_puk_client_sig:
        type: string
        contentEncoding: base64url
        description: >-
          Selbstsignatur über SHA-256(puk_client_sig || nonce), erstellt mit
          prk_client_sig. Base64url-kodiert, Signaturformat:
          definitions/hash_signature. Weist den Besitz des
          Instanzschlüssels nach und verhindert, dass ein Dritter einen
          fremden öffentlichen Schlüssel registriert und damit dessen
          spätere Registrierung per 409 registrationConflict blockiert.

          Optional aus Kompatibilitätsgründen (in Schema 1.0.0 nicht
          vorhanden): fehlt das Feld, registriert der AuthS wie bisher ohne
          Besitznachweis. Neue Client-Implementierungen SOLLEN es zusammen
          mit nonce setzen; der AuthS MUSS das Fehlen protokollieren (A_30192).
      token_endpoint_auth_method: { type: string }
      grant_types: { $ref: "#/definitions/grant_types" }
      redirect_uris: { $ref: "#/definitions/redirect_uris" }
      jwks: { $ref: "#/definitions/client_jwks" }
      platform:        { $ref: "#/definitions/platform" }
      product_id:      { $ref: "#/definitions/product_id" }
      product_version: { $ref: "#/definitions/product_version" }

  # -----------------------------------------------------------------
  # Gemeinsame Felddefinitionen
  # -----------------------------------------------------------------
  # Name client_jwks, nicht jwks: zeta-guard-client-management.yaml führt
  # bereits components/schemas/Jwks; beide ergäben denselben Typnamen.
  client_jwks:
    type: object
    description: >-
      Öffentlicher Client-Signaturschlüssel (ECDSA P-256).
    properties:
      keys:
        type: array
        items: { $ref: "#/definitions/jwk" }
    required: [keys]
  grant_types:
    type: array
    description: >-
      OAuth 2.0 Grant-Typen, die der Client am Token-Endpunkt verwenden wird
      (RFC 7591).

      Aus gemSpec_ZETA 2.0.0:
      - Der AuthS lehnt am Token-Endpunkt jeden Grant-Typ ab, der hier nicht
        registriert wurde (unauthorized_client, A_30364).
      - Der AuthS leitet aus dem Feld den Lebenszyklus der Registrierung ab;
        die Plattform ist dafür nicht maßgeblich (A_30086).
      - Enthält das Feld "authorization_code", ist es eine mobile,
        identitätsgebundene Registrierung (Status pending_user_binding,
        A_30086).
      - Enthält es ausschließlich
        "urn:ietf:params:oauth:grant-type:jwt-bearer", ist es eine
        identitätslose Registrierung (Status registered, A_29894).
      - "urn:ietf:params:oauth:grant-type:jwt-bearer" zusammen mit
        "authorization_code" lehnt der AuthS mit invalid_client_metadata ab
        (A_29894).

      Präzisierung dieses Schemas. Sie steht so NICHT in gemSpec_ZETA 2.0.0
      und weicht in (2) vom Wortlaut von A_29894 ("ausschließlich") ab; sie
      setzt einen Änderungsvorschlag an die Spezifikation voraus. Grund: Die
      Abläufe geben auch identitätslosen Clients ein Refresh Token aus, und
      mobile Clients lösen das E-Mail-Binding-Token per Token Exchange ein
      (A_30218). Vorgesehen sind drei Formen:
      (1) mit "authorization_code": zusätzlich zulässig sind
          "urn:ietf:params:oauth:grant-type:token-exchange" und
          "refresh_token". Lebenszyklus pending_user_binding → bound.
      (2) mit "urn:ietf:params:oauth:grant-type:jwt-bearer", ohne
          "authorization_code": zusätzlich zulässig ist nur "refresh_token".
          Identitätslos, Lebenszyklus registered → active.
      (3) mit "urn:ietf:params:oauth:grant-type:token-exchange", ohne
          "authorization_code" und ohne jwt-bearer: zusätzlich zulässig ist
          "refresh_token". Registrierung für den Token Exchange mit SM(C)-B
          Subject Token, Lebenszyklus registered → active – auf jeder
          Plattform, auch mit attestation_type apple oder android.
      Neue Client-Implementierungen MÜSSEN eine der drei Formen senden.

      Verhalten des AuthS bei POST /register (abschließend):
      - jwt-bearer UND "authorization_code": Ablehnung mit
        invalid_client_metadata (A_29894).
      - jwt-bearer UND token-exchange (Mischform): Ablehnung mit
        invalid_client_metadata. Eine Registrierung ist entweder identitätslos
        oder nicht; sonst könnte sie Token mit SM(C)-B-Identität und zugleich
        ohne Nutzer-Identität beziehen. Achtung: Der Ablauf "Software
        Attestation (Legacy OIDC DCR)" in gemSpec_ZETA 5.3.2.2 Schritt (12)
        nennt diese Kombination; Clients, die ihm wörtlich folgen, müssen auf
        Form (2) oder (3) umstellen.
      - jeder andere Inhalt wird bis zum Stichtag angenommen (Legacy-Form):
        ein fehlendes Feld, ein leeres Array, "refresh_token" allein und
        Werte, die kein ZETA-Grant sind. Das gilt für jeden attestation_type:
        bis Schema 1.1.3 war das Feld nicht eingeschränkt. Ab dem Stichtag
        (Vorschlag: 01.01.2028, wie die übrigen Legacy-Formen in A_30193)
        lehnt der AuthS alles ab, was keiner der drei Formen entspricht.
      - Registrierung OHNE das Feld oder mit leerem Array: Sie darf bis zum
        Stichtag token-exchange und "refresh_token" nutzen, nicht jwt-bearer
        und nicht "authorization_code". Der Default "authorization_code" aus
        RFC 7591 gilt NICHT.
      - Bestehende Registrierungen mit der Mischform (angelegt, bevor sie
        abgelehnt wurde): Der AuthS behandelt sie wie eine Registrierung ohne
        das Feld – token-exchange und "refresh_token" bleiben zulässig,
        jwt-bearer beantwortet er mit unauthorized_client.
      - Lebenszyklus: mit "authorization_code" pending_user_binding, sonst
        registered (A_30086).
      Am Token-Endpunkt gilt A_30364: Der AuthS lässt nur registrierte
      Grant-Typen zu. "client_credentials" ist kein ZETA-Grant (früher in einem
      Beispiel verwendet); der Token-Endpunkt beantwortet ihn mit
      unsupported_grant_type.

      Die Ablehnung der Mischform, der Stichtag und die Regel für
      Registrierungen ohne das Feld stehen noch nicht in gemSpec_ZETA 2.0.0.
      Das Feld ist im Schema nicht verpflichtend und die Werte sind nicht per
      enum eingeschränkt, damit Requests nach Schema <= 1.1.3 gültig bleiben.
    # Kein uniqueItems: bis 1.1.3 waren doppelte Einträge gültig; der AuthS
    # behandelt das Feld als Menge.
    items:
      type: string
    examples:
      - ["authorization_code", "urn:ietf:params:oauth:grant-type:token-exchange", "refresh_token"]
      - ["urn:ietf:params:oauth:grant-type:token-exchange", "refresh_token"]
      - ["urn:ietf:params:oauth:grant-type:jwt-bearer", "refresh_token"]
  puk_client_sig_bytes:
    type: string
    description: >-
      Byte-Repräsentation von puk_client_sig (PuK.Client.Sig) in allen
      Hash-Eingaben dieses Schemas und der Posture-Schemas
      (SHA-256(puk_client_sig), SHA-256(puk_client_sig || nonce),
      attestationChallenge, App-Attest-clientDataHash, clientDataHash in
      posture-android.yaml): die UTF-8-Bytes der RFC-7638-Kanonisierung des
      JWK aus jwks, d. h. {"crv":"P-256","kty":"EC","x":"…","y":"…"} mit
      genau diesen Membern in lexikografischer Reihenfolge, ohne Leerzeichen.
      Damit gilt SHA-256(puk_client_sig) = JWK-Thumbprint (jkt) des Client
      Instance Keys; der AuthS kann den Wert aus dem registrierten Schlüssel
      nachrechnen. Rein dokumentarische Definition, kein Request-Feld.
  hash_signature:
    type: string
    description: >-
      Einheitliches Format aller Signaturen "über einen Hash h" in diesem
      Schema (signed_hash_puk_client_sig, attestation_pop für android | tpm)
      sowie von signed_client_data_hash (posture-android.yaml):

      - Nachricht ist h selbst (32 Byte); die Signatur wird mit SHA-256 über
        diese Nachricht gebildet, also über SHA-256(h) – "hash-then-sign" wie
        bei ES256 / RS256. Das entspricht SHA256withECDSA (Android Keystore,
        JCA), SecKeyCreateSignature mit
        ecdsaSignatureMessageX962SHA256 (Apple) sowie beim TPM TPM2_Hash(h,
        TPM_ALG_SHA256) und TPM2_Sign mit dem erhaltenen Digest und
        Validierungsticket. Eine Signatur direkt über h ohne erneutes Hashen
        (NONEwithECDSA, TPM2_Sign über h) ist unzulässig.
      - Algorithmus nach Schlüsseltyp: EC P-256 → ECDSA mit SHA-256;
        RSA (nur TPM-AK) → RSASSA-PKCS1-v1_5 mit SHA-256.
      - Kodierung: ECDSA-Signatur als DER (ASN.1 ECDSA-Sig-Value; beim TPM
        aus r und s von TPMS_SIGNATURE_ECDSA zu bilden), RSA-Signatur als
        Oktettstring; jeweils Base64url ohne Padding.
      - Der Weg über TPM2_Hash und Validierungsticket gilt nur für den
        Attestation Key (restricted Signing Key). Für den Client Instance Key
        im TPM (client_key_pop) genügt TPM2_Sign über den Digest SHA-256(h).
      - TPM-Sonderfall (nur Attestation Key): TPM2_Hash liefert kein gültiges Ticket, wenn h mit
        TPM_GENERATED_VALUE (0xFF544347) beginnt (Wahrscheinlichkeit 2^-32).
        Der Client bezieht dann eine neue nonce bzw. erzeugt, wo keine nonce
        eingeht, einen neuen Client Instance Key.
  nonce:
    type: string
    description: >-
      Frische, einmalig verwendbare Nonce vom nonce_endpoint (GET /nonce, siehe
      as-well-known.yaml). Die Nonce MUSS in den signierten Hash eingehen —
      attestation_pop bzw. signed_hash_puk_client_sig werden dann über
      SHA-256(puk_client_sig || nonce) gebildet: die Nonce wird als UTF-8-Bytes
      des vom AuthS gelieferten Strings an die Byte-Repräsentation von
      puk_client_sig (definitions/puk_client_sig_bytes) angehängt, die auch die
      Legacy-Form SHA-256(puk_client_sig) hasht. Eine mitgesendete, aber nicht mitsignierte Nonce hat keine
      Schutzwirkung.

      Verbrauch (gilt für jeden Request, der eine Nonce trägt – POST /register
      ebenso wie Token-Requests mit Nonce in Subject Token, Posture und DPoP
      Proof): Der AuthS prüft die Nonce (von ihm ausgestellt, nicht
      abgelaufen, unverbraucht) und verbraucht sie in EINEM atomaren Schritt,
      bevor er den Request weiter auswertet. Je Nonce ist damit höchstens ein
      Request erfolgreich, auch bei parallelen Requests. Kommt die Nonce im
      selben Request mehrfach vor (hier: client_key_pop und qualifyingData
      von tpm_certify_info), müssen alle Werte gleich sein. Wird der Request
      danach aus einem anderen Grund abgelehnt, bleibt die Nonce verbraucht;
      der Client bezieht eine neue.

      Relevant für attestation_type "zeta_attestation_token" (Fast-Path),
      "software" und – seit 1.2.0 – "tpm": dort geht die Nonce in
      client_key_pop und als qualifyingData in tpm_certify_info ein. Für die
      AK-Signatur signed_hash_puk_client_sig des TPM-Zweigs wird sie nicht
      verwendet (der MakeCredential/ActivateCredential-Handshake liefert für
      den Attestation Key bereits eine serverseitig erzeugte Challenge).
      Seit 1.2.0 auch für "apple" und "android": Die Nonce geht dort in die
      Selbstsignatur signed_hash_puk_client_sig ein und macht sie zu einem
      frischen Besitznachweis. In das Attestation Object bzw. die
      attestationChallenge geht sie NICHT ein – clientDataHash und
      attestationChallenge bleiben SHA-256(puk_client_sig); die Frische der
      Plattform-Attestierung ändert sich dadurch nicht.

      Optional aus Kompatibilitätsgründen; ohne nonce gilt die Legacy-Form des
      jeweiligen Besitznachweises (siehe dort). Ausnahme: client_key_pop und
      tpm_certify_info im TPM-Zweig haben keine Legacy-Form und sind ohne
      nonce unzulässig.

  platform:
    type: string
    enum: [android, apple, windows, linux, other]
    description: >-
      Plattform der Client-Instanz. Der AuthS prüft den Wert auf Konsistenz mit
      dem attestation_type (tpm → windows|linux, apple → apple,
      android → android) und pinnt ihn im Registrierungsdatensatz; ein davon
      abweichendes client_statement.platform wird am /token-Endpunkt abgelehnt.

      Optional aus Kompatibilitätsgründen: fehlt das Feld, leitet der AuthS die
      Plattform aus dem attestation_type ab. Bei "software" ist das nicht
      möglich; dann bleibt NUR die Plattform ungepinnt und wird wie bisher aus
      dem client_statement übernommen. Der attestation_type selbst wird
      unabhängig davon IMMER gepinnt — er ergibt sich aus dem gewählten Zweig
      dieses Schemas und ist dem AuthS daher bei jeder Registrierung bekannt
      (siehe policy-engine-client-data.yaml, binding_status).

  product_id:
    type: string
    description: >-
      gematik-Produktbezeichner der Client-Software, vom Hersteller bei der
      gematik registriert (zusammen mit den zugelassenen Produktversionen; bei
      TPM-Attestierung zusätzlich mit dem Code-Signatur-Schlüssel, mit dem der
      Hersteller das Primärsystem signiert). Wird bei der Registrierung gepinnt
      und in das Access Token übernommen (access-token.yaml).

      Belastbarkeit je attestation_type: Bei "apple" und "android" prüft der
      AuthS bzw. die Policy Engine die product_id gegen die attestierte
      App-Identität (rpIdHash bzw. app_id bei Apple, Package-Name und
      Signaturzertifikat-Digests aus der Key-Attestation-Chain bei Android). Bei "tpm" ergibt sich die
      Bindung über PCR 23: Der ZETA Attestation Service prüft die
      Hersteller-Signatur des Primärsystems und misst das Prüfergebnis samt
      Signer-Identität in PCR 23; der AuthS bzw. die Policy Engine vergleicht
      den gemessenen Signer mit dem für DIESE product_id registrierten
      Schlüssel — die Referenz MUSS über die gepinnte product_id nachgeschlagen
      werden, nicht nur gegen die Menge aller registrierten Schlüssel. Bei
      "software" existiert kein attestierter Nachweis; die product_id ist dort
      eine unveränderliche, aber unbelegte Selbstauskunft.

      Optional aus Kompatibilitätsgründen: fehlt das Feld, bleibt die product_id
      ungepinnt und wird wie bisher aus dem client_statement der Client
      Assertion übernommen — sie ist dann selbst-behauptet und für
      Autorisierungsentscheidungen nicht belastbar.

  product_version:
    type: string
    description: >-
      Version der Client-Software zum Registrierungszeitpunkt. Wird NICHT
      gepinnt (Software-Updates ändern sie); dient der Nachvollziehbarkeit im
      Registrierungsdatensatz. Die für Policy-Entscheidungen maßgebliche
      Version stammt weiterhin aus dem client_statement.

  user_email:
    type: string
    format: email
    description: >-
      E-Mail-Adresse des Nutzers für die identitätsgebundene Trust-On-First-Use
      (TOFU) Bindung mobiler Clients. Wird NACH der OIDC-Nutzerauthentisierung über
      POST /zeta/identity/bind-email übermittelt (nur bei Erstnutzung einer Identität);
      bei Folgeregistrierung sendet der AuthS das OTP an die gespeicherte Adresse.
      Siehe Abb-ZETA-OIDC-Token-Bezug.puml.
  redirect_uris:
    type: array
    description: >-
      Liste der Redirection-Endpunkte des Clients (RFC 6749 Abschnitt 3.1.2,
      RFC 8252 für native Apps). Die URIs werden NICHT zur Laufzeit frei gewählt,
      sondern vom Hersteller vorab bei der gematik registriert. Erst dadurch können
      sie (a) im AuthS für die DCR-Prüfung hinterlegt werden — beim DCR muss jede
      übergebene redirect_uri exakt (String-Vergleich) einer registrierten URI
      entsprechen — und (b) in das Entity Statement des AuthS aufgenommen werden,
      gegen das der sektorale IDP die oidc_redirect_uri beim inneren PAR prüft. Die URIs liegen
      auf einer vom App-Hersteller kontrollierten Domain (dem Universal-/App-Link-Host)
      und stehen damit schon zur Entwicklungszeit fest — unabhängig vom AuthS, dessen
      FQDN der Client erst nach Abruf von opr-well-known/as-well-known auflöst. Die
      redirect_uris zeigen also NICHT auf die AuthS-Domain.

      Referenz für die Prüfung ist die Client-Registry des Provisioning Images
      (client-registry.yaml): Der AuthS vergleicht gegen die redirect_uris des
      Eintrags zur gepinnten product_id (eine product_id gilt für genau eine
      Plattform); fehlt die product_id, gegen die redirect_uris aller Einträge.
      Eine nicht registrierte URI lehnt er mit HTTP 400 und error
      "invalid_redirect_uri" (RFC 7591 Abschnitt 3.2.2) ab.

      Beim äußeren PAR (POST /par des ZETA Client an den
      pushed_authorization_request_endpoint des AuthS, RFC 9126) prüft der AuthS
      zusätzlich, dass redirect_uri (= app_redirect_uri) und oidc_redirect_uri exakt
      (String-Vergleich) zu den bei der DCR für diese client_id registrierten
      redirect_uris gehören und am letzten Pfad-Abschnitt ("/app" bzw. "/oidc") dem
      jeweiligen Flow entsprechen. Andernfalls lehnt er den PAR mit HTTP 400 und
      error "invalid_request" (RFC 9126 Abschnitt 2.3) ab; es wird keine
      request_uri_app ausgestellt. Siehe
      Abb-ZETA-OIDC-Authorization-Request-mit-äußerem-und-innerem-PAR.puml.

      Für native mobile Clients werden zwei claimed-HTTPS-URIs (Universal Links /
      App Links) je App registriert. Beide Auth Code Flows enden über denselben
      App-/Universal-Link in der App; der ZETA Client unterscheidet den beim AuthS zu
      nutzenden Endpunkt über den LETZTEN Pfad-Abschnitt (Konvention "/cb/<app>/<flow>"):
        - ".../oidc" = oidc_redirect_uri → SekIDP Auth Code Flow; der ZETA Client reicht
          den über diese URI empfangenen Code an den redirection_endpoint des AuthS
          weiter (NICHT /token). Diese URI wird ins AuthS-Entity-Statement aufgenommen;
          der AuthS erkennt am Suffix, welche URI für den SekIDP bestimmt ist.
        - ".../app" = app_redirect_uri → ZETA Guard Auth Code Flow; der ZETA Client
          reicht den Code an den /token-Endpunkt des AuthS weiter.
      Die OS-seitige Verknüpfung erfolgt über apple-app-site-association bzw.
      assetlinks.json (Deployment, kein Laufzeit-Flow).
    items:
      type: string
      format: uri
      description: >-
        Claimed-HTTPS-Redirection-URI. Der letzte Pfad-Abschnitt (oidc|app) bestimmt,
        welchem Auth Code Flow die URI zugeordnet ist (siehe Beschreibung des Arrays).
      pattern: '^https://.+/(oidc|app)$'
    minItems: 1
  jwk:
    type: object
    properties:
      kty: { type: string }
      crv: { type: string }
      x: { type: string }
      y: { type: string }
      n: { type: string }
      e: { type: string }
    required: [kty]
