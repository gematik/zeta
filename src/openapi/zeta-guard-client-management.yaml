openapi: 3.1.0
info:
  title: ZETA Guard — Client Registration and Management API
  version: 0.1.0-draft
  description: |
    Client Registration and Management API of a single ZETA Guard (one guard = one realm =
    one Fachdienst; no central registry). Covers Dynamic Client Registration (A_29658) and the
    factor-bound TOFU lifecycle built on it.

    Trust model: the adversary is a compromised SEK-IDP; IDP authentication is necessary but
    never sufficient. Every control-transferring operation additionally requires a factor
    pinned at first use — F1 (verified email) or F2 (instance-key proof-of-possession); the
    factor set is {F1, F2} (peer attestation is NOT a factor). Scope is mobile TOFU clients
    bound to a TI identity (KVNR, A_29893); stationary SMC-B (A_25762) and identity-less
    clients (A_29733) are out of scope for the identity-bound `/zeta/*` operations (email,
    enrolled-client management, veto; A_29894). EXCEPTION: the key rollover (A_29921 ff.)
    applies to ALL client classes (A_29895) — `PUT /register/{client_id}` with
    `application/zeta-rollover+jws` and `HEAD /zeta/rollover-nonce` are also available to
    identity-less clients, since rollover only requires possession of the current instance
    key. An identity-less client that loses its instance key has NO recovery path and MUST
    re-register (A_29895).

    Registration (A_29658, A_25432-01): `POST /register` (body `dcr-request.yaml`). For mobile
    TOFU clients this returns `201 Created` (`client_id`, status `pending_user_binding`)
    directly — the email OTP is NOT part of `/register` anymore; the identity-bound F1 email
    verification is performed AFTER the OIDC user authentication (see the token flow,
    `Abb-ZETA-OIDC-Token-Bezug`). Only the stationary TPM ActivateCredential challenge still
    uses the asynchronous `202 Accepted` (`dcr-response-202.yaml`) → `POST /register/verify`
    (`verify_type: tpm_activation`) → `201 Created` handshake. Identity binding derives from
    the OIDC user authentication, not from a realm-wide token (A_29903).

    Fast path (`attestation_type: zeta_attestation_token`): the client presents a ZETA
    Attestation Token (`zeta-attestation-token.yaml`), issued by this guard's token endpoint
    after hardware attestation plus successful user authentication (A_29842), and skips the
    post-OIDC F1 email verification. For cross-guard onboarding the token carries
    the identity and verified email (F1), so a target guard adopts them without a fresh first
    use (A_29913–A_29916, A_29918/A_29919). The token is long-lived and reusable (never consumed); each
    registration is bound to a fresh instance key via the DCR possession proof
    (`signed_hash_puk_client_sig`, A_29915/A_29916), so replay is useless without the private
    key. Every cross-guard onboarding MUST notify the F1 email (A_29920) — the primary
    abuse-detection control (accepted residual risk; the PoP is not challenge-bound).

    Extensions on top of registration: RFC 7592 management (`/register/{client_id}`),
    instance-key rollover, identity-scoped email change, enrolled-client management and the
    client-side deletion veto (A_29909 ff.). Recovery after total loss (all devices and the
    email) is NOT self-service — it goes solely through the operator OOB deletion path.

    Authentication: NO bearer secret exists in client management — the RFC 7592 Registration
    Access Token is NOT used (A_30101). Per-client
    management operations are authorised by a per-request `private_key_jwt` client assertion
    signed with the instance key (F2, `Client-Assertion` header, RFC 7521/7523); the
    identity-scoped listing (`GET /zeta/clients`) additionally requires a DPoP-bound access
    token from the OIDC user authentication (RFC 9449). The `client_id` is a non-secret
    selector. First-use registration carries its own credentials (attestation + key PoP); the
    post-OIDC F1 email binding (`/zeta/identity/bind-email(/resend|/verify)`) is authorised
    by the short-lived DPoP-bound email-binding token with the endpoint-specific scope
    (`zeta:email-binding` to register a new address, `zeta:email-verify` to re-send and
    confirm the OTP). A
    client assertion (or an IDP login) is necessary but never sufficient for a
    control-transferring change — key rollover and email change require their own proofs
    (A_29896/A_29902). Runtime/resource access uses DPoP-bound tokens (RFC 9449) and is out
    of scope.

    The operator-facing OOB deletion (initiate/approve/abort/re-register) lives in the separate
    Admin OOB API (`zeta-guard-admin-oob.yaml`); only the client-side veto is reachable here.
    Design draft, not a normative gematik specification.
  contact:
    name: ZETA Guard design

servers:
  - url: https://{guardHost}/realms/{realm}
    description: One guard = one realm = one Fachdienst
    variables:
      guardHost:
        default: guard-epa.example
      realm:
        default: zeta-epa

tags:
  - name: registration
    description: >-
      Dynamic Client Registration and RFC 7592 registration management: first-use registration
      (`POST /register`; gemSpec_ZETA 5.3.2/5.5, A_29658/A_25432-01, request body
      `dcr-request.yaml`) with the stationary TPM ActivateCredential challenge resolved via
      `POST /register/verify`, plus per-client read, metadata update / key rollover and
      self-deregistration on `/register/{client_id}`.
  - name: keys
    description: Instance-key rollover (proof-of-possession)
  - name: email
    description: >-
      Identity-bound F1 email binding after the OIDC user authentication
      (`/zeta/identity/bind-email`) or the identity-scoped email change
      (`/zeta/identity/email`)
  - name: devices
    description: Listing and deletion of the identity's enrolled clients
  - name: oob
    description: >-
      Client-side veto of a pending out-of-band deletion. Operator-initiated deletion lives in
      the separate Admin OOB API (zeta-guard-admin-oob.yaml).

security:
  - clientAssertion: []

paths:

  /register:
    post:
      tags: [registration]
      summary: Register a client (Dynamic Client Registration, first use / TOFU)
      description: |
        Base client-registration operation (RFC 7591 Dynamic Client Registration), defined
        normatively by A_29658 (gemSpec_ZETA 5.3.2 / 5.5). The request body is the attestation
        variant union in `dcr-request.yaml` (TPM, Apple, Android, ZETA attestation-token
        fast-path, or software).

        Flow by client class:
          * **Mobile TOFU (identity-bound)** — the guard stores the client as
            `pending_user_binding` and answers `201 Created` directly. The email OTP is NOT
            part of `/register` anymore; the identity-bound F1 email verification is performed
            AFTER the OIDC user authentication (see the token flow, `Abb-ZETA-OIDC-Token-Bezug`),
            so no inline `202`/`transaction_id` challenge is issued here. Recovery of a lost
            identity (all devices and email lost) is not self-service; it is handled only via
            the operator OOB deletion path.
          * **TPM activation (stationary)** — the guard answers `202 Accepted`
            (`dcr-response-202.yaml`, `challenge_type: tpm_activation`) and the client completes
            the ActivateCredential handshake via `POST /register/verify` (A_29658, A_25432-01).
          * **Fast path** — `attestation_type: zeta_attestation_token` skips the F1 email
            verification and
            answers `201 Created` directly. The client presents a valid ZETA Attestation Token
            (`zeta-attestation-token.yaml`): for platform re-registration it proves hardware
            attestation and the confirmed key; for cross-guard onboarding it additionally
            carries the identity and verified email (F1), so the target guard adopts them
            without a fresh F1 email first use (A_29913, A_29915). Key possession (F2) is
            proven by the standard DCR possession proof (`signed_hash_puk_client_sig`) binding
            the new instance key to the token's attestation key (A_29916). The token is
            long-lived and REUSABLE — it MAY be redeemed repeatedly and at multiple guards (it is
            the same attestation token used for platform re-registration); the guard does NOT
            consume it. Because each registration is bound to a fresh instance key that only the
            genuine attestation key can sign, a replayed redemption can only re-register that same
            key (useless to a replayer without its private key). Every successful cross-guard
            onboarding MUST notify the F1 email (A_29920), which is the primary abuse-detection
            control; the PoP is not challenge-bound (no server nonce) — an accepted residual risk
            (A_29915).

        Identity binding is derived from the OIDC user authentication (status
        `pending_user_binding`); a realm-wide initial access token without identity reference
        is NOT sufficient (A_29903). Full scope/audiences are withheld until email verification
        completes (A_29905).
      security:
        - {}   # Self-authenticating request (attestation + instance-key PoP); the identity
               # binding is established by the OIDC user authentication (A_29903).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/dcr-request.yaml' }
      responses:
        '201':
          description: |
            Client registered (mobile TOFU direct, fast path, or after a completed TPM
            ActivateCredential challenge). Returns the final `client_id` — a non-secret
            selector; NO registration access token is issued (A_30101). Subsequent
            management operations are authorised by the per-request client assertion (F2).
          headers:
            Location:
              description: Management URI of the new client (`/register/{client_id}`).
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientRegistration' }
        '202':
          description: |
            Registration accepted; an asynchronous TPM ActivateCredential challenge must be
            solved before the final `client_id` is issued. Only stationary TPM clients receive
            this response — mobile TOFU clients get `201 Created` directly and perform F1 email
            verification after the OIDC user authentication. The client resolves the challenge
            via `POST /register/verify`.
          content:
            application/json:
              schema: { $ref: '../schemas/dcr-response-202.yaml' }
        '400':
          description: invalidAttestation | malformed registration request
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: registrationForbidden — the client is not permitted to register at this guard
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: registrationConflict — a client with the same identity/key already exists
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /register/verify:
    post:
      tags: [registration]
      summary: Complete a registration by answering its TPM ActivateCredential challenge
      description: |
        Second step of the first-use registration for stationary TPM clients (A_29658,
        A_25432-01). Submits the answer to the TPM ActivateCredential challenge issued by the
        `202 Accepted` response of `POST /register` (`verify_type: tpm_activation`) together
        with the `transaction_id`. On success the guard issues the final `client_id` (status
        `pending_user_binding`). Mobile TOFU clients do NOT use this endpoint for email OTP
        anymore — their F1 email verification runs after the OIDC user authentication.
      security:
        - {}   # Authenticated by the challenge answer + transaction_id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/verify-request.yaml' }
      responses:
        '201':
          description: |
            Verified and registered. Returns the final `client_id` (status
            `pending_user_binding`); NO registration access token is issued (A_30101).
          headers:
            Location:
              description: Management URI of the new client (`/register/{client_id}`).
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientRegistration' }
        '400':
          description: invalidActivationSecret | challengeExpired | invalid challenge response
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown or expired transaction_id
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /register/{client_id}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [registration]
      summary: Read this client's registration (RFC 7592-style)
      security:
        - clientAssertion: []
      responses:
        '200':
          description: Current registration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientRegistration' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [registration]
      summary: Update metadata, or roll over the instance key (PoP)
      description: |
        RFC 7592-style registration management. Two modes, distinguished by Content-Type:
          * application/json — metadata-only update. Narrowed to renaming the client
            (`client_name`, A_29909, A_30005); the client assertion (F2) alone suffices for
            this single change (A_30101). It MUST
            NOT change the instance key (F2 — use the rollover mode below), the bound email
            (F1 — use `POST /zeta/identity/email`, A_29911), the authorised audiences (governed
            by policy per client instance, A_29901) or DCR parameters (`jwks`, `redirect_uris`,
            `grant_types`). Any such field is rejected (`additionalProperties: false`).
          * application/zeta-rollover+jws — instance-key rollover (A_29921). Body is the
            nested JWS: outer signed by the OLD key = authorization (A_29922), inner signed
            by the NEW key = anti-substitution. Requires a fresh Replay-Nonce from
            `HEAD /zeta/rollover-nonce` bound to HTTP method+URI and guard audience
            (A_29923). The client assertion alone is NEVER sufficient to change a key — the
            old-key PoP envelope is the authorisation (A_29921, A_30101).
            After success the old key stays valid for resource access only, during a
            grace/overlap window (A_29924, A_29925); it can no longer authorize management
            operations, including another rollover (A_29924). Rollover requires possession of
            the current key — if it was lost, re-enrol via a new registration when another
            device (F2) or the bound email (F1) still survives (A_29910); only if ALL of
            {F1, F2} are lost is self-recovery impossible and the identity can be re-established
            solely via the operator OOB deletion path (A_29927).
            A rollover MUST NOT be coupled with an email (F1) change
            (A_29926). Key thumbprints follow RFC 7638.
      security:
        - clientAssertion: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetadataUpdate' }
          application/zeta-rollover+jws:
            schema: { $ref: '#/components/schemas/RolloverEnvelope' }
      responses:
        '200':
          description: Updated registration (on rollover, new key active; old key in grace)
          headers:
            Replay-Nonce:
              schema: { type: string }
              description: Fresh nonce for the next rollover.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientRegistration' }
        '400':
          description: badNonce | invalidBinding | wrongAudience | staleRequest | invalidKeyChange
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
          headers:
            Replay-Nonce:
              schema: { type: string }
              description: Returned on badNonce so the client can retry.
        '401':
          description: invalidSignature | invalidNewKeyProof | popRequired
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: tombstoned
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [registration]
      summary: Deregister THIS client (self, client-plane only)
      description: |
        RFC 7592 client deletion. Removes the calling client's own registration. Client-plane
        only — the identity record and the pinned email (F1) are untouched
        (A_29934, A_29938). To delete another device use
        `DELETE /zeta/clients/{target_client_id}`; to remove the identity use the OOB path.
      security:
        - clientAssertion: []
      responses:
        '204':
          description: Deregistered
        '401':
          $ref: '#/components/responses/Unauthorized'

  /zeta/rollover-nonce:
    head:
      tags: [keys]
      summary: Obtain a single-use rollover Replay-Nonce
      description: |
        Guard-scoped, single-use, short-lived. Required before a key-rollover PUT (A_29923).
        Unlike the identity-bound `/zeta/*` operations, this endpoint is available to ALL
        client classes, including identity-less clients (A_29895) — the rollover requires
        only possession of the current instance key. Requiring the client assertion (instead
        of an unauthenticated endpoint) prevents nonce farming.
      security:
        - clientAssertion: []
      responses:
        '200':
          description: Nonce issued (in header)
          headers:
            Replay-Nonce:
              required: true
              schema: { type: string }

  /zeta/identity/bind-email:
    post:
      tags: [email]
      summary: Bind the identity-scoped email (F1) — register a new address (first use)
      description: |
        Identity-bound F1 email binding, performed AFTER the OIDC user authentication
        (registration status `pending_user_binding`). Authorised by the
        short-lived DPoP-bound email-binding token issued by the token endpoint with scope
        `zeta:email-binding` (5–15 min, no refresh token); identity and `client_id` are
        resolved from the token — no server-side transaction state and no `transaction_id`
        (at most one open challenge per client). The granted scope encodes the mode:
          * identity (token scope `zeta:email-binding zeta:email-verify`, TOFU): the
            request carries the address to pin; the guard sends the OTP to it.
          * identity (token scope `zeta:email-verify` only, A_29910): this endpoint
            is NOT authorised (`403 insufficient_scope`) — the OTP was already sent to the
            STORED bound address at token issuance; the client goes directly to
            `POST /zeta/identity/bind-email/verify` (re-send via `…/resend`). A
            client-supplied address is thus structurally excluded (least privilege).
        After the successful verify the registration becomes `bound`; full access and
        refresh tokens are then obtained via token exchange (RFC 8693) at the token
        endpoint (A_29905). Distinct from the email CHANGE operation
        (`POST /zeta/identity/email`, A_29911).

        Calling this endpoint again REPLACES a still-open challenge (at most one open
        challenge per client, A_30085) — this is the correction path for an address the user
        mistyped, whose OTP therefore never arrives. Because every call sends mail to a
        client-supplied address, the anti-abuse limits are shared with `…/resend`: a cooldown
        between two sends (SHOULD: at least 60 s) and a common upper bound of sends per
        email-binding token; a send beyond that is rejected with `429`.
      security:
        - dpopAccessToken: []   # email-binding token (scope zeta:email-binding, DPoP-bound)
      parameters:
        - $ref: '#/components/parameters/DPoPProof'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BindEmailRequest' }
      responses:
        '202':
          description: >-
            Email-OTP challenge issued. No `transaction_id` — correlation is via the
            email-binding token; completed via `POST /zeta/identity/bind-email/verify`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge_type: { type: string, const: email_otp }
                  expires_in:
                    type: integer
                    description: Challenge lifetime in seconds.
        '400':
          description: invalid address
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            insufficientScope — the token does not carry `zeta:email-binding` (known
            identity: the OTP was already sent to the stored address, A_29910)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: >-
            otpSendLimited — cooldown not yet elapsed or the maximum number of sends per
            email-binding token reached (shared budget with `…/resend`, A_30085)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /zeta/identity/bind-email/resend:
    post:
      tags: [email]
      summary: Re-send the binding confirmation email (OTP) for the open challenge
      description: |
        Re-sends the confirmation email for the OPEN binding challenge (A_30085), e.g.
        after a lost or filtered mail. Requires the email-binding token with scope
        `zeta:email-verify`. No request body and no `transaction_id` — at most one
        challenge is open per client, correlation is via the token; the OTP always goes to
        the address of the open challenge (client-supplied at first use, stored address
        otherwise). Anti-abuse: the guard enforces a cooldown between sends
        (SHOULD: at least 60 s) and an upper bound of sends per email-binding token, shared
        with `POST /zeta/identity/bind-email` (A_30085).
      security:
        - dpopAccessToken: []   # email-binding token (scope zeta:email-verify, DPoP-bound)
      parameters:
        - $ref: '#/components/parameters/DPoPProof'
      responses:
        '202':
          description: Confirmation email re-sent to the address of the open challenge.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: noOpenChallenge — no open binding challenge for this client
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: >-
            otpSendLimited — cooldown not yet elapsed or the maximum number of sends per
            email-binding token reached (shared budget with `POST /zeta/identity/bind-email`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /zeta/identity/bind-email/verify:
    post:
      tags: [email]
      summary: Verify the binding OTP (completes the F1 email binding)
      description: |
        Completes the identity-bound F1 email binding: submits the OTP sent by
        `POST /zeta/identity/bind-email` (first use) or at token issuance (known identity,
        A_29910). Requires the email-binding token with scope `zeta:email-verify`. Uses
        the email-OTP verify payload
        (`verify_type: email_otp`, `code`) WITHOUT a `transaction_id` — the
        open challenge is resolved from the email-binding token. On success the
        registration becomes `bound` (A_29905); the client then exchanges the email-binding
        token for full access and refresh tokens (RFC 8693, token endpoint).
      security:
        - dpopAccessToken: []   # email-binding token (scope zeta:email-verify, DPoP-bound)
      parameters:
        - $ref: '#/components/parameters/DPoPProof'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BindEmailVerifyRequest' }
      responses:
        '200':
          description: >-
            F1 bound; registration status is now `bound` — full tokens available via token
            exchange (RFC 8693).
        '400':
          description: invalidOtp | challengeExpired
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /zeta/identity/email:
    post:
      tags: [email]
      summary: Change the identity-scoped email (affects all clients at this FD)
      description: |
        Changes the identity-bound email (F1). Distinct from the first-use binding
        (`/zeta/identity/bind-email`). Per A_29911 this requires THREE things together:
          1. an enrolled, valid client — the instance-key client assertion (F2,
             `Client-Assertion` header, A_29902/A_30101);
          2. a fresh, stepped-up IDP user authentication (`idp_step_up`); and
          3. a surviving factor — instance-key PoP (F2, `pop`) OR proof of control of the old
             email (F1, `old_email_proof`).

        Step-up follows RFC 9470 and reuses the guard's REGULAR user authentication — no
        separate step-up protocol: if the presented user authentication is missing or below the
        required assurance/freshness, the guard answers `401` with a `WWW-Authenticate` header
        (`error="insufficient_user_authentication"`, `acr_values`, optionally `max_age`). The
        client then runs the standard ZETA Authorization Code Flow (PAR → `GET /authorize` →
        sectoral-IDP login → `POST /token`) requesting those `acr_values`; the guard brokers the
        SekIDP login, takes `acr`/`amr` from the SekIDP ID token (A_29994) and issues a fresh
        DPoP-bound access token reflecting them. The client retries ONCE with that token as
        `idp_step_up` (DPoP proof in the `DPoP` header); then the operation is aborted.

        On success the guard issues a verification challenge for the new address; the change
        takes effect once verified and applies identity-wide (A_29912). No server-side sync
        across Fachdienste — repeat per guard (A_29899).
      security:
        - clientAssertion: []
      parameters:
        - $ref: '#/components/parameters/StepUpDPoPProof'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeRequest' }
      responses:
        '202':
          description: >-
            New email accepted; email-OTP challenge issued to the NEW address. Same challenge
            shape as the registration flow (`dcr-response-202.yaml`, `challenge_type:
            email_otp`, `transaction_id`); completed via `POST /zeta/identity/email/verify`.
          content:
            application/json:
              schema: { $ref: '../schemas/dcr-response-202.yaml#/definitions/OtpChallengeResponse' }
        '401':
          $ref: '#/components/responses/StepUpRequired'

  /zeta/identity/email/verify:
    post:
      tags: [email]
      summary: Verify the new email address (completes the email change)
      description: |
        Completes the identity-scoped email change (A_29911 "die neue Adresse verifizieren"):
        submits the OTP sent to the NEW address together with the `transaction_id` from the
        `202` response of `POST /zeta/identity/email`. Reuses the DEFINED email-OTP verify
        payload of the registration flow (`verify-request.yaml`, `verify_type: email_otp`;
        A_25432-01) — only the response differs: no new registration is created. On success the
        change takes effect identity-wide for all clients at this Fachdienst (A_29912) and the
        OLD address is notified (A_25750).
      security:
        - clientAssertion: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/verify-request.yaml#/definitions/OtpVerifyRequest' }
      responses:
        '200':
          description: New email verified; change now effective identity-wide (A_29912)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailStatus' }
        '400':
          description: invalidOtp | challengeExpired
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown or expired transaction_id
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /zeta/clients:
    get:
      tags: [devices]
      summary: List the identity's enrolled clients at this FD
      description: |
        Identity-scoped read: returns ALL enrolled clients of the calling identity. Requires
        BOTH the calling client's assertion (F2) AND a DPoP-bound access token from the OIDC
        user authentication (A_30101): the client assertion only proves possession
        of ONE device, while the listing discloses the identity-wide record (all devices,
        names, key thumbprints) — the additional user-identity proof prevents device
        enumeration/reconnaissance by a stolen or compromised device without eGK/PIN.
      security:
        - clientAssertion: []
          dpopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/DPoPProof'
      responses:
        '200':
          description: Enrolled clients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClientSummary' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /zeta/clients/{target_client_id}:
    parameters:
      - name: target_client_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [devices]
      summary: Delete another device / client of the same identity (client-plane only)
      description: |
        Allowed for any enrolled client of the identity. The guard MUST verify that
        `target_client_id` belongs to the SAME identity as the calling client (established by
        its client assertion, F2) and reject a
        non-matching target with `403` (`forbiddenTarget`, A_29939) — possession of the
        object reference alone is never authorisation (BOLA / OWASP API1). Removes the target's
        client record and notifies the pinned email F1 (A_29935). Never touches the
        identity-scoped factor F1 (A_29934). Deleting the LAST remaining sibling requires
        IDP step-up; such a request is scheduled with a veto window rather than executed
        immediately (A_29936). Bulk deletion is not a server operation — a client deletes
        multiple siblings by repeating this call. Deliberately authorised by the client
        assertion (F2) alone — a security-response operation (locking out a lost/compromised
        device) that must work without a fresh IDP login (A_30101, rationale).
      security:
        - clientAssertion: []
      parameters:
        - name: idp_step_up
          in: header
          required: false
          schema: { type: string }
          description: >-
            Required when deleting the last remaining sibling (A_29936): the fresh, DPoP-bound
            access token from the guard's step-up Authorization Code Flow, as for
            `POST /zeta/identity/email` (RFC 9470).
        - $ref: '#/components/parameters/StepUpDPoPProof'
      responses:
        '204':
          description: Deleted (routine sibling deletion)
        '202':
          description: Scheduled with veto window (last-sibling deletion); email notified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingDeletion' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: forbiddenTarget — target client not owned by the caller's identity (A_29939)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /zeta/deletions/{deletion_id}/veto:
    post:
      tags: [oob]
      summary: Cancel a pending OOB deletion using a surviving enrolled client
      description: |
        Client-side counterpart to the operator-initiated deletion defined in the Admin OOB
        API. While a deletion is in its veto window, a surviving enrolled client cancels it by
        authenticating with its instance-key client assertion (surviving factor F2, A_29943).
        A veto by control of the
        bound email (F1) alone is NOT offered: if no enrolled client remains, the user must
        first register a new device (Folgeregistrierung, which re-verifies the bound email F1,
        A_29910) and then veto with that client. Only if all factors {F1, F2} are lost does the
        deletion proceed. The operator surface never performs this veto.
      security:
        - clientAssertion: []   # surviving enrolled client (F2) — deliberately without F1:
                                # emergency exit when the identity is compromised (A_29943)
      parameters:
        - name: deletion_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deletion cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such pending deletion

components:

  securitySchemes:
    clientAssertion:
      type: apiKey
      in: header
      name: Client-Assertion
      description: |
        Per-request `private_key_jwt` client assertion (RFC 7521/7523, A_25767) signed with
        the registered instance key (`PrK.Client.Sig`, F2) and sent in the `Client-Assertion`
        header (the JWT alone; no `client_assertion_type` parameter — RFC 7521/7523 only
        define form parameters, which the body-less operations `GET`/`HEAD`/`DELETE` cannot
        carry). Payload per `client-assertion-jwt.yaml`. Sender-constrained — replaces the
        RFC 7592 Registration Access Token; NO bearer secret exists in client management and
        the `client_id` is a non-secret selector (A_30101).

        The guard verifies the assertion against the instance key of the registration
        addressed by `client_id` and rejects the request with `401` (`invalid_client`) if
        (A_30101):
          * `iss`/`sub` are not the `client_id`;
          * `aud` does not identify this Authorization Server (its issuer);
          * `htm`/`htu` do not match the HTTP method and target URI of this request
            (RFC 9449 section 4.2) — this prevents replaying a read assertion against a
            destructive endpoint;
          * the lifetime exceeds 60 seconds;
          * `jti` was already used within that lifetime (replay cache).

        Necessary but never sufficient for a control-transferring change: a key rollover
        additionally requires the old-key PoP envelope plus the server nonce (A_29921 ff.,
        A_29923) and an email change requires
        IDP step-up plus a surviving factor (A_29911). Management is only accepted from an
        enrolled, valid client (A_29902); a successful IDP authentication alone is not enough
        (A_29896).

        EXCEPTION: the post-OIDC F1 email binding (`/zeta/identity/bind-email(/resend|/verify)`)
        is NOT authorised by a client assertion but by the DPoP-bound email-binding token
        with the endpoint-specific scope (see `dpopAccessToken`) — the F2 proof was already
        given at the token endpoint.
    dpopAccessToken:
      type: http
      scheme: dpop
      description: |
        DPoP-bound access token (RFC 9449): `Authorization: DPoP <token>` plus a `DPoP` proof
        header bound to this request (htm/htu). Two roles on this API:
          * Identity-scoped read (`GET /zeta/clients`): a full access token from the OIDC
            user authentication — proves the USER identity where the identity-wide record is
            the authorisation object (A_30101 Nr. 2).
          * F1 email binding (`/zeta/identity/bind-email(/resend|/verify)`): the short-lived
            email-binding token (5–15 min, no refresh token) issued by the token endpoint in
            status `pending_user_binding` (A_30085). The granted scope is state-dependent
            and endpoint-specific: `zeta:email-binding` authorises `bind-email` (register a
            new address, first use only), `zeta:email-verify` authorises `…/resend` and
            `…/verify`. Full access and refresh tokens follow via token exchange (RFC 8693)
            once `bound`.

  parameters:
    ClientId:
      name: client_id
      in: path
      required: true
      schema: { type: string }
    DPoPProof:
      name: DPoP
      in: header
      required: true
      schema: { type: string }
      description: >-
        DPoP proof JWT (RFC 9449 section 4.2) for the DPoP-bound access token presented as
        `Authorization: DPoP <token>`, bound to this request via `htm`/`htu`. OpenAPI cannot
        express this companion header through the security scheme, so it is declared
        explicitly on every operation secured by `dpopAccessToken`.
    StepUpDPoPProof:
      name: DPoP
      in: header
      required: false
      schema: { type: string }
      description: >-
        DPoP proof (RFC 9449) for the step-up access token passed in `idp_step_up`, bound to
        this request (htm/htu). Required whenever `idp_step_up` is presented (A_29911,
        A_29936).

  responses:
    BadRequest:
      description: Malformed or invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials/factor
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    StepUpRequired:
      description: |
        Additional authentication required. Either the user authentication is missing or below
        the required assurance/freshness (`insufficientUserAuthentication`) — per RFC 9470 the
        client runs the guard's regular Authorization Code Flow (PAR → `GET /authorize` →
        `POST /token`) with the `acr_values` named in `WWW-Authenticate`, obtains a fresh
        DPoP-bound access token and retries once — or a required surviving factor was not
        presented (`factorRequired`).
      headers:
        WWW-Authenticate:
          description: >-
            Present for the step-up case (RFC 9470), e.g.
            `Bearer error="insufficient_user_authentication", acr_values="<required>", max_age=<seconds>`.
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Jwks:
      type: object
      description: >-
        JSON Web Key Set carrying the instance public key. The guard MUST validate every key
        against an explicit algorithm/key-type allowlist and reject `alg: none`, unlisted
        algorithms and header-supplied keys from untrusted sources
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          items:
            type: object
            required: [kty, crv, x, y]
            additionalProperties: false
            properties:
              kty: { type: string, enum: [EC] }
              crv: { type: string, enum: [P-256, P-384] }
              x: { type: string }
              y: { type: string }
              kid: { type: string }
              use: { type: string, enum: [sig] }
              alg: { type: string, enum: [ES256, ES384] }
              key_ops:
                type: array
                items: { type: string, enum: [verify] }

    MetadataUpdate:
      type: object
      description: >-
        Non-key metadata update via RFC 7592-style `PUT` (application/json). Deliberately
        narrowed to the only change for which the client assertion (F2) alone is sufficient
        on this endpoint: renaming the client
        (A_29909, A_30005, A_30101). Key material (F2), the bound email (F1), the authorised
        audiences (A_29901) and DCR parameters cannot be changed here — they have dedicated
        operations or require proof-of-possession / step-up.
      additionalProperties: false
      required: [client_name]
      properties:
        client_name:
          type: string
          description: New human-readable name for this client instance.

    RolloverEnvelope:
      type: string
      description: |
        Compact-serialized NESTED JWS authorizing an instance-key rollover (A_29921, A_29922).
        This is a string (a JWS), not a JSON object; the guard verifies BOTH signature layers
        before applying the change. Sent as the request body with
        `Content-Type: application/zeta-rollover+jws`.

        Structure (the outer JWS wraps the inner JWS as its payload):
          * OUTER JWS — signed by the OLD (currently active) instance key = AUTHORISATION,
            i.e. proof-of-possession of the key being replaced (A_29921). Its protected header
            identifies the old key by its RFC 7638 thumbprint (`kid`/`jkt`) and sets
            `cty: "JWT"` to mark the nested payload.
          * INNER JWS — signed by the NEW instance key = ANTI-SUBSTITUTION, i.e. proof the
            caller controls the key being pinned (A_29922). Its protected header carries the
            full NEW public key as a `jwk`.

        Claims in the (inner) payload bind the request against replay and misdirection
        (A_29923):
          * `nonce` — the single-use value from `HEAD /zeta/rollover-nonce`.
          * `htm`   — the HTTP method of this request (`PUT`).
          * `htu`   — the target URI of this request (`/register/{client_id}`).
          * `aud`   — the guard audience (this ZETA Guard's identity).
          * `iat`   — issue time, for freshness.

        The envelope MUST NOT carry an email (F1) change; that is a separate operation
        (A_29911, A_29926).
      contentMediaType: application/zeta-rollover+jws
      example: "eyJhbGciOiJFUzI1NiIsImN0eSI6IkpXVCIsImtpZCI6Ii4uLm9sZC1qa3QifQ.<inner-jws>.<outer-sig>"

    ClientRegistration:
      type: object
      required: [client_id]
      properties:
        client_id:
          type: string
          description: >-
            Non-secret selector for the per-client management operations
            (`/register/{client_id}`). Authorisation is always the per-request client
            assertion (F2) — no registration access token exists (A_30101).
        client_id_issued_at: { type: integer }
        jwks: { $ref: '#/components/schemas/Jwks' }
        resource:
          type: array
          items: { type: string, format: uri }
        email_verification:
          type: object
          description: >-
            State of the identity-bound F1 email binding performed after the OIDC user
            authentication (`/zeta/identity/bind-email`, A_30085). Correlation is via the
            email-binding token — no transaction id.
          properties:
            required: { type: boolean }
            status: { type: string, enum: [pending, verified] }
        key_overlap:
          type: object
          description: Present after a rollover.
          properties:
            old_jkt: { type: string }
            grace_until: { type: integer }

    BindEmailRequest:
      type: object
      description: >-
        Body of `POST /zeta/identity/bind-email`. Only used at FIRST USE of an identity
        (token scope includes `zeta:email-binding`): carries the address to pin (TOFU).
        For a KNOWN identity (Folgeregistrierung) the endpoint is not authorised — the
        token carries `zeta:email-verify` only and the OTP was already sent to the stored
        bound address at token issuance (A_29910).
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: '../schemas/dcr-request.yaml#/definitions/user_email'

    BindEmailVerifyRequest:
      type: object
      description: >-
        Body of `POST /zeta/identity/bind-email/verify`. Same OTP payload as
        `verify-request.yaml#/definitions/OtpVerifyRequest`, but WITHOUT `transaction_id`:
        the open challenge is correlated via the email-binding token (at most one open
        challenge per client, A_30085).
      additionalProperties: false
      required: [verify_type, code]
      properties:
        verify_type:
          type: string
          const: email_otp
        code:
          type: string
          description: The confirmation code (OTP) entered by the user.
          minLength: 4
          maxLength: 10
          example: "123456"

    EmailStatus:
      type: object
      description: Verification state of an email-change transaction.
      properties:
        transaction_id:
          type: string
          description: The email-OTP transaction this status refers to (from the `202` challenge).
        status: { type: string, enum: [pending, verified, expired] }

    EmailChangeRequest:
      type: object
      required: [new_email, idp_step_up]
      properties:
        new_email: { type: string, format: email }
        idp_step_up:
          type: string
          description: >-
            Proof of the stepped-up user authentication: the FRESH access token issued by THIS
            guard's own token endpoint after completing the step-up Authorization Code Flow
            (RFC 9470 challenge → PAR / `GET /authorize` / `POST /token` with the required
            `acr_values`). The guard validates its own token signature, the `acr`/`amr` claims
            it took from the SekIDP ID token (A_29994), a recent `auth_time`, and the DPoP
            binding (proof in the `DPoP` request header). Note the client never holds the SekIDP
            ID token itself — it is encrypted to the guard; the guard-issued access token is the
            only step-up artefact available to the client.
        pop:
          type: string
          description: Instance-key PoP signature (F2) — or use old_email_proof.
        old_email_proof:
          type: string
          description: Proof of control of the old email (F1) as the surviving factor.

    ClientSummary:
      type: object
      properties:
        client_id: { type: string }
        client_name: { type: string }
        jkt:
          type: string
          description: RFC 7638 JWK thumbprint of the client's instance key (F2).
        created_at: { type: integer }
        is_self: { type: boolean }

    PendingDeletion:
      type: object
      properties:
        deletion_id: { type: string }
        scope: { type: string, enum: [client, identity] }
        effective_after: { type: integer }
        notified_channels:
          type: array
          items: { type: string }

    Error:
      type: object
      description: >-
        Problem Details object per RFC 9457 (`application/problem+json`); `code` carries the
        machine-readable failure reason.
      required: [code]
      properties:
        code:
          type: string
          enum:
            - badNonce
            - invalidBinding
            - invalidSignature
            - invalidNewKeyProof
            - wrongAudience
            - staleRequest
            - invalidKeyChange
            - popRequired
            - emailMismatch
            - tombstoned
            - factorRequired
            - stepUpRequired
            - forbiddenTarget
            - insufficientUserAuthentication
            - invalidAttestation
            - registrationForbidden
            - registrationConflict
            - invalidOtp
            - challengeExpired
            - insufficientScope
            - noOpenChallenge
            - otpSendLimited
        title: { type: string }
        detail: { type: string }
