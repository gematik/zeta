openapi: 3.1.0
info:
  title: ZETA Guard — SDK HTTP API
  version: 0.1.0-draft
  description: |
    Network interface between the ZETA client SDK and a single ZETA Guard
    (one independent guard / Keycloak realm per Fachdienst — no central registry).

    Trust model: the adversary of record is a compromised SEK-IDP; the protected asset is
    existing client registrations. IDP authentication is necessary but never sufficient —
    every control-transferring operation additionally requires a factor pinned at first use
    (F1 verified email, F2 instance-key proof-of-possession, F3 recovery code). Peer
    attestation is deliberately NOT a factor (the factor set is {F1, F2, F3}).

    Scope: this surface governs **mobile** TOFU client registrations bound to a TI identity
    (KVNR), per A_29893. Stationary SMC-B clients (A_25762) and identity-less clients
    (A_29733; governed by F2 + platform attestation via JWT-bearer, RFC 7523) are out of scope
    for the factor-bound `/zeta/*` operations — see A_29894 / A_29895.

    Alignment with the defined client-registration API: first-use client registration and the
    email-OTP TOFU challenge are ALREADY defined normatively in gemSpec_ZETA (chapters 5.3.2 /
    5.5, requirements A_29658 and A_25432-01) as `POST /register` (request body
    `dcr-request.yaml`) -> `202 Accepted` (`register-response-202.yaml`,
    `challenge_type: email_otp`, `transaction_id`) -> `POST /register/verify` (OTP) ->
    `201 Created` with the final `client_id` (status `pending_user_binding`). The platform
    fast-path via `attestation_type: zeta_attestation_token` (identity-less clients, F2 +
    platform attestation) skips the OTP; it is a DISTINCT value from the cross-guard fast path
    (`attestation_type: zeta_cross_guard`, see below) and MUST NOT be conflated with it. This
    SDK surface does NOT redefine
    that flow; it references it and adds only the TOFU lifecycle EXTENSIONS not yet covered
    there: RFC 7592 registration management (`/register/{client_id}`), instance-key rollover,
    identity-scoped email change, recovery (F3), enrolled-client management and the client-side
    deletion veto. Registration/verify therefore implement A_29904 / A_29909 /
    A_29910 via the defined `/register` + `/register/verify` operations.
    Cross-guard fast-path onboarding (A_29913-A_29919): a client that already holds a valid,
    factor-backed registration at one guard can onboard the SAME identity at ANOTHER guard
    without repeating the email-OTP first use. The source guard issues a short-lived signed
    bootstrap assertion (`POST /zeta/bootstrap-grants`) carrying the verified email (F1) and a
    confirmation of the requesting instance key (`cnf`/`jkt`, RFC 7638); the target guard
    consumes it on the DEFINED `POST /register` (attestation_type `zeta_cross_guard`) together
    with a FRESH proof-of-possession of that same key. The assertion is authorised by
    instance-key possession (F2) — not derivable from an IDP compromise — so the fast path is at
    least as strong as an email-OTP first use. The assertion carries no recovery secrets and no
    portable recovery verifier; the target guard stores the recovery factor (F3) under its OWN
    per-guard salt, so stored verifiers are never identical across guards (correlation resistance,
    A_29917). The target guard establishes its own recovery factor (F3) via its own
    server-generated recovery codes (A_29904 und A_29908); no recovery secret is shared across
    guards. Email (F1) and recovery (F3) then
    evolve independently per guard: a later email change (A_29911) or recovery-code
    regeneration (A_29908) is never propagated, and divergence across guards is expected and
    permitted (A_29918). On a successful cross-guard onboarding the target guard MUST notify
    the pinned email (F1) over the Notification Service (A_29920) — since ANY approved guard
    can sign an assertion, that notification is the identity owner's primary detection of a
    misused vouch. The bootstrap is client-mediated only; guards never exchange state
    directly (A_29898/A_29899).
    Runtime token acquisition is NOT part of this surface: it uses the stock OIDC token endpoint
    (`POST /protocol/openid-connect/token`, Keycloak) unchanged, sender-constrained to the
    instance key via a DPoP proof (RFC 9449). It is referenced here,
    not redefined.

    Standards baseline:
      * RFC 7591 / RFC 7592 — OAuth 2.0 Dynamic Client Registration & management.
      * RFC 9449 — DPoP sender-constrained runtime tokens (F2 binding).
      * RFC 7638 — JWK thumbprints (`jkt` key identity).
      * RFC 8707 — Resource Indicators (per-Fachdienst audience).
      * RFC 9457 — Problem Details (`application/problem+json`).

    Scope boundary: this specification covers only the **client/SDK-facing** surface. The
    operator-facing out-of-band deletion escape hatch (initiate / approve / abort / re-register
    confirmation) is defined separately in the privileged **Admin OOB API**
    (`zeta-guard-admin-oob.yaml`). The only OOB operation reachable from this surface is
    the client-side **veto** of an already-scheduled deletion, performed with a surviving factor.

    This is a design draft, not a normative gematik specification.
  contact:
    name: ZETA Guard design

servers:
  - url: https://{guardHost}/realms/{realm}
    description: One guard = one realm = one Fachdienst
    variables:
      guardHost:
        default: guard-epa.example
      realm:
        default: zeta-epa

tags:
  - name: registration
    description: >-
      RFC 7592 registration management (key rollover, read, self-deregister). First-use
      registration and the email-OTP TOFU challenge are the DEFINED API (`POST /register`,
      `POST /register/verify`; see gemSpec_ZETA 5.3.2/5.5, A_29658/A_25432-01) and are not
      redefined here.
  - name: keys
    description: Instance-key rollover (proof-of-possession)
  - name: email
    description: Email verification (F1) and identity-scoped email change
  - name: recovery
    description: Recovery after factor loss (F3)
  - name: devices
    description: Listing and deletion of the identity's enrolled clients
  - name: oob
    description: >-
      Client-side veto of a pending out-of-band deletion. Operator-initiated deletion lives in
      the separate Admin OOB API (zeta-guard-admin-oob.yaml).
  - name: bootstrap
    description: >-
      Cross-guard fast-path onboarding. Issues a short-lived, signed bootstrap assertion that
      lets the same identity register at ANOTHER ZETA Guard without a fresh email-OTP first use
      (A_29913 - A_29919, A_29920). Client-mediated only; no server-to-server sync
      (A_29898/A_29899).

security:
  - registrationAccessToken: []

paths:

  /register/{client_id}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [registration]
      summary: Read this client's registration (RFC 7592)
      security:
        - registrationAccessToken: []
      responses:
        '200':
          description: Current registration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientRegistration' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [registration, keys]
      summary: Update metadata, or roll over the instance key (PoP)
      description: |
        RFC 7592 registration management. Two modes, distinguished by Content-Type:
          * application/json — metadata-only update (e.g. audiences/resources). The RAT alone
            is sufficient for non-key changes.
          * application/zeta-rollover+jws — instance-key rollover (A_29921). Body is the
            nested JWS: outer signed by the OLD key = authorization (A_29922), inner signed
            by the NEW key = anti-substitution. Requires a fresh Replay-Nonce from
            `HEAD /zeta/rollover-nonce` bound to HTTP method+URI and guard audience
            (A_29923). The RAT alone is NEVER sufficient to change a key (A_29921).
            After success the old key stays valid for resource access only, during a
            grace/overlap window (A_29924, A_29925). Key thumbprints follow RFC 7638.
      security:
        - registrationAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetadataUpdate' }
          application/zeta-rollover+jws:
            schema:
              type: string
              description: Compact-serialized nested JWS rollover envelope.
      responses:
        '200':
          description: Updated registration (on rollover, new key active; old key in grace)
          headers:
            Replay-Nonce:
              schema: { type: string }
              description: Fresh nonce for the next rollover.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientRegistration' }
        '400':
          description: badNonce | invalidBinding | wrongAudience | staleRequest | invalidKeyChange
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
          headers:
            Replay-Nonce:
              schema: { type: string }
              description: Returned on badNonce so the client can retry.
        '401':
          description: invalidSignature | invalidNewKeyProof | popRequired
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: tombstoned
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [registration]
      summary: Deregister THIS client (self, client-plane only)
      description: |
        RFC 7592 client deletion. Removes the calling client's own registration. Client-plane
        only — the identity record, pinned email (F1) and recovery codes (F3) are untouched
        (A_29934, A_29938). To delete another device use
        `DELETE /zeta/clients/{target_client_id}`; to remove the identity use the OOB path.
      security:
        - registrationAccessToken: []
      responses:
        '204':
          description: Deregistered
        '401':
          $ref: '#/components/responses/Unauthorized'

  /zeta/rollover-nonce:
    head:
      tags: [keys]
      summary: Obtain a single-use rollover Replay-Nonce
      description: Guard-scoped, single-use, short-lived. Required before a key-rollover PUT.
      security:
        - registrationAccessToken: []
      responses:
        '200':
          description: Nonce issued (in header)
          headers:
            Replay-Nonce:
              required: true
              schema: { type: string }

  /zeta/identity/email:
    post:
      tags: [email]
      summary: Change the identity-scoped email (affects all clients at this FD)
      description: |
        Requires IDP step-up AND a surviving factor (instance-key PoP F2, or proof of control
        of the old email F1) — A_29911. Issues a verification challenge for the new
        address; the change takes effect once verified and applies identity-wide
        (A_29912). No server-side sync across FDs — repeat per guard (A_29899).
      security:
        - registrationAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeRequest' }
      responses:
        '202':
          description: New email accepted; verification challenge issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailStatus' }
        '401':
          description: Missing step-up or surviving factor
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /zeta/recover:
    post:
      tags: [recovery]
      summary: Recover after factor loss (re-pin a new instance key)
      description: |
        Used on a fresh install after device loss. Requires an identity-scoped registration
        token (fresh IDP login) AND the surviving factor recovery code (F3). Re-pins the
        supplied new key; IDP alone is never sufficient (A_29928). Recovery-code checks are
        rate-limited with an increasing lockout after repeated failures (A_29930) — since a
        compromised IDP yields the registration token freely, F3 is the last barrier. A
        successful recovery does NOT change the identity-bound email F1 (A_29931). If the
        bound email was also lost, use the replacement-device path from an existing device first
        (A_29933).
      security:
        - registrationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoverRequest' }
      responses:
        '200':
          description: Recovered; new client registration returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientRegistration' }
        '401':
          description: No valid surviving factor presented
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: tooManyAttempts — recovery-code rate limit / lockout (A_29930)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /zeta/recovery-codes:
    post:
      tags: [recovery]
      summary: (Re)generate recovery codes for this identity at this FD
      description: |
        Requires an enrolled client (RAT) plus IDP step-up (A_29908). The guard generates
        the codes and returns them once; only salted hashes are stored (A_29906). The
        previous set is fully invalidated. Codes use a CSPRNG with adequate entropy
        (A_29932) under the guard's OWN per-guard salt (A_29917), so stored verifiers
        stay distinct and non-correlatable across guards (A_29899). Recovery-code checks are
        rate-limited with lockout (A_29930). Recovery material is never synced server-side;
        each guard establishes and evolves F3 independently.
      security:
        - registrationAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idp_step_up]
              properties:
                idp_step_up:
                  type: string
                  description: Step-up assertion / token.
      responses:
        '200':
          description: New recovery codes (shown once)
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: tooManyAttempts — recovery-code rate limit / lockout (A_29930)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /zeta/bootstrap-nonce:
    head:
      tags: [bootstrap]
      summary: Obtain a single-use nonce for the bootstrap instance-key PoP
      description: >-
        Guard-scoped, single-use, short-lived. The returned `Replay-Nonce` MUST be embedded in
        the instance-key PoP presented to `POST /zeta/bootstrap-grants`, binding it to a fresh
        server challenge and preventing replay (A_29914).
      security:
        - registrationAccessToken: []
      responses:
        '200':
          description: Nonce issued (in header)
          headers:
            Replay-Nonce:
              required: true
              schema: { type: string }

  /zeta/bootstrap-grants:
    post:
      tags: [bootstrap]
      summary: Issue a cross-guard bootstrap assertion for onboarding at another guard
      description: |
        Source-guard side of the cross-guard fast path (A_29914). An enrolled, valid client
        (RAT) proves possession of its instance key (F2) and receives a short-lived, signed
        assertion (JWS) it can present to ANOTHER ZETA Guard's `POST /register`
        (attestation_type `zeta_cross_guard`). The assertion carries the identity subject, the
        verified email (F1) and a confirmation (`cnf`/`jkt`, RFC 7638) of THIS client's instance
        key; it NEVER carries recovery secrets (F3) or a portable recovery verifier, and is
        audience-restricted to ZETA Guards
        with a short expiry and a single-use `jti` (A_29914). Client-mediated only — the
        guards never exchange state directly (A_29898, A_29899).
      security:
        - registrationAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BootstrapGrantRequest' }
      responses:
        '201':
          description: Bootstrap assertion issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapGrant' }
        '401':
          description: Missing RAT or instance-key PoP (F2)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /zeta/clients:
    get:
      tags: [devices]
      summary: List the identity's enrolled clients at this FD
      security:
        - registrationAccessToken: []
      responses:
        '200':
          description: Enrolled clients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClientSummary' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /zeta/clients/{target_client_id}:
    parameters:
      - name: target_client_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [devices]
      summary: Delete another device / client of the same identity (client-plane only)
      description: |
        Allowed for any enrolled client of the identity. The guard MUST verify that
        `target_client_id` belongs to the SAME identity as the calling RAT and reject a
        non-matching target with `403` (`forbiddenTarget`, A_29939) — possession of the
        object reference alone is never authorisation (BOLA / OWASP API1). Removes the target's
        client record and notifies the pinned email F1 (A_29935). Never touches
        identity-scoped factors F1/F3 (A_29934). Deleting the LAST remaining sibling or bulk
        deletion requires IDP step-up; such a request is scheduled with a veto window rather than
        executed immediately (A_29936).
      security:
        - registrationAccessToken: []
      parameters:
        - name: idp_step_up
          in: header
          required: false
          schema: { type: string }
          description: Required when deleting the last sibling or in bulk.
      responses:
        '204':
          description: Deleted (routine sibling deletion)
        '202':
          description: Scheduled with veto window (last-sibling/bulk); email notified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingDeletion' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: forbiddenTarget — target client not owned by the caller's identity (A_29939)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /zeta/deletions/{deletion_id}/veto:
    post:
      tags: [oob]
      summary: Cancel a pending OOB deletion using any surviving factor
      description: |
        Client-side counterpart to the operator-initiated deletion defined in the Admin OOB
        API. While a deletion is in its veto window, any surviving factor cancels it
        (A_29943): an enrolled client authenticates with its RAT, or — if no client
        remains — a recovery code (F3) is supplied. The two authorisation paths are genuine
        alternatives (RAT OR recovery code); the recovery-code path is rate-limited and subject
        to lockout per A_29930. The operator surface never performs this veto.
      security:
        - registrationAccessToken: []   # surviving enrolled client (RAT)
        - {}                            # no client remains: authorised by recovery_code (F3) in body, rate-limited (A_29930)
      parameters:
        - name: deletion_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                recovery_code:
                  type: string
                  description: Alternative surviving factor (F3) if no enrolled client remains; rate-limited (A_29930).
      responses:
        '200':
          description: Deletion cancelled
        '404':
          description: No such pending deletion
        '429':
          description: tooManyAttempts — recovery-code veto attempts rate-limited/locked out (A_29930)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

components:

  securitySchemes:
    registrationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Identity-scoped token obtained from a brokered SEK-IDP login (Authorization Code + PKCE)
        at this guard - the same identity binding the defined `POST /register` flow establishes
        (status `pending_user_binding` until the OIDC user flow completes). Carries the resolved
        KVNR/Telematik-ID and is used as the bearer for `POST /zeta/recover`.
    registrationAccessToken:
      type: http
      scheme: bearer
      description: RFC 7592 per-client Registration Access Token (RAT). Necessary, not sufficient, for key/email change.

  parameters:
    ClientId:
      name: client_id
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed or invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials/factor
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Jwks:
      type: object
      description: >-
        JSON Web Key Set carrying the instance public key. The guard MUST validate every key
        against an explicit algorithm/key-type allowlist and reject `alg: none`, unlisted
        algorithms and header-supplied keys from untrusted sources
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          items:
            type: object
            required: [kty, crv, x, y]
            additionalProperties: false
            properties:
              kty: { type: string, enum: [EC] }
              crv: { type: string, enum: [P-256, P-384] }
              x: { type: string }
              y: { type: string }
              kid: { type: string }
              use: { type: string, enum: [sig] }
              alg: { type: string, enum: [ES256, ES384] }
              key_ops:
                type: array
                items: { type: string, enum: [verify] }

    MetadataUpdate:
      type: object
      description: Non-key metadata update (RAT sufficient).
      properties:
        client_name: { type: string }
        resource:
          type: array
          items: { type: string, format: uri }

    ClientRegistration:
      type: object
      required: [client_id, registration_client_uri, registration_access_token]
      properties:
        client_id: { type: string }
        registration_client_uri: { type: string, format: uri }
        registration_access_token:
          type: string
          description: RAT for subsequent RFC 7592 operations.
        client_id_issued_at: { type: integer }
        jwks: { $ref: '#/components/schemas/Jwks' }
        resource:
          type: array
          items: { type: string, format: uri }
        email_verification:
          type: object
          properties:
            required: { type: boolean }
            status: { type: string, enum: [pending, verified] }
            challenge_id: { type: string }
        recovery_codes:
          type: array
          items: { type: string }
          description: Present only on first-use registration; shown once.
        key_overlap:
          type: object
          description: Present after a rollover.
          properties:
            old_jkt: { type: string }
            grace_until: { type: integer }

    EmailStatus:
      type: object
      properties:
        challenge_id: { type: string }
        status: { type: string, enum: [pending, verified, expired] }

    EmailChangeRequest:
      type: object
      required: [new_email, idp_step_up]
      properties:
        new_email: { type: string, format: email }
        idp_step_up:
          type: string
          description: Step-up assertion/token.
        pop:
          type: string
          description: Instance-key PoP signature (F2) — or use old_email_proof.
        old_email_proof:
          type: string
          description: Proof of control of the old email (F1) as the surviving factor.

    RecoverRequest:
      type: object
      required: [jwks, recovery_code]
      properties:
        jwks:
          $ref: '#/components/schemas/Jwks'
          description: New instance public key to pin (identified by its RFC 7638 thumbprint).
        recovery_code:
          type: string
          description: Surviving factor F3 — checked against the stored salted hash; single-use.

    BootstrapGrantRequest:
      type: object
      required: [pop]
      properties:
        pop:
          type: string
          description: >-
            Fresh instance-key proof-of-possession (F2) of the requesting client — a JWS/DPoP
            proof over this request, bound to method+URI and a single-use guard nonce obtained
            from `HEAD /zeta/bootstrap-nonce`. Authorises issuance (A_29914, A_29916).
        audience:
          type: string
          description: >-
            Optional hint restricting the assertion to one target guard. When omitted the
            assertion is valid for any gematik-approved ZETA Guard (audience class).

    BootstrapGrant:
      type: object
      required: [assertion, expires_in]
      properties:
        assertion:
          type: string
          description: >-
            Compact-serialized signed JWS. Claims: iss (source guard), sub (KVNR/Telematik-ID),
            verified_email + email_verified, cnf.jkt (RFC 7638 thumbprint of the requesting
            instance key), aud (ZETA-Guard audience class), jti (single-use), iat, exp (short).
            Contains NO recovery secrets or portable recovery verifier (A_29914, A_29917).
            Presented to the target guard's
            `POST /register` with attestation_type `zeta_cross_guard` plus a fresh PoP of the
            same key (A_29915).
        expires_in:
          type: integer
          description: Assertion lifetime in seconds (short-lived).

    ClientSummary:
      type: object
      properties:
        client_id: { type: string }
        client_name: { type: string }
        jkt:
          type: string
          description: RFC 7638 JWK thumbprint of the client's instance key (F2).
        created_at: { type: integer }
        is_self: { type: boolean }

    PendingDeletion:
      type: object
      properties:
        deletion_id: { type: string }
        scope: { type: string, enum: [client, identity] }
        effective_after: { type: integer }
        notified_channels:
          type: array
          items: { type: string }

    Error:
      type: object
      description: >-
        Problem Details object per RFC 9457 (`application/problem+json`); `code` carries the
        machine-readable failure reason.
      required: [code]
      properties:
        code:
          type: string
          enum:
            - badNonce
            - invalidBinding
            - invalidSignature
            - invalidNewKeyProof
            - wrongAudience
            - staleRequest
            - invalidKeyChange
            - popRequired
            - emailMismatch
            - tombstoned
            - factorRequired
            - stepUpRequired
            - bootstrapInvalid
            - bootstrapExpired
            - bootstrapAudience
            - forbiddenTarget
            - tooManyAttempts
        title: { type: string }
        detail: { type: string }
