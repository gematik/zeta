openapi: 3.1.0
info:
  title: OAuth 2.0 Pushed Authorization Requests (PAR) Endpoint (RFC 9126)
  version: 1.1.0
  description: |
    Outer Pushed Authorization Request of mobile ZETA Clients
    (Abb-ZETA-OIDC-Authorization-Request-mit-äußerem-und-innerem-PAR, A_29660).

    Changes 1.0.0 -> 1.1.0: client authentication (`client_assertion`), the ZETA
    parameters `idp_iss`, `oidc_redirect_uri`, `acr_values` and `resource` are added; PKCE
    (`code_challenge`, `code_challenge_method=S256`), `redirect_uri` and `state` are
    REQUIRED as used in the flow; the JWT request object (`request`) is removed because
    no ZETA flow uses it; error responses reference `zeta-error.yaml`.
servers:
  - url: https://as.example.com
paths:
  /par:
    post:
      operationId: pushAuthorizationRequest
      summary: Submit an authorization request to the PAR endpoint
      description: |
        The ZETA Client pushes the parameters of the outer authorization request to the
        Authorization Server and authenticates with a `private_key_jwt` client assertion.
        No DPoP proof is sent here: step (02) of the flow names only the client assertion,
        although A_25659 demands DPoP for all requests (open point towards the
        specification).
        The Authorization Server validates the request, stores it and returns a
        `request_uri` that the client presents at the authorization endpoint.

        The Authorization Server checks that `redirect_uri` (app_redirect_uri, last path
        segment `app`) and `oidc_redirect_uri` (last path segment `oidc`) are exactly
        (string comparison) among the redirect_uris registered for this `client_id`
        (`dcr-request.yaml`, definitions/redirect_uris); otherwise the request is rejected
        with `invalid_request` and no `request_uri` is issued. `idp_iss` MUST identify a
        sectoral IDP that the Authorization Server can verify via the Federation Master.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_assertion_type:
                  type: string
                  enum:
                    - urn:ietf:params:oauth:client-assertion-type:jwt-bearer
                client_assertion:
                  type: string
                  description: Private Key JWT of the client (`client-assertion-jwt.yaml`).
                client_id:
                  type: string
                  description: >-
                    The client identifier issued at registration. MUST equal `iss`/`sub` of
                    the client assertion.
                response_type:
                  type: string
                  enum: [code]
                redirect_uri:
                  type: string
                  format: uri
                  description: >-
                    app_redirect_uri — the registered redirection URI with last path segment
                    `app`, to which the Authorization Server returns AUTH_CODE_AS. The flow
                    description of gemSpec_ZETA calls the value `app_redirect_uri`; on the
                    wire it is the standard parameter `redirect_uri` (RFC 6749).
                oidc_redirect_uri:
                  type: string
                  format: uri
                  description: >-
                    The registered redirection URI with last path segment `oidc`, which the
                    Authorization Server uses as its redirect_uri towards the sectoral IDP
                    (inner PAR).
                idp_iss:
                  type: string
                  format: uri
                  description: Issuer (Entity Identifier) of the sectoral IDP selected by the user.
                scope:
                  type: string
                  description: The scope of the access request (RFC 6749 Section 3.3).
                resource:
                  type: string
                  format: uri
                  description: >-
                    Resource indicator (RFC 8707), contract v2. Optional here; the binding
                    value is the `resource` of the token request.
                acr_values:
                  type: string
                  description: >-
                    Requested authentication level, e.g. after a step-up challenge
                    (RFC 9470, `insufficient_user_authentication`). Passed on to the sectoral
                    IDP in the inner PAR.
                state:
                  type: string
                  description: Opaque value of the client (state_app), returned with the redirect.
                code_challenge:
                  type: string
                  description: >-
                    PKCE code challenge (RFC 7636), code_challenge_app. With S256 always
                    43 characters (base64url of a SHA-256 digest).
                  minLength: 43
                  maxLength: 43
                code_challenge_method:
                  type: string
                  enum: [S256]
              required:
                - client_assertion_type
                - client_assertion
                - client_id
                - response_type
                - redirect_uri
                - oidc_redirect_uri
                - idp_iss
                - state
                - code_challenge
                - code_challenge_method
      responses:
        '201':
          description: The authorization request has been stored.
          headers:
            Cache-Control:
              description: "`no-cache, no-store` (RFC 9126 section 2.2)."
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_uri:
                    type: string
                    description: >-
                      Single-use reference to the pushed request (request_uri_app), bound to
                      the `client_id`.
                    example: "urn:ietf:params:oauth:request_uri:6esc_11ACC5bwc014ltc14eY22c"
                  expires_in:
                    type: integer
                    description: The lifetime in seconds of the request URI.
                required:
                  - request_uri
                  - expires_in
        '400':
          description: >-
            Invalid request (`invalid_request`), e.g. a missing parameter, a redirect URI
            that is not registered for the client, an unknown `idp_iss` or an unsupported
            `code_challenge_method`.
          content:
            application/json:
              schema:
                $ref: '../schemas/zeta-error.yaml'
        '401':
          description: Client authentication failed (`invalid_client`).
          content:
            application/json:
              schema:
                $ref: '../schemas/zeta-error.yaml'
        '405':
          description: Method Not Allowed. The method is not POST.
        '413':
          description: Payload Too Large. The request size exceeds the allowed limit.
        '429':
          description: Rate limit exceeded (`rate_limit_exceeded`, A_26668-02).
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '../schemas/zeta-error.yaml'
