openapi: 3.1.0
info:
  title: OAuth 2.0 Token Endpoint (RFC 6749 Section 3.2)
  version: 1.2.0
  description: |
    Token endpoint of the ZETA Guard Authorization Server.

    Changes 1.0.0 -> 1.1.0: the `grant_type` list is reduced to the grants ZETA actually
    uses (`password` and the parameters `username`, `password`, `client_secret` are removed,
    `urn:ietf:params:oauth:grant-type:jwt-bearer` is added); the parameters `code_verifier`,
    `assertion` and the `DPoP` header are added; error responses reference `zeta-error.yaml`
    and cover 401, 403, 429, 500 and 503. Two points are stipulations of this file that
    gemSpec_ZETA 2.0.0 does not state: the selection of the token-exchange variant by
    `subject_token_type`, and the answer 503 `temporarily_unavailable` when the Policy
    Engine cannot be reached.

    Changes 1.1.0 -> 1.1.1 (description only): management token of the Client Management API
    obtained as a separate token with exactly one `resource` (`<issuer>/zeta`); more than one
    `resource` is rejected with `invalid_target`; rules for the management scopes
    (client-management target model A_CM-22, A_CM-23, placeholder IDs).

    Changes 1.1.1 -> 1.1.2 (description only): `403 access_denied` also when the maximum
    number of SM(C)-B registrations per Telematik-ID is reached (A_CM-36); the email-binding
    token carries the audience of the Client Management API, because all its operations run
    through the PEP HTTP Proxy (A_CM-12, A_CM-20).

    Changes 1.1.2 -> 1.2.0: token exchange of Workload Identity Federation (service-to-service
    communication, gemSpec_ZETA 2.0.1 A_28431, proposal A_NEU-ABL-12): `subject_token_type`
    `urn:ietf:params:oauth:token-type:id_token` and the parameter `requested_token_type` are
    added; `client_assertion_type`, `client_assertion` and the `DPoP` header are no longer
    required by the schema, because this variant has no registered client. For all other
    grants they remain mandatory (checked by the Authorization Server, A_25659). For code
    generators the three fields become optional.

    Every request is authenticated with a `private_key_jwt` client assertion (RFC 7523) and
    carries a DPoP proof (RFC 9449); requests without them are rejected with
    `401 invalid_client` resp. `400 invalid_dpop_proof` (A_25659). Only exception: the token
    exchange of Workload Identity Federation, where the requesting service is identified by
    the validated subject token and a DPoP proof is optional (proposal A_NEU-ABL-12).

    Nonce: where a request carries a nonce (subject token, posture of the client
    statement, DPoP proof), the Authorization Server checks and consumes it in one
    atomic step before it evaluates the request further, so that at most one request
    per nonce succeeds; all occurrences in the request must be equal. The rule is
    stated once, for all platforms, in `dcr-request.yaml`, definitions/nonce.
servers:
  - url: https://as.example.com
paths:
  /token:
    post:
      operationId: requestToken
      summary: Request an access token
      description: |
        The client exchanges an authorization grant for an access token.

        Supported grants:
          * `urn:ietf:params:oauth:grant-type:token-exchange` (RFC 8693). The meaning is
            selected by `subject_token_type`:
              - `urn:ietf:params:oauth:token-type:jwt` — SM(C)-B signed subject token
                (`subject-token-smb.yaml`, A_25645-02);
              - `urn:ietf:params:oauth:token-type:access_token` — redemption of the
                down-scoped email-binding token for full tokens (A_30218);
              - Workload Identity Federation (proposal A_NEU-ABL-12): `subject_token` is a
                JWT according to `subject-token-workload.yaml`, with `subject_token_type`
                `urn:ietf:params:oauth:token-type:jwt` or
                `urn:ietf:params:oauth:token-type:id_token`. The Authorization Server
                recognises this variant structurally: `id_token`, or `jwt` without `x5c`
                in the JOSE header; `jwt` with the SM(C)-B certificate in `x5c` is the
                SM(C)-B subject token (proposal A_25645-03). The variant is chosen from
                still unverified data; all decisions follow the checks of
                A_NEU-ABL-12. `iss` MUST be an issuer registered with gematik
                (A_28437-02) and configured at this Authorization Server
                (`workload-issuer.yaml`, proposal A_NEU-ABL-18), otherwise
                `invalid_grant`. No client assertion; DPoP proof optional; the request
                carries exactly one `resource` and no `audience` (contract v2 only). Each
                (`iss`, `jti`) of a subject token is accepted once. The Policy Engine input follows
                `policy-engine-input-workload.yaml`. The response carries an access token
                according to `access-token-workload.yaml`, `token_type` `Bearer` (or `DPoP`
                if a valid DPoP proof was sent), `issued_token_type`
                `urn:ietf:params:oauth:token-type:access_token`, `expires_in` of at most
                3600 seconds and no refresh token (proposal A_NEU-ABL-25).
          * `authorization_code` — outer Authorization Code Flow of mobile clients with
            PKCE (`code`, `redirect_uri` = app_redirect_uri, `code_verifier`), A_29672.
          * `urn:ietf:params:oauth:grant-type:jwt-bearer` (RFC 7523 section 2.1) —
            authentication without user identity (`assertion`), A_29733.
          * `refresh_token` — renewal with refresh token rotation (A_25662-01).

        Target of the token (contract versioning, A_29693): contract v2 clients send
        `resource` (RFC 8707) and `scope`; the `aud` claim is taken from the Policy Engine
        decision and the token carries `ver: 2`. Contract v1 (legacy) clients send
        `audience`; the value is written verbatim into `aud` and the token carries
        `ver: 1`. `resource` and `audience` are never combined. Requests that open a
        session (token exchange with an SM(C)-B subject token, `authorization_code`,
        `jwt-bearer`) carry exactly one of them. With `refresh_token` both are optional
        (A_29843: a refresh MAY name another `resource` and `scope`); the redemption of
        the email-binding token carries the target of the original request. A `resource`
        that names an unsupported target is rejected with `invalid_target` (A_29694).
        Every access token has exactly one audience: a request with more than one
        `resource` is rejected with `400 invalid_target` (A_CM-22), so that each scope
        unambiguously belongs to the one target of the token.

        Management token (client-management target model A_CM-22, A_CM-23): a separate
        token for the Client Management API, obtained when needed with
        `grant_type=refresh_token` (A_29843), `resource=<issuer>/zeta` as the only
        resource and the scopes `zeta:client-management` and/or `zeta:email-change` only.
        Its `aud` is exactly the logical audience of the Client Management API (e.g.
        `cm_resource`). The client then obtains the Fachdienst token again by refresh with
        the resource of the Fachdienst; the refresh token rotates each time. The management
        scopes are granted only with `<issuer>/zeta` and only to registrations in status
        `bound` (`zeta:client-management` also to `active` SM(C)-B registrations); no other
        scope is granted with `<issuer>/zeta`. Violations: `400 invalid_scope`. For step-up
        (A_CM-25) the client runs the `authorization_code` flow with
        `resource=<issuer>/zeta`, `acr_values` and `max_age` from the `WWW-Authenticate`
        challenge of the Client Management API; the AS keeps the time of the last user
        authentication in the session (from `auth_time` of the ID token) and does not change
        it on refresh.

        Which parameters a grant requires is stated per parameter below. The form schema
        itself only requires the parameters common to all grants; it deliberately has no
        `oneOf` per `grant_type`, because code generators map that to an untyped union.
        The Authorization Server validates the grant-specific parameters itself.

        ZETA identity binding (A_30085, A_29905): if the
        `authorization_code` grant is presented while the client registration is
        `pending_user_binding`, the endpoint issues a DOWN-SCOPED access token instead of
        the requested scope (returned explicitly per RFC 6749 section 5.1 to signal that
        less than requested was granted), DPoP-bound, WITHOUT any Fachdienst or management
        scopes, with `aud` = exactly the logical audience of the Client Management API (e.g.
        `cm_resource`, A_CM-12; the binding endpoints run through the PEP HTTP Proxy, A_CM-20),
        WITHOUT a refresh token and with a lifetime of at most 900 seconds
        (SHOULD: 300–900 seconds). The granted scope depends on the email state of the
        identity and encodes the client's next step:
          * NO email bound to the identity (first use): scope
            `zeta:email-binding zeta:email-verify` — the client registers the address via
            `POST /zeta/identity/bind-email` and confirms via
            `POST /zeta/identity/bind-email/verify`.
          * Email bound but not yet OTP-confirmed for THIS registration
            (Folgeregistrierung): the OTP is sent to the STORED address at token issuance
            (only if no challenge is already open — repeated token requests do NOT
            re-trigger emails) and the scope is `zeta:email-verify` only (optionally with
            `email_hint`) — the client cannot submit a different address (least
            privilege); it goes directly to `verify` (re-send via
            `POST /zeta/identity/bind-email/resend`).
          * Email bound and verified (`bound`): the requested scopes are granted
            (regular path, no binding step).
        After completing the binding the client exchanges the email-binding token for
        full tokens with `grant_type=urn:ietf:params:oauth:grant-type:token-exchange`
        (RFC 8693, `subject_token` = email-binding token), authenticated by its
        `private_key_jwt` client assertion and the SAME DPoP key as the initial token
        request. The exchange succeeds only once the registration is `bound`; otherwise
        the endpoint answers `400 invalid_grant`. If the email-binding token expires
        before the binding completes, the client restarts with a new OIDC authorization
        request.
      parameters:
        - name: DPoP
          in: header
          required: false
          description: >-
            DPoP proof JWT (RFC 9449, `dpop-token.yaml`) with `htm` = `POST` and `htu` = the
            URL of this token endpoint. The issued tokens are bound to the key of this proof
            (`cnf.jkt`). A refresh, and the redemption of the email-binding token, use the
            same DPoP key as the request that opened the session. REQUIRED for all grants
            except the token exchange of Workload Identity Federation, where it is optional
            (A_25659, proposal A_NEU-ABL-12).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  description: The grant type (see the operation description).
                  enum:
                    - authorization_code
                    - refresh_token
                    - urn:ietf:params:oauth:grant-type:token-exchange
                    - urn:ietf:params:oauth:grant-type:jwt-bearer
                client_assertion_type:
                  type: string
                  description: >-
                    Format of the client assertion (RFC 7521/RFC 7523). REQUIRED for all
                    grants except the token exchange of Workload Identity Federation.
                  enum:
                    - urn:ietf:params:oauth:client-assertion-type:jwt-bearer
                client_assertion:
                  type: string
                  description: >-
                    The Private Key JWT authenticating the client (`client-assertion-jwt.yaml`),
                    signed with PrK.Client.Sig. REQUIRED for all grants except the token
                    exchange of Workload Identity Federation, where it MUST be absent.
                client_id:
                  type: string
                  description: >-
                    The client identifier issued at registration. Optional; if present it MUST
                    equal `iss`/`sub` of the client assertion.
                code:
                  type: string
                  description: The authorization code (AUTH_CODE_AS) — `authorization_code` grant only.
                redirect_uri:
                  type: string
                  format: uri
                  description: >-
                    The app_redirect_uri used in the pushed authorization request —
                    `authorization_code` grant only.
                code_verifier:
                  type: string
                  description: >-
                    PKCE code verifier (RFC 7636) matching the `code_challenge` of the pushed
                    authorization request — REQUIRED for the `authorization_code` grant.
                  minLength: 43
                  maxLength: 128
                assertion:
                  type: string
                  description: >-
                    Self-signed JWT of the client instance (RFC 7523 section 2.1), signed with
                    PrK.Client.Sig — REQUIRED for the `jwt-bearer` grant.
                refresh_token:
                  type: string
                  description: The refresh token — `refresh_token` grant only.
                subject_token:
                  type: string
                  description: >-
                    The subject token (RFC 8693) — REQUIRED for the token-exchange grant: the
                    SM(C)-B signed JWT, for the identity-binding completion the down-scoped
                    email-binding access token, or for Workload Identity Federation the JWT
                    of the requesting workload issued by a registered issuer (A_28437-02),
                    claims according to `subject-token-workload.yaml`.
                subject_token_type:
                  type: string
                  description: >-
                    Type of the subject_token (RFC 8693) — REQUIRED for the token-exchange grant.
                    Selects the processing of the subject token.
                  enum:
                    - urn:ietf:params:oauth:token-type:jwt
                    - urn:ietf:params:oauth:token-type:access_token
                    - urn:ietf:params:oauth:token-type:id_token
                requested_token_type:
                  type: string
                  description: >-
                    Requested token type (RFC 8693). Optional; if present, only an access token
                    can be requested. Other values are rejected with `invalid_request`.
                  enum:
                    - urn:ietf:params:oauth:token-type:access_token
                scope:
                  type: string
                  description: The scope of the access request as described by RFC 6749 Section 3.3.
                audience:
                  type: string
                  description: >-
                    LEGACY (contract v1). The logical, deployment-independent audience
                    identifier of the target service (RFC 8693), e.g. `n_resource` or
                    `cm_resource`. This value is written verbatim into the `aud` claim
                    of the issued access token (`ver: 1`). Sent by clients when the
                    Authorization Server does not announce contract v2 in
                    `api_versions_supported`. MUST NOT be combined with `resource`.
                resource:
                  type: string
                  format: uri
                  description: >-
                    Resource indicator (RFC 8707), contract v2. Absolute URL of the
                    target endpoint at the resource server. The ZETA Guard determines
                    the logical `aud` claim from this URL via the Policy Engine decision.
                    The resource URL itself is NOT written into the `aud` claim but is
                    bound to the actual request via the DPoP proof `htu` claim (RFC 9449).
                    MUST NOT be combined with `audience`. Exactly one value per request
                    (more than one: `400 invalid_target`); for the Client Management API
                    `<issuer>/zeta` (A_CM-22).
              required:
                - grant_type
      responses:
        '200':
          description: >-
            Successful response (`token-response.yaml`, successResponse). With the down-scoped
            email-binding response the granted `scope` is returned explicitly, no refresh
            token is issued and `email_hint` MAY be present. For the token exchange of Workload
            Identity Federation the access token follows `access-token-workload.yaml`,
            `token_type` is `Bearer` (or `DPoP` with a valid DPoP proof) and no refresh token
            is issued.
          headers:
            Cache-Control:
              description: "`no-store` (RFC 6749 section 5.1)."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/token-response.yaml#/definitions/successResponse'
        '400':
          description: |
            Malformed request or invalid, expired, re-used or revoked grant (RFC 6749
            section 5.2): `invalid_request`, `invalid_grant`, `invalid_scope` (formal check
            by the Authorization Server before the policy query only; a scope reduction by the
            Policy Engine is not an error), `invalid_target`, `unsupported_grant_type`,
            `unauthorized_client` (grant type not registered for this client, A_30364), and
            DPoP errors including nonce errors `invalid_dpop_proof` (A_25661-01). ZETA does not
            use `use_dpop_nonce`: nonces come from `GET /nonce` only; refresh requests need
            no nonce. The exact mapping per error case is table ZT_PDP_Fehlerfaelle
            (gemSpec_ZETA 5.4.6.1). For the ZETA identity binding: a token-exchange request with the
            email-binding token as `subject_token` fails with `invalid_grant` while the
            registration is not yet `bound`, or when the email-binding token is expired or
            unknown — the client MUST then restart with a new OIDC authorization request.
            Workload Identity Federation: a subject token that is invalid (signature, `iss`
            not registered, `aud`, expiry) is answered with `invalid_grant` without asking the
            Policy Engine (proposal A_NEU-ABL-12).
            Every refresh token that can no longer be used — unknown, expired, re-used,
            revoked via `/revoke` or belonging to a terminated session — is answered with
            `invalid_grant` and an identical body; on re-use the session is additionally
            terminated (A_25662-01, A_29856, A_29998). The client then discards its tokens
            and authenticates again (A_29849).
          content:
            application/json:
              schema:
                $ref: '../schemas/zeta-error.yaml'
        '401':
          description: >-
            Client authentication failed or is missing (`invalid_client`) — A_25661-01,
            A_25659; not used for the token exchange of Workload Identity Federation. The token endpoint
            never signals step-up (`insufficient_user_authentication`): step-up need is signalled
            only by the protected endpoints per RFC 9470 (PEP, A_28525-02; client management,
            A_CM-25), whose `WWW-Authenticate` header supplies the `acr_values`. An insufficient
            authentication level at the token endpoint is evaluated by the Policy Engine via
            `acr` (scope reduction or `403 access_denied`).
          content:
            application/json:
              schema:
                $ref: '../schemas/zeta-error.yaml'
        '403':
          description: >-
            The Policy Engine denied the request although the credentials are valid
            (`access_denied`; the body then additionally carries `reasons`,
            `token-response.yaml` denyResponse), or the Authorization Backend denied access
            (`access_denied`, A_30243), or — at the first token exchange of an SM(C)-B
            registration — the configured maximum number of `active` SM(C)-B registrations
            per Telematik-ID is reached (`access_denied`, client-management target model
            A_CM-36; no registration is displaced automatically, the client deletes one via
            the Client Management API). For the token exchange of Workload Identity
            Federation 403 means the Policy Engine denied the workload. 403 is used for no
            other case; a terminated session or
            revoked refresh token is `400 invalid_grant`.
          content:
            application/json:
              schema:
                # anyOf, not oneOf: denyResponse is zeta-error plus `reasons`, so a
                # deny body matches both branches.
                anyOf:
                  - $ref: '../schemas/token-response.yaml#/definitions/denyResponse'
                  - $ref: '../schemas/zeta-error.yaml'
        '429':
          description: Rate limit exceeded (`rate_limit_exceeded`, A_26668-02).
          headers:
            Retry-After:
              description: Seconds until the next attempt is permitted (RFC 9110).
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '../schemas/zeta-error.yaml'
        '500':
          description: >-
            The Policy Engine decision cannot be applied (`server_error`), e.g. it names a
            scope that was not requested (`pdp-decision.yaml`, `result.scope`); no tokens
            are issued.
          content:
            application/json:
              schema:
                $ref: '../schemas/zeta-error.yaml'
        '503':
          description: >-
            A component required for the decision is not available
            (`temporarily_unavailable`); no tokens are issued. This includes the token
            exchange of Workload Identity Federation when the JWKS of a registered issuer
            cannot be obtained and no valid cached copy exists (proposal A_NEU-ABL-18).
          content:
            application/json:
              schema:
                $ref: '../schemas/zeta-error.yaml'
