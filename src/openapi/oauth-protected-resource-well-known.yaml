openapi: 3.1.0

info:
  title: OAuth 2.0 Protected Resource Metadata Endpoint
  version: 1.2.0
  description: |
    Changes 1.1.0 -> 1.2.0 (behavior: one document per host, no subpath documents):
    only the main resource (the Fachdienst) publishes this document, at
    `https://<host>[:<port>]/.well-known/oauth-protected-resource` without a path (its `resource` is `https://<host>[:<port>]/`, opr-well-known.yaml 1.1.0;
    RFC 9728 Section 3.1). The Notification Service and the Client Management are fixed
    resources (`resource` followed by `notification-service/`; `issuer` without a trailing
    `/` followed by `/zeta/`) without a protected resource metadata document; the former
    Notification Service document `/.well-known/oauth-protected-resource/notification-service`
    is no longer used. Minor version: the endpoint and the response schema stay
    unchanged; the Notification Service document is used only by ZETA Clients with contract
    v2, which is developed together with the ZETA Guard of the same stage.

paths:
  /.well-known/oauth-protected-resource:
    get:
      operationId: getProtectedResourceMetadata
      summary: Retrieve the metadata of the protected resource
      description: |
        This endpoint returns a JSON document containing metadata about the configuration of the main
        resource of the host. There is exactly one such document per host; no path is appended to
        `/.well-known/oauth-protected-resource`.

        The ZETA Guard returns an ETag header that changes whenever the content of the document changes,
        and a Cache-Control header with max-age (at most 86400 seconds). On subsequent requests the ZETA Client
        sends the last received ETag in the If-None-Match header. If the document is unchanged, the ZETA Guard
        responds with 304 Not Modified without a body and repeats the ETag and Cache-Control headers of the
        corresponding 200 response.

      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"

      responses:
        "200":
          description: Successful response with the metadata of the protected resource.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"
        "304":
          description: Not Modified. The document is unchanged compared to the ETag sent in the If-None-Match header. The response has no body.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "404":
          description: Not Found.
        "500":
          description: Internal Server Error.

components:
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: The ETag of the document last received by the ZETA Client (RFC 9110, section 13.1.2). If it matches the current ETag, the ZETA Guard responds with 304 Not Modified.
      schema:
        type: string
        example: '"a1b2c3d4"'
  headers:
    ETag:
      description: Entity tag of the document (RFC 9110, section 8.8.3). Changes whenever the content of the document changes.
      required: true
      schema:
        type: string
        example: '"a1b2c3d4"'
    CacheControl:
      description: Cache directives according to RFC 9111. The max-age value must not exceed 86400 seconds.
      required: false
      schema:
        type: string
        example: "max-age=3600"
  schemas:
    ProtectedResourceMetadata:
      $ref: "../schemas/opr-well-known.yaml"
