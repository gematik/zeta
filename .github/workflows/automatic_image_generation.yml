name: Automatic Image Generation

on:
  push:
    paths:
      - 'src/plantuml/**'
      - 'src/drawio/**'
      - '.github/workflows/automatic_image_generation.yml'
  workflow_dispatch:

jobs:
  generate_images:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install dependencies and draw.io
      run: |
        set -e
        sudo apt-get update
        sudo apt-get install -y jq
        sudo apt-get install -y --no-install-recommends graphviz xvfb libasound2t64

        echo "Finding latest draw.io .deb release URL..."
        DRAWIO_LATEST_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/jgraph/drawio-desktop/releases \
          | jq -r '[.[] | .assets[] | select(.name | contains("amd64") and endswith(".deb")) | .browser_download_url] | first')


        if [[ -z "$DRAWIO_LATEST_URL" || "$DRAWIO_LATEST_URL" == "null" ]]; then
          echo "::error::Could not find any recent draw.io release with a .deb file. API response may be rate limited or malformed."
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/rate_limit
          exit 1
        fi
        
        echo "Downloading draw.io from: $DRAWIO_LATEST_URL"
        wget --quiet "$DRAWIO_LATEST_URL" -O /tmp/drawio.deb
        
        echo "Installing draw.io..."
        sudo apt-get install -y /tmp/drawio.deb
        
    - name: Download PlantUML jar
      id: download_plantuml
      run: |
        wget --quiet https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar -O /tmp/plantuml.jar
        if [ ! -f /tmp/plantuml.jar ]; then
          echo "::error::Failed to download plantuml.jar"
          exit 1
        fi
        echo "PlantUML JAR downloaded."

    - name: Generate images from PlantUML files
      id: generate_plantuml
      run: |
        set -e
        SUCCESSFUL_GENERATIONS=0
        shopt -s nullglob

        # Git erhält keine Datei-Zeitstempel, daher ist ein mtime-Vergleich im CI
        # unzuverlässig. Es wird immer generiert; ob committet wird, entscheidet
        # der Commit-Step anhand des tatsächlichen Diffs.
        echo "Generating images for PlantUML files..."
        while IFS= read -r -d $'\0' file; do
          output_dir="$PWD/$(dirname "$file" | sed 's|^src/plantuml|images|')"
          image_base=$(basename "$file" .puml)
          png_path="$output_dir/$image_base.png"
          svg_path="$output_dir/$image_base.svg"

          echo "-> Generating images for PlantUML file: $file"
          mkdir -p "$output_dir"

          # In das Quellverzeichnis wechseln (Subshell), damit relative '!include'-Pfade
          # aufgelöst werden; die Ausgabepfade sind absolut.
          file_dir=$(dirname "$file")
          file_name=$(basename "$file")

          echo "Generating PNG: $png_path"
          (cd "$file_dir" && cat "$file_name" | java -jar /tmp/plantuml.jar -p -tpng -scale 4 -graphvizdot /usr/bin/dot > "$png_path")

          echo "Generating SVG: $svg_path"
          (cd "$file_dir" && cat "$file_name" | java -jar /tmp/plantuml.jar -p -tsvg -graphvizdot /usr/bin/dot > "$svg_path")

          if [ -f "$png_path" ] && [ -f "$svg_path" ]; then
             SUCCESSFUL_GENERATIONS=$((SUCCESSFUL_GENERATIONS + 1))
          else
             echo "::error::File generation failed unexpectedly for $file. Output files are missing."
             exit 1
          fi
        done < <(find src/plantuml -name "*.puml" -print0)

        echo "PlantUML generation finished. Successfully generated for $SUCCESSFUL_GENERATIONS file(s)."

        if [ "$SUCCESSFUL_GENERATIONS" -gt 0 ]; then
          echo "plantuml_generated=true" >> $GITHUB_OUTPUT
        else
          echo "plantuml_generated=false" >> $GITHUB_OUTPUT
        fi
      shell: bash
    - name: Generate images from drawio files
      id: generate_drawio
      run: |
        set -e
        SUCCESSFUL_GENERATIONS=0
        shopt -s nullglob

        echo "Generating images for Draw.io files..."
        while IFS= read -r -d $'\0' file; do
          output_dir="$(dirname "$file" | sed 's|^src/drawio|images|')"
          image_base=$(basename "$file" .drawio)
          png_path="$output_dir/$image_base.png"
          svg_path="$output_dir/$image_base.svg"

          echo "-> Generating images for Draw.io file: $file"
          mkdir -p "$output_dir"

          xvfb-run --auto-servernum drawio --no-sandbox --export --format png --scale 4 --output "$png_path" "$file"
          xvfb-run --auto-servernum drawio --no-sandbox --export --format svg --output "$svg_path" "$file"

          if [ -f "$png_path" ] && [ -f "$svg_path" ]; then
             SUCCESSFUL_GENERATIONS=$((SUCCESSFUL_GENERATIONS + 1))
          else
             echo "::error::File generation failed unexpectedly for $file. Output files are missing."
             exit 1
          fi
        done < <(find src/drawio -name "*.drawio" -print0)

        echo "Draw.io generation finished. Successfully generated for $SUCCESSFUL_GENERATIONS file(s)."

        if [ "$SUCCESSFUL_GENERATIONS" -gt 0 ]; then
          echo "drawio_generated=true" >> $GITHUB_OUTPUT
        else
          echo "drawio_generated=false" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Commit and push generated images
      if: github.ref_type == 'branch' && (steps.generate_plantuml.outputs.plantuml_generated == 'true' || steps.generate_drawio.outputs.drawio_generated == 'true')
      env:
        TARGET_BRANCH: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

        commit_if_changed () {
          git add images
          if git diff --staged --quiet -- images; then
            echo "No staged changes in images."
            return 1
          fi
          git commit -m "chore: Generate/update images from source files" -m "Generated by GitHub Action."
          return 0
        }

        # initial commit attempt
        if ! commit_if_changed; then
          exit 0
        fi

        for i in 1 2 3; do
          if git push origin "HEAD:$TARGET_BRANCH"; then
            echo "Push successful."
            exit 0
          fi

          if [ "$i" = 3 ]; then
            break
          fi

          echo "Push rejected (attempt $i/3). Refreshing from origin/$TARGET_BRANCH and regenerating images..."
          git fetch origin "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"

          # regenerate to match latest source state
          while IFS= read -r -d $'\0' file; do
            output_dir="$(dirname "$file" | sed 's|^src/drawio|images|')"
            image_base=$(basename "$file" .drawio)
            mkdir -p "$output_dir"
            xvfb-run --auto-servernum drawio --no-sandbox --export --format png --scale 4 --output "$output_dir/$image_base.png" "$file"
            xvfb-run --auto-servernum drawio --no-sandbox --export --format svg --output "$output_dir/$image_base.svg" "$file"
          done < <(find src/drawio -name "*.drawio" -print0)

          while IFS= read -r -d $'\0' file; do
            output_dir="$PWD/$(dirname "$file" | sed 's|^src/plantuml|images|')"
            image_base=$(basename "$file" .puml)
            file_dir=$(dirname "$file")
            file_name=$(basename "$file")
            mkdir -p "$output_dir"
            (cd "$file_dir" && cat "$file_name" | java -jar /tmp/plantuml.jar -p -tpng -scale 4 -graphvizdot /usr/bin/dot > "$output_dir/$image_base.png")
            (cd "$file_dir" && cat "$file_name" | java -jar /tmp/plantuml.jar -p -tsvg -graphvizdot /usr/bin/dot > "$output_dir/$image_base.svg")
          done < <(find src/plantuml -name "*.puml" -print0)

          # create fresh commit if anything changed
          if ! commit_if_changed; then
            echo "No changes after refresh/regeneration."
            exit 0
          fi
        done

        echo "::error::Failed to push generated images after 3 attempts."
        exit 1