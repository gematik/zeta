name: Automatic Image Generation

on:
  push:
    paths:
      - 'src/plantuml/**'
      - 'src/drawio/**'
      - '.github/workflows/automatic_image_generation.yml'
      - '.github/scripts/generate-images.sh'
  workflow_dispatch:

# Läufe pro Branch serialisieren, damit sich parallele Läufe nicht gegenseitig
# die Pushes abweisen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate_images:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Determine files to generate
      id: changes
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}
        AFTER_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        NULL_SHA=0000000000000000000000000000000000000000
        FULL_RUN=false
        CHANGED=""

        # Git erhält keine Datei-Zeitstempel, daher werden die zu generierenden
        # Dateien aus dem Push-Diff bestimmt. Ohne verwertbaren Diff
        # (workflow_dispatch, neuer Branch, Force-Push, Workflow/Skript
        # geändert) wird alles generiert; ob committet wird, entscheidet
        # ohnehin der Commit-Step anhand des tatsächlichen Diffs.
        if [ "$EVENT_NAME" != "push" ] || [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "$NULL_SHA" ]; then
          echo "Kein Push-Diff verfügbar (Event: $EVENT_NAME) - alle Bilder werden generiert."
          FULL_RUN=true
        elif ! git fetch --depth=1 origin "$BEFORE_SHA"; then
          echo "Before-Commit $BEFORE_SHA nicht abrufbar (Force-Push?) - alle Bilder werden generiert."
          FULL_RUN=true
        else
          CHANGED=$(git diff --name-only --diff-filter=d "$BEFORE_SHA" "$AFTER_SHA")
          if grep -qE '^\.github/(workflows/automatic_image_generation\.yml|scripts/generate-images\.sh)$' <<< "$CHANGED"; then
            echo "Workflow oder Generierungsskript geändert - alle Bilder werden generiert."
            FULL_RUN=true
          fi
        fi

        if [ "$FULL_RUN" = true ]; then
          find src/plantuml -name '*.puml' | sort > "$RUNNER_TEMP/puml_files.txt"
          find src/drawio -name '*.drawio' | sort > "$RUNNER_TEMP/drawio_files.txt"
        else
          grep -E '^src/plantuml/.*\.puml$' <<< "$CHANGED" > "$RUNNER_TEMP/puml_files.txt" || true
          grep -E '^src/drawio/.*\.drawio$' <<< "$CHANGED" > "$RUNNER_TEMP/drawio_files.txt" || true
        fi

        echo "Zu generieren: $(wc -l < "$RUNNER_TEMP/puml_files.txt") PlantUML-Datei(en), $(wc -l < "$RUNNER_TEMP/drawio_files.txt") Draw.io-Datei(en)."
        echo "puml=$([ -s "$RUNNER_TEMP/puml_files.txt" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "drawio=$([ -s "$RUNNER_TEMP/drawio_files.txt" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Set up JDK 11
      if: steps.changes.outputs.puml == 'true'
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install PlantUML and Graphviz
      if: steps.changes.outputs.puml == 'true'
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends graphviz

        wget --quiet https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar -O /tmp/plantuml.jar
        if [ ! -s /tmp/plantuml.jar ]; then
          echo "::error::Failed to download plantuml.jar"
          exit 1
        fi
        echo "PlantUML JAR downloaded."

    - name: Install draw.io
      if: steps.changes.outputs.drawio == 'true'
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends xvfb libasound2t64

        echo "Finding latest draw.io .deb release URL..."
        DRAWIO_LATEST_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/jgraph/drawio-desktop/releases \
          | jq -r '[.[] | .assets[] | select(.name | contains("amd64") and endswith(".deb")) | .browser_download_url] | first')

        if [[ -z "$DRAWIO_LATEST_URL" || "$DRAWIO_LATEST_URL" == "null" ]]; then
          echo "::error::Could not find any recent draw.io release with a .deb file. API response may be rate limited or malformed."
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/rate_limit
          exit 1
        fi

        echo "Downloading draw.io from: $DRAWIO_LATEST_URL"
        wget --quiet "$DRAWIO_LATEST_URL" -O /tmp/drawio.deb

        echo "Installing draw.io..."
        sudo apt-get install -y /tmp/drawio.deb

    - name: Generate images
      if: steps.changes.outputs.puml == 'true' || steps.changes.outputs.drawio == 'true'
      run: bash .github/scripts/generate-images.sh "$RUNNER_TEMP/puml_files.txt" "$RUNNER_TEMP/drawio_files.txt"

    - name: Commit and push generated images
      if: github.ref_type == 'branch' && (steps.changes.outputs.puml == 'true' || steps.changes.outputs.drawio == 'true')
      env:
        TARGET_BRANCH: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

        commit_if_changed () {
          git add images
          if git diff --staged --quiet -- images; then
            echo "No staged changes in images."
            return 1
          fi
          git commit -m "chore: Generate/update images from source files" -m "Generated by GitHub Action."
          return 0
        }

        # initial commit attempt
        if ! commit_if_changed; then
          exit 0
        fi

        for i in 1 2 3; do
          if git push origin "HEAD:$TARGET_BRANCH"; then
            echo "Push successful."
            exit 0
          fi

          if [ "$i" = 3 ]; then
            break
          fi

          echo "Push rejected (attempt $i/3). Refreshing from origin/$TARGET_BRANCH and regenerating images..."
          git fetch origin "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"

          bash .github/scripts/generate-images.sh "$RUNNER_TEMP/puml_files.txt" "$RUNNER_TEMP/drawio_files.txt"

          if ! commit_if_changed; then
            echo "No changes after refresh/regeneration."
            exit 0
          fi
        done

        echo "::error::Failed to push generated images after 3 attempts."
        exit 1
